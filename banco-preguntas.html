+ 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto al **cartílago hialino**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Su matriz se nutre por difusión a través del pericondrio, ya que es avascular.", "b": "Su matriz territorial es basófila por la abundancia de glucosaminoglucanos.", "c": "Los condrocitos están unidos entre sí por uniones comunicantes que recorren la matriz.", "d": "Posee fibras de colágeno tipo II no visibles en condiciones normales en H-E."}, "correcta": "c", "razones": {"a": "Cierta: el cartílago es {{avascular}}; su matriz se nutre por {{difusión}} desde los vasos del pericondrio.", "b": "Cierta: la matriz territorial (cápsula pericelular) es {{basófila}} por la riqueza en {{glucosaminoglucanos}} sulfatados (condroitín sulfato).", "c": "CORRECTA (es la FALSA). Los {{condrocitos}} están aislados en sus lagunas y **NO** se comunican por uniones comunicantes a través de la matriz (la rigidez de la matriz lo impide).", "d": "Cierta: las fibras de colágeno {{II}} quedan enmascaradas porque su índice de refracción es similar al de la matriz; no se ven en H-E normal."}, "_k": "org1p-065:3926314652", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-066", "tema": "Tejidos básicos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Respecto al **sarcómero** del músculo estriado, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Los filamentos gruesos de miosina se anclan en la línea Z.", "b": "Los filamentos finos de actina se anclan en la línea Z.", "c": "El sarcómero se define entre dos líneas Z consecutivas.", "d": "En los mamíferos hay dos tríadas por sarcómero, a nivel de la unión A-I."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Los filamentos {{gruesos}} de miosina se anclan en la línea {{M}} (centro de la banda A); en la línea Z se anclan los filamentos finos.", "b": "Cierta: los filamentos {{finos}} de actina se anclan en la línea {{Z}}.", "c": "Cierta: el {{sarcómero}} es la unidad contráctil comprendida entre dos líneas {{Z}} consecutivas.", "d": "Cierta: en el músculo esquelético de mamíferos hay {{2 tríadas}} por sarcómero, situadas en las uniones {{A-I}}."}, "_k": "org1p-066:1286199441", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-067", "tema": "Tejidos básicos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Las **células satélite** del músculo esquelético se caracterizan por:", "opciones": {"a": "Situarse en el endomisio, lejos de la fibra muscular.", "b": "Encontrarse bajo la misma lámina basal que la fibra muscular, como células madre quiescentes.", "c": "Ser células gliales que mielinizan los axones motores.", "d": "Formar los husos neuromusculares."}, "correcta": "b", "razones": {"a": "Falsa: no están libres en el endomisio, sino íntimamente adosadas a la superficie de la fibra muscular.", "b": "CORRECTA. Las células {{satélite}} se sitúan **bajo la misma lámina basal** que la fibra muscular y son las células {{madre}} quiescentes responsables de la regeneración del músculo esquelético.", "c": "Falsa: las que mielinizan los axones motores son las células de {{Schwann}} (glía del SNP), no las satélite musculares.", "d": "Falsa: los husos {{neuromusculares}} son receptores propioceptivos con fibras intrafusales, no derivan de células satélite."}, "_k": "org1p-067:831272006", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-068", "tema": "Tejidos básicos", "examen": "2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept, 2022-23", "enunciado": "Respecto a las **fibras musculares tipo I (rojas/lentas)**, señala la afirmación **correcta**:", "opciones": {"a": "Tienen pequeño diámetro, muchas mitocondrias y mioglobina, y son resistentes a la fatiga.", "b": "Son blancas, pobres en mitocondrias y de contracción rápida.", "c": "Dependen exclusivamente de la glucólisis anaerobia.", "d": "Predominan en músculos de movimientos breves y potentes."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras {{tipo I}} (rojas/lentas) tienen pequeño diámetro, muchas {{mitocondrias}} y mioglobina (metabolismo oxidativo) y son {{resistentes a la fatiga}} (músculos posturales).", "b": "Falsa: ser blancas, pobres en mitocondrias y de contracción rápida describe a las fibras {{tipo II}}.", "c": "Falsa: la glucólisis anaerobia exclusiva es propia de las tipo {{IIb}}; las tipo I son {{oxidativas}}.", "d": "Falsa: los movimientos breves y potentes los realizan las fibras {{tipo II}}, no las tipo I."}, "_k": "org1p-068:1856012652", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-069", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Respecto a las **células de Schwann**, señala la afirmación **correcta**:", "opciones": {"a": "Una sola célula de Schwann mieliniza varios axones a la vez.", "b": "En las fibras amielínicas, una célula de Schwann envuelve varios axones, pero cada segmento de mielina (en las mielínicas) corresponde a una sola célula y un solo axón.", "c": "Carecen de lámina basal.", "d": "Son equivalentes a la microglía del sistema nervioso central."}, "correcta": "b", "razones": {"a": "Falsa: en las fibras {{mielínicas}}, una sola célula de Schwann mieliniza **un único** axón (un solo segmento internodal).", "b": "CORRECTA. En fibras {{amielínicas}} una Schwann envuelve {{varios}} axones a la vez; en las mielínicas, cada {{segmento}} internodal corresponde a una sola Schwann y un solo axón.", "c": "Falsa: las células de Schwann **SÍ** poseen {{lámina basal}} propia (importante en la regeneración axonal).", "d": "Falsa: el equivalente glial mielinizante del SNC son los {{oligodendrocitos}}; el equivalente de la microglía no es la Schwann."}, "_k": "org1p-069:3580801053", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-070", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Los **cuerpos de Nissl** de las neuronas corresponden a:", "opciones": {"a": "Acúmulos de aparato de Golgi.", "b": "Acúmulos de retículo endoplásmico rugoso (RER) y ribosomas, basófilos y visibles al microscopio óptico.", "c": "Mitocondrias agrupadas en el axón.", "d": "Lisosomas en el cono axónico."}, "correcta": "b", "razones": {"a": "Falsa: el {{Golgi}} no constituye el cuerpo de Nissl (aunque está bien desarrollado en la neurona).", "b": "CORRECTA. Los cuerpos de {{Nissl}} son acúmulos de {{RER}} y polirribosomas, intensamente {{basófilos}} al microscopio óptico; están en el soma y las dendritas, pero **no** en el cono axónico ni en el axón.", "c": "Falsa: no son agrupaciones de mitocondrias.", "d": "Falsa: el {{cono axónico}} carece precisamente de sustancia de Nissl (criterio para identificarlo)."}, "_k": "org1p-070:139077349", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-071", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a la **glía del sistema nervioso central**, señala la afirmación **correcta**:", "opciones": {"a": "La microglía es fagocítica y de origen mesodérmico (mieloide); los astrocitos forman la barrera con sus pies vasculares.", "b": "La microglía deriva del tubo neural como el resto de la glía.", "c": "Los astrocitos producen la mielina del SNC.", "d": "Los oligodendrocitos son los macrófagos residentes del SNC."}, "correcta": "a", "razones": {"a": "CORRECTA. La {{microglía}} es fagocítica y de origen {{mesodérmico}}/mieloide (no neuroectodérmico); los {{astrocitos}} contribuyen a la barrera hematoencefálica con sus pies perivasculares.", "b": "Falsa: la microglía **NO** deriva del {{tubo neural}}, sino de precursores mieloides (saco vitelino/médula ósea).", "c": "Falsa: la mielina del SNC la producen los {{oligodendrocitos}}, no los astrocitos.", "d": "Falsa: los macrófagos residentes del SNC son la {{microglía}}, no los oligodendrocitos."}, "_k": "org1p-071:2997752800", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-001", "tema": "Piel", "examen": "2025-26 2º parcial · Q1", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept Q26, 2025-26 2P Q1", "enunciado": "El estrato de Malpighi está formado por:", "opciones": {"a": "Estrato basal y espinoso.", "b": "Estrato espinoso y granuloso.", "c": "Estrato granuloso y lúcido.", "d": "Ninguna de las anteriores."}, "correcta": "a", "razones": {"a": "CORRECTA. El estrato de **Malpighi** (capa germinativa) está formado por {{basal}} + {{espinoso}}, las dos capas con mayor capacidad proliferativa e inicio de la queratinización.", "b": "El estrato {{granuloso}} ya está en diferenciación terminal (gránulos de queratohialina); no forma parte del Malpighi.", "c": "El estrato {{lúcido}} es una capa de transición exclusiva de la piel gruesa, totalmente diferenciada.", "d": "Sí hay respuesta correcta (la **a**); 'ninguna' es falsa."}, "_k": "org2p-001:1034748592", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-002", "tema": "Piel", "examen": "2025-26 2º parcial · Q2", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **piel gruesa**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "No encontramos pelos en la piel gruesa.", "b": "Cuanto más gruesa es la piel, más desarrollada está la epidermis.", "c": "Las células del estrato espinoso presentan abundantes gránulos laminares con contenido lipídico.", "d": "La presencia de tonofilamentos es una característica exclusiva de las células del estrato basal germinativo."}, "correcta": "d", "razones": {"a": "Cierta: la piel gruesa (palmas, plantas) es {{lampiña}}, sin folículos pilosos.", "b": "Cierta: el grosor cutáneo depende sobre todo del desarrollo de la {{epidermis}} (estrato córneo).", "c": "Cierta: los {{gránulos laminares}} (cuerpos de Odland, contenido lipídico) ya aparecen en el espinoso/granuloso.", "d": "CORRECTA (es la FALSA). Los {{tonofilamentos}} (queratina) están en todas las capas vivas, especialmente abundantes en el {{espinoso}}; no son exclusivos del estrato basal."}, "_k": "org2p-002:3922724189", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-003", "tema": "Piel", "examen": "2025-26 2º parcial · Q3", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23 1P, 2025-26 2P", "enunciado": "Señala la **respuesta correcta** sobre las células de la epidermis:", "opciones": {"a": "Los melanocitos están unidos a los queratinocitos mediante estructuras desmosómicas.", "b": "Los queratinocitos nunca contienen melanina.", "c": "Los gránulos de queratohialina son propios de los queratinocitos de la capa basal.", "d": "Las células de Langerhans de la piel están relacionadas con fenómenos de inmunidad."}, "correcta": "d", "razones": {"a": "Falsa: los melanocitos se unen a los queratinocitos {{sin desmosomas}} (lo hacen por cadherinas; son células dendríticas móviles).", "b": "Falsa: los queratinocitos SÍ reciben melanina por {{secreción citocrina}} desde los melanocitos (se sitúa sobre el núcleo como escudo UV).", "c": "Falsa: los gránulos de {{queratohialina}} son propios del estrato {{granuloso}}, no de la capa basal.", "d": "CORRECTA. Las células de {{Langerhans}} (origen en médula ósea, gránulos de Birbeck) son presentadoras de antígeno → función {{inmunitaria}}."}, "_k": "org2p-003:1885155143", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-004", "tema": "Piel", "examen": "2025-26 2º parcial · Q4", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 1P, 2025-26 2P", "enunciado": "Sobre las **glándulas sudoríparas apocrinas**, ¿cuál **NO** es correcta?", "opciones": {"a": "Tienen un tipo de secreción merocrina.", "b": "Están desarrolladas en el momento del nacimiento.", "c": "Se asocian a folículos pilosos.", "d": "Presentan células mioepiteliales."}, "correcta": "b", "razones": {"a": "Cierta: liberan por mecanismo {{merocrino}} (pese al nombre histórico 'apocrino', no hay pérdida celular).", "b": "CORRECTA (es la FALSA). Las apocrinas NO están desarrolladas al nacer: maduran en la {{pubertad}}.", "c": "Cierta: desembocan en el {{folículo piloso}} (axila, región anogenital, areola).", "d": "Cierta: poseen {{células mioepiteliales}} (más grandes y numerosas que en las ecrinas) que ayudan a expulsar la secreción."}, "_k": "org2p-004:925307479", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-005", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q5", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q10, 2021-22 Q8, 2024-25 Q2, 2025-26 2P Q5", "enunciado": "De las siguientes afirmaciones referentes a la hipófisis del ser humano, una **NO** es cierta:", "opciones": {"a": "La pars intermedia en el adulto es responsable de la secreción de hormona estimulante de los melanocitos (MSH).", "b": "En la pars intermedia la presencia de células es más escasa.", "c": "Las hormonas hipotalámicas que actúan sobre la adenohipófisis son de naturaleza peptídica.", "d": "La pars tuberalis está constituida principalmente por células cromófobas."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). En el **humano adulto** la pars intermedia es {{rudimentaria}} y NO produce MSH: solo se generan precursores ({{POMC}}, propiomelanocortina). La MSH humana solo se genera en época {{fetal}}.", "b": "Cierta: en el ser humano la pars intermedia es muy reducida, con células {{escasas}} y quistes de coloide (restos de la {{bolsa de Rathke}}).", "c": "Cierta: las hormonas hipotalámicas que actúan sobre la adenohipófisis son de naturaleza {{peptídica}} (NO esteroidea); es el distractor falso clásico cuando esta opción se enuncia al revés.", "d": "Cierta: la pars tuberalis predomina en células {{cromófobas}} (con algunas acidófilas/basófilas y receptores de melatonina)."}, "_k": "org2p-005:3338506224", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-006", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q6", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "¿Qué tinción es la más adecuada para teñir el **coloide** de los folículos tiroideos?", "opciones": {"a": "Hematoxilina-eosina.", "b": "Tricrómico.", "c": "PAS.", "d": "Tionina."}, "correcta": "c", "razones": {"a": "Falsa como 'la más adecuada': la {{H-E}} tiñe el coloide de rosa pero no es la tinción específica que lo destaca.", "b": "Falsa: el {{tricrómico}} resalta el colágeno/conjuntivo de cápsula y septos, no el coloide.", "c": "CORRECTA. El coloide es un reservorio de {{tiroglobulina}} (glicoproteína) → reacción {{PAS positiva}}, la tinción de elección para destacarlo.", "d": "Falsa: la {{tionina}} es un colorante metacromático, no específico del coloide tiroideo."}, "_k": "org2p-006:1133196374", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-007", "tema": "Piel", "examen": "2025-26 2º parcial · Q7", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept Q30, 2022-23 1P, 2025-26 2P Q7", "enunciado": "En relación con los **melanocitos**, es cierto que:", "opciones": {"a": "Provienen de la diferenciación de células del estrato germinativo o basal de la epidermis.", "b": "En las personas de raza blanca los melanocitos contienen menos melanosomas que las de raza negra.", "c": "Los individuos de raza negra tienen un número de melanocitos por unidad de superficie similar al de la raza blanca.", "d": "Los melanocitos son células que no experimentan recambio celular."}, "correcta": "b", "razones": {"a": "FALSA: los melanocitos NO derivan del estrato basal epidérmico, sino de la {{cresta neural}} (migran a la capa basal, pero su origen es neuroectodérmico). Es la única claramente falsa.", "b": "CORRECTA (la marcada). En la raza blanca los melanocitos contienen {{menos melanosomas}} (y más pequeños/menos melanizados) que en la raza negra; la diferencia de color depende de los melanosomas, no del número de melanocitos.", "c": "También cierta histológicamente: el {{número}} de melanocitos por superficie es similar en todas las razas.", "d": "También cierta: los melanocitos son una población {{estable}}, sin recambio significativo."}, "_k": "org2p-007:1839184245", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-008", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q8", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q9, 2022-23 2P Q12, 2024-25 Q3, 2025-26 2P Q8 (CONCEPTO REY)", "enunciado": "De los orígenes embrionarios que se citan a continuación, ¿cuál es el propio de las **células parafoliculares (C)** del tiroides?", "opciones": {"a": "Endodermo de la base de la lengua.", "b": "Cresta neural.", "c": "3ª bolsa faríngea.", "d": "Ectodermo del techo de la boca primitiva."}, "correcta": "b", "razones": {"a": "Falsa: el endodermo de la base de la lengua origina las {{células foliculares}} (divertículo tiroideo del suelo faríngeo), no las C.", "b": "CORRECTA. Las células parafoliculares (C), secretoras de {{calcitonina}}, derivan de la {{cresta neural}} (migran vía cuerpos ultimobranquiales) y NO contactan con la luz del folículo.", "c": "Falsa: la {{3ª bolsa}} faríngea origina las paratiroides inferiores y el timo, no las células C.", "d": "Falsa: el ectodermo del techo de la boca primitiva (bolsa de {{Rathke}}) origina la adenohipófisis."}, "_k": "org2p-008:1872865226", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-009", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q9", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22 Q8, 2025-26 2P Q9", "enunciado": "En relación con la **oxitocina**, es cierto que:", "opciones": {"a": "Es transportada por transporte axonal por axones de neuronas hipotalámicas, en forma de un péptido precursor más grande que se escinde a medida que avanza por el axón.", "b": "Es sintetizada en el núcleo supraóptico del hipotálamo.", "c": "Se transporta y concentra en el axón en estructuras que al microscopio electrónico se ven como masas amorfas irregulares y electrodensas (cuerpos de Herring).", "d": "Los pituicitos que rodean los axones portadores de oxitocina son células con aspecto similar a los oligodendrocitos del SNC."}, "correcta": "a", "razones": {"a": "CORRECTA (la cierta marcada). La oxitocina viaja por {{transporte axonal}} desde el hipotálamo como un {{pro-péptido}} largo (neurofisina + hormona) que se escinde a medida que avanza por el axón. Es el mecanismo correcto y completo.", "b": "FALSA: la oxitocina se sintetiza principalmente en el núcleo {{paraventricular}} (el {{supraóptico}} es el de la ADH). Esta opción es incorrecta tal como está enunciada.", "c": "Cierta también: se concentra en los {{cuerpos de Herring}}, masas amorfas electrodensas en la pars nervosa (MET).", "d": "Cierta también: los {{pituicitos}} son glía de la neurohipófisis, similar a {{oligodendrocitos}} del SNC."}, "_k": "org2p-009:320870416", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-010", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q10", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P Q10, 2024-25 Q4, 2025-26 2P Q10", "enunciado": "Referente a las glándulas **paratiroides**, **NO** es cierto:", "opciones": {"a": "Habitualmente están situadas bajo la cápsula de la glándula tiroides.", "b": "La presencia de células oxífilas no es significativa hasta la adolescencia.", "c": "El contenido de glucógeno es muy abundante en las células principales.", "d": "Las células oxífilas se caracterizan por presentar un núcleo muy grande y discretamente teñido."}, "correcta": "d", "razones": {"a": "Cierta: las paratiroides se sitúan en la cara posterior de los lóbulos tiroideos, bajo la {{cápsula}} del tiroides.", "b": "Cierta: las células {{oxífilas}} no son significativas hasta la pubertad/adolescencia (aparecen tras los 6-7 años y aumentan con la edad).", "c": "Cierta: el {{glucógeno}} abundante está en las células {{principales}} (no en las oxífilas).", "d": "CORRECTA (es la FALSA). Las oxífilas tienen citoplasma muy eosinófilo (muchas mitocondrias) pero su núcleo es {{pequeño}} e intensamente teñido (denso/picnótico), NO grande y poco teñido."}, "_k": "org2p-010:4098050428", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-011", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q11", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "Referente al **páncreas** endocrino, **NO** es cierto:", "opciones": {"a": "Los islotes de Langerhans están delimitados por tejido conjuntivo muy escaso.", "b": "Las células alfa y beta de los islotes pueden distinguirse claramente al microscopio electrónico por el aspecto de sus gránulos de secreción.", "c": "Métodos histoquímicos han demostrado que los islotes de Langerhans están inervados por el sistema nervioso autónomo.", "d": "Las células delta constituyen el porcentaje más pequeño de los diferentes tipos de células endocrinas de los islotes de Langerhans."}, "correcta": "d", "razones": {"a": "Cierta: el conjuntivo que delimita los islotes es {{escaso}} (fina red de fibras reticulares).", "b": "Cierta: al {{ME}} las células alfa (gránulo denso uniforme) y beta (cristaloide + halo claro) se distinguen claramente por sus gránulos.", "c": "Cierta: la histoquímica demuestra que los islotes están inervados por el {{sistema nervioso autónomo}} (simpático y parasimpático, con uniones gap entre células).", "d": "CORRECTA (es la FALSA). Las células {{delta}} (somatostatina, ~5%) NO son la población más pequeña: las células {{PP/F}} (~1%) son las menos abundantes."}, "_k": "org2p-011:1942429934", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-012", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q12", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (zonas suprarrenal · lipofuscina en reticular)", "enunciado": "La presencia de gránulos de **lipofuscina** en la glándula suprarrenal es particularmente abundante en las células ubicadas en una de las siguientes regiones:", "opciones": {"a": "Zona glomerular.", "b": "Zona fascicular.", "c": "Zona reticular.", "d": "Médula."}, "correcta": "c", "razones": {"a": "Falsa: la zona {{glomerular}} (externa) produce mineralocorticoides; no acumula lipofuscina de forma notable.", "b": "Falsa: la zona {{fascicular}} destaca por las abundantes gotas de {{lípidos}} (espongiocitos), no por la lipofuscina.", "c": "CORRECTA. La zona {{reticular}} (la más interna de la corteza) tiene células con abundante {{lipofuscina}} (pigmento de desgaste) y menos lípidos, lo que le da su tono pardo.", "d": "Falsa: la {{médula}} tiene células cromafines (catecolaminas); no destaca por lipofuscina."}, "_k": "org2p-012:3157730063", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-013", "tema": "Urinario", "examen": "2025-26 2º parcial · Q13", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "En relación con la **nefrona**, una de las siguientes afirmaciones **NO** es cierta:", "opciones": {"a": "Las nefronas corticales tienen unas asas de Henle más cortas que las nefronas yuxtamedulares.", "b": "Las nefronas corticales constituyen aproximadamente el 65-85% del total de nefronas presentes en un riñón.", "c": "Los podocitos y las células endoteliales glomerulares comparten la misma lámina basal.", "d": "La membrana de filtración glomerular está constituida solo por la membrana de los podocitos."}, "correcta": "d", "razones": {"a": "Cierta: las nefronas {{corticales}} tienen asas de Henle más **cortas** que las yuxtamedulares (que las tienen largas).", "b": "Cierta: las nefronas corticales constituyen ~**85%** del total (el rango {{65-85%}} las engloba como mayoritarias).", "c": "Cierta: podocitos y endotelio glomerular {{comparten}} la misma membrana basal glomerular.", "d": "CORRECTA (es la FALSA). La barrera de filtración tiene **tres** componentes: endotelio fenestrado + {{membrana basal}} compartida + pedicelos de los podocitos (con el diafragma de la ranura). No es solo la membrana de los podocitos."}, "_k": "org2p-013:2532340576", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-014", "tema": "Urinario", "examen": "2025-26 2º parcial · Q14", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (mesangiales · EPO la hacen los fibroblastos)", "enunciado": "En relación con las **células mesangiales extraglomerulares** del riñón, **NO** es correcto que:", "opciones": {"a": "Se localizan en la región entre las arteriolas aferente y eferente del polo vascular del riñón.", "b": "Reciben también el nombre de células de Lacis.", "c": "Son secretoras de eritropoyetina (EPO).", "d": "Forman parte del aparato yuxtaglomerular."}, "correcta": "c", "razones": {"a": "Cierta: las mesangiales extraglomerulares se sitúan entre la arteriola {{aferente}} y la **eferente** del polo vascular.", "b": "Cierta: se denominan también células de {{Lacis}} (o de Goormaghtigh).", "c": "CORRECTA (es la FALSA). La {{EPO}} la producen los **fibroblastos modificados** del intersticio cortical peritubular, NO las mesangiales extraglomerulares.", "d": "Cierta: las mesangiales extraglomerulares forman parte del {{aparato yuxtaglomerular}} (con la mácula densa y las células yuxtaglomerulares)."}, "_k": "org2p-014:2742668247", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-015", "tema": "Oído", "examen": "2025-26 2º parcial · Q15", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P Q27, 2024-25 Q29, 2025-26 2P Q15", "enunciado": "En relación con el **órgano de Corti** del oído interno, ¿qué opción es correcta?", "opciones": {"a": "Las células ciliadas presentan estereocilios y cinocilio.", "b": "No presenta otolitos.", "c": "La cúpula cubre sus células ciliadas.", "d": "Se localiza en la membrana vestibular."}, "correcta": "b", "razones": {"a": "Falsa: las células ciliadas cocleares maduras tienen estereocilios pero {{pierden el cinocilio}} en el adulto.", "b": "CORRECTA. El órgano de Corti {{NO presenta otolitos}} (los otolitos están en las máculas del utrículo/sáculo); lo cubre la membrana tectoria.", "c": "Falsa: la {{cúpula}} cubre las crestas ampollares de los conductos semicirculares, no el Corti.", "d": "Falsa: el Corti se asienta sobre la membrana {{basilar}}, no sobre la membrana vestibular (de Reissner)."}, "_k": "org2p-015:3162450943", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-016", "tema": "Urinario", "examen": "2025-26 2º parcial · Q16", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q13, 2025-26 2P Q16", "enunciado": "En relación con los **túbulos contorneados proximales** de la nefrona, es cierto que:", "opciones": {"a": "Son los más numerosos de la corteza.", "b": "El borde luminal de sus células epiteliales presenta numerosas microvellosidades con un glicocálix PAS positivo.", "c": "Presentan una luz de aspecto estrellado.", "d": "Todas las anteriores son correctas."}, "correcta": "d", "razones": {"a": "Cierta: el TCP es el túbulo más {{numeroso}} de la corteza renal.", "b": "Cierta: su borde luminal tiene microvellosidades (ribete en cepillo) con glicocálix {{PAS+}}.", "c": "Cierta: presenta luz de contorno {{estrellado}} (por el ribete en cepillo y el colapso).", "d": "CORRECTA. Las tres afirmaciones describen el {{TCP}} → 'todas las anteriores' son correctas."}, "_k": "org2p-016:1757884564", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-017", "tema": "Urinario", "examen": "2025-26 2º parcial · Q17", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (vías urinarias / detrusor 3 capas)", "enunciado": "En relación con las **vías urinarias**, una de las siguientes afirmaciones **NO** es cierta:", "opciones": {"a": "El músculo detrusor vesical está constituido por dos capas de fibras musculares lisas.", "b": "Histológicamente no hay válvulas ni esfínteres en la desembocadura de los uréteres en la vejiga.", "c": "El esfínter vesical (uretral interno) es un esfínter funcional pero no anatómico.", "d": "El plexo nervioso vesical está constituido por fibras del sistema nervioso vegetativo."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). El músculo **detrusor** vesical tiene {{tres}} subcapas de músculo liso (longitudinal interna, circular media, longitudinal externa), no dos.", "b": "Cierta: la desembocadura ureteral carece de válvula o esfínter anatómico; tiene un mecanismo valvular {{funcional}} por su trayecto oblicuo intramural que impide el reflujo.", "c": "Cierta: el esfínter uretral interno es {{funcional}} (engrosamiento de la subcapa circular del detrusor), no un esfínter anatómico independiente.", "d": "Cierta: el plexo vesical está formado por fibras del sistema nervioso {{vegetativo}} (simpático y parasimpático)."}, "_k": "org2p-017:11681578", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-018", "tema": "Urinario", "examen": "2025-26 2º parcial · Q18", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (yuxtaglomerulares = músculo liso modificado de la aferente)", "enunciado": "Las **células yuxtaglomerulares** son:", "opciones": {"a": "Células de la mácula densa modificadas.", "b": "Fibras musculares lisas modificadas de la pared de la arteriola aferente.", "c": "Células endoteliales de los capilares glomerulares.", "d": "Células del intersticio de la médula renal."}, "correcta": "b", "razones": {"a": "Falsa: la {{mácula densa}} pertenece al TCD (sensor de NaCl), distinta de las células yuxtaglomerulares.", "b": "CORRECTA. Las células yuxtaglomerulares son fibras de **músculo liso modificadas** de la pared de la arteriola {{aferente}}, con gránulos de **renina**.", "c": "Falsa: las células {{endoteliales}} forman el revestimiento capilar y no secretan renina.", "d": "Falsa: las células intersticiales {{medulares}} (fibroblastos modificados) secretan PGE2, no renina."}, "_k": "org2p-018:2805323034", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-019", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q19", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "En relación con el **testículo**, una de las siguientes afirmaciones es cierta:", "opciones": {"a": "Está rodeado por una túnica vaginal de origen peritoneal que le aporta la mayor parte de su irrigación sanguínea.", "b": "Cada lóbulo testicular contiene de 1 a 4 túbulos seminíferos.", "c": "Las células de Leydig se localizan dentro de los túbulos seminíferos.", "d": "Los conductillos eferentes están ubicados en el interior del testículo, drenando directamente la rete testis hacia los túbulos seminíferos."}, "correcta": "b", "razones": {"a": "FALSA. La túnica {{vaginal}} (peritoneo arrastrado en el descenso) es la cubierta **más externa**, pero NO aporta la irrigación: la sangre llega por la **arteria testicular** que entra por el mediastino tras atravesar la albugínea.", "b": "CORRECTA (es la cierta; confirmada con foto del examen). Cada **lóbulo testicular** (delimitado por los tabiques de la albugínea, ~250 lóbulos) contiene de {{1 a 4}} **túbulos seminíferos** enrollados.", "c": "FALSA. Las células de {{Leydig}} (poliédricas, productoras de **testosterona**) están en el **intersticio** entre los túbulos, NO dentro de ellos.", "d": "FALSA. Los {{conductillos eferentes}} (10-20) conectan la **rete testis** con el **epidídimo**; no drenan hacia los túbulos seminíferos (el sentido del flujo es túbulo → rectos → rete → eferentes → epidídimo)."}, "_k": "org2p-019:3566194680", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-020", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q20", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "En relación con las **glándulas de Cowper (bulbouretrales)**, señala la afirmación correcta:", "opciones": {"a": "Son nódulos linfáticos asociados a la uretra prostática.", "b": "Forman parte de la pared de las vesículas seminales.", "c": "Son glándulas tubuloalveolares que vierten su secreción mucosa a la uretra esponjosa (membranosa-bulbar).", "d": "Constituyen el epitelio de transición que reviste la uretra peniana."}, "correcta": "c", "razones": {"a": "FALSA. No son tejido linfático, sino **glándulas exocrinas** túbulo-alveolares.", "b": "FALSA. Son glándulas **independientes** situadas en el diafragma urogenital, no forman parte de la pared de las vesículas seminales.", "c": "CORRECTA (confirmada con foto del examen). Las glándulas de {{Cowper}} (bulbouretrales) son {{tubuloalveolares}} compuestas, en el **diafragma urogenital**, y vierten su secreción **lubricante** a la uretra {{esponjosa}} antes de la eyaculación.", "d": "FALSA. La uretra peneana la reviste epitelio cilíndrico/pseudoestratificado (y plano estratificado distal); las glándulas de Cowper desembocan en ella, no la 'forman' como epitelio."}, "_k": "org2p-020:3269834797", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-021", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q21", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "Durante la espermiogénesis, la formación de la **vesícula acrosómica** tiene lugar en la fase:", "opciones": {"a": "De Golgi.", "b": "De casquete (cubierta).", "c": "Acrosómica.", "d": "De maduración."}, "correcta": "a", "razones": {"a": "CORRECTA (confirmada con foto del examen). En la **fase de Golgi** los gránulos proacrosómicos del aparato de Golgi confluyen y forman la {{vesícula acrosómica}} (con su gránulo acrosómico), que se adosa al núcleo. Aparece también el esbozo del axonema.", "b": "En la fase de **casquete/cubierta** la vesícula ya formada se {{extiende}} sobre el polo anterior del núcleo como un capuchón; la cromatina empieza a condensarse.", "c": "En la fase **acrosómica** el núcleo se aplana y condensa, la célula se alarga y se organiza el flagelo; la vesícula acrosómica ya existía.", "d": "En la fase de **maduración** las Sertoli fagocitan el citoplasma sobrante (cuerpo residual) y se libera la espermátide del sincitio."}, "_k": "org2p-021:1954555034", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-022", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q22", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q21 (clave C)", "enunciado": "El epitelio que reviste el **conducto deferente** es del tipo:", "opciones": {"a": "Plano estratificado no queratinizado.", "b": "Cilíndrico simple con células ciliadas.", "c": "Cilíndrico pseudoestratificado con estereocilios.", "d": "Plano simple con células ciliadas."}, "correcta": "c", "razones": {"a": "FALSA. El plano estratificado no queratinizado es propio de esófago/vagina/exocérvix, no de la vía espermática.", "b": "FALSA. No es cilíndrico **simple**; es **pseudoestratificado**.", "c": "CORRECTA (clave oficial 2022-23 Q21 = C). El **conducto deferente** (igual que el epidídimo) tiene epitelio cilíndrico {{pseudoestratificado}} con {{estereocilios}} (células principales + basales).", "d": "FALSA. No es plano simple ni ciliado."}, "_k": "org2p-022:705642904", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-023", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q23", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22 Q16 (clave C · células deciduales en fase secretora)", "enunciado": "Las **células deciduales** del endometrio, que almacenan glucógeno y lípidos, se encuentran en una de las siguientes fases del ciclo menstrual:", "opciones": {"a": "Fase menstrual.", "b": "Fase proliferativa.", "c": "Fase secretora.", "d": "Ninguna de las anteriores."}, "correcta": "c", "razones": {"a": "FALSA. En la fase {{menstrual}} hay isquemia y descamación por vasoconstricción de las arterias helicoidales; el estroma no está decidualizado.", "b": "FALSA. En la fase {{proliferativa}} (estrógenos) las glándulas son **rectas** y el estroma no está decidualizado.", "c": "CORRECTA (clave oficial 2021-22 Q16 = C). Bajo la {{progesterona}} de la fase {{secretora}}, las células del estroma se transforman en células {{deciduales}} que almacenan glucógeno y lípidos (reacción/predecidualización).", "d": "FALSA. Sí hay fase correcta (la secretora)."}, "_k": "org2p-023:406073204", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-024", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q24", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (foto 2202)", "enunciado": "¿Cuál de las siguientes afirmaciones es una característica histológica de la **glándula mamaria activa (en lactancia)**?", "opciones": {"a": "Los conductos glandulares presentan epitelios estratificados con escasa actividad secretora.", "b": "Los alvéolos están poco desarrollados y solo se observan brotes alveolares dispersos.", "c": "Los componentes de la leche se secretan principalmente por exocitosis a partir de gránulos de secreción.", "d": "Las células secretoras muestran abundantes gotas lipídicas apicales, liberadas mediante un mecanismo apocrino."}, "correcta": "d", "razones": {"a": "FALSA. En la mama **activa** hay intensa actividad secretora en los alvéolos; el epitelio glandular no es 'estratificado con escasa actividad'.", "b": "FALSA. Alvéolos poco desarrollados y brotes dispersos describen la mama **inactiva/en reposo**, no la lactante.", "c": "FALSA (parcial-trampa). Las {{proteínas}} (caseína) y carbohidratos sí van por **merocrino/exocitosis**, pero NO 'principalmente todos' los componentes: los **lípidos** se liberan por mecanismo apocrino.", "d": "CORRECTA. En la mama activa los {{lípidos}} se acumulan en **gotas apicales** y se liberan por mecanismo {{apocrino}} (arrastrando un fragmento de membrana/cubierta)."}, "_k": "org2p-024:4224868450", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-025", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q25", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 Q25 (clave B), 2025-26 2P Q25", "enunciado": "Las llamadas **glándulas de Bartholin** en la mujer se encuentran en:", "opciones": {"a": "Cuerpo del útero.", "b": "Cérvix uterino.", "c": "Vagina.", "d": "Vestíbulo de los genitales externos."}, "correcta": "d", "razones": {"a": "FALSA. El cuerpo del útero no contiene glándulas de Bartholin.", "b": "FALSA. El cérvix tiene glándulas endocervicales (origen de los quistes de Naboth), no Bartholin.", "c": "FALSA. La vagina carece de glándulas mucosas propias (epitelio plano estratificado no queratinizado).", "d": "CORRECTA (clave 2024-25 = B 'caras laterales del vestíbulo'). Las glándulas de {{Bartholin}} (vestibulares mayores) están en las caras laterales posteriores del {{vestíbulo}} de los genitales externos; secreción lubricante."}, "_k": "org2p-025:1162497080", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-026", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q26", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Los llamados **quistes de Naboth** pueden encontrarse en:", "opciones": {"a": "La luz de las glándulas del cuello del útero (cérvix).", "b": "La luz de las glándulas del cérvix uterino.", "c": "La luz de la vagina.", "d": "En los folículos pilosos de la piel del monte de Venus."}, "correcta": "a", "razones": {"a": "CORRECTA. Los quistes de {{Naboth}} son glándulas {{endocervicales}} (del cuello del útero / cérvix) dilatadas por retención de moco al obstruirse su conducto.", "b": "Describe **lo mismo** que la opción a ('cérvix uterino' = 'cuello del útero'); por convención se marca la primera (a).", "c": "FALSA. La vagina carece de glándulas mucosas propias (epitelio plano estratificado).", "d": "FALSA. No tienen relación con los folículos pilosos del monte de Venus."}, "_k": "org2p-026:1194766219", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-027", "tema": "Ojo", "examen": "2025-26 2º parcial · Q27", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "El **glaucoma** es un trastorno provocado por el aumento de la presión intraocular que sucede frecuentemente como consecuencia de:", "opciones": {"a": "El aumento de la producción de humor acuoso por parte de la red trabecular.", "b": "El aumento de la producción de humor acuoso por parte del conducto de Schlemm.", "c": "La disminución del drenaje del humor acuoso primero a través del conducto de Schlemm y después de la red trabecular.", "d": "La disminución del drenaje del humor acuoso primero a través de la red trabecular y después del conducto de Schlemm."}, "correcta": "d", "razones": {"a": "Falsa: la red trabecular {{drena}} el humor acuoso, no lo produce (lo producen los procesos ciliares).", "b": "Falsa: el conducto de {{Schlemm}} es vía de drenaje, no de producción.", "c": "Falsa: invierte el orden; el acuoso pasa primero por la {{red trabecular}} y después al Schlemm.", "d": "CORRECTA. El glaucoma resulta de la {{disminución del drenaje}}: el humor acuoso atraviesa primero la {{red trabecular}} y luego el conducto de Schlemm."}, "_k": "org2p-027:1548744117", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-028", "tema": "Ojo", "examen": "2025-26 2º parcial · Q28", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 Q27 (clave C), 2025-26 2P Q28", "enunciado": "En relación con las **células ganglionares de la retina**, es cierto que:", "opciones": {"a": "Están en contacto con el epitelio pigmentario de la retina.", "b": "Son células fotorreceptoras.", "c": "Las células amacrinas establecen contactos sinápticos con ellas.", "d": "Las células horizontales establecen contactos sinápticos con ellas."}, "correcta": "c", "razones": {"a": "Falsa: las ganglionares son la capa más {{interna}} de la retina; no contactan con el epitelio pigmentario (el más externo).", "b": "Falsa: NO son {{fotorreceptoras}}; reciben la señal ya procesada por bipolares.", "c": "CORRECTA. Las células {{amacrinas}} hacen sinapsis con las ganglionares en la capa {{plexiforme interna}}.", "d": "Falsa: las células {{horizontales}} sinaptan en la plexiforme externa (fotorreceptores/bipolares), no con las ganglionares."}, "_k": "org2p-028:2879550282", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-029", "tema": "Ojo", "examen": "2025-26 2º parcial · Q29", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P Q29", "enunciado": "Es cierto que el **cristalino**:", "opciones": {"a": "Está vascularizado.", "b": "Se localiza al mismo nivel que los procesos ciliares.", "c": "Presenta terminaciones nerviosas.", "d": "Presenta melanocitos."}, "correcta": "b", "razones": {"a": "Falsa: el cristalino es {{avascular}} (sus fibras se nutren del humor acuoso).", "b": "CORRECTA. El cristalino se sitúa a la altura de los {{procesos ciliares}}, suspendido por las fibras zonulares (zónula de Zinn).", "c": "Falsa: NO tiene {{terminaciones nerviosas}}.", "d": "Falsa: NO contiene {{melanocitos}}; sus fibras (cristalinas) son transparentes."}, "_k": "org2p-029:3780371810", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-030", "tema": "Oído", "examen": "2025-26 2º parcial · Q30", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 Q30, 2025-26 2P Q30", "enunciado": "En relación con la **mácula del utrículo**, es cierto que:", "opciones": {"a": "Sus células ciliadas están en contacto con la perilinfa.", "b": "Se localiza en una región de los conductos semicirculares.", "c": "No contiene células de sostén.", "d": "Contiene otolitos y está bañada por endolinfa."}, "correcta": "d", "razones": {"a": "Falsa: las células ciliadas están en contacto con la {{endolinfa}}, no con la perilinfa.", "b": "Falsa: la mácula utricular está en el {{utrículo}}, no en los conductos semicirculares (ahí están las crestas ampollares).", "c": "Falsa: SÍ tiene células de {{sostén}} junto a las ciliadas.", "d": "CORRECTA. Las máculas contienen {{otolitos}} (membrana otolítica con CaCO₃) y están bañadas por {{endolinfa}}; la mácula del utrículo detecta el plano horizontal."}, "_k": "org2p-030:622927155", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-031", "tema": "Piel", "examen": "2025-26 2º parcial · Q31 (Imagen 1)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (estratos epidermis)", "enunciado": "IMAGEN 1. Sección histológica de piel. ¿A qué capa corresponde lo que indica la flecha?", "opciones": {"a": "Estrato córneo.", "b": "Estrato germinativo o basal.", "c": "Estrato espinoso.", "d": "Estrato granuloso."}, "correcta": "a", "razones": {"a": "Por defecto (lo más señalado en piel gruesa): la capa más superficial, eosinófila, laminar y anucleada → **estrato córneo** {{(escamas de queratina sin núcleo)}}.", "b": "El basal es la hilera profunda columnar sobre la dermis.", "c": "El espinoso son varias capas de células poligonales con espinas.", "d": "El granuloso tiene gránulos basófilos de queratohialina (justo bajo el córneo).", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T07-Piel/t07pellcv-p06-1.png", "_k": "org2p-031:1325566814", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-032", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q32 (Imagen 2)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (cromófilas adenohipófisis)", "enunciado": "IMAGEN 2. ¿Qué células endocrinas (adenohipófisis) indican los números?", "opciones": {"a": "1-Cromófila acidófila, 2-Cromófila basófila, 3-Cromófoba.", "b": "1-Cromófila basófila, 2-Cromófila acidófila, 3-Cromófoba.", "c": "1-Cromófoba, 2-Cromófila basófila, 3-Cromófila acidófila.", "d": "1-Cromófila acidófila, 2-Cromófoba, 3-Cromófila basófila."}, "correcta": "a", "razones": {"a": "CORRECTA (lo más probable según patrón de color). Criterio: **acidófila** = citoplasma rosa-rojo intenso (somatotropas/mamotropas); **basófila** = azul-púrpura/PAS+ (cortico/tiro/gonadotropas); **cromófoba** = pálida, casi sin teñir. La opción a aplica 1=acidófila (rosa), 2=basófila (azul), 3=cromófoba (pálida).", "b": "Solo correcta si 1 fuera {{basófila}} (azul) y 2 acidófila (rosa).", "c": "Solo correcta si 1 fuera {{cromófoba}} (pálida).", "d": "Solo correcta si 3 fuera {{basófila}} (azul) y 2 cromófoba (pálida)."}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08hipofisi-p17-1.png", "redact": [{"x": 34, "y": 3, "w": 40, "h": 13}, {"x": 2, "y": 78, "w": 40, "h": 13}, {"x": 60, "y": 40, "w": 38, "h": 13}], "_k": "org2p-032:4201543411", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-033", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q33 (Imagen 3)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 3. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pituitaria.", "b": "Paratiroides.", "c": "Tiroides.", "d": "Adrenal."}, "correcta": "c", "razones": {"a": "Falsa: la hipófisis muestra cordones de células {{cromófilas}}/cromófobas y sinusoides, sin folículos con coloide.", "b": "Falsa: la paratiroides tiene cordones de células {{principales}} pequeñas + oxífilas, sin coloide.", "c": "CORRECTA. Si se ven {{folículos}} redondos llenos de coloide rosado homogéneo rodeados de epitelio cúbico → {{tiroides}}.", "d": "Falsa: la suprarrenal muestra {{zonación}} cortical en cordones + médula, sin folículos."}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08tiroide-p08-1.png", "redact": [{"x": 2, "y": 2, "w": 22, "h": 11}, {"x": 30, "y": 28, "w": 42, "h": 20}, {"x": 62, "y": 45, "w": 38, "h": 12}], "_k": "org2p-033:3174869072", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-034", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q34 (Imagen 4)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 4. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pineal.", "b": "Tiroides.", "c": "Hipófisis.", "d": "Paratiroides."}, "correcta": "d", "razones": {"a": "Falsa: la pineal tiene {{pinealocitos}} y cuerpos arenáceos (acérvulos calcificados), no cordones de principales/oxífilas.", "b": "Falsa: la tiroides mostraría {{folículos}} con coloide.", "c": "Falsa: la hipófisis tiene mezcla de cromófilas {{acidófilas/basófilas}} y sinusoides.", "d": "CORRECTA. Cordones densos de células {{principales}} pequeñas y pálidas con algunas {{oxífilas}} eosinófilas y SIN coloide → {{paratiroides}}."}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08paratiro-p07-1.png", "redact": [{"x": 36, "y": 7, "w": 40, "h": 12}, {"x": 24, "y": 40, "w": 24, "h": 12}, {"x": 58, "y": 72, "w": 40, "h": 12}], "_k": "org2p-034:3108303954", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-035", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q35 (Imagen 5)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (zonas suprarrenal)", "enunciado": "IMAGEN 5. Indica a qué zonas de la corteza de la glándula adrenal corresponde cada número:", "opciones": {"a": "1-Cápsula, 2-Zona fascicular, 3-Médula.", "b": "1-Zona reticular, 2-Zona fascicular, 3-Zona glomerular.", "c": "1-Zona glomerular, 2-Zona fascicular, 3-Zona reticular.", "d": "1-Zona glomerular, 2-Zona reticular, 3-Zona fascicular."}, "correcta": "c", "razones": {"a": "Falsa: mezcla {{cápsula}} y médula sin la zonación cortical ordenada que piden los números.", "b": "Falsa: invierte el orden ({{glomerular}} es la más externa, no la 3).", "c": "CORRECTA. De fuera a dentro la corteza es {{glomerular}} → fascicular → reticular (regla 'GFR').", "d": "Falsa: la {{reticular}} no precede a la fascicular (es la más interna)."}, "imagen": "_quiz_imgs/T08-Endocrino/t08adrenals-p11-2.png", "redact": [{"x": 38, "y": 42, "w": 30, "h": 13}], "_k": "org2p-035:20651113", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-036", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q36 (Imagen 6)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (regiones hipófisis)", "enunciado": "IMAGEN 6. Zona de la glándula hipófisis (H-E). ¿A qué región corresponde la que señalan las flechas?", "opciones": {"a": "Pars distalis.", "b": "Pars nervosa.", "c": "Pars tuberalis.", "d": "Pars intermedia."}, "correcta": "d", "razones": {"a": "Falsa: la pars distalis es la masa principal de la adenohipófisis (cordones de {{cromófilas}}/cromófobas + sinusoides).", "b": "Falsa: la pars nervosa es pálida y {{fibrilar}} (axones + pituicitos), con cuerpos de Herring.", "c": "Falsa: la pars tuberalis es el manguito que rodea el {{tallo}}, con cromófobas.", "d": "CORRECTA. Banda entre adeno y neurohipófisis con {{quistes de Rathke}} (folículos con coloide) y células basófilas → {{pars intermedia}}."}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08hipofisi-p24-1.png", "redact": [{"x": 1, "y": 6, "w": 28, "h": 12}, {"x": 32, "y": 38, "w": 34, "h": 12}, {"x": 36, "y": 78, "w": 34, "h": 13}], "_k": "org2p-036:1999909973", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-037", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De entre las células que constituyen el parénquima de la adenohipófisis, ¿cuáles presentan los gránulos de secreción más grandes?", "opciones": {"a": "Células somatotropas.", "b": "Células mamotropas.", "c": "Células tirotropas.", "d": "Células gonadotropas."}, "correcta": "c", "razones": {"a": "Falsa según la clave: las {{somatotropas}} (GH, 350-400 nm) no tienen los gránulos mayores.", "b": "Falsa según la clave oficial, aunque histológicamente las {{mamotropas}} (PRL, ~600 nm) son las de mayor diámetro en la tabla del tema (ojo a esta contradicción).", "c": "CORRECTA (clave oficial 2024-25 = C). El profesor marca las {{tirotropas}} como las de gránulos más grandes. Se memoriza tal cual cae, pese a que por diámetro (130-150 nm) serían las MENORES de la tabla.", "d": "Falsa: las {{gonadotropas}} (200-400 nm) tienen gránulos de tamaño intermedio."}, "_k": "org2p-037:3313232386", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-038", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. B)", "enunciado": "De las siguientes afirmaciones referentes a la adenohipófisis, una **NO** es cierta:", "opciones": {"a": "Las células acidófilas constituyen el mayor porcentaje de células de la pars distalis.", "b": "Las hormonas hipotalámicas de liberación son de naturaleza esteroidea.", "c": "Las hormonas hipotalámicas llegan a la adenohipófisis por el sistema porta hipotálamo-hipofisario.", "d": "Las células cromófobas predominan en la pars tuberalis."}, "correcta": "b", "razones": {"a": "Cierta: las células {{acidófilas}} (somatotropas + mamotropas) son el mayor porcentaje de la pars distalis (~50%).", "b": "CORRECTA (es la FALSA). Las hormonas hipotalámicas de liberación son {{peptídicas}}, NO esteroideas. Distractor clásico de altísima frecuencia.", "c": "Cierta: las hormonas hipotalámicas llegan por el {{sistema porta}} hipotálamo-hipofisario.", "d": "Cierta: en la {{pars tuberalis}} predominan las células cromófobas."}, "_k": "org2p-038:4200441748", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-039", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "De las siguientes afirmaciones relacionadas con la glándula tiroides, una **NO** es cierta:", "opciones": {"a": "Tiene elementos celulares de distinto origen embriológico.", "b": "Las células foliculares cambian de aspecto según la actividad funcional de la glándula.", "c": "El aumento de actividad de la glándula conlleva un aumento de los gránulos de secreción de las células foliculares.", "d": "Las células parafoliculares se encuentran en contacto con la luz de los folículos."}, "correcta": "d", "razones": {"a": "Cierta: el tiroides tiene células de distinto origen: foliculares ({{endodermo}}) y parafoliculares (cresta neural).", "b": "Cierta: las foliculares cambian de aspecto (cúbicas/aplanadas en reposo → {{prismáticas}} altas en hiperactividad).", "c": "Cierta: al aumentar la actividad reabsorben coloide y aumentan las {{gotas/vacuolas}} intracelulares apicales.", "d": "CORRECTA (es la FALSA). Las células parafoliculares NO contactan con la {{luz}} del folículo: quedan en la pared sin alcanzar el coloide."}, "_k": "org2p-039:656032108", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-040", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. A)", "enunciado": "En relación con las **células oxífilas de las paratiroides** humanas, **NO** es cierto que:", "opciones": {"a": "Su número no es significativo hasta llegar a la pubertad.", "b": "Son células secretoras que colaboran con las principales en la secreción de PTH.", "c": "Tienen abundantes mitocondrias en su citoplasma.", "d": "Son de mayor tamaño que las células principales."}, "correcta": "b", "razones": {"a": "Cierta: el número de oxífilas no es significativo hasta la {{pubertad}} (aumentan con la edad).", "b": "CORRECTA (es la FALSA). Las oxífilas NO secretan {{PTH}} ni colaboran en su secreción; la PTH la producen las células {{principales}}.", "c": "Cierta: las oxífilas tienen abundantes {{mitocondrias}} alargadas (de ahí su intensa eosinofilia).", "d": "Cierta: las oxífilas son de mayor {{tamaño}} que las células principales."}, "_k": "org2p-040:2009929168", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-041", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "De las características mencionadas a continuación, ¿cuál es propia de las células de la **capa fasciculada** de la corteza suprarrenal?", "opciones": {"a": "Son las más abundantes y grandes en la corteza.", "b": "Frecuentemente son binucleadas.", "c": "Son las que presentan más gotas de lípidos.", "d": "Todas las anteriores."}, "correcta": "d", "razones": {"a": "Cierta: las células de la zona {{fascicular}} son las más abundantes y grandes de la corteza (espongiocitos).", "b": "Cierta: con frecuencia son {{binucleadas}}.", "c": "Cierta: son las que presentan más {{gotas de lípidos}} (precursores de glucocorticoides).", "d": "CORRECTA. {{Todas}} las características anteriores son propias de la zona fascicular."}, "_k": "org2p-041:2384875513", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-042", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. B)", "enunciado": "Sobre la **médula de la glándula suprarrenal**, señala la respuesta correcta:", "opciones": {"a": "Sus células se tiñen de pardo con sales de cromo (reacción cromafín).", "b": "Las células secretoras de noradrenalina presentan gránulos más electrodensos que las de adrenalina.", "c": "Embrionariamente se origina de la cresta neural entre las semanas 6-7.", "d": "Todas son ciertas."}, "correcta": "b", "razones": {"a": "Cierta también: las células cromafines se tiñen de pardo con sales de {{cromo}} (reacción cromafín); no es la marcada oficialmente.", "b": "CORRECTA (clave oficial 2024-25 = B). Las células secretoras de {{noradrenalina}} tienen gránulos más {{electrodensos}} que las de adrenalina. Dato repetido del tema.", "c": "Cierta también: la médula deriva de la {{cresta neural}} (semanas 6-7); no es la marcada.", "d": "Falsa como respuesta única: aunque a, b y c son ciertas, la clave oficial marca solo la {{B}} (probablemente por matiz en alguna otra opción del examen original)."}, "_k": "org2p-042:3521759222", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-043", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B)", "enunciado": "En el páncreas endocrino, gránulos con un **centro fuertemente electrodenso rodeado de un halo claro** (cristaloide) son propios de las células:", "opciones": {"a": "Alfa.", "b": "Beta.", "c": "Delta.", "d": "PP."}, "correcta": "b", "razones": {"a": "Falsa: las células {{alfa}} (glucagón, periferia del islote) tienen gránulo electrodenso uniforme, sin halo claro.", "b": "CORRECTA. Las células {{beta}} (insulina, centro del islote) tienen gránulos con un cristaloide {{electrodenso}} central rodeado de un {{halo claro}}.", "c": "Falsa: las células {{delta}} (somatostatina) tienen gránulo grande de densidad homogénea baja.", "d": "Falsa: las {{PP}} son escasas, con gránulos pequeños (140-200 nm)."}, "_k": "org2p-043:3351943404", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-044", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "De las siguientes formaciones, ¿cuál **NO** se localiza en la **corteza renal**?", "opciones": {"a": "Corpúsculo renal.", "b": "Túbulo contorneado proximal.", "c": "Asa de Henle.", "d": "Túbulo contorneado distal."}, "correcta": "c", "razones": {"a": "Sí está en la corteza: el {{corpúsculo renal}} es cortical.", "b": "Sí está en la corteza: el {{TCP}} es cortical (es el túbulo más abundante de la corteza).", "c": "CORRECTA (la que NO está en la corteza). El {{asa de Henle}} (sobre todo su segmento delgado y porciones rectas) se confina a la **médula** y rayos medulares, no a la corteza.", "d": "Sí está en la corteza: el {{TCD}} es cortical."}, "_k": "org2p-044:1024929625", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-045", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q18, 2024-25 (clave D)", "enunciado": "Uno de los tipos celulares que forman parte del riñón presenta una importante **capacidad fagocítica**, ¿cuál?", "opciones": {"a": "Podocitos.", "b": "Células yuxtaglomerulares.", "c": "Células mesangiales extraglomerulares.", "d": "Células mesangiales intraglomerulares."}, "correcta": "d", "razones": {"a": "Los {{podocitos}} forman la barrera de filtración (pedicelos y diafragma de la ranura), no fagocitan.", "b": "Las células {{yuxtaglomerulares}} secretan **renina**, no fagocitan.", "c": "Las mesangiales {{extraglomerulares}} (células de Lacis/Goormaghtigh) tienen función de soporte y comunicación, no fagocítica destacada.", "d": "CORRECTA. Las células mesangiales {{intraglomerulares}} tienen capacidad **fagocítica** (limpian restos proteicos de la membrana basal) además de contráctil."}, "_k": "org2p-045:3090779143", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-046", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A)", "enunciado": "Sobre las **vías urinarias**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Sin distensión, el urotelio tiene más capas en la vejiga vacía que en la pelvis renal.", "b": "Las células del urotelio presentan abundantes vesículas fusiformes limitadas por membrana.", "c": "La capa muscular de la vejiga está formada por tres subcapas de fibras musculares lisas (detrusor).", "d": "La vejiga está inervada por fibras simpáticas y parasimpáticas."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). El enunciado afirma que la vejiga vacía tiene más capas que la pelvis renal; según el profesor (clave 2024-25 = A) la afirmación está marcada como falsa. ⚠️ La razón estándar del distractor invierte el nº de capas: el urotelio de la vejiga relajada/vacía es de {{6-8+ capas}} mientras que cálices/pelvis tienen 2-3. Ver nota: discrepancia con el apunte T09.", "b": "Cierta: las células superficiales 'en cúpula' (en paraguas) presentan abundantes {{vesículas fusiformes}} (reserva de membrana apical para la distensión).", "c": "Cierta: el {{detrusor}} está formado por **tres** subcapas de fibras musculares lisas.", "d": "Cierta: la vejiga está inervada por fibras {{simpáticas y parasimpáticas}} (sistema autónomo)."}, "_k": "org2p-046:1676876680", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-047", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué célula renal es la encargada de secretar **prostaglandina E2**?", "opciones": {"a": "Células de la mácula densa.", "b": "Células yuxtaglomerulares.", "c": "Fibroblastos modificados del intersticio de la corteza.", "d": "Fibroblastos modificados del intersticio de la médula."}, "correcta": "d", "razones": {"a": "La {{mácula densa}} censa el NaCl tubular del TCD; no secreta PGE2.", "b": "Las células {{yuxtaglomerulares}} secretan **renina**.", "c": "Los fibroblastos modificados del intersticio {{cortical}} (peritubular) producen **eritropoyetina (EPO)**, no PGE2.", "d": "CORRECTA. Los fibroblastos modificados del intersticio {{medular}} secretan **prostaglandina E2** (y medulipina)."}, "_k": "org2p-047:867273910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-048", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "Señala la afirmación **CORRECTA** sobre el esfínter y el plexo vesicales:", "opciones": {"a": "El esfínter vesical interno es de músculo estriado voluntario.", "b": "El esfínter externo depende del sistema simpático.", "c": "El esfínter vesical interno es un engrosamiento de la subcapa circular del detrusor; el plexo vesical lo forman fibras simpáticas y parasimpáticas.", "d": "La vejiga carece de inervación autónoma."}, "correcta": "c", "razones": {"a": "Falsa: el esfínter vesical interno es de músculo {{liso}} (involuntario), no estriado voluntario.", "b": "Falsa: el esfínter externo (uretral) es estriado y depende del control {{somático}} (voluntario), no del simpático.", "c": "CORRECTA. El esfínter interno es un engrosamiento de la subcapa {{circular}} del detrusor; el plexo vesical lo forman fibras **simpáticas y parasimpáticas**.", "d": "Falsa: la vejiga sí posee inervación {{autónoma}} (vegetativa)."}, "_k": "org2p-048:1830958548", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-049", "tema": "Urinario", "examen": "2022-23 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23 (resp. A); glomérulo", "enunciado": "Sobre el **glomérulo renal**, señala lo que **NO** es cierto:", "opciones": {"a": "Los capilares glomerulares son fenestrados con fenestraciones provistas de diafragma.", "b": "Entre los pedicelos hay ranuras de filtración cerradas por un diafragma con nefrina.", "c": "La membrana basal es compartida por endotelio y podocitos.", "d": "Las células mesangiales dan soporte a los capilares."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Los capilares glomerulares son fenestrados, pero sus fenestraciones {{NO tienen diafragma}} (a diferencia de otros capilares fenestrados, p. ej. del intestino o endocrinos).", "b": "Cierta: entre los pedicelos hay ranuras de filtración cerradas por un diafragma con {{nefrina}} (y podocina).", "c": "Cierta: la {{membrana basal}} glomerular es compartida por endotelio y podocitos (fusión de ambas láminas).", "d": "Cierta: las células {{mesangiales}} dan soporte estructural a las asas capilares."}, "_k": "org2p-049:2264242390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-050", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "¿Qué **NO** es una característica propia de las **células de Sertoli**?", "opciones": {"a": "Tener forma cilíndrica alta.", "b": "Presentar numerosos pliegues de la membrana.", "c": "Contener cuerpos amiláceos en su citoplasma.", "d": "Presentar uniones oclusivas con células de Sertoli vecinas."}, "correcta": "c", "razones": {"a": "Cierta: las Sertoli son células {{cilíndricas altas}} que se extienden de la lámina basal a la luz del túbulo.", "b": "Cierta: presentan numerosos {{pliegues}} laterales y apicales de membrana que envuelven a las células germinales.", "c": "CORRECTA (es la FALSA; clave 2024-25 = C). Los {{cuerpos amiláceos}} son propios de la **próstata**; las Sertoli contienen **cristales de Charcot-Böttcher**, no amiláceos.", "d": "Cierta: las {{uniones oclusivas}} (tight junctions) entre Sertoli adyacentes forman la **barrera hemato-testicular**."}, "_k": "org2p-050:1322815544", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-051", "tema": "Reproductor", "examen": "Concepto recurrente (Sertoli)", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q16; concepto recurrente", "enunciado": "Las **células de Sertoli** sintetizan principalmente:", "opciones": {"a": "Testosterona.", "b": "Proteína fijadora de andrógenos (ABP) e inhibina.", "c": "LH y FSH.", "d": "Cristales de Reinke."}, "correcta": "b", "razones": {"a": "FALSA. La {{testosterona}} la producen las células de **Leydig** (intersticio), no las Sertoli.", "b": "CORRECTA. Las Sertoli sintetizan {{ABP}} (proteína fijadora de andrógenos, mantiene la testosterona alta en el túbulo) e {{inhibina}} (frena la FSH). También: hormona antimülleriana, transferrina, medio rico en fructosa.", "c": "FALSA. **LH y FSH** son hormonas **hipofisarias** (adenohipófisis), no las sintetiza el testículo.", "d": "FALSA. Los {{cristales de Reinke}} son inclusiones de las células de **Leydig**."}, "_k": "org2p-051:3245024624", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-052", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. D); cristales de Reinke", "enunciado": "Los **cristales de Reinke** son propios de:", "opciones": {"a": "Espermatogonias tipo A oscuras.", "b": "Células glandulares de la próstata.", "c": "Células de Sertoli.", "d": "Células de Leydig."}, "correcta": "d", "razones": {"a": "FALSA. Las espermatogonias tipo A son células germinales de reserva; no contienen cristales de Reinke.", "b": "FALSA. La próstata tiene {{cuerpos amiláceos}}, no cristales de Reinke.", "c": "FALSA. Las Sertoli tienen cuerpos de {{Charcot-Böttcher}}.", "d": "CORRECTA (clave 2021-junio = D). Los {{cristales de Reinke}} (función desconocida) son inclusiones citoplasmáticas características de las células de **Leydig**."}, "_k": "org2p-052:81412857", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-053", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D); meiosis", "enunciado": "De las células germinales del testículo, ¿cuál experimenta la **primera división meiótica**?", "opciones": {"a": "Espermatogonia tipo A.", "b": "Espermatocito secundario.", "c": "Espermátida.", "d": "Ninguna de las anteriores."}, "correcta": "d", "razones": {"a": "FALSA. Las espermatogonias tipo A se dividen por {{mitosis}} (renovación), no por meiosis.", "b": "FALSA. El espermatocito {{secundario}} realiza la **SEGUNDA** división meiótica, no la primera.", "c": "FALSA. Las espermátidas ya no se dividen; sufren espermiogénesis.", "d": "CORRECTA (clave 2024-25 = D). La **1ª división meiótica** la hace el espermatocito {{primario}}, que NO figura entre las opciones → 'ninguna de las anteriores'. Trampa de redacción clásica."}, "_k": "org2p-053:658427566", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-054", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. C)", "enunciado": "¿En qué célula germinal se produce la **segunda división meiótica**?", "opciones": {"a": "Espermatogonia tipo A.", "b": "Espermatogonia tipo B.", "c": "Espermatocito secundario.", "d": "Espermátida."}, "correcta": "c", "razones": {"a": "FALSA. La espermatogonia A se renueva por {{mitosis}}.", "b": "FALSA. La espermatogonia B se diferencia a espermatocito primario (sin meiosis aún).", "c": "CORRECTA (clave 2021-junio = C). El espermatocito {{secundario}} (producto de la 1ª meiosis) realiza la **2ª división meiótica** → espermátidas haploides.", "d": "FALSA. La espermátida ya no se divide; sufre espermiogénesis (G-C-A-M)."}, "_k": "org2p-054:1048147569", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-055", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las túnicas que recubren el testículo, ¿cuál es la **más externa**?", "opciones": {"a": "Túnica vascular.", "b": "Túnica albugínea.", "c": "Túnica vaginal.", "d": "Túnica muscular."}, "correcta": "c", "razones": {"a": "FALSA. La túnica **vascular** es la más **interna** (TC laxo bajo la albugínea).", "b": "FALSA. La túnica {{albugínea}} (TC denso irregular) es la cápsula intermedia.", "c": "CORRECTA (clave 2024-25 = C). La túnica {{vaginal}} (derivada del **peritoneo**, hojas visceral y parietal) es la cubierta **más externa** del testículo.", "d": "FALSA. La 'túnica muscular' no es una túnica testicular en este esquema (el dartos es de la pared escrotal, no del testículo)."}, "_k": "org2p-055:689751499", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-056", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D); próstata", "enunciado": "En relación con la **próstata**, señala lo que **NO** es correcto:", "opciones": {"a": "Las fibras musculares lisas son abundantes en su cápsula.", "b": "No es infrecuente encontrar glicoproteínas calcificadas (cuerpos amiláceos) en la luz glandular.", "c": "Rodea la porción final de los conductos eyaculadores.", "d": "Las glándulas principales están ubicadas internamente, inmediatamente alrededor de la uretra."}, "correcta": "d", "razones": {"a": "Cierta: la cápsula y los tabiques prostáticos son ricos en {{músculo liso}} fibroelástico.", "b": "Cierta: los {{cuerpos amiláceos}} (glicoproteínas calcificadas) en la luz glandular son un hallazgo típico y aumentan con la edad.", "c": "Cierta: la próstata rodea la uretra prostática y la **porción final de los conductos eyaculadores**.", "d": "CORRECTA (es la FALSA; clave 2024-25 = D). Las glándulas {{principales}} son las **periféricas/externas** (las más abundantes); las inmediatas a la uretra son las **periuretrales/mucosas**."}, "_k": "org2p-056:2586158088", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-057", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); conducto deferente", "enunciado": "¿Qué capa **NO** es propia del **conducto deferente**?", "opciones": {"a": "Serosa en todo su trayecto.", "b": "Epitelio cilíndrico pseudoestratificado con estereocilios.", "c": "Lámina propia.", "d": "Muscular muy gruesa (tres capas)."}, "correcta": "a", "razones": {"a": "CORRECTA (es la que NO es propia; clave 2021-junio = A). El conducto deferente tiene **adventicia** en la mayor parte de su trayecto, NO {{serosa}}.", "b": "Cierta: epitelio cilíndrico {{pseudoestratificado}} con **estereocilios** (igual que el epidídimo).", "c": "Cierta: bajo el epitelio hay {{lámina propia}}.", "d": "Cierta: la {{muscular}} es muy gruesa (3 capas: longitudinal interna, circular media, longitudinal externa) → se palpa como cordón en la vasectomía."}, "_k": "org2p-057:496507390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-058", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B); foliculogénesis", "enunciado": "Sobre el **desarrollo de los folículos ováricos**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Los folículos primordiales están formados por un ovocito rodeado por una sola capa de células aplanadas.", "b": "La teca externa de los folículos secundarios está formada por células fibrosas con receptores para FSH.", "c": "Los cuerpos de Call-Exner son propios de los folículos secundarios.", "d": "Los folículos de Graaf tienen múltiples capas de granulosa y una gran cavidad antral."}, "correcta": "b", "razones": {"a": "Cierta: el folículo {{primordial}} = ovocito primario + **1 capa** de células foliculares **aplanadas** + lámina basal.", "b": "CORRECTA (es la FALSA; clave 2024-25 = B). La teca **externa** es fibrosa de soporte y **carece de receptores hormonales relevantes**; los receptores de **LH** y la esteroidogénesis están en la teca {{interna}}. Afirmar 'teca externa con receptores de FSH' es falso.", "c": "Cierta: los {{cuerpos de Call-Exner}} (espacios con líquido entre la granulosa) son propios de los folículos **secundarios/antrales** y al fusionarse forman el antro.", "d": "Cierta: el folículo de {{Graaf}} (maduro) tiene granulosa multilaminar y una gran **cavidad antral**."}, "_k": "org2p-058:2157574592", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-059", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P (resp. C); antro folicular", "enunciado": "¿En cuál de los siguientes tipos de folículos se empieza a desarrollar lo que llamamos **antro folicular**?", "opciones": {"a": "Folículos primordiales.", "b": "Folículos primarios.", "c": "Folículos secundarios.", "d": "Folículos de De Graaf."}, "correcta": "c", "razones": {"a": "FALSA. El folículo {{primordial}} solo tiene 1 capa de células planas, sin antro.", "b": "FALSA. El folículo {{primario}} tiene zona pelúcida y granulosa cúbica/multilaminar, pero aún sin cavidad antral.", "c": "CORRECTA (clave 2022-23 = C). El **antro** (cavidad con líquido folicular, por fusión de los cuerpos de Call-Exner) aparece por primera vez en el folículo {{secundario}} (antral).", "d": "FALSA. El de Graaf ya posee un **gran antro consolidado**; no es donde 'empieza' a desarrollarse."}, "_k": "org2p-059:3754665862", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-060", "tema": "Reproductor", "examen": "Concepto recurrente (zona pelúcida)", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q17; conceptos foliculares", "enunciado": "La **zona pelúcida** comienza a desarrollarse en el folículo:", "opciones": {"a": "Primordial.", "b": "Primario.", "c": "De Graaf.", "d": "Cuerpo lúteo."}, "correcta": "b", "razones": {"a": "FALSA. En el folículo {{primordial}} aún no existe zona pelúcida (ovocito + 1 capa plana).", "b": "CORRECTA. La {{zona pelúcida}} (glicoproteínas ZP1-ZP2-ZP3 entre ovocito y granulosa) aparece por primera vez en el folículo **primario**.", "c": "FALSA. En el folículo de **Graaf** ya está bien formada, pero no es donde se inicia.", "d": "FALSA. El cuerpo lúteo es una estructura **postovulatoria**; no contiene zona pelúcida."}, "_k": "org2p-060:2766706593", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-061", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C falsa); cuerpo lúteo", "enunciado": "Sobre el **cuerpo lúteo / ovario**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células luteínicas de la granulosa producen principalmente progesterona.", "b": "Las células luteínicas de la teca producen principalmente estrógenos.", "c": "Las células epitelioides de la íntima producen mayoritariamente progesterona.", "d": "El folículo dominante produce inhibina."}, "correcta": "c", "razones": {"a": "Cierta: las células luteínicas de la {{granulosa}} producen principalmente **progesterona** (~80% de la pared del cuerpo lúteo).", "b": "Cierta: las células luteínicas de la {{teca}} producen principalmente **estrógenos** (+ androstenediona).", "c": "CORRECTA (es la FALSA; clave 2021-junio = C). Las células tecales/de la teca interna producen mayoritariamente {{estrógenos}}/andrógenos, NO progesterona. Invierte los productos.", "d": "Cierta: el folículo dominante (De Graaf) produce {{inhibina}}, que frena la FSH y favorece la atresia de los demás."}, "_k": "org2p-061:1456756959", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-062", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B); trom

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Organografía · Recuperación</title>
<style>
:root{--blue:#2c6fbf;--green:#27ae60;--red:#e74c3c}
*{box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;color:#1a2b3c;
     margin:0;line-height:1.45}
header{background:var(--blue);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;
       box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:18px}
.bar{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select{padding:6px 10px;border-radius:6px;border:none;font-size:15px}
.bar .reshuffle{padding:6px 12px;border-radius:6px;border:none;font-size:14px;font-weight:700;
     background:#fff;color:var(--blue);cursor:pointer}
.bar .reshuffle:hover{background:#e8f1fb}
.bar .count{margin-left:auto;font-size:14px;opacity:.9}
.bar .pos{font-size:14px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 11px;border-radius:14px;white-space:nowrap}
main{max-width:780px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:18px}
.meta{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.alta{color:var(--red)}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead .meta{flex:1}
.qnum{flex:none;background:var(--blue);color:#fff;font-weight:800;font-size:12.5px;padding:3px 10px;border-radius:20px;line-height:1.35;white-space:nowrap}
.star{cursor:pointer;background:none;border:none;font-size:24px;line-height:1;padding:0;color:#cfd8e3;flex:none;transition:.12s}
.star:hover{transform:scale(1.15)}
.star.on{color:#f1c40f}
.preg{font-weight:600;font-size:17px;margin-bottom:12px}
.imgwrap{position:relative;display:block;width:fit-content;max-width:100%;margin:2px auto 4px;cursor:zoom-in}
.imgwrap.zoom{cursor:zoom-out}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:8px;border:1px solid #cdd8e6;background:#fff}
.imgwrap.zoom .qimg{max-height:none}
.redact{position:absolute;background:#101a26;border-radius:2px;cursor:pointer;transition:background .12s}
.redact:hover{background:#26405e}
.redact.revealed{background:transparent;outline:1px dashed rgba(230,57,70,.55)}
.imghint{font-size:11px;color:#8a98a8;text-align:center;margin:0 0 12px}
.imgtag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;margin-left:6px;background:#8e44ad;color:#fff;text-transform:uppercase;letter-spacing:.3px}
/* palabra clave resaltada en enunciados/opciones */
.kw{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:#1a2b3c}
.opt{border:1px solid #d8e0ea;border-radius:9px;padding:10px 12px;margin:7px 0;cursor:pointer;
     background:#f7fafd;transition:.12s;font-size:15.5px}
.opt:hover{border-color:var(--blue)}
.opt b{margin-right:6px}
.opt.ok{background:#e8f7ec;border-left:4px solid var(--green)}
.opt.no{background:#fdecea;border-left:4px solid var(--red);opacity:.9}
.opt.mine{box-shadow:0 0 0 2px var(--blue) inset}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;margin-left:8px;
     vertical-align:middle;text-transform:uppercase;letter-spacing:.3px}
.tag.you{background:var(--blue);color:#fff}
.tag.cor{background:var(--green);color:#fff}
.hint{font-size:13px;color:#8a98a8;margin-top:6px;font-style:italic}
.resp{margin-top:14px;display:none}
.resp.show{display:block}
.razon{font-size:14.5px;color:#33485c;margin:5px 0 5px 4px}
.reveal-words{margin:2px 0 12px 0;background:#fff;color:var(--blue);border:1px solid var(--blue);
     padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.reveal-words:hover{background:#e8f1fb}
/* oclusión cloze: barra que tapa la palabra clave hasta hacer click */
.cloze{background:#33485c;color:transparent;border-radius:4px;padding:0 3px;cursor:pointer;
       user-select:none;transition:.12s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cloze::selection{color:transparent;background:#33485c}
.cloze:hover{background:#27425e}
.cloze.revealed{background:#fff3cd;color:#7a5b00;font-weight:700;cursor:default}
.cloze.revealed::selection{color:#7a5b00;background:#ffe08a}
</style></head><body>
<header><div class="bar">
  <h1>🔬 Banco Organografía · Recuperación</h1>
  <label>Examen:
    <select id="examen"><option value="">Todos</option></select>
  </label>
  <label>Tema:
    <select id="filtro"><option value="">Todos</option></select>
  </label>
  <label>Tipo:
    <select id="tipo">
      <option value="">Todas</option>
      <option value="img">🖼 Solo imágenes</option>
      <option value="txt">Solo texto</option>
    </select>
  </label>
  <label>Frecuencia:
    <select id="frec">
      <option value="">Todas</option>
      <option value="alta">⭐ Solo alta frecuencia</option>
    </select>
  </label>
  <label>Mis marcadas:
    <select id="marc">
      <option value="">Todas</option>
      <option value="si">🌟 Solo mis marcadas</option>
    </select>
  </label>
  <label>Orden:
    <select id="orden">
      <option value="orig">Original</option>
      <option value="rand">🔀 Aleatorio</option>
    </select>
  </label>
  <button id="reshuffle" class="reshuffle" style="display:none">🔀 Barajar</button>
  <span class="count" id="count"></span>
  <span class="pos" id="pos"></span>
</div></header>
<main id="app"></main>
<script>
const DATA = [{"id": "org1p-001", "tema": "Cor", "examen": "2019 + 2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23, 2025-26", "enunciado": "En relación con el **corazón**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Las válvulas auriculoventriculares son más finas que las arteriales.", "b": "Las válvulas cardíacas están revestidas por endocardio.", "c": "Las fibras elásticas del miocardio de las aurículas son poco abundantes en comparación con las de los ventrículos.", "d": "El miocardio es más grueso en los ventrículos que en las aurículas."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Las válvulas {{auriculoventriculares}} (tricúspide y mitral) son las más {{gruesas}}; las arteriales (semilunares aórtica/pulmonar) son más finas. Distractor clásico que invierte el grosor.", "b": "Cierta: las válvulas son prolongaciones del {{endocardio}} que recubren por ambas caras un eje central de tejido conjuntivo denso.", "c": "OJO: tal como está redactada también es FALSA. Las fibras {{elásticas}} son ABUNDANTES en el miocardio auricular y ESCASAS en el ventricular, justo al revés de lo que dice el enunciado. El enunciado oficial era 'escasas en los ventrículos' (verdadero); aquí está invertido. Ver nota.", "d": "Cierta: el {{miocardio ventricular}} (máximo en el VI) es mucho más grueso que el auricular por la mayor carga de presión."}, "_k": "org1p-001:2502450822", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-002", "tema": "Cor", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "En relación con el **sistema de conducción cardíaco**, una afirmación **NO** es cierta:", "opciones": {"a": "Las fibras de Purkinje se distribuyen en la capa subendocárdica de los ventrículos.", "b": "Las fibras nodales presentan escasas miofibrillas.", "c": "Las fibras de Purkinje son ricas en mitocondrias.", "d": "Las fibras de Purkinje están unidas entre sí por numerosos discos intercalares completos como el miocardio común."}, "correcta": "d", "razones": {"a": "Cierta: las fibras de {{Purkinje}} ocupan la capa {{subendocárdica}} de los ventrículos.", "b": "Cierta: las fibras {{nodales}} (nodos SA y AV) son pequeñas y tienen escasas {{miofibrillas}}.", "c": "Cierta: las fibras de Purkinje son RICAS en {{mitocondrias}} y en {{glucógeno}}, con mucho sarcoplasma y pocas miofibrillas periféricas (apuntes T01 + histología estándar). NO es la falsa.", "d": "CORRECTA (es la FALSA). Las Purkinje se unen por {{desmosomas}} y gap junctions con discos intercalares ESCASOS y MENOS desarrollados que el miocardio común; no presentan 'numerosos discos intercalares completos como el miocardio común'."}, "_k": "org1p-002:471551570", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-003", "tema": "Vasos", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relación con los **nervios vasomotores simpáticos** que inervan los vasos sanguíneos, **NO** es cierto que:", "opciones": {"a": "Son postganglionares.", "b": "Generalmente provocan vasodilatación.", "c": "Son más abundantes en las arterias que en las venas.", "d": "Su neurotransmisor es la noradrenalina."}, "correcta": "b", "razones": {"a": "Cierta: son fibras simpáticas {{postganglionares}} amielínicas que alcanzan la adventicia del vaso.", "b": "CORRECTA (es la FALSA). El tono simpático sobre el músculo liso vascular produce {{vasoconstricción}} (receptores alfa-adrenérgicos), no vasodilatación.", "c": "Cierta: la inervación vasomotora es más densa en {{arterias}} (control de resistencia) que en venas.", "d": "Cierta: el neurotransmisor es la {{noradrenalina}}."}, "_k": "org1p-003:2870361707", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-004", "tema": "Vasos", "examen": "2019 + 2021-sept + 2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23, 2025-26", "enunciado": "De los siguientes tipos arteriales, ¿en cuál **NO** se encuentra **lámina elástica interna**?", "opciones": {"a": "Arterias elásticas.", "b": "Arterias musculares.", "c": "Arteriolas.", "d": "Metarteriolas."}, "correcta": "d", "razones": {"a": "Las arterias {{elásticas}} tienen lámina elástica interna, aunque queda enmascarada entre las numerosas láminas elásticas fenestradas de la media.", "b": "La arteria {{muscular}} presenta una lámina elástica interna prominente, ondulada y bien definida.", "c": "Las {{arteriolas}} aún conservan lámina elástica interna, fina o discontinua.", "d": "CORRECTA. Las {{metarteriolas}} carecen de lámina elástica interna; solo tienen endotelio y músculo liso disperso (esfínteres precapilares)."}, "_k": "org1p-004:3296545405", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-005", "tema": "Vasos", "examen": "2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**NO** es una característica propia de los **capilares fenestrados**:", "opciones": {"a": "Presentar fenestraciones cerradas por diafragmas de grosor similar al de la membrana plasmática.", "b": "Presentar una lámina basal continua.", "c": "Presentar pericitos formando parte de su pared.", "d": "Tener células endoteliales unidas entre sí mediante uniones oclusivas (zonula occludens)."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Los {{diafragmas}} que cierran las fenestraciones son MUCHO MÁS FINOS que la membrana plasmática (estructura tenue, no trilaminar), no de grosor similar.", "b": "Cierta: a diferencia de los sinusoides, el capilar fenestrado conserva una lámina basal {{continua}}.", "c": "Cierta: los {{pericitos}} envuelven el endotelio compartiendo su lámina basal.", "d": "Las células endoteliales se unen por {{uniones oclusivas}} (zonulae occludentes). En histología estándar esto es cierto para todos los capilares (continuos y fenestrados); ver nota."}, "_k": "org1p-005:2137398582", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-006", "tema": "Vasos", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept", "enunciado": "En las **arterias elásticas**, ¿cuál es la capa de mayor grosor?", "opciones": {"a": "Túnica media.", "b": "Túnica íntima.", "c": "Túnica adventicia.", "d": "Las tres tienen igual grosor."}, "correcta": "a", "razones": {"a": "CORRECTA. La capa más gruesa es la túnica {{media}}, con 40-70 láminas elásticas fenestradas concéntricas que amortiguan la onda de pulso.", "b": "La {{íntima}} es relativamente gruesa para una arteria, pero menor que la media.", "c": "La {{adventicia}} es comparativamente delgada en las arterias elásticas.", "d": "Falso: predomina claramente la túnica {{media}}."}, "_k": "org1p-006:66905895", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-007", "tema": "Vasos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Respecto a la **arteria muscular**, señala la afirmación que **NO** es propia de ella:", "opciones": {"a": "La túnica adventicia es muy gruesa, mayor que la media.", "b": "Presenta lámina elástica interna bien definida.", "c": "La túnica media está dominada por músculo liso dispuesto circularmente.", "d": "Puede presentar lámina elástica externa entre media y adventicia."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). En la arteria muscular domina la túnica {{media}} (músculo liso); la {{adventicia}} es de grosor similar o menor a la media, nunca MAYOR que ella.", "b": "Cierta: la {{lámina elástica interna}} es prominente y ondulada (refringente en H-E).", "c": "Cierta: la media tiene muchas capas de {{músculo liso}} circular que regulan el calibre.", "d": "Cierta: las musculares grandes presentan {{lámina elástica externa}} entre media y adventicia."}, "_k": "org1p-007:3368235452", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-008", "tema": "Respiratorio", "examen": "2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "En relación con las **células olfatorias**, una afirmación **NO** es cierta:", "opciones": {"a": "Son neuronas bipolares.", "b": "Sus prolongaciones apicales constituyen los filamentos olfatorios.", "c": "Tienen cilios inmóviles inmersos en una película líquida.", "d": "Tienen núcleos redondeados que se disponen centralmente en la célula."}, "correcta": "b", "razones": {"a": "Cierta: la célula olfatoria es una {{neurona bipolar}}, único caso de neurona en contacto directo con el medio externo.", "b": "CORRECTA (es la FALSA). Los {{filamentos olfatorios}} son los {{axones}} (prolongación BASAL) que atraviesan la lámina cribosa; la prolongación apical forma la vesícula olfatoria con los cilios.", "c": "Cierta: presentan cilios {{inmóviles}} (receptores) inmersos en la película de moco donde se disuelven los odorantes.", "d": "Cierta: el núcleo redondeado se sitúa en posición {{central}} dentro del soma."}, "_k": "org1p-008:1351789484", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-009", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "¿Qué región(es) de la **faringe** está(n) revestida(s) por **epitelio respiratorio** (pseudoestratificado ciliado)?", "opciones": {"a": "Pared posterior de la nasofaringe.", "b": "Paredes laterales de la nasofaringe.", "c": "Orofaringe.", "d": "Laringofaringe."}, "correcta": "b", "razones": {"a": "La pared posterior de la nasofaringe, por roce con el paladar blando, suele revestirse de epitelio {{plano estratificado}} (no respiratorio).", "b": "CORRECTA. Las {{paredes laterales de la nasofaringe}} conservan el epitelio {{respiratorio}} (cilíndrico pseudoestratificado ciliado), al no sufrir roce mecánico.", "c": "La orofaringe es de epitelio {{plano estratificado}} no queratinizado (paso de alimento).", "d": "La laringofaringe también es de epitelio {{plano estratificado}} no queratinizado."}, "_k": "org1p-009:1186018919", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-010", "tema": "Respiratorio", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "¿En qué región(es) de la **laringe** encontramos **epitelio plano estratificado no queratinizado**?", "opciones": {"a": "Cuerdas vocales.", "b": "Una porción de la cara dorsal de la epiglotis.", "c": "Cara anterior (lingual) de la epiglotis.", "d": "En todas las anteriores."}, "correcta": "d", "razones": {"a": "Las {{cuerdas vocales}} verdaderas llevan epitelio plano estratificado no queratinizado (sometidas a roce/vibración).", "b": "Parte de la cara {{dorsal}} (posterior) de la epiglotis también lleva epitelio plano estratificado.", "c": "La cara anterior (lingual) de la {{epiglotis}} es plano estratificado no queratinizado.", "d": "CORRECTA. En {{todas}} las regiones citadas hay epitelio plano estratificado no queratinizado (zonas de roce)."}, "_k": "org1p-010:218090441", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-011", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "De las siguientes afirmaciones sobre **bronquios y bronquiolos**, una **NO** es correcta:", "opciones": {"a": "La submucosa de los bronquios intrapulmonares contiene glándulas mucosas y mucoserosas.", "b": "Las células Club/clara contienen abundantes cuerpos multilaminares de aspecto electrodenso.", "c": "En los bronquios de pequeño calibre el epitelio es simple cúbico bajo con células ciliadas.", "d": "En el epitelio de los bronquiolos terminales no encontramos células caliciformes."}, "correcta": "b", "razones": {"a": "Cierta: los bronquios intrapulmonares tienen glándulas {{seromucosas}} en la submucosa.", "b": "CORRECTA (es la FALSA). Los {{cuerpos multilaminares}} (lamelares) electrodensos del surfactante son propios de los {{neumocitos tipo II}}; las células Club tienen gránulos secretores electrodensos apicales y SER abundante, pero NO los cuerpos lamelares laminados.", "c": "Cierta: al disminuir el calibre el epitelio pasa a {{cúbico}} simple ciliado.", "d": "Cierta: en el bronquiolo terminal ya NO hay células {{caliciformes}} (desaparecen al avanzar)."}, "_k": "org1p-011:2667121233", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-012", "tema": "Respiratorio", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "En relación con los **neumocitos tipo II**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Presentan cuerpos multilaminares con surfactante.", "b": "Tienen el aparato de Golgi poco desarrollado.", "c": "Pueden regenerar/restaurar a los neumocitos tipo I.", "d": "Son más numerosos pero cubren menos superficie alveolar que los tipo I."}, "correcta": "b", "razones": {"a": "Cierta: los {{cuerpos multilaminares}} (lamelares) almacenan el {{surfactante}} que reduce la tensión superficial.", "b": "CORRECTA (es la FALSA). El aparato de {{Golgi}} está MUY desarrollado, pues son células muy secretoras de surfactante.", "c": "Cierta: son las células {{progenitoras}} del epitelio alveolar y regeneran los neumocitos tipo I.", "d": "Cierta: son más {{numerosos}} pero, al ser redondeados, recubren mucha menos superficie alveolar que los planos tipo I."}, "_k": "org1p-012:929419668", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-013", "tema": "Digestivo", "examen": "2021-junio + 2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23, 2025-26", "enunciado": "En relación con los **botones gustativos**, una afirmación es **cierta**:", "opciones": {"a": "Se localizan exclusivamente en la mucosa de la lengua.", "b": "Son estructuralmente distintos según la región de la lengua y el sabor que perciben.", "c": "Su tipo celular más abundante es la célula de sostén.", "d": "Cada célula neuroepitelial de una región solo presenta un único tipo de receptor para un sabor específico."}, "correcta": "c", "razones": {"a": "Falsa: hay botones gustativos también en **paladar blando**, arcos glosopalatinos, **{{epiglotis}}** y faringe, no solo en la lengua.", "b": "Falsa: los botones son **{{estructuralmente idénticos}}** en toda la lengua; la diferente percepción de sabores no implica distinta morfología.", "c": "CORRECTA. El tipo celular más abundante del botón gustativo es la **célula de {{sostén}}** (sustentacular, tipo I); las neuroepiteliales (tipo III) son solo {{10-14}} por botón.", "d": "Falsa: una misma célula neuroepitelial responde a **{{varios estímulos}}**; no hay correspondencia uno-a-uno célula-sabor."}, "_k": "org1p-013:2168090432", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-014", "tema": "Digestivo", "examen": "2020-21 1P + 2021-junio + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2020-21, 2021-junio, 2025-26", "enunciado": "Respecto a la **glándula sublingual**, un enunciado **NO** es correcto:", "opciones": {"a": "Es una glándula de secreción principalmente serosa en el ser humano.", "b": "Sus secreciones se vierten al suelo de la boca o a los conductos de la glándula submaxilar.", "c": "No presenta conductos intercalares.", "d": "No tiene una cápsula de tejido conjuntivo bien definida."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). En el humano la sublingual es mixta de **predominio {{mucoso}}**, no serosa. La {{parótida}} es serosa pura y la submaxilar es mixta de predominio seroso.", "b": "Cierta: drena por conductos pequeños (Rivinus/Bartholin) al **{{suelo de la boca}}** o a los conductos de la submaxilar (Wharton).", "c": "Cierta: prácticamente **carece de conductos {{intercalares}}** y estriados desarrollados.", "d": "Cierta: **no tiene {{cápsula}}** conjuntiva bien definida, a diferencia de la parótida."}, "_k": "org1p-014:1781599777", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-015", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2025-26", "enunciado": "De las partes del **diente**, ¿cuál tiene un origen **ectodérmico**?", "opciones": {"a": "Esmalte.", "b": "Dentina.", "c": "Cemento.", "d": "Membrana periodontal."}, "correcta": "a", "razones": {"a": "CORRECTA. El **{{esmalte}}** lo producen los ameloblastos derivados del **{{ectodermo}}** (órgano del esmalte); es el único tejido dental de origen ectodérmico.", "b": "Falsa para la pregunta: la **{{dentina}}** la forman los odontoblastos, de origen **mesodérmico** (ectomesénquima de cresta neural).", "c": "Falsa: el **{{cemento}}** es de origen {{mesodérmico}} (cementoblastos).", "d": "Falsa: la **membrana {{periodontal}}** es conjuntiva, de origen mesodérmico."}, "_k": "org1p-015:1848778077", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-016", "tema": "Digestivo", "examen": "2021-junio", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, Unybook", "enunciado": "Las **fibras de Tomes** del diente corresponden a:", "opciones": {"a": "Prolongaciones citoplasmáticas de los odontoblastos.", "b": "Fibras de colágeno de la membrana periodontal.", "c": "Prolongaciones de los ameloblastos.", "d": "Cristales de hidroxiapatita del esmalte."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras de **{{Tomes}}** son las prolongaciones apicales de los **{{odontoblastos}}** alojadas en los canalículos de la dentina.", "b": "Falsa: las fibras de colágeno del periodonto ancladas al cemento son las de **{{Sharpey}}**, no las de Tomes.", "c": "Falsa: los **{{ameloblastos}}** forman el esmalte (proceso de Tomes del esmalte), pero las fibras de Tomes pertenecen al {{odontoblasto}}.", "d": "Falsa: los cristales de hidroxiapatita son producto mineral del esmalte, **no una fibra {{celular}}**."}, "_k": "org1p-016:2995962908", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-017", "tema": "Digestivo", "examen": "2021-22 2P + Unybook", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22", "enunciado": "Las **fibras de Sharpey** del periodonto corresponden a:", "opciones": {"a": "Prolongaciones de los ameloblastos en el esmalte.", "b": "Prolongaciones de los odontoblastos en la dentina.", "c": "Cristales de hidroxiapatita del cemento.", "d": "Fibras de colágeno de la membrana periodontal ancladas al cemento y al hueso alveolar."}, "correcta": "d", "razones": {"a": "Falsa: las prolongaciones de los ameloblastos forman el proceso de **{{Tomes}}** del esmalte, no Sharpey.", "b": "Falsa: las prolongaciones de los odontoblastos en la dentina son las fibras de **{{Tomes}}**.", "c": "Falsa: los cristales de hidroxiapatita **no son {{fibras}}**.", "d": "CORRECTA. Las fibras de **{{Sharpey}}** son haces de **{{colágeno}}** de la membrana periodontal que se insertan en cemento y hueso alveolar, fijando el diente."}, "_k": "org1p-017:2389842075", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-018", "tema": "Digestivo", "examen": "2021-22 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; glándulas de Von Ebner serosas", "enunciado": "En el ser humano, de las **glándulas salivales menores**, ¿cuáles son de naturaleza **exclusivamente serosa**?", "opciones": {"a": "Glándulas labiales.", "b": "Glándulas de las mejillas.", "c": "Glándulas de Von Ebner.", "d": "Glándulas palatinas."}, "correcta": "c", "razones": {"a": "Falsa: las glándulas **labiales** son **{{mixtas/mucosas}}**, no exclusivamente serosas.", "b": "Falsa: las glándulas de las **mejillas** (geniales) son **{{mixtas}}**.", "c": "CORRECTA. Las glándulas de **{{Von Ebner}}** (asociadas a las papilas caliciformes/circunvaladas) son las únicas salivales menores **exclusivamente {{serosas}}**; limpian el surco para la gustación.", "d": "Falsa: las glándulas **palatinas** son **{{mucosas}}**."}, "_k": "org1p-018:2678300213", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-019", "tema": "Digestivo", "examen": "2022-23 2P + Unybook", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "¿Qué **glándula salival mayor** tiene los **conductos estriados más desarrollados** y produce mayor volumen de saliva?", "opciones": {"a": "Parótida.", "b": "Submaxilar (submandibular).", "c": "Sublingual.", "d": "Glándulas de Von Ebner."}, "correcta": "b", "razones": {"a": "Falsa: la **{{parótida}}** es serosa pura, pero no tiene los conductos estriados más largos ni el mayor volumen.", "b": "CORRECTA. La **{{submaxilar}}** (submandibular) tiene los conductos **{{estriados}}** más desarrollados y aporta la mayor parte (~{{60%}}) del volumen salival.", "c": "Falsa: la **{{sublingual}}** casi carece de conductos estriados (predomina mucosa).", "d": "Falsa: las de **{{Von Ebner}}** son glándulas serosas menores de las papilas caliciformes, no salivales mayores."}, "_k": "org1p-019:3021590747", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-020", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relación con la **faringe**, ¿qué afirmación **NO** es correcta?", "opciones": {"a": "Su epitelio de revestimiento es del tipo plano estratificado no queratinizado en toda su extensión.", "b": "Las fibras elásticas son escasas en su pared.", "c": "La capa muscular está constituida por fibras musculares estriadas esqueléticas.", "d": "La submucosa no se encuentra en todas las regiones de su pared."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). La **{{nasofaringe}}** está revestida por epitelio **{{respiratorio}}** (pseudoestratificado ciliado); no toda la faringe es plano estratificado no queratinizado.", "b": "Cierta: las fibras **{{elásticas}}** son escasas en la pared faríngea (matiz del profesor).", "c": "Cierta: la capa muscular son los constrictores, fibras **{{estriadas esqueléticas}}**.", "d": "Cierta: la **{{submucosa}}** solo aparece en algunos puntos (paredes laterales de nasofaringe y unión con esófago), no en toda la pared."}, "_k": "org1p-020:2463969302", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-021", "tema": "Digestivo", "examen": "2014-15 + 2021-junio + 2021-22 + 2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2021-junio, 2021-22, 2022-23, 2025-26", "enunciado": "En relación con el **esófago humano**, **NO** es cierto que:", "opciones": {"a": "La capa muscular del tercio medio está constituida exclusivamente por fibras musculares lisas.", "b": "El esfínter esofágico superior está constituido por el músculo cricofaríngeo.", "c": "Las glándulas esofágicas propias están formadas por células mucosas y serosas.", "d": "El epitelio de revestimiento es plano estratificado no queratinizado."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). El **tercio {{medio}}** del esófago es **mixto** (estriado + liso); solo el tercio **{{inferior}}** es exclusivamente liso y el superior es estriado esquelético.", "b": "Cierta: el esfínter esofágico superior corresponde al músculo **{{cricofaríngeo}}** (estriado).", "c": "Cierta: las glándulas esofágicas propias (en submucosa) son **{{mucoserosas}}** (mucosas y serosas).", "d": "Cierta: el epitelio esofágico es plano estratificado **{{no queratinizado}}**."}, "_k": "org1p-021:3812092759", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-022", "tema": "Digestivo", "examen": "2022-23 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; concepto estómago repetido", "enunciado": "De las siguientes afirmaciones referentes al **estómago**, una **NO** es cierta:", "opciones": {"a": "Las células mucosas superficiales sintetizan mucina que se almacena en gránulos de secreción ovales en la base de las glándulas gástricas.", "b": "Las células principales o pépticas se localizan mayoritariamente en la base de las glándulas gástricas.", "c": "Las células oxínticas o parietales se distinguen por ser células grandes y tener un citoplasma muy acidófilo.", "d": "Las células G productoras de gastrina se encuentran principalmente en glándulas de la región fúndica."}, "correcta": "d", "razones": {"a": "Cierta: las mucosas superficiales sintetizan mucina que se acumula en gránulos en el **{{ápice}}** de la célula.", "b": "Cierta: las células **{{principales/pépticas}}** (pepsinógeno) predominan en la **{{base}}** de las glándulas.", "c": "Cierta: las **{{oxínticas/parietales}}** son células grandes y muy **{{acidófilas/eosinófilas}}** (muchas mitocondrias).", "d": "CORRECTA (es la FALSA, clave oficial 2022-23). Las **células {{G}}** (gastrina) están principalmente en la región **{{pilórica/antral}}**, NO en el fundus."}, "_k": "org1p-022:706108960", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-023", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "De las siguientes células, ¿cuál es la **menos abundante** en las **glándulas pilóricas** del estómago?", "opciones": {"a": "Células mucosas.", "b": "Células endocrinas.", "c": "Células oxínticas o parietales.", "d": "Células madre."}, "correcta": "c", "razones": {"a": "Las células **{{mucosas}}** son las predominantes en las glándulas pilóricas (cripta/glándula ~1/1).", "b": "Las **{{endocrinas}}** (sobre todo células G de gastrina) son frecuentes en el píloro/antro.", "c": "CORRECTA. Las células **{{oxínticas/parietales}}** son la población **menos abundante** (escasísimas o ausentes) en el píloro; abundan en fundus y cuerpo.", "d": "Las células **{{madre}}** están siempre presentes en el istmo/cuello para la renovación."}, "_k": "org1p-023:3783228085", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-024", "tema": "Digestivo", "examen": "2020-21 1P + 2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2020-21, 2021-22, 2025-26", "enunciado": "En relación con las **células oxínticas (parietales) en actividad**, **NO** es cierto que:", "opciones": {"a": "Tienen invaginaciones profundas de la membrana que forman canalículos intracelulares muy desarrollados.", "b": "Su sistema tubulovesicular está poco desarrollado durante la fase de secreción activa.", "c": "Tienen abundantes mitocondrias.", "d": "Tienen numerosas microvellosidades proyectadas a la luz de los canalículos."}, "correcta": "b", "razones": {"a": "Cierta: en actividad desarrollan profundos **{{canalículos intracelulares}}** tapizados de microvellosidades.", "b": "CORRECTA (es la FALSA según el criterio del profesor). El sistema **{{tubulovesicular}}** se considera muy desarrollado como rasgo de la célula parietal; afirmar que está 'poco desarrollado' es el enunciado falso de la clave. (Matiz Ross/Junqueira: al activarse, el tubulovesicular SÍ disminuye al fusionarse con el canalículo formando microvellosidades.)", "c": "Cierta: son muy eosinófilas por sus abundantes **{{mitocondrias}}** (producen H+ con la bomba H+/K+ ATPasa).", "d": "Cierta: la luz del canalículo está cubierta por numerosas **{{microvellosidades}}**."}, "_k": "org1p-024:1623514422", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-025", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**NO** es una característica propia de las **células mucosas de superficie** del estómago:", "opciones": {"a": "Presentar microvellosidades cortas y granulares.", "b": "Tener un aparato de Golgi poco desarrollado.", "c": "Presentar complejos de unión en las caras laterales.", "d": "Tener abundantes gránulos esféricos electrodensos en la porción apical del citoplasma."}, "correcta": "b", "razones": {"a": "Cierta: tienen **{{microvellosidades}}** cortas y granulares en el polo apical.", "b": "CORRECTA (es la FALSA). El aparato de Golgi está **{{bien desarrollado}}** (supranuclear), porque son células muy activas en la producción de moco neutro protector.", "c": "Cierta: presentan **complejos de {{unión}}** en las caras laterales que sellan el epitelio frente al ácido.", "d": "Cierta: acumulan **gránulos de {{mucinógeno}}** esféricos electrodensos en la porción apical."}, "_k": "org1p-025:2899896461", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-026", "tema": "Digestivo", "examen": "2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2025-26", "enunciado": "En la región del **cuello del estómago**, ¿cuál es el lugar de **predominio de las células madre**?", "opciones": {"a": "Criptas gástricas.", "b": "Istmo de las glándulas.", "c": "Cuello de las glándulas.", "d": "Base de las glándulas."}, "correcta": "b", "razones": {"a": "Falsa: las **{{criptas/fovéolas}}** gástricas alojan las células mucosas de superficie ya diferenciadas (desembocadura).", "b": "CORRECTA. Las células **{{madre}}** predominan en el **{{istmo}}** de la glándula, desde donde migran hacia arriba (foveola) y hacia abajo (cuerpo).", "c": "Falsa: el **{{cuello}}** aloja sobre todo células mucosas del cuello (y parietales).", "d": "Falsa: la **{{base}}** aloja las células principales/zimógenas."}, "_k": "org1p-026:2921200286", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-027", "tema": "Digestivo", "examen": "2021-22 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; predominio celular gástrico", "enunciado": "En la región del **cuerpo del estómago**, ¿cuál es el lugar de **predominio de las células principales (zimógenas)**?", "opciones": {"a": "Criptas gástricas.", "b": "Istmo de las glándulas.", "c": "Cuello de las glándulas.", "d": "Base de las glándulas."}, "correcta": "d", "razones": {"a": "Falsa: las **{{fovéolas/criptas}}** son la desembocadura, con células mucosas superficiales.", "b": "Falsa: el **{{istmo}}** aloja células madre (y parietales).", "c": "Falsa: el **{{cuello}}** tiene células mucosas del cuello y parietales.", "d": "CORRECTA (clave oficial 2021-22). Las células **principales/{{zimógenas}}** (pepsinógeno) predominan en la **{{base}}** de las glándulas gástricas."}, "_k": "org1p-027:3029637203", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-028", "tema": "Digestivo", "examen": "2014-15 + 2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2021-22, 2025-26", "enunciado": "**NO** es una característica de las **células de Paneth**:", "opciones": {"a": "Tener forma piramidal.", "b": "Teñirse muy bien con colorantes básicos.", "c": "Presentar un complejo de Golgi bien desarrollado.", "d": "Ser una población muy estable con escasa renovación."}, "correcta": "b", "razones": {"a": "Cierta: la célula de Paneth tiene forma **{{piramidal}}**, en el fondo de las criptas de Lieberkühn.", "b": "CORRECTA (es la FALSA). El rasgo distintivo de Paneth son sus **gránulos apicales {{eosinófilos/acidófilos}}** (lisozima, defensinas), que se tiñen con colorantes ÁCIDOS, no básicos; por eso 'teñirse muy bien con colorantes básicos' es la afirmación falsa.", "c": "Cierta: tienen un complejo de **{{Golgi}}** bien desarrollado y RER abundante (célula secretora de proteínas).", "d": "Cierta (criterio del profesor): se consideran una población **{{estable}}** con escasa renovación celular."}, "_k": "org1p-028:808843392", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-029", "tema": "Digestivo", "examen": "2014-15 + 2020-21 + 2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida TODOS los años (intestino delgado)", "enunciado": "De las siguientes afirmaciones referentes al **intestino delgado**, **NO** es cierta:", "opciones": {"a": "Las válvulas de Kerckring están especialmente desarrolladas en el yeyuno.", "b": "Las vellosidades intestinales muestran su máximo desarrollo en la porción final del íleon.", "c": "Las células de Paneth se consideran una población celular muy estable con un grado muy pequeño de renovación celular.", "d": "Los nódulos linfoides presentes en la lámina propia del intestino delgado son más numerosos y grandes a nivel del íleon."}, "correcta": "b", "razones": {"a": "Cierta: las válvulas de **{{Kerckring}}** (conniventes) alcanzan su máximo desarrollo en el **{{yeyuno}}** proximal.", "b": "CORRECTA (es la FALSA). Las **{{vellosidades}}** son máximas en **duodeno/yeyuno** (~1,5 mm); en el íleon final son más **{{cortas}}** y escasas, no máximas.", "c": "Cierta (criterio del profesor): las células de **{{Paneth}}** son una población estable con escasa renovación.", "d": "Cierta: los **nódulos {{linfoides}}** (placas de Peyer) son más grandes y numerosos en el **{{íleon}}**."}, "_k": "org1p-029:564562096", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-030", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "¿Qué porción del **intestino delgado** está envuelta **completamente por peritoneo** (intraperitoneal)?", "opciones": {"a": "1ª porción del duodeno.", "b": "4ª porción del duodeno.", "c": "Yeyuno.", "d": "La 1ª porción del duodeno y el yeyuno."}, "correcta": "d", "razones": {"a": "Verdadera en parte: la **{{1ª porción}}** del duodeno (bulbo) sí es intraperitoneal, pero no es la única respuesta.", "b": "Falsa: la **{{4ª porción}}** del duodeno es **retroperitoneal** (fija a la pared posterior).", "c": "Verdadera en parte: el **{{yeyuno}}** es intraperitoneal (suspendido por mesenterio), pero la respuesta completa agrupa ambas.", "d": "CORRECTA. Son intraperitoneales la **{{1ª porción}}** del duodeno y el **{{yeyuno}}** (e íleon); las porciones 2ª-4ª del duodeno son retroperitoneales."}, "_k": "org1p-030:302066994", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-031", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "¿Qué tipos de **células endocrinas** están presentes en el **intestino delgado**?", "opciones": {"a": "Células secretoras de colecistoquinina.", "b": "Células secretoras de secretina.", "c": "Células secretoras de motilina.", "d": "Todas las anteriores."}, "correcta": "d", "razones": {"a": "Cierta: las células **{{I}}** secretan **{{colecistoquinina (CCK)}}** (contracción vesicular y enzimas pancreáticas).", "b": "Cierta: las células **{{S}}** secretan **{{secretina}}** (estimula el bicarbonato pancreático).", "c": "Cierta: las células **{{M}}** (enteroendocrinas) secretan **{{motilina}}** (regula la motilidad).", "d": "CORRECTA. El intestino delgado posee un amplio sistema **{{enteroendocrino}}** difuso con todas estas células (y más: GIP, neurotensina, VIP...)."}, "_k": "org1p-031:3369834046", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-032", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**NO** es una característica propia del **apéndice** vermiforme:", "opciones": {"a": "Glándulas escasas e irregulares.", "b": "Células caliciformes poco numerosas.", "c": "Ausencia total de células de Paneth.", "d": "Gran cantidad de nódulos linfoides en la lámina propia."}, "correcta": "c", "razones": {"a": "Cierta: las criptas son **{{escasas e irregulares}}**, poco profundas, desplazadas por el tejido linfoide.", "b": "Cierta: hay **{{pocas caliciformes}}** en comparación con el colon.", "c": "CORRECTA (es la FALSA). El apéndice **SÍ contiene células de {{Paneth}}** en el fondo de sus criptas (a diferencia del resto del intestino grueso); no están ausentes.", "d": "Cierta: su rasgo más llamativo es la **gran cantidad de **{{nódulos linfoides}}** (\"amígdala abdominal\")."}, "_k": "org1p-032:3566976249", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-033", "tema": "Digestivo", "examen": "2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "Respecto al **hígado**, es **cierto** que:", "opciones": {"a": "Los sinusoides hepáticos no se encuentran apoyados directamente sobre el cordón hepático.", "b": "Más del 50% de los hepatocitos presentan diploidía.", "c": "La disposición radial de los cordones hepáticos alrededor de una vena central es la base del lóbulo portal.", "d": "Los conductos de Hering están constituidos por la unión de dos hepatocitos adyacentes."}, "correcta": "a", "razones": {"a": "CORRECTA (la cierta). Entre el endotelio sinusoidal y el hepatocito existe el **espacio de {{Disse}}**; el sinusoide NO se apoya directamente sobre el cordón de hepatocitos.", "b": "Falsa: más del 50% de los hepatocitos son **{{poliploides/binucleados}}**, no diploides; la poliploidía es característica del hígado.", "c": "Falsa: la disposición radial de cordones alrededor de una vena central define el **{{lobulillo clásico}}**, no el lóbulo portal (cuyo eje es el conducto biliar del espacio porta).", "d": "Falsa: los conductos de **{{Hering}}** (colangiolos) están formados por hepatocitos y **{{colangiocitos}}** (células ductales cúbicas), no por la unión de dos hepatocitos."}, "_k": "org1p-033:2576699776", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-034", "tema": "Digestivo", "examen": "2021-22 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; células de Ito", "enunciado": "De las células de los **sinusoides hepáticos**, ¿cuál almacena lípidos en cantidad notable en condiciones normales?", "opciones": {"a": "Células de Kupffer.", "b": "Células endoteliales.", "c": "Células de Ito o estrelladas.", "d": "Hepatocitos."}, "correcta": "c", "razones": {"a": "Falsa: las células de **{{Kupffer}}** son macrófagos del sinusoide (fagocitosis), no almacén de lípidos.", "b": "Falsa: las células **{{endoteliales}}** solo tapizan el sinusoide (endotelio discontinuo fenestrado).", "c": "CORRECTA (clave oficial 2021-22). Las células de **{{Ito}}** (estrelladas/lipocitos), en el espacio de Disse, almacenan **{{lípidos y vitamina A}}**; en la fibrosis se transforman en miofibroblastos.", "d": "Falsa: los **{{hepatocitos}}** almacenan glucógeno y algo de lípido, pero el almacén característico de vitamina A es la célula de Ito."}, "_k": "org1p-034:1582995857", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-035", "tema": "Digestivo", "examen": "2021-22", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-22", "enunciado": "La célula de **Ito (estrellada)** del hígado se caracteriza por:", "opciones": {"a": "Fagocitar bacterias y eritrocitos viejos en el sinusoide.", "b": "Producir la bilis.", "c": "Almacenar lípidos y vitamina A en el espacio de Disse.", "d": "Sintetizar la albúmina plasmática."}, "correcta": "c", "razones": {"a": "Falsa: fagocitar bacterias y eritrocitos viejos es función de las células de **{{Kupffer}}** (macrófagos del sinusoide).", "b": "Falsa: la **{{bilis}}** la producen los hepatocitos.", "c": "CORRECTA. La célula de **{{Ito}}** almacena **{{lípidos}}** y **vitamina A** en el espacio de Disse; en la fibrosis se transforma en miofibroblasto.", "d": "Falsa: la **{{albúmina}}** plasmática la sintetiza el hepatocito."}, "_k": "org1p-035:1665536573", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-036", "tema": "Digestivo", "examen": "2022-23 2P + Unybook", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "Respecto a las **glándulas de Brunner**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Son glándulas tubulares situadas en la submucosa del duodeno.", "b": "Son glándulas exclusivamente serosas.", "c": "Secretan un moco alcalino que neutraliza el quimo ácido.", "d": "Secretan péptidos que inhiben la secreción ácida gástrica."}, "correcta": "b", "razones": {"a": "Cierta: son glándulas **{{tubulares}}** situadas en la **{{submucosa}}** del duodeno (signo característico del duodeno).", "b": "CORRECTA (es la FALSA). Las glándulas de **{{Brunner}}** son **{{mucosas}}** (mucosecretoras), no exclusivamente serosas; su secreción es alcalina protectora.", "c": "Cierta: secretan un moco **{{alcalino}}** (rico en bicarbonato) que neutraliza el quimo ácido y protege la mucosa duodenal.", "d": "Cierta: secretan péptidos (urogastrona/enterogastrona) que **{{inhiben}}** la secreción ácida gástrica."}, "_k": "org1p-036:1952435208", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-037", "tema": "Digestivo", "examen": "2022-23 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; células M", "enunciado": "Las **células M** del intestino se localizan mayoritariamente en:", "opciones": {"a": "El duodeno, sobre las glándulas de Brunner.", "b": "El yeyuno, en el ápice de las vellosidades.", "c": "El íleon, sobre las placas de Peyer.", "d": "El colon, en las criptas de Lieberkühn."}, "correcta": "c", "razones": {"a": "Falsa: las células M se asocian a tejido linfoide organizado, **no a las glándulas de {{Brunner}}**.", "b": "Falsa: el **{{yeyuno}}** tiene escaso tejido linfoide agregado.", "c": "CORRECTA (clave oficial 2022-23). Las células **{{M}}** (micropliegues) recubren las **placas de {{Peyer}}** del íleon y transcitan antígenos al tejido linfoide subyacente.", "d": "Falsa: aunque hay folículos en el colon, el predominio de células M es **{{ileal}}**."}, "_k": "org1p-037:3763913122", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-038", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (citoesqueleto eritrocito)", "enunciado": "De las proteínas del citoesqueleto del **eritrocito**, ¿cuál constituye la malla **hexagonal** característica de su membrana?", "opciones": {"a": "Espectrina.", "b": "Anquirina.", "c": "Proteína banda 3.", "d": "Ninguna de las anteriores."}, "correcta": "a", "razones": {"a": "CORRECTA. La {{espectrina}} (tetrámeros α-β) forma la malla **hexagonal** submembranosa que da al hematíe su forma de disco bicóncavo y su deformabilidad para atravesar capilares sin romperse.", "b": "La {{anquirina}} es la proteína de unión que ancla la espectrina a la **banda 3**, pero no constituye la malla.", "c": "La banda {{3}} es una proteína **transmembrana** (intercambiador aniónico Cl⁻/HCO₃⁻) y punto de fijación del citoesqueleto, no la malla.", "d": "Incorrecta: sí existe la proteína que forma la malla (la **espectrina**)."}, "_k": "org1p-038:2234887080", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-039", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "Respecto a los **gránulos específicos del eosinófilo**, ¿qué elemento contiene su región interna (cristaloide)?", "opciones": {"a": "Enzimas hidrolíticos.", "b": "Proteína básica mayor (MBP).", "c": "Histamina.", "d": "Peroxidasa."}, "correcta": "b", "razones": {"a": "Los {{enzimas hidrolíticos}} están en los gránulos azurófilos (lisosomas) o en la matriz, no en el núcleo cristaloide interno.", "b": "CORRECTA. La región interna (**cristaloide**) del gránulo específico del eosinófilo contiene la {{MBP}} (proteína básica mayor), junto con ECP; perfora la cubierta de los parásitos.", "c": "La {{histamina}} es propia del basófilo/mastocito (y, en el eosinófilo, de la región externa, no del cristaloide).", "d": "La {{peroxidasa}} se localiza en la **matriz/región externa** del gránulo, rodeando al cristaloide, no en su interior."}, "_k": "org1p-039:519233479", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-040", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "En la **granulopoyesis**, ¿a qué tipo celular da lugar directamente el **mieloblasto**?", "opciones": {"a": "Metamielocito eosinófilo.", "b": "Metamielocito.", "c": "Promielocito.", "d": "Célula en banda (cayado)."}, "correcta": "c", "razones": {"a": "El metamielocito {{eosinófilo}} es un estadio muy posterior (aparece tras el mielocito), no deriva directamente del mieloblasto.", "b": "El {{metamielocito}} surge después del mielocito; no es el inmediato al mieloblasto.", "c": "CORRECTA. La secuencia es {{mieloblasto}} → **promielocito** → mielocito → metamielocito → banda → segmentado.", "d": "La célula en {{banda}} (cayado) es uno de los últimos estadios, no el inmediato al mieloblasto."}, "_k": "org1p-040:3723259371", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-041", "tema": "Sangre/Hematopoyesis", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "En la **eritropoyesis**, ¿a qué célula da lugar el **proeritroblasto**?", "opciones": {"a": "Reticulocito.", "b": "Eritroblasto ortocromático.", "c": "Eritroblasto basófilo.", "d": "Eritroblasto policromatófilo."}, "correcta": "c", "razones": {"a": "El {{reticulocito}} es de los últimos estadios (tras expulsar el núcleo el ortocromático).", "b": "El eritroblasto {{ortocromático}} es posterior al policromatófilo, no el inmediato al proeritroblasto.", "c": "CORRECTA. Secuencia: {{proeritroblasto}} → eritroblasto **basófilo** → policromatófilo → ortocromático → reticulocito → hematíe.", "d": "El eritroblasto {{policromatófilo}} aparece tras el basófilo, no directamente del proeritroblasto."}, "_k": "org1p-041:3357072042", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-042", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept", "enunciado": "En relación con los **linfocitos** de sangre periférica, señala la afirmación que **NO** es correcta:", "opciones": {"a": "No contienen en absoluto gránulos azurófilos.", "b": "Poseen un único núcleo redondeado que ocupa casi toda la célula.", "c": "Representan el 20-40% de los leucocitos circulantes.", "d": "Su recuento es de aproximadamente 1500-2500/mm³."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Los linfocitos SÍ contienen **algunos gránulos azurófilos** inespecíficos (sobre todo los grandes/NK); afirmar la ausencia {{absoluta}} es falso.", "b": "Cierta: poseen un único {{núcleo}} redondeado que ocupa casi toda la célula con escaso citoplasma.", "c": "Cierta: representan el {{20-40%}} de los leucocitos circulantes.", "d": "Cierta: su recuento es de aproximadamente {{1500-2500/mm³}}."}, "_k": "org1p-042:3816393065", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-043", "tema": "Sangre/Hematopoyesis", "examen": "2019", "anio": 2019, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2019", "enunciado": "Los **factores de la coagulación** transportados por las plaquetas se almacenan en:", "opciones": {"a": "Los gránulos densos (delta).", "b": "Los gránulos alfa (α).", "c": "Los lisosomas (gránulos lambda).", "d": "El sistema canalicular abierto."}, "correcta": "b", "razones": {"a": "Los gránulos {{densos}} (δ) contienen ADP, ATP, serotonina, histamina y calcio, no los factores de coagulación proteicos.", "b": "CORRECTA. Los gránulos {{alfa}} (α) almacenan los factores de la **coagulación** (fibrinógeno, factor V, vWF) y factores de crecimiento (PDGF).", "c": "Los {{lisosomas}} (gránulos γ/lambda) contienen enzimas hidrolíticos.", "d": "El {{sistema canalicular abierto}} es una vía de liberación al exterior, no un almacén de factores."}, "_k": "org1p-043:1962058634", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-044", "tema": "Inmune", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "En relación con el **corpúsculo de Hassall**, ¿cuál es la afirmación correcta?", "opciones": {"a": "Se encuentra en la corteza del timo.", "b": "Se encuentra en la médula del timo.", "c": "Está formado por células epitelio-reticulares tipo III.", "d": "Forma parte de la barrera hematotímica."}, "correcta": "b", "razones": {"a": "Falso: la {{corteza}} tímica es densa en timocitos en maduración; no contiene corpúsculos de Hassall.", "b": "CORRECTA. El corpúsculo de {{Hassall}} es exclusivo de la {{médula}} del timo, formado por células epitelio-reticulares queratinizadas (tipo VI) dispuestas concéntricamente.", "c": "Falso: lo forman células epitelio-reticulares {{tipo VI}}, no tipo III (las tipo III separan corteza de médula).", "d": "Falso: la barrera {{hematotímica}} está en la corteza (epitelio-reticular tipo I + endotelio), no en los corpúsculos."}, "_k": "org1p-044:4278925549", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-045", "tema": "Inmune", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "Las **vénulas de endotelio alto (HEV)** se encuentran en:", "opciones": {"a": "La corteza (paracortex) del ganglio linfático.", "b": "Los cordones medulares del ganglio linfático.", "c": "La pulpa blanca del bazo.", "d": "La pulpa roja del bazo."}, "correcta": "a", "razones": {"a": "CORRECTA. Las {{HEV}} (vénulas de endotelio alto) están en el {{paracortex}} (corteza profunda, zona T) del ganglio; por ellas migran los linfocitos desde la sangre.", "b": "Los cordones {{medulares}} contienen plasmocitos y macrófagos, no HEV.", "c": "El bazo NO tiene {{HEV}} (la entrada linfocitaria es por la arteria central y la zona marginal).", "d": "La pulpa {{roja}} es de cordones de Billroth y senos venosos de filtración, sin HEV."}, "_k": "org1p-045:539354245", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-046", "tema": "Inmune", "examen": "2019 + 2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23, 2025-26", "enunciado": "Los **linfocitos B** se distribuyen ampliamente en:", "opciones": {"a": "La vaina linfática periarteriolar (PALS) del bazo.", "b": "La corteza del timo.", "c": "La médula del timo.", "d": "El centro germinal de los nódulos linfáticos."}, "correcta": "d", "razones": {"a": "El {{PALS}} es la zona T-dependiente del bazo (rodea la arteria central).", "b": "La corteza del {{timo}} aloja linfocitos T en maduración.", "c": "La médula del {{timo}} es territorio de linfocitos T (ya maduros).", "d": "CORRECTA. Los linfocitos {{B}} pueblan los {{centros germinales}} de los nódulos/folículos linfáticos (zona B-dependiente)."}, "_k": "org1p-046:168010711", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-047", "tema": "Inmune", "examen": "2021-sept + Unybook", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "Respecto al **bazo**, señala la afirmación **correcta**:", "opciones": {"a": "Sus folículos linfoides carecen de arteria central, igual que los del ganglio.", "b": "La pulpa roja está formada por centros germinales B-dependientes.", "c": "Posee senos subcapsulares como el ganglio linfático.", "d": "Sus folículos linfoides están atravesados por una arteria central, rasgo que lo distingue del ganglio; la pulpa roja tiene cordones de Billroth."}, "correcta": "d", "razones": {"a": "Falso: precisamente la {{arteria central}} excéntrica define el folículo esplénico (a diferencia del ganglio).", "b": "Falso: la pulpa {{roja}} consta de cordones de Billroth y senos venosos (filtración de hematíes), no de centros germinales.", "c": "Falso: el bazo NO tiene {{senos subcapsulares}} (eso es propio del ganglio linfático).", "d": "CORRECTA. La {{arteria central}} dentro del folículo distingue el bazo del ganglio; la pulpa roja tiene {{cordones de Billroth}} y senos venosos."}, "_k": "org1p-047:3251210583", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-048", "tema": "Inmune", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "En el **ganglio linfático**, ¿qué tipo celular predomina en el **paracortex** (corteza profunda)?", "opciones": {"a": "Linfocitos T.", "b": "Linfocitos B.", "c": "Plasmocitos.", "d": "Macrófagos."}, "correcta": "a", "razones": {"a": "CORRECTA. El {{paracortex}} (corteza profunda) es la zona T-dependiente, con HEV por donde entran los linfocitos {{T}}.", "b": "Los linfocitos {{B}} ocupan la corteza externa (folículos y centros germinales).", "c": "Los {{plasmocitos}} se ubican en los cordones medulares.", "d": "Los {{macrófagos}} abundan en senos y médula; no predominan en el paracortex."}, "_k": "org1p-048:4221282697", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-049", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**(IMAGEN 2)** En un corte de **estómago** (H-E), la flecha señala la fina banda de músculo liso que separa la mucosa glandular de la submucosa. ¿A qué capa de la pared corresponde?", "opciones": {"a": "Epitelio.", "b": "Lámina propia.", "c": "Submucosa.", "d": "Muscularis mucosae."}, "correcta": "d", "razones": {"a": "El epitelio es la capa superficial cilíndrica que tapiza la luz y las foveolas.", "b": "La lámina propia es el conjuntivo entre las glándulas gástricas.", "c": "La submucosa es el conjuntivo laxo por debajo de la muscular de la mucosa, con vasos grandes.", "d": "CORRECTA. La banda eosinófila estrecha de fibras musculares lisas al pie de las glándulas, que separa la mucosa de la submucosa, es la {{muscularis mucosae}}."}, "imagen": "_quiz_imgs/T04-Digestivo/t04sdigest-p01-1.png", "redact": [{"x": 30, "y": 39, "w": 42, "h": 22}], "_k": "org1p-049:2635659135", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-050", "tema": "Vasos", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (paquete vasculonervioso)", "enunciado": "**(IMAGEN 3)** En un **paquete vasculonervioso** (H-E), la flecha señala un vaso de luz redonda, pared gruesa con media muscular concéntrica y una lámina elástica interna ondulada bien visible bajo el endotelio. ¿A qué formación corresponde?", "opciones": {"a": "Vena mediana.", "b": "Arteria muscular.", "c": "Arteriola.", "d": "Ninguna de las anteriores."}, "correcta": "b", "razones": {"a": "La {{vena mediana}} tiene pared fina, luz amplia e irregular (a menudo colapsada) y escasa media muscular.", "b": "CORRECTA. La {{arteria muscular}} muestra luz redonda, media muscular concéntrica y, sobre todo, una {{lámina elástica interna}} ondulada bien visible: criterio diferencial clave.", "c": "La {{arteriola}} es de pequeño calibre (1-2 capas de músculo); demasiado pequeña para el vaso principal del paquete.", "d": "Incorrecta: hay una arteria muscular identificable."}, "imagen": "_quiz_imgs/T02-Vasos/t02vascul-p35-1.png", "redact": [{"x": 85, "y": 0, "w": 12, "h": 14}, {"x": 12, "y": 35, "w": 12, "h": 16}, {"x": 82, "y": 28, "w": 13, "h": 14}, {"x": 35, "y": 64, "w": 11, "h": 14}, {"x": 62, "y": 84, "w": 12, "h": 15}], "_k": "org1p-050:835623174", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-051", "tema": "Vasos", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "**(IMAGEN 4)** En una microfotografía de microscopio electrónico de transmisión (MET) se observa un único tubo de pared delgadísima, una sola capa de endotelio rodeada de lámina basal, con un eritrocito en la luz y sin capa muscular. ¿A qué elemento corresponde?", "opciones": {"a": "Conducto de Hering.", "b": "Capilar.", "c": "Arteriola.", "d": "Bronquiolo terminal."}, "correcta": "b", "razones": {"a": "El conducto de {{Hering}} al MET mostraría la unión de hepatocito con colangiocito cúbico, no un tubo endotelial.", "b": "CORRECTA. Pared delgadísima de una sola capa de {{endotelio}} con lámina basal, sin capa muscular y con un eritrocito en la luz → {{capilar}}.", "c": "La {{arteriola}} tendría 1-2 capas de músculo liso rodeando el endotelio.", "d": "El {{bronquiolo}} terminal mostraría epitelio cúbico con células Club, no endotelio."}, "imagen": "_quiz_imgs/T02-Vasos/t02vascul-p27-1.png", "redact": [{"x": 0, "y": 2, "w": 14, "h": 16}, {"x": 32, "y": 26, "w": 12, "h": 16}, {"x": 33, "y": 54, "w": 12, "h": 18}, {"x": 56, "y": 26, "w": 16, "h": 16}, {"x": 78, "y": 0, "w": 22, "h": 18}], "_k": "org1p-051:762031588", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-052", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "**(IMAGEN 6)** En la imagen de un epitelio (H-E) se observa un epitelio cilíndrico simple alto, sin caliciformes ni cilios, con pliegues mucosos altos y ramificados (sin glándulas en la mucosa). ¿A qué órgano corresponde?", "opciones": {"a": "Estómago.", "b": "Tráquea.", "c": "Vesícula biliar.", "d": "Intestino grueso."}, "correcta": "c", "razones": {"a": "El estómago tiene epitelio cilíndrico simple mucoso con foveolas.", "b": "La tráquea es cilíndrico pseudoestratificado ciliado con caliciformes.", "c": "CORRECTA. Epitelio cilíndrico simple absortivo, sin caliciformes ni cilios, con pliegues mucosos altos y laberínticos → {{vesícula biliar}}.", "d": "El intestino grueso tiene criptas rectas con abundantes caliciformes."}, "imagen": "_quiz_imgs/T04-Digestivo/t04sdigfet-p49-1.png", "_k": "org1p-052:2112029865", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-053", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar porción del tubo digestivo)", "enunciado": "**(IMAGEN 14)** Fíjate en la mucosa: criptas rectas y profundas, SIN vellosidades y con muchas células caliciformes. ¿A qué porción del tubo digestivo corresponde?", "opciones": {"a": "Intestino grueso.", "b": "Intestino delgado.", "c": "Estómago (fundus).", "d": "Estómago (cardias)."}, "correcta": "a", "razones": {"a": "CORRECTA. Superficie plana, sin vellosidades, criptas rectas y caliciformes abundantes → {{intestino grueso}}.", "b": "El intestino delgado tendría {{vellosidades}} digitiformes (ausentes en el grueso).", "c": "El fundus gástrico tiene glándulas gástricas con parietales/principales.", "d": "El cardias tiene glándulas mucosas cortas y tortuosas."}, "imagen": "_quiz_imgs/T04-Digestivo/t04sdigint-p24-1.png", "redact": [{"x": 14, "y": 41, "w": 50, "h": 14}, {"x": 60, "y": 3, "w": 40, "h": 9}, {"x": 60, "y": 13, "w": 40, "h": 9}, {"x": 62, "y": 27, "w": 38, "h": 9}, {"x": 62, "y": 43, "w": 38, "h": 9}, {"x": 62, "y": 70, "w": 38, "h": 9}, {"x": 0, "y": 60, "w": 30, "h": 10}], "_k": "org1p-053:475778555", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-054", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23, 2025-26", "enunciado": "**(IMAGEN 1)** En un corte de **diente** de mamífero (H-E), la flecha señala una estructura fibrosa que une el diente al hueso alveolar. ¿De qué se trata?", "opciones": {"a": "Hueso alveolar.", "b": "Cemento.", "c": "Membrana periodontal (ligamento periodontal).", "d": "Cámara pulpar."}, "correcta": "c", "razones": {"a": "El {{hueso alveolar}} es el lecho óseo, no la banda fibrosa intermedia.", "b": "El {{cemento}} recubre la raíz, pero la estructura de fibras de Sharpey que ancla es el ligamento.", "c": "CORRECTA. La {{membrana periodontal}} (ligamento) es el espacio conjuntivo fibroso entre cemento y hueso alveolar, con las fibras de Sharpey que fijan el diente.", "d": "La {{cámara pulpar}} es el espacio central con la pulpa, no una estructura de anclaje."}, "_k": "org1p-054:1374438130", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-055", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "**(IMAGEN 5)** En un corte de **pulmón** humano (H-E), los septos interalveolares muestran numerosas células redondeadas grandes que protruyen hacia el alveolo (flechas). ¿Qué células son?", "opciones": {"a": "Fibroblastos.", "b": "Macrófagos alveolares.", "c": "Neumocitos tipo II.", "d": "Células plasmáticas."}, "correcta": "c", "razones": {"a": "Los {{fibroblastos}} son fusiformes, intersticiales; no protruyen a la luz alveolar.", "b": "Los {{macrófagos}} alveolares (células del polvo) están libres en la luz, no formando parte de la pared.", "c": "CORRECTA. Las células redondeadas grandes que abultan en los vértices del septo son los {{neumocitos tipo II}} (cuerpos lamelares con surfactante).", "d": "Las células {{plasmáticas}} no son un componente típico del septo alveolar normal."}, "imagen": "_quiz_imgs/T03-Respiratorio/t03srespi-p33-1.png", "redact": [{"x": 74, "y": 0, "w": 14, "h": 16}, {"x": 36, "y": 86, "w": 14, "h": 14}], "_k": "org1p-055:2991913226", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-056", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**(IMAGEN 16)** En un detalle de **glándula parótida** (H-E), la flecha señala un conducto pequeño de epitelio cúbico con núcleos basales redondeados, situado entre los acinos serosos. ¿Qué estructura es?", "opciones": {"a": "Acino mucoso.", "b": "Conducto intercalar.", "c": "Conducto interlobular.", "d": "Conducto estriado o secretor."}, "correcta": "b", "razones": {"a": "La parótida es {{serosa}}; no presenta acinos mucosos pálidos.", "b": "CORRECTA. El conducto pequeño de epitelio {{cúbico}} simple que sale del acino es el conducto {{intercalar}} (muy desarrollado en la parótida).", "c": "El {{interlobular}} es de mayor calibre y va por el tejido conjuntivo entre lobulillos.", "d": "El conducto {{estriado}} es más grande, con células cilíndricas eosinófilas y estriaciones basales."}, "imagen": "_quiz_imgs/T04-Digestivo/t04sdiggla-p13-1.png", "_k": "org1p-056:2839371550", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-057", "tema": "Inmune", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN 17)** En la **pulpa blanca del bazo**, ¿qué estructuras corresponden a los números 1 (manguito linfoide), 2 (vaso excéntrico) y 3 (acúmulo linfoide)?", "opciones": {"a": "1-PALS, 2-Arteria central, 3-Nódulo esplénico.", "b": "1-Nódulo esplénico, 2-Vena central, 3-PALS.", "c": "1-Nódulo esplénico, 2-Arteria central, 3-PALS.", "d": "1-Nódulo esplénico, 2-Arteria central, 3-Zona marginal."}, "correcta": "a", "razones": {"a": "CORRECTA. El manguito de linfocitos T en torno al vaso es el {{PALS}}; el vaso excéntrico es la {{arteria central}}; el acúmulo de linfocitos B es el {{nódulo esplénico}}.", "b": "Falso: el vaso central es una {{arteria}} (no vena) y la numeración no encaja.", "c": "Falso: invierte el {{PALS}} con el nódulo (el manguito perivascular es el PALS, no el nódulo).", "d": "Falso: el elemento 3 es el {{nódulo}} linfoide B, no la zona marginal."}, "imagen": "_quiz_imgs/T06-Inmune/t06tema8-p06-1.png", "redact": [{"x": 1, "y": 1, "w": 16, "h": 6}, {"x": 12, "y": 7, "w": 22, "h": 5}, {"x": 12, "y": 16, "w": 22, "h": 5}, {"x": 24, "y": 1, "w": 18, "h": 5}, {"x": 38, "y": 5, "w": 19, "h": 5}, {"x": 50, "y": 3, "w": 25, "h": 5}, {"x": 50, "y": 9, "w": 17, "h": 5}, {"x": 55, "y": 13, "w": 15, "h": 5}, {"x": 77, "y": 13, "w": 23, "h": 9}, {"x": 71, "y": 14, "w": 12, "h": 4}, {"x": 30, "y": 24, "w": 30, "h": 5}, {"x": 30, "y": 30, "w": 16, "h": 4}, {"x": 30, "y": 34, "w": 18, "h": 4}, {"x": 30, "y": 39, "w": 18, "h": 5}, {"x": 44, "y": 44, "w": 16, "h": 5}, {"x": 18, "y": 49, "w": 13, "h": 5}, {"x": 14, "y": 53, "w": 26, "h": 5}, {"x": 12, "y": 58, "w": 38, "h": 5}, {"x": 7, "y": 64, "w": 18, "h": 5}, {"x": 2, "y": 78, "w": 22, "h": 5}, {"x": 2, "y": 84, "w": 32, "h": 5}, {"x": 31, "y": 91, "w": 16, "h": 5}, {"x": 56, "y": 86, "w": 16, "h": 5}, {"x": 73, "y": 86, "w": 16, "h": 5}, {"x": 88, "y": 91, "w": 16, "h": 5}], "_k": "org1p-057:2258435197", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-058", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN 18)** En un frotis de sangre, identifica las células: 1 (núcleo multilobulado, gránulos finos neutros), 2 (gránulos grandes anaranjados, núcleo bilobulado), 3 (célula pequeña anuclear). ¿Qué combinación es correcta?", "opciones": {"a": "1-Neutrófilo, 2-Basófilo, 3-Plaqueta.", "b": "1-Neutrófilo, 2-Eosinófilo, 3-Plaqueta.", "c": "1-Eritrocito, 2-Eosinófilo, 3-Neutrófilo.", "d": "1-Neutrófilo, 2-Linfocito, 3-Plaqueta."}, "correcta": "b", "razones": {"a": "Falsa: la célula 2, con gránulos {{anaranjados}} grandes y núcleo bilobulado, es un **eosinófilo**, no un basófilo (que tiene gránulos basófilos metacromáticos).", "b": "CORRECTA. 1 = {{neutrófilo}} (núcleo multilobulado, gránulos finos neutros), 2 = **eosinófilo** (gránulos rojo-naranja, núcleo bilobulado), 3 = {{plaqueta}} (fragmento anuclear).", "c": "Falsa: la célula 1 es nucleada (neutrófilo), no un {{eritrocito}} (anucleado).", "d": "Falsa: la célula 2, granulada, no es un {{linfocito}} (agranular con núcleo redondo)."}, "imagen": "_quiz_imgs/T05-Sangre/t05sangcv-p30-1.png", "redact": [{"x": 0, "y": 4, "w": 26, "h": 13}, {"x": 0, "y": 30, "w": 24, "h": 8}, {"x": 0, "y": 47, "w": 18, "h": 8}, {"x": 0, "y": 63, "w": 21, "h": 8}, {"x": 0, "y": 80, "w": 21, "h": 9}], "_k": "org1p-058:3520206405", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-059", "tema": "Inmune", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2022-23, 2025-26", "enunciado": "**(IMAGEN 19)** En un corte de **ganglio linfático**, la flecha señala un nódulo con centro germinal. ¿En qué región está y qué célula lo conforma?", "opciones": {"a": "Corteza interna (paracortex), linfocitos T.", "b": "Corteza externa, linfocitos B.", "c": "Corteza interna (paracortex), linfocitos B.", "d": "Corteza externa, linfocitos T."}, "correcta": "b", "razones": {"a": "Falso: el {{paracortex}} es zona T, pero el folículo con centro germinal no está ahí.", "b": "CORRECTA. Los folículos/nódulos con {{centro germinal}} están en la corteza {{externa}} y son zona de linfocitos {{B}}.", "c": "Falso: ubica mal el nódulo B en el paracortex (zona T).", "d": "Falso: la corteza externa es territorio {{B}}, no T."}, "imagen": "_quiz_imgs/T06-Inmune/t06tema7-p12-1.png", "redact": [{"x": 13, "y": 13, "w": 14, "h": 12}, {"x": 33, "y": 8, "w": 16, "h": 12}, {"x": 78, "y": 11, "w": 14, "h": 7}, {"x": 30, "y": 28, "w": 16, "h": 12}, {"x": 78, "y": 22, "w": 16, "h": 12}, {"x": 71, "y": 56, "w": 22, "h": 12}, {"x": 18, "y": 50, "w": 15, "h": 7}], "_k": "org1p-059:1175876319", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-060", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN 20)** En un frotis de médula ósea, los precursores señalados con flechas presentan gránulos específicos eosinófilos en formación. ¿A qué célula sanguínea madura darán lugar?", "opciones": {"a": "Eosinófilo.", "b": "Eritrocito.", "c": "Basófilo.", "d": "Plaqueta."}, "correcta": "a", "razones": {"a": "CORRECTA. Los gránulos específicos {{eosinófilos}} (anaranjados) en mielocitos/metamielocitos indican linaje **eosinófilo** → eosinófilo maduro.", "b": "El {{eritrocito}} procede de eritroblastos, que carecen de gránulos específicos.", "c": "El {{basófilo}} tendría gránulos metacromáticos basófilos (violeta), no eosinófilos.", "d": "La {{plaqueta}} deriva del megacariocito (célula gigante poliploide), no de mielocitos granulados."}, "imagen": "_quiz_imgs/T05-Sangre/t05hematopo-p21-1.png", "redact": [{"x": 3, "y": 27, "w": 24, "h": 9}, {"x": 28, "y": 30, "w": 24, "h": 9}, {"x": 49, "y": 28, "w": 24, "h": 9}, {"x": 73, "y": 6, "w": 27, "h": 19}, {"x": 3, "y": 49, "w": 24, "h": 9}, {"x": 9, "y": 84, "w": 20, "h": 9}, {"x": 41, "y": 85, "w": 21, "h": 9}], "_k": "org1p-060:3483832481", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-061", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a los **epitelios de revestimiento**, señala la afirmación **correcta**:", "opciones": {"a": "El epitelio estratificado es más resistente que el simple y no todas sus células contactan con la superficie y la basal.", "b": "En el epitelio estratificado todas las células contactan a la vez con la luz y la lámina basal.", "c": "El epitelio simple es el más resistente a la abrasión.", "d": "El epitelio pseudoestratificado tiene varias capas reales de células."}, "correcta": "a", "razones": {"a": "CORRECTA. El epitelio {{estratificado}} (varias capas) es más {{resistente}} a la abrasión; solo las células basales tocan la lámina basal y solo las superficiales contactan con la luz.", "b": "Falsa: que **todas** las células toquen a la vez luz y lámina basal describe al epitelio {{simple}}, no al estratificado.", "c": "Falsa: el más resistente a la abrasión es el {{estratificado}} (p. ej. plano queratinizado de la epidermis), no el simple.", "d": "Falsa: el {{pseudoestratificado}} tiene **una sola capa** real; todas las células tocan la lámina basal aunque no todas lleguen a la luz (de ahí el aspecto estratificado falso)."}, "_k": "org1p-061:2514847433", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-062", "tema": "Tejidos básicos", "examen": "2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2022-23", "enunciado": "En las **glándulas exocrinas pluricelulares**, las unidades secretoras constituyen el:", "opciones": {"a": "Estroma.", "b": "Cápsula.", "c": "Sistema de conductos exclusivamente.", "d": "Parénquima."}, "correcta": "d", "razones": {"a": "Falsa: el {{estroma}} es el tejido conjuntivo de sostén (tabiques, cápsula), no las unidades secretoras.", "b": "Falsa: la {{cápsula}} envuelve el órgano; pertenece al estroma, no a la porción funcional.", "c": "Falsa: los {{conductos}} transportan la secreción; el componente secretor (adenómeros) es lo que define la pregunta.", "d": "CORRECTA. Las unidades secretoras (adenómeros), junto con el sistema de conductos, forman el {{parénquima}} glandular (componente epitelial funcional), frente al estroma conjuntivo."}, "_k": "org1p-062:2719171842", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-063", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "El **tejido conjuntivo reticular** se caracteriza por:", "opciones": {"a": "Teñirse selectivamente con impregnaciones argénticas (plata) por sus fibras de colágeno III.", "b": "Estar formado por fibras elásticas gruesas.", "c": "Carecer por completo de células.", "d": "Ser el componente principal del cartílago hialino."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras {{reticulares}} (colágeno {{III}}) son argirófilas: se impregnan de negro con sales de {{plata}} (no con H-E ordinario) y forman el estroma de órganos linfoides, médula ósea e hígado.", "b": "Falsa: las fibras reticulares son **finas** de colágeno III; las elásticas gruesas son de otro tejido (elastina), no reticular.", "c": "Falsa: contiene {{células reticulares}} (fibroblastos especializados) y abundantes células libres.", "d": "Falsa: el cartílago hialino es colágeno {{II}} en matriz condral, no tejido reticular."}, "_k": "org1p-063:2298741076", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-064", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a la **osificación endocondral**, señala la afirmación **correcta**:", "opciones": {"a": "El centro de osificación primario se forma en la diáfisis sobre un molde de cartílago hialino, dando espículas óseas recubiertas de cartílago calcificado.", "b": "No requiere un molde previo de cartílago.", "c": "Es el mecanismo de formación de los huesos planos del cráneo.", "d": "El hueso se forma directamente a partir del mesénquima sin pasar por cartílago."}, "correcta": "a", "razones": {"a": "CORRECTA. En la osificación {{endocondral}} el centro {{primario}} aparece en la {{diáfisis}} sobre un molde de cartílago hialino; quedan espículas de matriz ósea depositadas sobre restos de cartílago calcificado.", "b": "Falsa: la endocondral **sí** requiere un molde previo de {{cartílago hialino}} (es su rasgo definitorio).", "c": "Falsa: los huesos planos del cráneo se forman por osificación {{intramembranosa}} (directa desde mesénquima).", "d": "Falsa: la formación directa desde {{mesénquima}} sin pasar por cartílago es la osificación intramembranosa, no la endocondral."}, "_k": "org1p-064:3041785547", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-065", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept

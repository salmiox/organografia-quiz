pas", "enunciado": "Sobre las **trompas de Falopio**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Presentan epitelio cilíndrico simple con abundantes células ciliadas.", "b": "Durante la fase lútea las células secretoras disminuyen drásticamente su actividad.", "c": "La mucosa tiene pliegues longitudinales máximos en la ampolla.", "d": "La muscular está formada por dos subcapas de fibras lisas."}, "correcta": "b", "razones": {"a": "Cierta: la trompa tiene epitelio {{cilíndrico simple}} con células **ciliadas** (impulsan el óvulo) y secretoras.", "b": "CORRECTA (es la FALSA; clave 2024-25 = B). En la fase **lútea** (progesterona) las células secretoras **AUMENTAN** aún más su actividad; las que pierden altura y cilios son las **ciliadas**. Afirmar que las secretoras disminuyen es falso.", "c": "Cierta: los pliegues de la mucosa son **máximos en la {{ampolla}}** (sitio de fecundación).", "d": "Cierta: la muscular tiene {{dos subcapas}} (circular interna + longitudinal externa)."}, "_k": "org2p-062:1224390997", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-063", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave C); endometrio", "enunciado": "Sobre el **endometrio** durante el ciclo menstrual, señala la afirmación **CORRECTA**:", "opciones": {"a": "El endometrio tiene riego sanguíneo abundante durante la fase menstrual.", "b": "Durante la fase proliferativa las glándulas pierden progresivamente glucógeno.", "c": "En fase secretora las glándulas son pronunciadas y tortuosas, con células ricas en glucógeno.", "d": "La vascularización es máxima en fase menstrual con poca actividad de las arterias espirales."}, "correcta": "c", "razones": {"a": "FALSA. En la fase **menstrual** hay vasoconstricción de las arterias helicoidales → isquemia y descamación, NO riego abundante.", "b": "FALSA. En la fase **proliferativa** las glándulas son **rectas** y el epitelio glandular **acumula** glucógeno hacia el final (no lo pierde).", "c": "CORRECTA (clave 2024-25 = C). En la fase {{secretora}} (progesterona) las glándulas son **pronunciadas y tortuosas**, con células ricas en {{glucógeno}}.", "d": "FALSA. Las arterias {{espirales/helicoidales}} están muy implicadas en la fase menstrual (vasoespasmo que provoca la descamación)."}, "_k": "org2p-063:962023626", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-064", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. A); cérvix", "enunciado": "¿Qué epitelio es propio del **cérvix uterino** (antes de penetrar en la vagina)?", "opciones": {"a": "Cilíndrico simple con células secretoras de moco.", "b": "Plano estratificado no queratinizado.", "c": "Cilíndrico pseudoestratificado ciliado.", "d": "De transición."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-junio = A). El **endocérvix** (cérvix antes de penetrar en la vagina) tiene epitelio {{cilíndrico simple}} secretor de **moco**.", "b": "FALSA. El plano estratificado no queratinizado es el de la **vagina** y el exocérvix.", "c": "FALSA. El cilíndrico pseudoestratificado ciliado es epitelio **respiratorio**.", "d": "FALSA. El epitelio de **transición** (urotelio) es propio de las vías urinarias."}, "_k": "org2p-064:2251419726", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-065", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); glándulas de Littré", "enunciado": "Las **glándulas de Littré** son propias de:", "opciones": {"a": "La uretra peniana (esponjosa).", "b": "La uretra membranosa.", "c": "La uretra prostática.", "d": "La vejiga."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-junio = A). Las glándulas de {{Littré}} son glándulas **mucosas** de la uretra **esponjosa/peniana** (la lubrican).", "b": "FALSA. No son propias de la uretra membranosa (ahí desembocan las de Cowper).", "c": "FALSA. En la uretra prostática desembocan los conductos prostáticos, no las de Littré.", "d": "FALSA. La vejiga no tiene glándulas de Littré."}, "_k": "org2p-065:4071427875", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-066", "tema": "Reproductor", "examen": "Concepto recurrente (corona radiada)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. B)", "enunciado": "La **corona radiada** está formada por:", "opciones": {"a": "Células de la teca interna.", "b": "Células de la granulosa que rodean al ovocito tras la ovulación.", "c": "Fibroblastos del estroma ovárico.", "d": "Células germinales primordiales."}, "correcta": "b", "razones": {"a": "FALSA. La teca interna queda en la pared del folículo; no acompaña al ovocito tras la ovulación.", "b": "CORRECTA (clave 2022-23 = B). La **corona radiada** son las células de la {{granulosa}} (del cúmulo oóforo) fijadas a la zona pelúcida que **rodean al ovocito y se liberan con él en la ovulación**.", "c": "FALSA. Los fibroblastos forman el estroma ovárico, no la corona.", "d": "FALSA. Las células germinales primordiales son embrionarias, sin relación con la corona radiada."}, "_k": "org2p-066:2962398792", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-067", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C); córnea", "enunciado": "Respecto al **epitelio de la córnea**, es cierto que:", "opciones": {"a": "Está muy vascularizado.", "b": "Se localiza en la superficie posterior de la córnea.", "c": "Contiene terminaciones nerviosas.", "d": "Contiene melanocitos."}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (su transparencia depende de ello).", "b": "Falsa: el epitelio corneal está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA. El epitelio corneal anterior está muy {{inervado}} (terminaciones nerviosas libres amielínicas → gran sensibilidad).", "d": "Falsa: el epitelio corneal NO contiene {{melanocitos}}."}, "_k": "org2p-067:1370518998", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-068", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave D); humor acuoso", "enunciado": "¿Qué estructura produce el **humor acuoso**?", "opciones": {"a": "Iris.", "b": "Fibras zonulares.", "c": "Coroides.", "d": "Procesos ciliares."}, "correcta": "d", "razones": {"a": "Falsa: el {{iris}} regula la pupila, no produce humor acuoso.", "b": "Falsa: las {{fibras zonulares}} sostienen el cristalino.", "c": "Falsa: la {{coroides}} es vascular/nutricia de la retina externa.", "d": "CORRECTA. Los {{procesos ciliares}} (epitelio ciliar) secretan el humor acuoso."}, "_k": "org2p-068:179017947", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-069", "tema": "Ojo", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); células bipolares", "enunciado": "Sobre las **células bipolares de la retina**:", "opciones": {"a": "Contactan con células ganglionares y con fotorreceptores.", "b": "Sus axones forman el nervio óptico.", "c": "Son abundantes en la fóvea central.", "d": "Son células fotorreceptoras."}, "correcta": "a", "razones": {"a": "CORRECTA. Las células {{bipolares}} son la neurona intermedia: contactan con {{fotorreceptores}} (plexiforme externa) y con ganglionares (plexiforme interna).", "b": "Falsa: los axones que forman el nervio óptico son los de las {{ganglionares}}.", "c": "Falsa: en la {{fóvea}} predominan los conos y las capas internas se desplazan lateralmente.", "d": "Falsa: las células fotorreceptoras son los {{conos y bastones}}, no las bipolares."}, "_k": "org2p-069:641108057", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-070", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A); Corti", "enunciado": "Sobre el **órgano de Corti** del oído interno, es cierto que:", "opciones": {"a": "No presenta otolitos.", "b": "Las células ciliadas presentan estereocilios y un cinocilio funcional en el adulto.", "c": "La cúpula cubre sus células ciliadas.", "d": "Se localiza sobre la membrana vestibular (de Reissner)."}, "correcta": "a", "razones": {"a": "CORRECTA. El órgano de Corti NO tiene {{otolitos}} (esos están en las máculas del utrículo/sáculo).", "b": "Falsa: las células ciliadas del Corti tienen estereocilios pero {{pierden el cinocilio}} en el adulto (no es funcional).", "c": "Falsa: la {{cúpula}} cubre las crestas ampollares; el Corti tiene la membrana tectoria.", "d": "Falsa: el Corti se asienta sobre la membrana {{basilar}}, no sobre la de Reissner (vestibular)."}, "_k": "org2p-070:4064928720", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-071", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C); mácula del sáculo", "enunciado": "Sobre la **mácula del sáculo**, es cierto que:", "opciones": {"a": "Tiene una posición horizontal.", "b": "Se localiza en una región de los conductos semicirculares.", "c": "Está en contacto con la endolinfa.", "d": "No contiene células de sostén."}, "correcta": "c", "razones": {"a": "Falsa: la mácula del sáculo está en posición {{vertical}} (la del utrículo es horizontal).", "b": "Falsa: las máculas están en utrículo y sáculo, NO en los {{conductos semicirculares}} (ahí están las crestas ampollares).", "c": "CORRECTA. La mácula está bañada por {{endolinfa}} (dentro del laberinto membranoso).", "d": "Falsa: SÍ tiene células de {{sostén}} junto a las ciliadas."}, "_k": "org2p-071:2089677918", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-072", "tema": "Oído", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C), 2021-22; endolinfa", "enunciado": "La **endolinfa** se localiza:", "opciones": {"a": "Entre el laberinto óseo y el membranoso.", "b": "Dentro de la estría vascular.", "c": "Dentro del laberinto membranoso.", "d": "En el oído medio."}, "correcta": "c", "razones": {"a": "Falsa: el espacio entre laberinto óseo y membranoso lo ocupa la {{perilinfa}}.", "b": "Falsa: la {{estría vascular}} produce la endolinfa, pero no es el espacio que la contiene.", "c": "CORRECTA. La {{endolinfa}} llena el interior del laberinto {{membranoso}} (rica en K⁺, ≈ líquido intracelular).", "d": "Falsa: el oído medio contiene {{aire}}, no endolinfa."}, "_k": "org2p-072:4077062840", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-073", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22 (resp. A); crestas ampollares", "enunciado": "Las **crestas ampollares** son:", "opciones": {"a": "Órganos sensoriales de los conductos semicirculares, cubiertas por la cúpula y sin otolitos.", "b": "Órganos auditivos sobre la membrana basilar.", "c": "Las máculas del utrículo y sáculo.", "d": "Receptores con membrana otolítica."}, "correcta": "a", "razones": {"a": "CORRECTA. Las {{crestas ampollares}} son los receptores de los {{conductos semicirculares}} (aceleración angular), cubiertas por la cúpula y sin otolitos.", "b": "Falsa: el órgano auditivo sobre la membrana basilar es el {{órgano de Corti}}.", "c": "Falsa: las {{máculas}} (utrículo/sáculo) son estructuras distintas de las crestas.", "d": "Falsa: la membrana {{otolítica}} es de las máculas; las crestas tienen cúpula sin otolitos."}, "_k": "org2p-073:864624894", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-074", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuenci s terminales de la placenta madura son {{terciarias}}, es decir, contienen ya {{vasos fetales}} (vellosidades de intercambio).", "d": "Falsa: a término el {{citotrofoblasto}} (capa de Langhans) se reduce y la barrera se adelgaza; no aumenta el número de células."}, "_k": "org2p-080:2099344728", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-081", "tema": "Embriología", "examen": "Concepto recurrente (hojas germinativas)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Concepto base recurrente en 2º parcial", "enunciado": "El **tubo neural** se forma a partir de:", "opciones": {"a": "Mesodermo paraxial.", "b": "Neuroectodermo (placa neural inducida por el notocordio).", "c": "Endodermo del techo del saco vitelino.", "d": "Hipoblasto."}, "correcta": "b", "razones": {"a": "Falsa: el mesodermo paraxial origina los {{somitas}}, no el tubo neural.", "b": "CORRECTA. El tubo neural deriva del {{neuroectodermo}} (placa neural), inducido por el {{notocordio}} subyacente.", "c": "Falsa: el {{endodermo}} origina los epitelios digestivo y respiratorio, no el tubo neural.", "d": "Falsa: el {{hipoblasto}} es desplazado y no forma estructuras definitivas del embrión, menos aún el tubo neural."}, "_k": "org2p-081:318848892", "fuente": "📚 Históricos / repetidas"}];
const app = document.getElementById("app");
const examen = document.getElementById("examen");
const filtro = document.getElementById("filtro");
const tipo = document.getElementById("tipo");
const frec = document.getElementById("frec");
const marc = document.getElementById("marc");
const orden = document.getElementById("orden");
const reshuffleBtn = document.getElementById("reshuffle");
// orden aleatorio estable: asigna un nº al azar a cada pregunta; se mantiene fijo
// mientras estás en modo aleatorio (no se re-baraja al marcar estrellas / filtrar).
let shuffleSeed = null;
function buildShuffle(){
  shuffleSeed = {};
  DATA.forEach(q => { shuffleSeed[q._k] = Math.random(); });
}
const SKEY = "organo_starred_v1";
let starred = new Set(JSON.parse(localStorage.getItem(SKEY) || "[]"));
function saveStars(){ localStorage.setItem(SKEY, JSON.stringify([...starred])); }
// **x** → palabra clave resaltada ; {{x}} → palabra clave ocluida (cloze)
function esc(s){return String(s==null?"":s);}
function fmt(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<span class="kw">$1</span>');
  s = s.replace(/\{\{([^}]+)\}\}/g, '<span class="cloze" title="click para revelar">$1</span>');
  return s;
}
// Imagen de la pregunta con las etiquetas que delatan la respuesta TAPADAS (overlay).
// Click en una caja = revelarla; click en la imagen = ampliar.
function imgHTML(q){
  const boxes=(q.redact||[]).map(r=>`<span class="redact" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%" onclick="event.stopPropagation();this.classList.toggle('revealed')" title="click para revelar la etiqueta"></span>`).join('');
  const hint = (q.redact&&q.redact.length)?'<div class="imghint">🟦 etiquetas tapadas · click para revelar · click en la imagen para ampliar</div>':'';
  return `<div class="imgwrap" onclick="this.classList.toggle('zoom')"><img class="qimg" src="${q.imagen}" alt="micrografía" loading="lazy">${boxes}</div>${hint}`;
}
const TEMAS = ["Cor","Vasos","Respiratorio","Digestivo","Sangre/Hematopoyesis","Inmune","Piel","Endocrino","Urinario","Reproductor","Ojo","Oído","Embriología","Tejidos básicos"];
TEMAS.filter(t=>DATA.some(q=>q.tema===t)).forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
[...new Set(DATA.map(q=>q.tema))].filter(t=>!TEMAS.includes(t)).sort().forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
// Filtro por examen/fuente
const FUENTES = ["🎯 2025-26 · 1er parcial","🎯 2025-26 · 2º parcial","📚 Históricos / repetidas"];
FUENTES.filter(s=>DATA.some(q=>q.fuente===s)).forEach(s=>{
  const o=document.createElement("option");o.value=s;o.textContent=s;examen.appendChild(o);});
function render(){
  const f = filtro.value, fr = frec.value, mk = marc.value, ex = examen.value, tp = tipo.value;
  const list = DATA.filter(q=>(!f||q.tema===f) &&
    (!ex || q.fuente===ex) &&
    (tp!=="img" || q.imagen) && (tp!=="txt" || !q.imagen) &&
    (fr!=="alta" || q.alta_frecuencia) &&
    (mk!=="si" || starred.has(q._k)));
  if(orden.value==="rand"){
    if(!shuffleSeed) buildShuffle();
    list.sort((a,b)=>shuffleSeed[a._k]-shuffleSeed[b._k]);
  }
  document.getElementById("count").textContent = list.length+" preguntas · 🌟 "+starred.size+" marcadas";
  app.innerHTML = "";
  list.forEach((q,i)=>{
    const card=document.createElement("div");card.className="card";
    const alta = q.alta_frecuencia?' · <span class="alta">⭐ ALTA FRECUENCIA</span>':'';
    const rep = q.repetida?' · '+q.repetida:'';
    const L=Object.keys(q.opciones).sort();
    let opts="";
    L.forEach(l=>opts+=`<div class="opt" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.opciones[l])}</div>`);
    let raz="";
    L.forEach(l=>{if(q.razones&&q.razones[l]!==undefined)raz+=`<div class="razon" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.razones[l])}</div>`;});
    const on = starred.has(q._k);
    card.innerHTML=`<div class="chead">
        <span class="qnum">Nº ${i+1} / ${list.length}</span>
        <div class="meta">${q.examen} · ${q.tema}${alta}${rep}${q.imagen?' <span class="imgtag">🖼 imagen</span>':''}</div>
        <button class="star${on?' on':''}" title="Marcar como difícil">${on?'★':'☆'}</button>
      </div>
      ${q.imagen?imgHTML(q):''}
      <div class="preg">${fmt(q.enunciado)}</div>
      <div class="opts">${opts}</div>
      <div class="hint">👆 Toca tu respuesta para ver el razonamiento.</div>
      <div class="resp"><button class="reveal-words">👁 Revelar palabras clave</button><div class="razon-wrap">${raz}</div></div>`;
    // estrella
    const starBtn=card.querySelector(".star");
    starBtn.onclick=()=>{
      if(starred.has(q._k)){starred.delete(q._k);} else {starred.add(q._k);}
      saveStars();
      const now=starred.has(q._k);
      starBtn.classList.toggle("on",now);starBtn.textContent=now?'★':'☆';
      document.getElementById("count").textContent=app.querySelectorAll(".card").length+" preguntas · 🌟 "+starred.size+" marcadas";
      if(marc.value==="si"&&!now)render();
    };
    // click en opción → revela al instante
    const optEls=card.querySelectorAll(".opt");
    const resp=card.querySelector(".resp");
    const hint=card.querySelector(".hint");
    let answered=false;
    optEls.forEach(o=>o.onclick=()=>{
      if(answered)return; answered=true;
      const chosen=o.dataset.l;
      optEls.forEach(x=>{const l=x.dataset.l;
        x.classList.add(l===q.correcta?"ok":"no");
        if(l===chosen)x.classList.add("mine");
        if(l===chosen&&l===q.correcta){x.insertAdjacentHTML("beforeend",'<span class="tag cor">✓ tu respuesta · correcta</span>');}
        else{
          if(l===chosen)x.insertAdjacentHTML("beforeend",'<span class="tag you">tu respuesta</span>');
          if(l===q.correcta)x.insertAdjacentHTML("beforeend",'<span class="tag cor">correcta</span>');
        }
      });
      hint.style.display="none";
      resp.classList.add("show");
    });
    // cloze: click individual para revelar/ocultar
    resp.querySelectorAll(".cloze").forEach(c=>c.onclick=()=>c.classList.toggle("revealed"));
    // botón revelar/ocultar todas
    resp.querySelector(".reveal-words").onclick=(e)=>{
      const cs=resp.querySelectorAll(".cloze");
      const anyHidden=[...cs].some(c=>!c.classList.contains("revealed"));
      cs.forEach(c=>c.classList.toggle("revealed",anyHidden));
      e.target.textContent = anyHidden ? "🙈 Ocultar palabras clave" : "👁 Revelar palabras clave";
    };
    app.appendChild(card);
  });
  updatePos();
}
// contador en vivo: detecta la tarjeta que está arriba del todo y muestra posición + cuántas quedan
function updatePos(){
  const cards=app.querySelectorAll(".card");
  const pos=document.getElementById("pos");
  const n=cards.length;
  if(!n){pos.textContent="";return;}
  const thr=document.querySelector("header").offsetHeight+10;
  let cur=0;
  for(let i=0;i<n;i++){ if(cards[i].getBoundingClientRect().top<=thr) cur=i; else break; }
  // si estás al final del scroll, fija la última (las últimas tarjetas no llegan a subir hasta arriba)
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4) cur=n-1;
  pos.textContent=`📍 ${cur+1} / ${n} · quedan ${n-1-cur}`;
}
let _ticking=false;
window.addEventListener("scroll",()=>{ if(!_ticking){_ticking=true;requestAnimationFrame(()=>{updatePos();_ticking=false;});} },{passive:true});
examen.onchange=render;filtro.onchange=render;tipo.onchange=render;frec.onchange=render;marc.onchange=render;
orden.onchange=()=>{
  const rand = orden.value==="rand";
  reshuffleBtn.style.display = rand ? "" : "none";
  if(rand) buildShuffle();          // nueva mezcla cada vez que activas aleatorio
  window.scrollTo(0,0);
  render();
};
reshuffleBtn.onclick=()=>{ buildShuffle(); window.scrollTo(0,0); render(); };
render();
</script></body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Organografía · Recuperación</title>
<style>
:root{--blue:#2c6fbf;--green:#27ae60;--red:#e74c3c}
*{box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;color:#1a2b3c;
     margin:0;line-height:1.45}
header{background:var(--blue);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;
       box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:18px}
.bar{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select{padding:6px 10px;border-radius:6px;border:none;font-size:15px}
.bar .reshuffle{padding:6px 12px;border-radius:6px;border:none;font-size:14px;font-weight:700;
     background:#fff;color:var(--blue);cursor:pointer}
.bar .reshuffle:hover{background:#e8f1fb}
.bar .count{margin-left:auto;font-size:14px;opacity:.9}
.bar .pos{font-size:14px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 11px;border-radius:14px;white-space:nowrap}
main{max-width:780px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:18px}
.meta{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.alta{color:var(--red)}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead .meta{flex:1}
.qnum{flex:none;background:var(--blue);color:#fff;font-weight:800;font-size:12.5px;padding:3px 10px;border-radius:20px;line-height:1.35;white-space:nowrap}
.star{cursor:pointer;background:none;border:none;font-size:24px;line-height:1;padding:0;color:#cfd8e3;flex:none;transition:.12s}
.star:hover{transform:scale(1.15)}
.star.on{color:#f1c40f}
.preg{font-weight:600;font-size:17px;margin-bottom:12px}
/* palabra clave resaltada en enunciados/opciones */
.kw{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:#1a2b3c}
.opt{border:1px solid #d8e0ea;border-radius:9px;padding:10px 12px;margin:7px 0;cursor:pointer;
     background:#f7fafd;transition:.12s;font-size:15.5px}
.opt:hover{border-color:var(--blue)}
.opt b{margin-right:6px}
.opt.ok{background:#e8f7ec;border-left:4px solid var(--green)}
.opt.no{background:#fdecea;border-left:4px solid var(--red);opacity:.9}
.opt.mine{box-shadow:0 0 0 2px var(--blue) inset}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;margin-left:8px;
     vertical-align:middle;text-transform:uppercase;letter-spacing:.3px}
.tag.you{background:var(--blue);color:#fff}
.tag.cor{background:var(--green);color:#fff}
.hint{font-size:13px;color:#8a98a8;margin-top:6px;font-style:italic}
.resp{margin-top:14px;display:none}
.resp.show{display:block}
.razon{font-size:14.5px;color:#33485c;margin:5px 0 5px 4px}
.reveal-words{margin:2px 0 12px 0;background:#fff;color:var(--blue);border:1px solid var(--blue);
     padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.reveal-words:hover{background:#e8f1fb}
/* oclusión cloze: barra que tapa la palabra clave hasta hacer click */
.cloze{background:#33485c;color:transparent;border-radius:4px;padding:0 3px;cursor:pointer;
       user-select:none;transition:.12s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cloze::selection{color:transparent;background:#33485c}
.cloze:hover{background:#27425e}
.cloze.revealed{background:#fff3cd;color:#7a5b00;font-weight:700;cursor:default}
.cloze.revealed::selection{color:#7a5b00;background:#ffe08a}
</style></head><body>
<header><div class="bar">
  <h1>🔬 Banco Organografía · Recuperación</h1>
  <label>Examen:
    <select id="examen"><option value="">Todos</option></select>
  </label>
  <label>Tema:
    <select id="filtro"><option value="">Todos</option></select>
  </label>
  <label>Frecuencia:
    <select id="frec">
      <option value="">Todas</option>
      <option value="alta">⭐ Solo alta frecuencia</option>
    </select>
  </label>
  <label>Mis marcadas:
    <select id="marc">
      <option value="">Todas</option>
      <option value="si">🌟 Solo mis marcadas</option>
    </select>
  </label>
  <label>Orden:
    <select id="orden">
      <option value="orig">Original</option>
      <option value="rand">🔀 Aleatorio</option>
    </select>
  </label>
  <button id="reshuffle" class="reshuffle" style="display:none">🔀 Barajar</button>
  <span class="count" id="count"></span>
  <span class="pos" id="pos"></span>
</div></header>
<main id="app"></main>
<script>
const DATA = [{"id": "org1p-001", "tema": "Cor", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "En relació amb el cor, una de les següents respostes NO és correcta:", "opciones": {"a": "Les vàlvules auriculoventriculars són més primes que les arterials.", "b": "Les vàlvules cardíaques estan revestides per endocardi.", "c": "Les fibres elàstiques del miocardi de les aurícules són poc abundants en comparació amb les del miocardi dels ventricles.", "d": "El miocardi és més gruixut en els ventricles que en les aurícules."}, "correcta": "c", "razones": {"a": "Cierta: las válvulas AV (mitral/tricúspide) son efectivamente {{más primes}} que las semilunares arteriales, que soportan presiones mayores.", "b": "Cierta: todas las válvulas cardíacas están tapizadas por **endocardi** (endotelio + capa subendotelial).", "c": "FALSA (la que hay que marcar): es justo al revés. Las fibras elásticas son {{más abundantes en las aurícules}} que en los ventrículos; la aurícula tiene una red elástica más rica.", "d": "Cierta: el miocardio ventricular es mucho más {{gruixut}}, sobre todo el del ventrículo izquierdo."}, "_k": "org1p-001:2900994893", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-002", "tema": "Cor", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (sistema de conducción)", "enunciado": "En relació amb el sistema de conducció cardíaca, una de les següents afirmacions NO és certa:", "opciones": {"a": "Les fibres de Purkinje estan distribuïdes en la capa subendocàrdica dels ventricles.", "b": "Les fibres nodals presenten escasses miofibril·les.", "c": "Les fibres de Purkinje són riques en mitocòndries.", "d": "Les fibres de Purkinje estan unides entre si per nombroses discos intercalars."}, "correcta": "c", "razones": {"a": "Cierta: las fibras de Purkinje se sitúan en la capa {{subendocàrdica}} de los ventrículos.", "b": "Cierta: las fibras **nodals** (nódulo sinusal/AV) tienen {{escasses}} miofibrillas, son células pequeñas y poco contráctiles.", "c": "FALSA (la que hay que marcar): las fibras de Purkinje son pobres en mitocondrias y ricas en {{glucogen}} (metabolismo glucolítico); las pocas miofibrillas se sitúan periféricas. No destacan por mitocondrias.", "d": "Cierta: las fibras de Purkinje se unen entre sí por numerosos {{discos intercalars}} (son cardiomiocitos modificados)."}, "_k": "org1p-002:2003312130", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-003", "tema": "Vasos", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relació amb els nervis vasomotors simpàtics que innerven els vasos sanguinis, NO és cert que:", "opciones": {"a": "Són postganglionars.", "b": "Generalment provoquen vasodilatació.", "c": "Són més abundants en les artèries que en les venes.", "d": "El seu neurotransmissor és la noradrenalina."}, "correcta": "b", "razones": {"a": "Cierta: los nervios vasomotores simpáticos son fibras {{postganglionars}}.", "b": "FALSA (la que hay que marcar): el simpático vasomotor genera principalmente {{vasoconstricció}} (vía receptores alfa-adrenérgicos), no vasodilatación.", "c": "Cierta: son más densos en las **artèries** que en las venes.", "d": "Cierta: su neurotransmisor es la {{noradrenalina}}."}, "_k": "org1p-003:2964769544", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-004", "tema": "Vasos", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Dels diferents tipus arterials que es citen a continuació, en quin NO es troba làmina elàstica interna?", "opciones": {"a": "Artèries elàstiques.", "b": "Artèries musculars.", "c": "Arterioles.", "d": "Metarterioles."}, "correcta": "d", "razones": {"a": "Tiene LEI (aunque enmascarada entre las múltiples láminas elásticas de la media de las arterias elásticas).", "b": "La **arteria muscular** tiene una LEI muy prominente y bien definida (su rasgo identificador).", "c": "Las arteriolas aún conservan una LEI fenestrada delgada.", "d": "CORRECTA (donde NO hay): las {{metarterioles}} ya carecen de lámina elástica interna; solo tienen endotelio y células musculares lisas dispersas (esfínteres precapilares)."}, "_k": "org1p-004:2118290580", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-005", "tema": "Vasos", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "No és una característica pròpia dels capil·lars fenestrats:", "opciones": {"a": "Presentar en les cèl·lules endotelials fenestracions tancades per diafragmes amb un gruix similar al de la membrana plasmàtica.", "b": "Presentar una làmina basal contínua.", "c": "Presentar pericits formant part de la seva paret.", "d": "Tenir cèl·lules endotelials unides entre si mitjançant unions oclusives."}, "correcta": "a", "razones": {"a": "FALSA (la que hay que marcar): los diafragmas que cierran las fenestraciones son {{mucho más finos}} que la membrana plasmática (no de grosor similar); el diafragma fenestral es una estructura tenue. Ojo: hay fenestrados sin diafragma (glomérulo renal).", "b": "Cierta: el capilar fenestrado tiene lámina basal {{contínua}} (a diferencia del sinusoide).", "c": "Cierta: los **pericits** acompañan a estos capilares.", "d": "Cierta: las células endoteliales se unen por {{unions oclusives}} (zonulae occludentes)."}, "_k": "org1p-005:105464928", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-006", "tema": "Respiratorio", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 (Q4)", "enunciado": "En relació amb les cèl·lules olfactòries, una de les següents afirmacions NO és certa:", "opciones": {"a": "Són neurones bipolars.", "b": "Les prolongacions apicals d'aquestes cèl·lules constitueixen els filaments olfactoris.", "c": "Tenen cilis immòbils immersos en una pel·lícula líquida.", "d": "Tenen nuclis arrodonits que es disposen centralment en la cèl·lula."}, "correcta": "b", "razones": {"a": "Cierta: la célula olfatoria es una neurona {{bipolar}}.", "b": "FALSA (la que hay que marcar): los **filaments olfactoris** son los {{axons}} basales (prolongación basal) que atraviesan la lámina cribosa, NO las prolongaciones apicales. La parte apical forma la vesícula olfatoria con cilios.", "c": "Cierta: presenta cilios {{immòbils}} sumergidos en la película de moco donde se disuelven los odorantes.", "d": "Cierta: el núcleo redondeado se sitúa en posición {{central}} del cuerpo celular."}, "_k": "org1p-006:2477669248", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-007", "tema": "Respiratorio", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "De les regions de la faringe que es citen a continuació, quina o quines es troben revestides per un epiteli respiratori?", "opciones": {"a": "Paret posterior de la nasofaringe.", "b": "Parets laterals de la nasofaringe.", "c": "Orofaringe.", "d": "Laringofaringe."}, "correcta": "b", "razones": {"a": "La pared posterior de la nasofaringe, por el roce con el paladar blando, suele revestirse de epitelio {{pla estratificat}} (no respiratorio).", "b": "CORRECTA: las **parets laterals de la nasofaringe** conservan el epitelio {{respiratori}} (cilíndrico pseudoestratificado ciliado), porque no sufren roce mecánico.", "c": "La orofaringe es de epitelio {{pla estratificat no queratinitzat}} (zona de paso de alimento).", "d": "La laringofaringe también es de epitelio {{pla estratificat}}."}, "_k": "org1p-007:2480428215", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-008", "tema": "Respiratorio", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (epitelios laringe)", "enunciado": "En quina o quines de les següents regions de la laringe trobem epiteli pla estratificat no queratinitzat:", "opciones": {"a": "Cordes vocals.", "b": "Una porció de la cara dorsal de l'epiglotis.", "c": "Cara anterior de l'epiglotis.", "d": "En totes les anteriors."}, "correcta": "d", "razones": {"a": "Las **cuerdas vocales verdaderas** están revestidas por epitelio {{pla estratificat no queratinitzat}} (sometidas a roce/vibración).", "b": "Parte de la cara dorsal (posterior) de la epiglotis también lleva epitelio {{pla estratificat}}, aunque la base puede ser respiratorio.", "c": "La cara anterior (lingual) de la epiglotis es plano estratificado no queratinizado.", "d": "CORRECTA: en {{todas}} las regiones citadas hay epitelio plano estratificado no queratinizado."}, "_k": "org1p-008:702479617", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-009", "tema": "Respiratorio", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (cels Club, bronquios)", "enunciado": "De les afirmacions que es citen a continuació una NO és correcta:", "opciones": {"a": "La submucosa dels bronquis intrapulmonars conté abundants glàndules mucoses i mucoseroses.", "b": "Les cèl·lules clara/Club contenen abundants cossos multilaminars d'aspecte electrodens.", "c": "En els bronquis de petit calibre (abans d'arribar als bronquíols) l'epiteli de revestiment és del tipus simple cúbic baix amb cèl·lules ciliades.", "d": "En l'epiteli dels bronquíols terminals no trobem cèl·lules caliciformes."}, "correcta": "b", "razones": {"a": "Cierta: los bronquios intrapulmonares tienen glándulas {{seromucoses}} en la submucosa.", "b": "FALSA (la que hay que marcar): los **cuerpos multilaminares** electrodensos (surfactante) son típicos de los {{neumòcits tipus II}}, NO de las células Club. La célula Club tiene gránulos secretores electrodensos pero NO cuerpos multilaminares laminados.", "c": "Cierta: los bronquios pequeños tienen epitelio {{cúbic simple}} ciliado, más bajo que los grandes.", "d": "Cierta: en el bronquíolo terminal ya {{no hay}} células caliciformes (desaparecen al avanzar)."}, "_k": "org1p-009:1091449265", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-010", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relació amb els botons o corpuscles gustatius una de les següents afirmacions és certa:", "opciones": {"a": "Es localitzen exclusivament en la mucosa de la llengua.", "b": "Es localitzen en les diferents regions de la llengua on es perceben els diferents sabors, són diferents des del punt de vista estructural.", "c": "El seu tipus cel·lular més abundant és la cèl·lula de suport.", "d": "Les cèl·lules neuroepitelials dels botons localitzats en una regió concreta de la llengua presenten només un tipus de receptor per la sensació gustativa específica."}, "correcta": "c", "razones": {"a": "Falsa: también hay corpúsculos gustativos en {{paladar blando, epiglotis y faringe}}, no solo en la lengua.", "b": "Falsa: los botones son {{estructuralment iguals}} en todas las regiones; no difieren morfológicamente según el sabor.", "c": "CORRECTA: el tipo celular más abundante del botón gustativo es la {{cèl·lula de suport}} (sustentacular, tipo I).", "d": "Falsa: una misma célula neuroepitelial puede responder a {{varios}} sabores; no hay especialización regional estricta por un solo receptor."}, "_k": "org1p-010:4108088893", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-011", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2020-21 (Examen C Q1)", "enunciado": "Referent a la glàndula sublingual, un dels següents enunciats NO és correcte:", "opciones": {"a": "És una glàndula de secreció principalment serosa en l'home.", "b": "Les seves secrecions són alliberades directament al terra de la boca o bé als conductes excretors de la glàndula submaxil·lar.", "c": "No té conductes intercalars.", "d": "No presenta una càpsula de teixit conjuntiu ben definida."}, "correcta": "a", "razones": {"a": "FALSA (la que hay que marcar): la sublingual es mixta pero predominantemente {{mucosa}} (no serosa). La parótida es serosa pura; la submaxilar es mixta de predominio seroso.", "b": "Cierta: vierte por múltiples conductos pequeños al suelo de la boca o al conducto de Wharton (submaxilar).", "c": "Cierta: prácticamente {{carece}} de conductos intercalares y estriados desarrollados.", "d": "Cierta: no tiene una cápsula conjuntiva bien definida (a diferencia de parótida/submaxilar)."}, "_k": "org1p-011:227867111", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-012", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (origen del esmalte)", "enunciado": "De les parts de les dents que es citen a continuació, quina té un origen ectodèrmic:", "opciones": {"a": "Esmalt.", "b": "Dentina.", "c": "Ciment.", "d": "Membrana periodontal."}, "correcta": "a", "razones": {"a": "CORRECTA: el **esmalt** lo producen los ameloblastos, derivados del {{ectoderma}} (órgano del esmalte). Es el único tejido dental de origen ectodérmico.", "b": "La dentina la forman los odontoblastos, de origen {{mesenquimàtic}} (cresta neural/ectomesénquima).", "c": "El cemento es de origen {{mesenquimàtic}} (cementoblastos).", "d": "La membrana periodontal es conjuntiva, de origen {{mesenquimàtic}}."}, "_k": "org1p-012:3457659145", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-013", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relació amb la faringe, quina de les següents afirmacions NO és correcta:", "opciones": {"a": "El seu epiteli de revestiment és del tipus pla estratificat no queratinitzat.", "b": "Les fibres elàstiques són escasses en la seva paret.", "c": "La capa muscular està constituïda per fibres musculars estriades esquelètiques.", "d": "La submucosa no es troba en totes les regions de la seva paret."}, "correcta": "b", "razones": {"a": "Cierta (para oro/laringofaringe): epitelio {{pla estratificat no queratinitzat}} (la nasofaringe es respiratorio).", "b": "FALSA (la que hay que marcar): las fibras elásticas son {{abundants}} en la pared de la faringe (forman una capa fibroelástica que sustituye a la submucosa en muchas zonas), no escasas.", "c": "Cierta: la musculatura faríngea es {{estriada esquelètica}} (constrictores).", "d": "Cierta: la submucosa solo está bien definida en algunas regiones (no en toda la pared)."}, "_k": "org1p-013:2948863907", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-014", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2022-23 2P", "enunciado": "En relació amb l'esòfag humà NO és cert:", "opciones": {"a": "La presència de material limfoide en la seva làmina pròpia només té lloc en situacions d'infecció o inflamació.", "b": "Anatòmicament, l'esfínter esofàgic superior està constituït pel múscul cricofaringi.", "c": "Les glàndules esofàgiques pròpies estan constituïdes per cèl·lules mucoses i seroses.", "d": "La capa muscular del terç mig de l'esòfag està constituïda exclusivament per fibres musculars llises."}, "correcta": "d", "razones": {"a": "Cierta (matiz del profesor): el tejido linfoide en la lámina propia esofágica es escaso y se asocia sobre todo a glándulas/inflamación.", "b": "Cierta: el **esfínter esofágico superior** es el músculo {{cricofaringi}} (estriado).", "c": "Cierta: las glándulas esofágicas propias (submucosa) son {{seromucoses}}.", "d": "FALSA (la que hay que marcar): el tercio medio del esófago tiene una {{mezcla}} de fibras estriadas y lisas (transición), no exclusivamente lisas. El tercio superior es estriado; el inferior, liso."}, "_k": "org1p-014:812665766", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-015", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "De les cèl·lules que es citen a continuació, quines són les menys abundants en les glàndules pilòriques de l'estómac:", "opciones": {"a": "Cèl·lules mucoses.", "b": "Cèl·lules endocrines.", "c": "Cèl·lules oxíntiques o parietals.", "d": "Cèl·lules mare."}, "correcta": "c", "razones": {"a": "Las glándulas pilóricas son predominantemente {{mucoses}} (abundantes).", "b": "Hay células endocrinas relativamente abundantes en el píloro (células G de gastrina).", "c": "CORRECTA (las menos abundantes): las **cèl·lules oxíntiques/parietals** son escasas o casi ausentes en las glándulas {{pilòriques}} (abundan en cuerpo/fundus).", "d": "Las células madre están presentes en el cuello (renovación constante)."}, "_k": "org1p-015:4289233785", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-016", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2020-21 (Q6), 2021-22 (Q7)", "enunciado": "En relació amb les cèl·lules oxíntiques en activitat de les glàndules gàstriques, NO és cert que:", "opciones": {"a": "Tenen unes invaginacions profundes de la membrana plasmàtica que formen canalicles intracel·lulars molt desenvolupats.", "b": "Tenen abundants túbuls i vesícules que constitueixen un sistema molt desenvolupat.", "c": "Tenen abundants mitocondris.", "d": "Tenen nombroses microvellositats projectades a la llum dels canalicles."}, "correcta": "b", "razones": {"a": "Cierta: en actividad presentan canalículos intracelulares {{molt desenvolupats}}.", "b": "FALSA (la que hay que marcar): el **sistema tubulovesicular** está muy desarrollado en la célula oxíntica en {{reposo}}; cuando se activa, esas vesículas se fusionan con la membrana del canalículo para formar microvellosidades (el tubulovesicular {{disminuye}}, no abunda).", "c": "Cierta: la oxíntica es muy rica en {{mitocondris}} (alta demanda energética para la bomba H+/K+).", "d": "Cierta: en actividad proyecta numerosas {{microvellositats}} a la luz de los canalículos."}, "_k": "org1p-016:3575824239", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-017", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "No és una característica pròpia de les cèl·lules mucoses de superfície de l'estómac:", "opciones": {"a": "Presentar microvellositats curtes i granulars.", "b": "Tenir un aparell de Golgi poc desenvolupat.", "c": "Presentar complexos d'unió en les cares laterals.", "d": "Tenir abundants grànuls esfèrics electrodensos en la porció apical del citoplasma."}, "correcta": "b", "razones": {"a": "Cierta: tienen microvellosidades cortas apicales.", "b": "FALSA (la que hay que marcar): la célula mucosa de superficie es muy secretora, por lo que tiene un aparato de **Golgi** {{bien desarrollado}} (supranuclear), no escaso.", "c": "Cierta: presentan complejos de unión laterales (barrera epitelial).", "d": "Cierta: acumulan gránulos de {{mucinógeno}} apicales (en H-E se ven claros, pero ultraestructuralmente densos)."}, "_k": "org1p-017:2573696194", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-018", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En la regió del coll de l'estómac, quin és el lloc de predomini de les cèl·lules mare?", "opciones": {"a": "Criptes gàstriques.", "b": "Istme de les glàndules.", "c": "Coll de les glàndules.", "d": "Base de les glàndules."}, "correcta": "b", "razones": {"a": "Las criptas/foveolas son la desembocadura, no la zona de células madre.", "b": "CORRECTA: las **cèl·lules mare** predominan en el {{istme}} de las glándulas gástricas (zona de proliferación), desde donde migran hacia arriba (foveola) y abajo (cuerpo).", "c": "El cuello aloja sobre todo células mucosas del cuello, no el grueso de las madre.", "d": "La base aloja células principales (zimógenas), no las madre."}, "_k": "org1p-018:3767187289", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-019", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2014-15 (Q6)", "enunciado": "NO és una característica de les cèl·lules de Paneth:", "opciones": {"a": "Tenir una forma piramidal.", "b": "Tenyir-se molt bé amb colorants bàsics.", "c": "Presentar un complex de Golgi ben desenvolupat.", "d": "Ser una població molt estable amb escàs renovat."}, "correcta": "b", "razones": {"a": "Cierta: la célula de Paneth tiene forma {{piramidal}}, en la base de las criptas de Lieberkühn.", "b": "FALSA (la que hay que marcar): los gránulos de Paneth (lisozima, defensinas) son {{eosinòfils/acidòfils}} — se tiñen muy bien con colorantes ÁCIDOS (eosina), NO con básicos. Ojo: el citoplasma basal sí es basófilo, pero el rasgo distintivo son los gránulos apicales eosinófilos.", "c": "Cierta: tienen un **Golgi** {{ben desenvolupat}} y RER abundante (célula secretora de proteínas).", "d": "Cierta (criterio del profesor): se consideran una población {{estable}} con escasa renovación."}, "_k": "org1p-019:2132817582", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-020", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida TODOS los años (intestino delgado)", "enunciado": "De les següents afirmacions referents a l'intestí prim NO és certa:", "opciones": {"a": "(il·legible parcial)", "b": "Les vellositats intestinals mostren el seu màxim desenvolupament en la porció final de l'ili.", "c": "Les cèl·lules de Paneth es consideren una població cel·lular molt estable amb un grau molt petit de renovació cel·lular.", "d": "Els nòduls limfoides presents en la làmina pròpia de l'intestí prim són més nombrosos i grans a nivell de l'ili."}, "correcta": "b", "razones": {"a": "Opción ilegible en la transcripción; no valorable.", "b": "FALSA (la que hay que marcar): las **vellositats** muestran su máximo desarrollo en el {{duodè/jejú}}, no al final del íleon. En el íleon las vellosidades son más cortas y escasas. (Cruzado con la clave de 2014-15 Q9 y 2020-21 Q5: la afirmación de máximo desarrollo de vellosidades en íleon es la falsa).", "c": "Cierta (criterio del profesor): Paneth = población {{estable}}.", "d": "Cierta: los **nódulos linfoides** (placas de Peyer) son más grandes y numerosos en el {{ili}}."}, "_k": "org1p-020:3232109342", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-021", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "De les porcions de l'intestí prim que es citen a continuació, quina es troba envoltada completament per peritoneu?", "opciones": {"a": "1a porció del duodè.", "b": "4a porció.", "c": "Jejú.", "d": "La A) i la C) són certes."}, "correcta": "d", "razones": {"a": "Cierta: la **1ª porción del duodeno** (bulbo duodenal) es {{intraperitoneal}} (móvil), a diferencia de las porciones 2ª-3ª-4ª que son retroperitoneales.", "b": "La 4ª porción del duodeno es {{retroperitoneal}}, no rodeada completamente.", "c": "Cierta: el **jejú** es intraperitoneal, suspendido por el mesenterio.", "d": "CORRECTA: están completamente rodeadas por peritoneo tanto la {{1ª del duodeno}} como el {{jejú}}.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-021:2560412496", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-022", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "Dels diferents tipus de cèl·lules endocrines que es citen a continuació, quins es troben presents en l'intestí prim?", "opciones": {"a": "Cèl·lules secretores de secretina.", "b": "Cèl·lules secretores de motilina.", "c": "Cèl·lules secretores de (il·legible).", "d": "Totes les anteriors."}, "correcta": "d", "razones": {"a": "Cierta: las células S secretoras de {{secretina}} están en el intestino delgado (duodeno/yeyuno).", "b": "Cierta: las células M secretoras de {{motilina}} están en intestino delgado.", "c": "Opción ilegible, pero presumiblemente otra hormona enteroendocrina (CCK/GIP) también presente.", "d": "CORRECTA: el intestino delgado contiene un repertorio amplio de células enteroendocrinas → {{totes}} las citadas.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-022:3598584565", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-023", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "NO és una característica pròpia de l'apèndix:", "opciones": {"a": "Glàndules escasses i irregulars.", "b": "Cèl·lules caliciformes poc nombroses.", "c": "Absència de cèl·lules de Paneth.", "d": "Gran quantitat de nòduls limfoides en la làmina pròpia."}, "correcta": "c", "razones": {"a": "Cierta: en el apéndice las glándulas (criptas) son {{escasses i irregulars}}, desplazadas por el tejido linfoide.", "b": "Cierta: las células caliciformes son {{poco abundantes}} respecto al colon.", "c": "FALSA (la que hay que marcar): el apéndice SÍ tiene **cèl·lules de Paneth** en el fondo de sus criptas; no hay ausencia.", "d": "Cierta: el rasgo dominante del apéndice es la {{gran cantidad de nódulos linfoides}} (anillo linfoide en la lámina propia/submucosa)."}, "_k": "org1p-023:3822064803", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-024", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2020-21 (Q7), 2021-22, 2022-23 2P", "enunciado": "Referent al fetge, és cert que:", "opciones": {"a": "Els sinusoides hepàtics no es troben recoberts directament sobre els cordons d'hepatòcits.", "b": "Més del 50% dels hepatòcits presenten diploïdia.", "c": "La disposició radial dels cordons hepàtics al voltant d'una vena central és la base del lòbul portal.", "d": "Els conductes de Hering estan constituïts per cèl·lules de dos hepatòcits adjacents."}, "correcta": "a", "razones": {"a": "CIERTA (la correcta): entre el sinusoide y el hepatocito hay el {{espacio de Disse}}; el endotelio sinusoidal NO se apoya directamente sobre el cordón de hepatocitos (queda separado por Disse y las microvellosidades).", "b": "Falsa: más del 50% de los hepatocitos son {{poliploides/binucleados}}, no diploides; la poliploidía es característica del hígado.", "c": "Falsa: la disposición radial de cordones alrededor de una {{vena central}} define el LOBULILLO clásico, NO el lóbulo portal (cuyo eje es el espacio porta).", "d": "Falsa: los **conductos de Hering** (colangiolos) están formados por hepatocitos Y {{colangiocitos}} (células ductales cúbicas), marcando la transición canalículo→conductillo; no por dos hepatocitos."}, "_k": "org1p-024:3494188865", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-025", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (citoesqueleto eritrocito)", "enunciado": "De les proteïnes que es citen a continuació i que formen part del citoesquelet de l'eritròcit, quina constitueix l'estructura en malla hexagonal característica d'aquest tipus de cèl·lula?", "opciones": {"a": "Espectrina.", "b": "Anquirina.", "c": "Proteïna banda 3.", "d": "Cap de les anteriors."}, "correcta": "a", "razones": {"a": "CORRECTA: la **espectrina** (tetrámeros α-β) forma la malla {{hexagonal}} del citoesqueleto subcortical del eritrocito, que le da forma de disco bicóncavo y deformabilidad.", "b": "La **anquirina** es proteína de {{anclaje}}: une el espectrina a la banda 3, pero no forma la malla.", "c": "La **banda 3** es un transportador transmembrana (intercambiador Cl-/HCO3-) y punto de anclaje, no la malla.", "d": "Incorrecta: sí hay una (la espectrina)."}, "_k": "org1p-025:1538484701", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-026", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (eosinófilo MBP)", "enunciado": "En relació amb els grànuls específics dels eosinòfils, quin dels següents elements està contingut en l'interior de la seva regió interna (cristal·loide)?", "opciones": {"a": "Enzims hidrolítics.", "b": "Proteïna bàsica major o principal (MBP).", "c": "Histamina.", "d": "Peroxidasa."}, "correcta": "b", "razones": {"a": "Las enzimas hidrolíticas (fosfatasa, arilsulfatasa) están en la matriz o en gránulos azurófilos, no en el núcleo cristaloide.", "b": "CORRECTA: la **proteína básica mayor (MBP)** forma el núcleo {{cristal·loide}} (internum) del gránulo específico del eosinófilo; es la responsable de su acción contra parásitos.", "c": "La **histamina** es propia del {{basòfil}}/mastocito, no del cristaloide eosinófilo.", "d": "La peroxidasa eosinofílica está en la {{matriz}} (externum) del gránulo, no en el cristaloide."}, "_k": "org1p-026:2550942585", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-027", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (granulopoyesis)", "enunciado": "En el procés de la granulopoesi, a quin dels següents tipus cel·lulars dóna lloc el mieloblast?", "opciones": {"a": "Metamielòcit eosinòfil.", "b": "Metamielòcit.", "c": "Promielòcit.", "d": "Cèl·lules en banda."}, "correcta": "c", "razones": {"a": "El metamielocito está varios pasos por debajo (mieloblasto→promielocito→mielocito→metamielocito).", "b": "Igual: el metamielocito no es el descendiente inmediato.", "c": "CORRECTA: la secuencia es {{mieloblast → promielòcit}} → mielocito → metamielocito → cayado/banda → segmentado. El descendiente directo del mieloblasto es el **promielòcit**.", "d": "La célula en banda (cayado) es estadio tardío, no inmediato."}, "_k": "org1p-027:2187122898", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-028", "tema": "Inmune", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (corpúsculo de Hassall)", "enunciado": "En relació amb el corpuscle de Hassall, quina és l'afirmació correcta?", "opciones": {"a": "Es troba a l'escorça del timus.", "b": "Es troba a la medul·la del timus.", "c": "Està format per cèl·lules epitelio-reticulars tipus III.", "d": "Forma part de la barrera hemato-tímica."}, "correcta": "b", "razones": {"a": "Falsa: NO está en la corteza.", "b": "CORRECTA: el **corpúsculo de Hassall** se localiza en la {{medul·la}} del timo; es un acúmulo concéntrico de células epitelio-reticulares queratinizadas (tipo VI).", "c": "Falsa: lo forman células epitelio-reticulares {{tipus VI}} (no tipo III). Las tipo III están en la unión cortico-medular.", "d": "Falsa: la {{barrera hemato-tímica}} está en la corteza (epiteliorreticulares tipo I + endotelio), no en Hassall."}, "_k": "org1p-028:3624913416", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-029", "tema": "Inmune", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Concepto repetido (HEV)", "enunciado": "Els capil·lars amb l'endoteli alt (HEV) els trobem:", "opciones": {"a": "A l'escorça del gangli limfàtic.", "b": "En cordons medul·lars al gangli limfàtic.", "c": "En la polpa blanca de la melsa.", "d": "En la polpa vermella de la melsa."}, "correcta": "a", "razones": {"a": "CORRECTA: las **vénulas de endotelio alto (HEV)** están en la {{escorça}} (paracorteza, zona T) del ganglio linfático; es la puerta de entrada de los linfocitos desde la sangre.", "b": "Falsa: los cordones medulares no contienen HEV.", "c": "Falsa: la pulpa blanca esplénica no tiene HEV (en el bazo el tráfico es por la zona marginal).", "d": "Falsa: la pulpa roja tiene sinusoides, no HEV."}, "_k": "org1p-029:422015921", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-030", "tema": "Inmune", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 1P (Q28)", "enunciado": "Els limfòcits B estan àmpliament distribuïts en zones com:", "opciones": {"a": "La beina limfàtica periarteriolar (PALS) a la melsa.", "b": "Escorça del timus.", "c": "Medul·la del timus.", "d": "Centre germinatiu dels nòduls limfàtics."}, "correcta": "d", "razones": {"a": "Falsa: la **PALS** esplénica es zona de linfocitos {{T}}, no B.", "b": "Falsa: la corteza tímica está poblada por linfocitos {{T}} en maduración.", "c": "Falsa: la médula tímica también es de linaje {{T}} (T maduros).", "d": "CORRECTA: el **centro germinal** de los nódulos linfáticos es zona de linfocitos {{B}} (proliferación/maduración de B). Cruzado con clave 2022-23 1P Q28 (respuesta A en ese modelo = centro germinal)."}, "_k": "org1p-030:2102873185", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-031", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "IMATGE 1. Secció histològica de dent de mamífer (H-E). A quina formació correspon la que indica la fletxa?", "opciones": {"a": "Os alveolar.", "b": "Ciment.", "c": "Membrana periodontal.", "d": "Cambra polpar."}, "correcta": "c", "razones": {"a": "El hueso alveolar es trabecular, con osteocitos en lagunas; no es el espacio fibroso señalado.", "b": "El **cemento** es una capa fina basófila adosada a la dentina de la raíz; no el espacio entre diente y hueso.", "c": "CORRECTA (criterio): la **membrana periodontal** (ligamento periodontal) es el {{espacio conjuntivo fibroso}} entre el cemento y el hueso alveolar, con fibras de colágeno (Sharpey) que cruzan oblicuas. Si la flecha apunta a ese tejido conjuntivo intermedio → periodontal.", "d": "La cámara pulpar es el centro de la dentina, con tejido conjuntivo laxo muy celular; no encaja con una formación periférica.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-031:1374174129", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-032", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "IMATGE 2. Secció d'estómac (H-E). A quina capa de la paret correspon l'assenyalada amb la fletxa?", "opciones": {"a": "Epiteli.", "b": "Làmina pròpia.", "c": "Submucosa.", "d": "Muscularis mucosae."}, "correcta": "d", "razones": {"a": "El epitelio es la capa superficial cilíndrica que tapiza la luz y las foveolas.", "b": "La lámina propia es el conjuntivo entre las glándulas gástricas.", "c": "La submucosa es el conjuntivo laxo por debajo de la muscular de la mucosa, con vasos grandes.", "d": "Si la flecha señala la fina banda de músculo liso que separa la mucosa glandular de la submucosa → **muscularis mucosae** {{(banda muscular lisa al pie de las glándulas)}}. Criterio: banda eosinófila estrecha de fibras musculares lisas bajo las glándulas.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-032:2108762014", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-033", "tema": "Vasos", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (paquete vasculonervioso)", "enunciado": "IMATGE 3. Paquet vasculonerviós (H-E). A quina formació correspon el que assenyala la fletxa?", "opciones": {"a": "Vena mitjana.", "b": "Artèria muscular.", "c": "Arteriola.", "d": "Cap dels anteriors."}, "correcta": "b", "razones": {"a": "La **vena mediana** tiene pared fina, luz amplia e irregular (a menudo colapsada), poca media muscular.", "b": "CORRECTA (criterio típico): la **artèria muscular** muestra luz redonda, pared gruesa con media muscular concéntrica y, sobre todo, una {{lámina elàstica interna}} ondulada y bien visible bajo el endotelio. Es el criterio diferencial clave en estas imágenes.", "c": "La arteriola es de pequeño calibre (1-2 capas de músculo); demasiado pequeña para ser el vaso principal del paquete.", "d": "Incorrecta si hay una arteria muscular identificable.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-033:3037904244", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-034", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "IMATGE 4. Microfotografia de microscopi electrònic de transmissió (MET). A quin element correspon?", "opciones": {"a": "Conducte de Hering.", "b": "Capil·lar.", "c": "Arteriola.", "d": "Bronquíol terminal."}, "correcta": "b", "razones": {"a": "El conducto de Hering al MET mostraría unión de hepatocito con colangiocito cúbico.", "b": "Por defecto, un único tubo endotelial pequeño con luz que contiene un eritrocito y una sola célula endotelial rodeada de lámina basal → **capil·lar** {{(endotelio + lámina basal, sin capa muscular)}}. Criterio MET: pared delgadísima, una capa de endotelio, posibles fenestraciones/pericito.", "c": "La arteriola tendría 1-2 capas de músculo liso alrededor del endotelio.", "d": "El bronquíolo terminal mostraría epitelio cúbico con células Club.", "confianza": "baja"}, "confianza": "baja", "_k": "org1p-034:1023053471", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-035", "tema": "Respiratorio", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (pulmón)", "enunciado": "IMATGE 5. Preparació de pulmó humà (H-E): septes interalveolars amb nombroses cèl·lules arrodonides (fletxes). Quines cèl·lules són?", "opciones": {"a": "Fibroblasts.", "b": "Macròfags.", "c": "Pneumòcits tipus 2.", "d": "Cèl·lules plasmàtiques."}, "correcta": "b", "razones": {"a": "Los fibroblastos son fusiformes, no redondeados.", "b": "CORRECTA (criterio): células redondeadas, libres, con citoplasma a veces pigmentado (antracótico) en la luz alveolar o el septo → **macròfags alveolars** (células del polvo). {{Redondas, con pigmento, a menudo en la luz}}.", "c": "Los **neumocitos tipo II** son cuboideos y están en el ÁNGULO del septo, no dispersos como células redondas libres; suelen ser pocos.", "d": "Las células plasmáticas (núcleo en rueda de carro) son raras en septos normales.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-035:2331075435", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-036", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "IMATGE 6. Imatge d'un epiteli (H-E). A què correspon?", "opciones": {"a": "Estómac.", "b": "Tràquea.", "c": "Vesícula biliar.", "d": "Intestí gros."}, "correcta": "c", "razones": {"a": "El estómago tiene epitelio cilíndrico simple mucoso con foveolas.", "b": "La tráquea es cilíndrico pseudoestratificado ciliado con caliciformes.", "c": "Si se ve un epitelio cilíndrico simple alto, sin caliciformes ni cilios, con pliegues mucosos altos y ramificados (sin glándulas en la mucosa) → **vesícula biliar** {{(cilíndrico simple absortivo, pliegues laberínticos)}}.", "d": "El intestino grueso tiene criptas rectas con abundantes caliciformes.", "confianza": "baja"}, "confianza": "baja", "_k": "org1p-036:3260286942", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-037", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar porción del tubo digestivo)", "enunciado": "IMATGE 14. A quina porció del tub digestiu correspon (fixa't en la mucosa)?", "opciones": {"a": "Intestí gros.", "b": "Intestí prim.", "c": "Estómac (fundus).", "d": "Estómac (càrdies)."}, "correcta": "a", "razones": {"a": "Si la mucosa muestra criptas rectas y profundas, SIN vellosidades y con MUCHAS células caliciformes → **intestí gros** {{(superficie plana, sin vellosidades, criptas rectas, caliciformes abundantes)}}.", "b": "El intestino delgado tendría {{vellosidades}} digitiformes (ausentes en grueso).", "c": "El fundus gástrico tiene glándulas gástricas con parietales/principales.", "d": "El cardias tiene glándulas mucosas cortas y tortuosas.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-037:2225105547", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org2p-001", "tema": "Piel", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (estratos epidermis)", "enunciado": "IMATGE 15. Secció histològica de pell. A quina capa correspon el que indica la fletxa?", "opciones": {"a": "Estrat espinós.", "b": "Estrat germinatiu o basal.", "c": "Estrat granulós.", "d": "Estrat lúcid."}, "correcta": "b", "razones": {"a": "El estrato espinoso son varias capas de queratinocitos poligonales con puentes intercelulares.", "b": "Si la flecha apunta a la capa MÁS PROFUNDA de la epidermis, una hilera de células cilíndricas/cúbicas basófilas sobre la membrana basal → **estrat basal/germinatiu** {{(capa única basal, columnar, sobre la dermis)}}.", "c": "El estrato granuloso tiene gránulos de queratohialina basófilos (capas superficiales).", "d": "El estrato lúcido es una banda clara translúcida (solo en piel gruesa).", "confianza": "media"}, "confianza": "baja", "_k": "org2p-001:123488752", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org1p-038", "tema": "Digestivo", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (conductos glándula salival)", "enunciado": "IMATGE 16. Detall de glàndula paròtide (H-E). A què correspon el que assenyala la fletxa?", "opciones": {"a": "Ací mucós.", "b": "Conducte intercalar.", "c": "Conducte interlobular.", "d": "Conducte estriat o secretor."}, "correcta": "d", "razones": {"a": "La parótida es serosa pura: NO tiene acinos mucosos.", "b": "El **conducto intercalar** es de epitelio cúbico bajo, luz estrecha, sin estrías basales.", "c": "El conducto interlobular va por el tejido conjuntivo entre lóbulos, con epitelio cilíndrico estratificado.", "d": "Si la flecha señala un conducto intralobular de células cilíndricas eosinófilas con ESTRÍAS basales (mitocondrias verticales) → **conducte estriat/secretor** {{(epitelio cilíndrico eosinófilo con estriación basal)}}. Criterio clave: estriaciones basales.", "confianza": "media"}, "confianza": "baja", "_k": "org1p-038:991618212", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-039", "tema": "Inmune", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (pulpa blanca del bazo)", "enunciado": "IMATGE 17. Indica quines estructures de la polpa blanca (melsa) corresponen a cada número.", "opciones": {"a": "1-PALS, 2-Artèria central, 3-Nòdul esplènic.", "b": "1-Nòdul esplènic, 2-Vena central, 3-PALS.", "c": "1-Nòdul esplènic, 2-Artèria central, 3-PALS.", "d": "1-Nòdul esplènic, 2-Artèria central, 3-Zona marginal."}, "correcta": "c", "razones": {"a": "Plausible según orden, pero el nódulo esplénico suele ser la estructura grande (1).", "b": "Falsa: el vaso central de la pulpa blanca es una **arteria central** (no vena).", "c": "CORRECTA (criterio): 1 = **nòdul esplènic** (folículo B con centro germinal), 2 = **artèria central** (la arteria que recorre la PALS, excéntrica al nódulo), 3 = **PALS** (vaina linfática periarteriolar T). En la pulpa blanca lo central es siempre la {{arteria central}}, rodeada de la PALS-T, y el nódulo B adosado.", "d": "Falsa: la zona marginal es periférica; aquí lo señalado en 3 es la PALS.", "confianza": "media"}, "_k": "org1p-039:3159832980", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-040", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar leucocitos)", "enunciado": "IMATGE 18. Quines cèl·lules sanguínies indiquen els números de la imatge?", "opciones": {"a": "1-Neutròfil, 2-Basòfil, 3-Plaqueta.", "b": "1-Neutròfil, 2-Eosinòfil, 3-Limfòcit.", "c": "1-Eritròcit, 2-Eosinòfil, 3-Neutròfil.", "d": "1-Neutròfil, 2-Limfòcit, 3-Plaqueta."}, "correcta": "b", "razones": {"a": "Posible, pero el basófilo es raro en frotis; suele preferirse eosinófilo/linfocito.", "b": "Opción típica de estas imágenes: 1 = **neutròfil** (núcleo multilobulado, gránulos finos), 2 = **eosinòfil** (núcleo bilobulado, gránulos gruesos eosinófilos), 3 = **limfòcit** (núcleo redondo grande, citoplasma escaso). Criterios: {{neutrófilo = núcleo segmentado; eosinófilo = gránulos rojo-naranja gruesos; linfocito = núcleo redondo denso}}.", "c": "Improbable que 1 sea eritrocito (anucleado) si está numerado como célula nucleada.", "d": "Posible alternativa; depende de la imagen real.", "confianza": "baja"}, "confianza": "baja", "_k": "org1p-040:3590508062", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-041", "tema": "Inmune", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (ganglio linfático cortex B/T)", "enunciado": "IMATGE 19. En quina regió del gangli limfàtic es troba l'estructura que indica la fletxa i quin tipus cel·lular la conforma?", "opciones": {"a": "Escorça interior, limfòcits T.", "b": "Escorça exterior, limfòcits B.", "c": "Escorça interior, limfòcits B.", "d": "Escorça exterior, limfòcits T."}, "correcta": "b", "razones": {"a": "La corteza interior (paracorteza) es zona T, pero los folículos no están ahí.", "b": "CORRECTA: si la flecha señala un **folículo linfoide / centro germinal**, está en la {{escorça exterior}} (cortical superficial) y lo forman linfocitos {{B}}.", "c": "Falsa: los B no están en la corteza interior.", "d": "Falsa: la corteza exterior es B, no T."}, "_k": "org1p-041:913280125", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-042", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1er parcial", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Imagen recurrente (precursores hematopoyéticos)", "enunciado": "IMATGE 20. A quina cèl·lula sanguínia donaran lloc els precursors indicats amb fletxes?", "opciones": {"a": "Eosinòfil.", "b": "Eritròcit.", "c": "Basòfil.", "d": "Plaqueta."}, "correcta": "b", "razones": {"a": "Los precursores eosinófilos mostrarían gránulos específicos eosinófilos en mielocito.", "b": "Si las flechas apuntan a células redondas pequeñas, de núcleo redondo y cromatina cada vez más condensada, citoplasma progresivamente acidófilo (eritroblasto basófilo→policromatófilo→ortocromático) → linaje **eritroide** → {{eritròcit}}. Criterio: núcleo redondo central que se condensa y se expulsa.", "c": "El basófilo es muy raro de ver en serie precursora.", "d": "Las plaquetas derivan del megacariocito (célula gigante multilobulada), aspecto muy distinto.", "confianza": "baja"}, "confianza": "baja", "_k": "org1p-042:2713819541", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org2p-002", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "L'estrat de Malpighi està format per:", "opciones": {"a": "Estrat basal i espinós.", "b": "Estrat espinós i granulós.", "c": "Estrat granulós i lúcid.", "d": "Cap dels anteriors."}, "correcta": "a", "razones": {"a": "CORRECTA: el **estrato de Malpighi** (capa germinativa de Malpighi) está formado por el {{estrat basal + estrat espinós}} (las capas vivas proliferativas profundas de la epidermis).", "b": "Falsa: no incluye el granuloso.", "c": "Falsa: granuloso y lúcido son capas más superficiales, ya en diferenciación terminal.", "d": "Falsa: sí hay respuesta correcta (la a).", "confianza": "media"}, "confianza": "baja", "_k": "org2p-002:435647219", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-003", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (piel gruesa)", "enunciado": "De les afirmacions que es fan a continuació en relació amb la pell gruixuda, una NO és certa:", "opciones": {"a": "No trobem pèls en la pell gruixuda.", "b": "Com més gruixuda és la pell, més desenvolupada està l'epidermis.", "c": "Les cèl·lules de l'estrat espinós de l'epidermis presenten abundants grànuls laminars amb contingut lipídic.", "d": "La presència de tonofilaments és una característica exclusiva de les cèl·lules de l'estrat basal germinatiu de l'epidermis."}, "correcta": "d", "razones": {"a": "Cierta: la **piel gruesa** (palmas/plantas) es {{lampiña}}, sin pelos.", "b": "Cierta: a mayor grosor cutáneo, epidermis más desarrollada (más estratos).", "c": "Cierta: el estrato espinoso ya tiene **cuerpos laminares** (gránulos lamelares) con lípidos.", "d": "FALSA (la que hay que marcar): los **tonofilaments** (queratina) NO son exclusivos de la basal; están en {{todos}} los estratos vivos, especialmente abundantes y agrupados (tonofibrillas) en el {{estrat espinós}}."}, "_k": "org2p-003:2773599558", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-004", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23 1P (Q29)", "enunciado": "Assenyala la resposta correcta:", "opciones": {"a": "Els melanòcits estan units als queratinòcits mitjançant estructures desmosòmiques.", "b": "Els queratinòcits mai contenen melanina.", "c": "Els grànuls de queratohialina són propis dels queratinòcits de la capa basal.", "d": "Les cèl·lules de Langerhans de la pell estan relacionades amb fenòmens d'immunitat."}, "correcta": "d", "razones": {"a": "Falsa: los **melanòcits** {{NO}} forman desmosomas con los queratinocitos (carecen de uniones desmosómicas; por eso quedan en lagunas claras).", "b": "Falsa: los queratinocitos SÍ acumulan melanina (capuchón supranuclear) transferida por los melanocitos.", "c": "Falsa: los gránulos de **queratohialina** son propios del {{estrat granulós}}, no de la capa basal.", "d": "CORRECTA: las **cèl·lules de Langerhans** son células presentadoras de antígeno, relacionadas con la {{inmunidad}} (origen en médula ósea, gránulos de Birbeck)."}, "_k": "org2p-004:4155778596", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-005", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "En relació amb les glàndules sudorípares apòcrines, quina de les següents afirmacions NO és correcta:", "opciones": {"a": "Tenen un tipus de secreció merocrina.", "b": "Estan desenvolupades en el moment del naixement.", "c": "S'associen a fol·licles pilosos.", "d": "Presenten cèl·lules mioepitelials."}, "correcta": "b", "razones": {"a": "Cierta (matiz): pese al nombre 'apocrina', su mecanismo real de secreción es {{merocrino}} (exocitosis); el término es histórico.", "b": "FALSA (la que hay que marcar): las glándulas sudoríparas apocrinas {{no son funcionales}} hasta la {{pubertad}}; no están desarrolladas/activas al nacer.", "c": "Cierta: desembocan en el {{fol·licle pilós}} (no directamente en la superficie).", "d": "Cierta: tienen **cèl·lules mioepitelials** que ayudan a expulsar la secreción."}, "_k": "org2p-005:615926670", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-006", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2020-21, 2021-22", "enunciado": "De les següents afirmacions referents a la hipòfisi de l'ésser humà, una NO és certa:", "opciones": {"a": "La pars intermèdia en l'adult és responsable de la secreció d'hormona estimulant dels melanòcits (MSH).", "b": "En la pars intermèdia la presència de cèl·lules és més escassa.", "c": "Les hormones hipotalàmiques que actuen sobre l'adenohipòfisi són de naturalesa peptídica.", "d": "La pars tuberalis està constituïda principalment per cèl·lules cromòfobes."}, "correcta": "a", "razones": {"a": "FALSA (la que hay que marcar): en el **humano adulto** la pars intermedia es {{rudimentaria}} y NO tiene un papel relevante en la secreción de MSH. La MSH deriva de la POMC, pero la función melanotropa de la pars intermedia es propia de otras especies, no del humano adulto.", "b": "Cierta: en el ser humano la pars intermedia es muy reducida ({{escasa}}, con quistes de Rathke).", "c": "Cierta: las hormonas hipotalámicas liberadoras/inhibidoras son {{peptídiques}} (excepto la dopamina, que es amina).", "d": "Cierta: la pars tuberalis es predominantemente de células {{cromòfobes}} (con algunas gonadotropas)."}, "_k": "org2p-006:2246932433", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-007", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "Quina de les següents tincions consideres més adequada per tenyir el col·loide dels fol·licles de la glàndula tiroide?", "opciones": {"a": "Hematoxilina-eosina.", "b": "Tricròmic / argèntiques.", "c": "PAS.", "d": "Tionina."}, "correcta": "c", "razones": {"a": "La H-E tiñe el coloide de rosa, pero no es la técnica de elección específica.", "b": "Las técnicas argénticas/tricrómico marcan fibras, no específicamente el coloide.", "c": "CORRECTA: el **coloide** tiroideo es rico en {{glicoproteína (tiroglobulina)}}, por lo que es intensamente {{PAS-positivo}}. El PAS es la tinción de elección para el coloide.", "d": "La tionina es un colorante básico metacromático, no específico del coloide.", "confianza": "media"}, "_k": "org2p-007:743925256", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-008", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (melanocitos)", "enunciado": "En relació amb els melanòcits, quina afirmació NO és certa? (opcions transcrites pel seu text)", "opciones": {"a": "Provenen de la diferenciació de cèl·lules de l'estrat basal de l'epidermis.", "b": "En les persones de raça blanca els melanòcits contenen menys melanosomes que les de raça negra.", "c": "Els individus de raça negra tenen un nombre de melanòcits per unitat de superfície similar als de raça blanca.", "d": "Els melanòcits són cèl·lules que no experimenten recanvi cel·lular."}, "correcta": "a", "razones": {"a": "FALSA (la que hay que marcar): los melanocitos NO derivan del estrato basal epidérmico; provienen de la {{cresta neural}} (melanoblastos que migran a la epidermis).", "b": "Cierta: en piel clara los melanosomas son menos numerosos/pequeños y se degradan antes; en piel negra son más grandes y abundantes.", "c": "Cierta: el {{número}} de melanocitos por unidad de superficie es similar en todas las razas; lo que cambia es la actividad/melanosomas, no el número.", "d": "Cierta (criterio del profesor): los melanocitos son una población muy {{estable}}, con escaso recambio.", "confianza": "media"}, "_k": "org2p-008:673694076", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-009", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2020-21, 2021-22, 2022-23 2P (Q12)", "enunciado": "Dels orígens embrionaris que es citen a continuació, quin és el propi de les cèl·lules parafol·liculars (C) del tiroide?", "opciones": {"a": "Endoderma de la llengua.", "b": "Cresta neural.", "c": "3a bossa faríngia.", "d": "Ectoderma del sostre de la boca primitiva."}, "correcta": "b", "razones": {"a": "Falsa: del endodermo lingual deriva el epitelio folicular (células principales), no las C.", "b": "CORRECTA: las **cèl·lules parafol·liculars (C)**, productoras de calcitonina, derivan de la {{cresta neural}} (vía cuerpo ultimobranquial). Cruzado con clave oficial 2022-23 2P Q12 = B.", "c": "Falsa: de la 3ª bolsa faríngea derivan paratiroides inferiores y timo.", "d": "Falsa: del ectodermo del techo de la boca (bolsa de Rathke) deriva la adenohipófisis."}, "_k": "org2p-009:2389546479", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-010", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "En relació amb l'oxitocina, és cert:", "opciones": {"a": "És transportada per transport axonal per axons de neurones hipotalàmiques, en forma d'un pèptid precursor més gran que s'escindeix a mesura que avança per l'axó.", "b": "És sintetitzada en el nucli supraòptic de l'hipotàlem.", "c": "Es transporta i concentra en l'axó en estructures que, al microscopi electrònic, es veuen en forma de masses amorfes irregulars i electrodenses (cossos de Herring).", "d": "Els pituïcits que envolten els axons portadors d'oxitocina són cèl·lules amb un aspecte similar als oligodendròcits del SNC."}, "correcta": "a", "razones": {"a": "CIERTA: la oxitocina se transporta por **transporte axonal** unida a neurofisina, como parte de un {{precursor mayor (preprohormona)}} que se escinde durante el trayecto axónico.", "b": "Imprecisa: la oxitocina se sintetiza predominantemente en el núcleo {{paraventricular}} (la ADH en el supraóptico); ambos producen ambas, pero el predominio de oxitocina es paraventricular → enunciado discutible.", "c": "Imprecisa: los **cossos de Herring** son dilataciones axónicas con material de secreción, pero se describen como acúmulos {{redondeados}} eosinófilos, no exactamente 'masas amorfas irregulares'.", "d": "Imprecisa: los **pituïcits** se asemejan más a {{astròcits}} (glía) que a oligodendrocitos.", "confianza": "media"}, "confianza": "baja", "_k": "org2p-010:675443381", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-011", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2021-22 (Q9), 2022-23 2P (Q10)", "enunciado": "Referent a les glàndules paratiroides, NO és cert:", "opciones": {"a": "Habitualment estan situades sota la càpsula de la glàndula tiroide.", "b": "La presència de cèl·lules oxífiles no és significativa fins a l'adolescència.", "c": "El contingut de glucogen és molt abundant en les cèl·lules principals.", "d": "Les cèl·lules oxífiles es caracteritzen per presentar un nucli molt gran i discretament tenyit."}, "correcta": "d", "razones": {"a": "Cierta: las paratiroides están bajo la {{càpsula}} posterior del tiroides.", "b": "Cierta: las **cèl·lules oxífiles** no son significativas hasta la {{pubertat/adolescència}} (aumentan con la edad).", "c": "Cierta: las **cèl·lules principals** son ricas en {{glucogen}}.", "d": "FALSA (la que hay que marcar): la célula oxífila tiene un núcleo {{pequeño y picnótico (denso, muy teñido)}}, NO un núcleo grande y poco teñido. Su rasgo es el citoplasma muy eosinófilo (lleno de mitocondrias). Cruzado con 2022-23 2P Q10 = D y 2014-15 Q13 = C (oxífilas más pequeñas que principales)."}, "_k": "org2p-011:673118644", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-012", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15 (Q11), 2020-21, 2021-22", "enunciado": "Referent al pàncrees, NO és cert:", "opciones": {"a": "Els illots de Langerhans estan delimitats per teixit connectiu molt escàs.", "b": "Les cèl·lules alfa i beta dels illots poden distingir-se clarament al microscopi electrònic per l'aspecte dels seus grànuls de secreció.", "c": "Mètodes histoquímics han demostrat que els illots de Langerhans estan innervats pel sistema nerviós autònom.", "d": "(opció no visible)"}, "correcta": "d", "razones": {"a": "Cierta: los islotes están rodeados por tejido conjuntivo {{muy escaso}} (reticular).", "b": "Cierta: al MET, las células {{alfa}} (gránulo con halo, denso excéntrico) y {{beta}} (gránulo con cristaloide y halo claro) SÍ se distinguen por sus gránulos.", "c": "Cierta: los islotes están {{inervados}} por el sistema nervioso autónomo.", "d": "CORRECTA (la falsa, no visible en la foto): según la serie histórica (2014-15 Q11 respuesta A), la afirmación falsa típica es la que niega que alfa/beta se distingan al MET. La opción no visible aquí debe ser la falsa por descarte.", "confianza": "media"}, "confianza": "baja", "_k": "org2p-012:4142653222", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-013", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (zonas suprarrenal)", "enunciado": "(Endocrino — suprarenal) La presència de l'estructura assenyalada a la glàndula suprarenal correspon a la zona:", "opciones": {"a": "Zona glomerular.", "b": "Zona fascicular.", "c": "Zona reticular.", "d": "Medul·la."}, "correcta": "b", "razones": {"a": "La **zona glomerular** (externa, bajo la cápsula) tiene células en arcos/ovillos; produce mineralocorticoides.", "b": "Por defecto (concepto más preguntado): la **zona fascicular** es la más ancha, con espongiocitos en cordones rectos paralelos, citoplasma vacuolado por lípidos. Pregunta de transcripción dudosa (foto inclinada).", "c": "La **zona reticular** (profunda) tiene cordones anastomosados, células con lipofuscina.", "d": "La **medul·la** central tiene células cromafines (catecolaminas).", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-013:2977484787", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-014", "tema": "Urinario", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (nefrona corticales vs yuxtamedulares)", "enunciado": "En relació amb la nefrona, una de les següents afirmacions NO és certa:", "opciones": {"a": "Les nefrones corticals tenen unes anses de Henle més curtes que les nefrones juxtamedul·lars.", "b": "(il·legible)", "c": "(il·legible)", "d": "(il·legible)"}, "correcta": "a", "razones": {"a": "Esta afirmación es CIERTA en sí (las corticales tienen asas más cortas), por lo que la FALSA estaría en otra opción ilegible. ADVERTENCIA: la transcripción solo tiene legible la opción A. En 2014-15 Q14 la falsa fue 'las corticales constituyen el 15% del total' (son ~85%). La respuesta correcta depende de las opciones B-D no transcritas.", "b": "Ilegible.", "c": "Ilegible.", "d": "Ilegible.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-014:1152932297", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-015", "tema": "Urinario", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (TCP PAS+)", "enunciado": "En relació amb els túbuls contornejats de l'escorça de la nefrona, és cert que (opcions: més nombrosos de l'escorça, vora luminal PAS+, llum d'aspecte estrellat, totes correctes):", "opciones": {"a": "Són els més nombrosos de l'escorça.", "b": "La vora luminal de les seves cèl·lules és PAS+.", "c": "La llum té un aspecte estrellat/irregular.", "d": "Totes les anteriors són correctes."}, "correcta": "d", "razones": {"a": "Cierta: los **túbuls contornejats proximals** son los más numerosos en la corteza (segmento más largo).", "b": "Cierta: el borde en cepillo (microvellosidades + glicocálix) es intensamente {{PAS+}}.", "c": "Cierta: por las microvellosidades, la luz se ve {{estrellada/irregular}} (a menudo ocluida).", "d": "CORRECTA: {{todas}} son rasgos del TCP. (Transcripción parcial de la foto inclinada; respuesta razonada desde histología estándar.)", "confianza": "media"}, "confianza": "baja", "_k": "org2p-015:1756187895", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-016", "tema": "Urinario", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15 (Q17)", "enunciado": "Les cèl·lules juxtaglomerulars són:", "opciones": {"a": "Cèl·lules de la màcula densa.", "b": "Fibres musculars llises modificades de la paret de l'arteriola aferent del glomèrul.", "c": "Cèl·lules endotelials modificades de l'arteriola eferent del glomèrul.", "d": "Fibroblasts modificats presents en l'interstici medul·lar del ronyó."}, "correcta": "b", "razones": {"a": "Falsa: la **màcula densa** es parte del túbulo contorneado distal, no las JG.", "b": "CORRECTA: las **cèl·lules juxtaglomerulars** son {{fibras musculares lisas modificadas}} de la pared de la arteriola {{aferent}}; sintetizan y liberan renina. Cruzado con clave 2014-15 Q17 = b.", "c": "Falsa: no son endoteliales ni de la eferente.", "d": "Falsa: los fibroblastos medulares modificados son las células intersticiales (secretan PGE2), no las JG."}, "_k": "org2p-016:3051440095", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-017", "tema": "Reproductor", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "Quina de les següents afirmacions sobre la glàndula mamària és correcta? (fragment visible)", "opciones": {"a": "(no visible)", "b": "Els alvèols estan poc desenvolupats i només s'observen gemmes alveolars disperses.", "c": "Els teixits de la llet es secreten principalment per exocitosi a partir de grànuls de secreció.", "d": "Les cèl·lules secretores mostren abundants gotes lipídiques apicals, alliberades mitjançant un mecanisme apocrí."}, "correcta": "d", "razones": {"a": "No visible en la foto.", "b": "Describe la mama en reposo (inactiva); puede ser cierta en ese contexto, pero la pregunta busca el mecanismo secretor.", "c": "Parcialmente cierta: el componente {{proteico}} de la leche (caseína) se libera por {{merocrina/exocitosis}}. Pero no es la afirmación más completa.", "d": "CORRECTA: las gotas {{lipídicas}} de la leche se liberan por mecanismo {{apocrí}} (la gota sale envuelta en membrana apical + algo de citoplasma). Es el rasgo distintivo de la secreción láctea lipídica.", "confianza": "media"}, "_k": "org2p-017:3308553168", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-018", "tema": "Reproductor", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15 (Q20), 2024-25 (Q25)", "enunciado": "Les anomenades glàndules de Bartholin en la dona es troben en:", "opciones": {"a": "Cos de l'úter.", "b": "Cèrvix uterí.", "c": "Vagina.", "d": "Vestíbul dels genitals externs."}, "correcta": "d", "razones": {"a": "Falsa: no están en el cuerpo uterino.", "b": "Falsa: en el cérvix están las glándulas endocervicales (quistes de Naboth), no Bartholin.", "c": "Falsa: no son vaginales.", "d": "CORRECTA: las **glàndules de Bartholin** (vestibulares mayores) están en el {{vestíbul de los genitales externos}}, a ambos lados del orificio vaginal. Cruzado con clave 2014-15 Q20 = b (caras laterales del vestíbulo)."}, "_k": "org2p-018:128824217", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-019", "tema": "Reproductor", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "", "enunciado": "Els anomenats quists de Naboth poden trobar-se en:", "opciones": {"a": "La llum de les glàndules del coll de l'úter.", "b": "La llum de les glàndules del cèrvix uterí.", "c": "La llum de la vagina.", "d": "En els fol·licles pilosos de la pell del mont de Venus."}, "correcta": "a", "razones": {"a": "CORRECTA: los **quistes de Naboth** son glándulas endocervicales dilatadas y obstruidas por moco, en el {{coll de l'úter (cérvix)}}. (Las opciones a y b describen lo mismo —cuello uterino = cérvix—; se toma 'a' como respuesta esperada; ojo posible solapamiento del enunciado.)", "b": "Equivale a la 'a' (cérvix = cuello uterino); posible distractor redundante.", "c": "Falsa: no se forman en la luz vaginal.", "d": "Falsa: nada que ver con folículos pilosos.", "confianza": "media"}, "confianza": "baja", "_k": "org2p-019:570186169", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-020", "tema": "Ojo", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (glaucoma/drenaje humor acuoso)", "enunciado": "El glaucoma és un trastorn provocat per l'augment de la pressió intraocular que succeeix freqüentment com a conseqüència del:", "opciones": {"a": "L'augment de la producció d'humor aquós per part de la xarxa trabecular.", "b": "L'augment de la producció d'humor aquós per part del conducte de Schlemm.", "c": "La disminució del drenatge de l'humor aquós primer a través del conducte de Schlemm i després de la xarxa trabecular.", "d": "La disminució del drenatge de l'humor aquós primer a través de la xarxa trabecular i després del conducte de Schlemm."}, "correcta": "d", "razones": {"a": "Falsa: el humor acuoso lo producen los {{procesos ciliares}}, no la red trabecular.", "b": "Falsa: el conducto de Schlemm drena, no produce.", "c": "Falsa: invierte el orden del drenaje.", "d": "CORRECTA: el glaucoma se debe a {{disminución del drenaje}}; el humor acuoso sale primero por la **xarxa trabecular** y luego al **conducte de Schlemm**. El orden correcto del flujo es trabécula → Schlemm."}, "_k": "org2p-020:157475676", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-021", "tema": "Ojo", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (Q27)", "enunciado": "En relació amb les cèl·lules ganglionars de la retina, és cert que:", "opciones": {"a": "Estan en contacte amb l'epiteli pigmentari de la retina.", "b": "Són cèl·lules fotoreceptores.", "c": "Les cèl·lules amacrines estableixen contactes sinàptics amb elles.", "d": "Les cèl·lules horitzontals estableixen contactes sinàptics amb elles."}, "correcta": "c", "razones": {"a": "Falsa: las **ganglionars** están en la capa más {{interna}} (cerca del vítreo); el epitelio pigmentario está en la más externa.", "b": "Falsa: las ganglionares NO son fotorreceptoras (lo son conos y bastones); son neuronas de salida.", "c": "CORRECTA: las **cèl·lules amacrines** hacen sinapsis con las ganglionares en la capa plexiforme {{interna}}. Cruzado con clave 2024-25 Q27 = C.", "d": "Falsa: las **cèl·lules horitzontals** sinaptan en la plexiforme {{externa}} (con fotorreceptores/bipolares), no con las ganglionares."}, "_k": "org2p-021:1541660518", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-022", "tema": "Ojo", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22 (Q22), 2022-23 2P", "enunciado": "És cert que el cristal·lí:", "opciones": {"a": "Està vascularitzat.", "b": "Es localitza al mateix nivell que els processos ciliars.", "c": "Presenta terminacions nervioses.", "d": "Presenta melanòcits."}, "correcta": "b", "razones": {"a": "Falsa: el **cristal·lí** es {{avascular}} (se nutre del humor acuoso).", "b": "CORRECTA: el cristalino está situado a la altura de los **procesos ciliares**, suspendido por las fibras zonulares (ligamento suspensorio) que lo unen al cuerpo ciliar.", "c": "Falsa: el cristalino {{no está inervado}} (sin terminaciones nerviosas).", "d": "Falsa: no contiene melanocitos.", "confianza": "media"}, "_k": "org2p-022:1667171521", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-023", "tema": "Oído", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (máculas)", "enunciado": "En relació amb la màcula de l'utricle, és cert que:", "opciones": {"a": "Les seves cèl·lules ciliades estan en contacte amb la perilimfa.", "b": "Es localitza en una regió dels conductes semicirculars.", "c": "No conté cèl·lules de suport.", "d": "(fora d'enquadrament)"}, "correcta": "d", "razones": {"a": "Falsa: las células ciliadas de la mácula contactan con la {{endolimfa}} (del laberinto membranoso), no la perilinfa.", "b": "Falsa: la **màcula de l'utricle** está en el utrículo (vestíbulo), NO en los conductos semicirculares (allí están las crestas ampollares).", "c": "Falsa: la mácula SÍ tiene **cèl·lules de suport** (sostén).", "d": "CORRECTA por descarte: las opciones A, B y C son falsas, así que la afirmación cierta es la D (no visible en la foto). Una afirmación verdadera típica sería: 'tiene posición horizontal' o 'contiene otolitos sobre la membrana otolítica'.", "confianza": "media"}, "confianza": "baja", "_k": "org2p-023:1622536637", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-024", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (estratos epidermis)", "enunciado": "IMATGE 1. Secció histològica de pell. A quina capa correspon el que indica la fletxa?", "opciones": {"a": "Estrat corni.", "b": "Estrat germinatiu o basal.", "c": "Estrat espinós.", "d": "Estrat granulós."}, "correcta": "a", "razones": {"a": "Por defecto (lo más señalado en piel gruesa): la capa más superficial, eosinófila, laminar y anucleada → **estrat corni** {{(escamas de queratina sin núcleo, superficial)}}.", "b": "El basal es la hilera profunda columnar sobre la dermis.", "c": "El espinoso son varias capas de células poligonales con espinas.", "d": "El granuloso tiene gránulos basófilos de queratohialina (justo bajo el córneo).", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-024:723616689", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-025", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (cromófilas adenohipófisis)", "enunciado": "IMATGE 2. Quines cèl·lules endocrines (adenohipòfisi) indiquen els números?", "opciones": {"a": "1-Cromòfila acidòfila, 2-Cromòfila basòfila, 3-Cromòfoba.", "b": "1-Cromòfila basòfila, 2-Cromòfila acidòfila, 3-Cromòfoba.", "c": "1-Cromòfoba, 2-Cromòfila basòfila, 3-Cromòfila acidòfila.", "d": "1-Cromòfila acidòfila, 2-Cromòfoba, 3-Cromòfila basòfila."}, "correcta": "a", "razones": {"a": "Criterio de identificación: **acidòfila** = citoplasma rosa-rojo intenso (somatotropas/mamotropas), **basòfila** = citoplasma azul-púrpura (corticotropas/tirotropas/gonadotropas), **cromòfoba

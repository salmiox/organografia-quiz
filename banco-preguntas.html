", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C), 2021-22; endolinfa", "enunciado": "La **endolinfa** se localiza:", "opciones": {"a": "Entre el laberinto óseo y el membranoso.", "b": "Dentro de la estría vascular.", "c": "Dentro del laberinto membranoso.", "d": "En el oído medio."}, "correcta": "c", "razones": {"a": "Ese espacio lo ocupa la {{perilinfa}}.", "b": "La estría vascular {{produce}} la endolinfa, pero no la contiene como espacio.", "c": "CORRECTA (clave 2021-junio = C). La {{endolinfa}} llena el interior del laberinto {{membranoso}} (rica en K+).", "d": "El oído medio contiene aire, no endolinfa."}, "_k": "org2p-072:4077062840", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-073", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22 (resp. A); crestas ampollares", "enunciado": "Las **crestas ampollares** son:", "opciones": {"a": "Órganos sensoriales de los conductos semicirculares, cubiertas por la cúpula y sin otolitos.", "b": "Órganos auditivos sobre la membrana basilar.", "c": "Las máculas del utrículo y sáculo.", "d": "Receptores con membrana otolítica."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-22 = A). Las {{crestas ampollares}} son los receptores de los {{conductos semicirculares}} (aceleración angular), cubiertas por la {{cúpula}}, sin otolitos.", "b": "Eso describe el {{órgano de Corti}}.", "c": "Las máculas son del utrículo/sáculo, distintas de las crestas.", "d": "La membrana otolítica es de las máculas, no de las crestas."}, "_k": "org2p-073:864624894", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-074", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2021-junio; laberinto membranoso", "enunciado": "Es cierto que el **laberinto membranoso**:", "opciones": {"a": "Está localizado en el oído medio.", "b": "Es más grande que el laberinto óseo.", "c": "Contiene el órgano de Corti, pero no contiene las máculas del utrículo y el sáculo.", "d": "Ninguna de las anteriores es cierta."}, "correcta": "d", "razones": {"a": "Falsa: el laberinto membranoso está en el {{oído interno}}, dentro del laberinto óseo.", "b": "Falsa: es {{más pequeño}} que el óseo (suspendido en la perilinfa dentro de él).", "c": "Falsa: contiene el órgano de Corti {{Y TAMBIÉN}} las máculas del utrículo y el sáculo (y las crestas).", "d": "CORRECTA (clave 2021-22 = D). Ninguna es correcta (todas tienen un error)."}, "_k": "org2p-074:1558231098", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-075", "tema": "Embriología", "examen": "2022-23 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P; notocordio", "enunciado": "Respecto a la formación del **notocordio**, señala la respuesta correcta:", "opciones": {"a": "La placa notocordal se cierra simultáneamente en todo el embrión.", "b": "La prolongación notocordal se origina por la proliferación y migración de células del mesodermo desde el nódulo primitivo.", "c": "Señales procedentes del tubo neural inducen la formación del notocordio.", "d": "La placa neural está constituida por la región ventral del conducto notocordal."}, "correcta": "b", "razones": {"a": "Falsa: el proceso es {{progresivo (craneocaudal)}}, no simultáneo.", "b": "CORRECTA (clave 2022-23/2021 = C/equiv. B). La **prolongación notocordal** se origina por proliferación y migración de células desde el {{nódulo primitivo}} (de Hensen).", "c": "Falsa: es al revés — el {{notocordio}} INDUCE al ectodermo a formar la placa neural.", "d": "Falsa: la placa neural deriva del {{ectodermo}} dorsal por inducción notocordal."}, "_k": "org2p-075:3664363768", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-076", "tema": "Embriología", "examen": "2021-22 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P; capas germinales", "enunciado": "Sobre el **disco embrionario**, señala la afirmación **CORRECTA**:", "opciones": {"a": "A partir del hipoblasto se forman mesodermo y endodermo.", "b": "A partir del epiblasto se forman las tres hojas germinativas (ecto, meso y endodermo).", "c": "A partir del hipoblasto se forma el ectodermo.", "d": "El epiblasto solo da lugar al ectodermo."}, "correcta": "b", "razones": {"a": "Falsa: el {{hipoblasto}} es desplazado; no origina las hojas del embrión.", "b": "CORRECTA. Durante la gastrulación, las células del {{epiblasto}} dan lugar a las {{tres hojas}} germinativas.", "c": "Falsa: el ectodermo procede del {{epiblasto}}.", "d": "Falsa: el epiblasto origina las {{tres}} capas, no solo el ectodermo."}, "_k": "org2p-076:2128495103", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-077", "tema": "Embriología", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22 (resp. D); poliespermia permanente", "enunciado": "Durante la fecundación, ¿qué procesos contribuyen a evitar la **poliespermia de forma permanente**?", "opciones": {"a": "La exocitosis de los gránulos corticales del ovocito.", "b": "Un cambio en el potencial de membrana del ovocito.", "c": "La unión de ZP3 a los receptores del espermatozoide.", "d": "A y B son ciertas (bloqueo rápido + bloqueo lento)."}, "correcta": "d", "razones": {"a": "Cierta en parte: la exocitosis de {{gránulos corticales}} es el bloqueo {{lento/permanente}} (reacción cortical → zona pelúcida modificada).", "b": "Cierta en parte: el cambio de {{potencial de membrana}} es el bloqueo {{rápido/primario}}.", "c": "La unión ZP3 promueve la entrada del espermatozoide, no el bloqueo.", "d": "CORRECTA (clave 2021-junio = D). Combinan ambos mecanismos: bloqueo rápido (potencial) + bloqueo permanente ({{gránulos corticales}})."}, "_k": "org2p-077:2496931525", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-078", "tema": "Embriología", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23 2P; somitas", "enunciado": "Sobre la formación de los **somitas**, señala lo **CORRECTO**:", "opciones": {"a": "Se forman por segmentación del mesodermo intermedio.", "b": "Se disponen lateralmente, lejos del tubo neural.", "c": "Derivan del mesodermo paraxial y se forman en sentido craneocaudal.", "d": "La formación se inicia en la región caudal del embrión."}, "correcta": "c", "razones": {"a": "Falsa: derivan del mesodermo {{paraxial}}, no del intermedio (que da el aparato urogenital).", "b": "Falsa: se disponen {{paraxialmente}}, a ambos lados del tubo neural/notocordio.", "c": "CORRECTA. Los {{somitas}} derivan del mesodermo {{paraxial}} y se segmentan en sentido {{craneocaudal}}.", "d": "Falsa: la formación se inicia en la región {{craneal}} y avanza hacia caudal."}, "_k": "org2p-078:604047881", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-079", "tema": "Embriología", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23 2P; plegamiento", "enunciado": "Como consecuencia del **plegamiento del disco embrionario**, señala lo **CORRECTO**:", "opciones": {"a": "Se forma el intestino primitivo a partir del ectodermo.", "b": "El plegamiento incorpora parte del saco vitelino al embrión, formando el intestino primitivo (endodermo), y el amnios acaba envolviendo al embrión.", "c": "El saco vitelino envuelve por completo al embrión.", "d": "Se forma el celoma extraembrionario."}, "correcta": "b", "razones": {"a": "Falsa: el intestino primitivo procede del {{endodermo}}, no del ectodermo.", "b": "CORRECTA. El plegamiento cefalocaudal y lateral incorpora el {{saco vitelino}} → {{intestino primitivo}} (endodermo); el {{amnios}} crece y envuelve al embrión.", "c": "Falsa: es el {{amnios}}, no el saco vitelino, el que envuelve al embrión.", "d": "Falsa: el celoma extraembrionario se forma antes, en la 2ª semana."}, "_k": "org2p-079:1287677166", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-080", "tema": "Embriología", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P; placenta", "enunciado": "Sobre la **placenta madura**, señala la afirmación **CORRECTA**:", "opciones": {"a": "La barrera entre sangre materna y fetal se produce en los espacios intervellosos sin vellosidades.", "b": "En las vellosidades coriónicas hay vasos con sangre materna.", "c": "Las vellosidades terminales de la placenta madura son vellosidades terciarias (con vasos fetales).", "d": "El número de células del citotrofoblasto aumenta a término."}, "correcta": "c", "razones": {"a": "Falsa: la barrera está en la pared de las {{vellosidades terminales}}, no en los espacios sin vellosidades.", "b": "Falsa: dentro de las vellosidades circula sangre {{fetal}}; la materna baña los espacios intervellosos.", "c": "CORRECTA (clave 2021-junio = C). Las vellosidades terminales maduras son {{terciarias}} (contienen ya {{vasos fetales}}).", "d": "Falsa: a término el {{citotrofoblasto}} se reduce (la barrera se adelgaza)."}, "_k": "org2p-080:2099344728", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-081", "tema": "Embriología", "examen": "Concepto recurrente (hojas germinativas)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Concepto base recurrente en 2º parcial", "enunciado": "El **tubo neural** se forma a partir de:", "opciones": {"a": "Mesodermo paraxial.", "b": "Neuroectodermo (placa neural inducida por el notocordio).", "c": "Endodermo del techo del saco vitelino.", "d": "Hipoblasto."}, "correcta": "b", "razones": {"a": "El mesodermo paraxial da los {{somitas}}, no el tubo neural.", "b": "CORRECTA. El tubo neural deriva del {{neuroectodermo}} (placa neural), inducido por el {{notocordio}}.", "c": "El endodermo origina epitelios digestivo/respiratorio, no el tubo neural.", "d": "El hipoblasto es desplazado y no forma estructuras del embrión."}, "_k": "org2p-081:318848892", "fuente": "📚 Históricos / repetidas"}];
const app = document.getElementById("app");
const examen = document.getElementById("examen");
const filtro = document.getElementById("filtro");
const tipo = document.getElementById("tipo");
const frec = document.getElementById("frec");
const marc = document.getElementById("marc");
const orden = document.getElementById("orden");
const reshuffleBtn = document.getElementById("reshuffle");
// orden aleatorio estable: asigna un nº al azar a cada pregunta; se mantiene fijo
// mientras estás en modo aleatorio (no se re-baraja al marcar estrellas / filtrar).
let shuffleSeed = null;
function buildShuffle(){
  shuffleSeed = {};
  DATA.forEach(q => { shuffleSeed[q._k] = Math.random(); });
}
const SKEY = "organo_starred_v1";
let starred = new Set(JSON.parse(localStorage.getItem(SKEY) || "[]"));
function saveStars(){ localStorage.setItem(SKEY, JSON.stringify([...starred])); }
// **x** → palabra clave resaltada ; {{x}} → palabra clave ocluida (cloze)
function esc(s){return String(s==null?"":s);}
function fmt(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<span class="kw">$1</span>');
  s = s.replace(/\{\{([^}]+)\}\}/g, '<span class="cloze" title="click para revelar">$1</span>');
  return s;
}
// Imagen de la pregunta con las etiquetas que delatan la respuesta TAPADAS (overlay).
// Click en una caja = revelarla; click en la imagen = ampliar.
function imgHTML(q){
  const boxes=(q.redact||[]).map(r=>`<span class="redact" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%" onclick="event.stopPropagation();this.classList.toggle('revealed')" title="click para revelar la etiqueta"></span>`).join('');
  const hint = (q.redact&&q.redact.length)?'<div class="imghint">🟦 etiquetas tapadas · click para revelar · click en la imagen para ampliar</div>':'';
  return `<div class="imgwrap" onclick="this.classList.toggle('zoom')"><img class="qimg" src="${q.imagen}" alt="micrografía" loading="lazy">${boxes}</div>${hint}`;
}
const TEMAS = ["Cor","Vasos","Respiratorio","Digestivo","Sangre/Hematopoyesis","Inmune","Piel","Endocrino","Urinario","Reproductor","Ojo","Oído","Embriología","Tejidos básicos"];
TEMAS.filter(t=>DATA.some(q=>q.tema===t)).forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
[...new Set(DATA.map(q=>q.tema))].filter(t=>!TEMAS.includes(t)).sort().forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
// Filtro por examen/fuente
const FUENTES = ["🎯 2025-26 · 1er parcial","🎯 2025-26 · 2º parcial","📚 Históricos / repetidas"];
FUENTES.filter(s=>DATA.some(q=>q.fuente===s)).forEach(s=>{
  const o=document.createElement("option");o.value=s;o.textContent=s;examen.appendChild(o);});
function render(){
  const f = filtro.value, fr = frec.value, mk = marc.value, ex = examen.value, tp = tipo.value;
  const list = DATA.filter(q=>(!f||q.tema===f) &&
    (!ex || q.fuente===ex) &&
    (tp!=="img" || q.imagen) && (tp!=="txt" || !q.imagen) &&
    (fr!=="alta" || q.alta_frecuencia) &&
    (mk!=="si" || starred.has(q._k)));
  if(orden.value==="rand"){
    if(!shuffleSeed) buildShuffle();
    list.sort((a,b)=>shuffleSeed[a._k]-shuffleSeed[b._k]);
  }
  document.getElementById("count").textContent = list.length+" preguntas · 🌟 "+starred.size+" marcadas";
  app.innerHTML = "";
  list.forEach((q,i)=>{
    const card=document.createElement("div");card.className="card";
    const alta = q.alta_frecuencia?' · <span class="alta">⭐ ALTA FRECUENCIA</span>':'';
    const rep = q.repetida?' · '+q.repetida:'';
    const L=Object.keys(q.opciones).sort();
    let opts="";
    L.forEach(l=>opts+=`<div class="opt" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.opciones[l])}</div>`);
    let raz="";
    L.forEach(l=>{if(q.razones&&q.razones[l]!==undefined)raz+=`<div class="razon" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.razones[l])}</div>`;});
    const on = starred.has(q._k);
    card.innerHTML=`<div class="chead">
        <span class="qnum">Nº ${i+1} / ${list.length}</span>
        <div class="meta">${q.examen} · ${q.tema}${alta}${rep}${q.imagen?' <span class="imgtag">🖼 imagen</span>':''}</div>
        <button class="star${on?' on':''}" title="Marcar como difícil">${on?'★':'☆'}</button>
      </div>
      ${q.imagen?imgHTML(q):''}
      <div class="preg">${fmt(q.enunciado)}</div>
      <div class="opts">${opts}</div>
      <div class="hint">👆 Toca tu respuesta para ver el razonamiento.</div>
      <div class="resp"><button class="reveal-words">👁 Revelar palabras clave</button><div class="razon-wrap">${raz}</div></div>`;
    // estrella
    const starBtn=card.querySelector(".star");
    starBtn.onclick=()=>{
      if(starred.has(q._k)){starred.delete(q._k);} else {starred.add(q._k);}
      saveStars();
      const now=starred.has(q._k);
      starBtn.classList.toggle("on",now);starBtn.textContent=now?'★':'☆';
      document.getElementById("count").textContent=app.querySelectorAll(".card").length+" preguntas · 🌟 "+starred.size+" marcadas";
      if(marc.value==="si"&&!now)render();
    };
    // click en opción → revela al instante
    const optEls=card.querySelectorAll(".opt");
    const resp=card.querySelector(".resp");
    const hint=card.querySelector(".hint");
    let answered=false;
    optEls.forEach(o=>o.onclick=()=>{
      if(answered)return; answered=true;
      const chosen=o.dataset.l;
      optEls.forEach(x=>{const l=x.dataset.l;
        x.classList.add(l===q.correcta?"ok":"no");
        if(l===chosen)x.classList.add("mine");
        if(l===chosen&&l===q.correcta){x.insertAdjacentHTML("beforeend",'<span class="tag cor">✓ tu respuesta · correcta</span>');}
        else{
          if(l===chosen)x.insertAdjacentHTML("beforeend",'<span class="tag you">tu respuesta</span>');
          if(l===q.correcta)x.insertAdjacentHTML("beforeend",'<span class="tag cor">correcta</span>');
        }
      });
      hint.style.display="none";
      resp.classList.add("show");
    });
    // cloze: click individual para revelar/ocultar
    resp.querySelectorAll(".cloze").forEach(c=>c.onclick=()=>c.classList.toggle("revealed"));
    // botón revelar/ocultar todas
    resp.querySelector(".reveal-words").onclick=(e)=>{
      const cs=resp.querySelectorAll(".cloze");
      const anyHidden=[...cs].some(c=>!c.classList.contains("revealed"));
      cs.forEach(c=>c.classList.toggle("revealed",anyHidden));
      e.target.textContent = anyHidden ? "🙈 Ocultar palabras clave" : "👁 Revelar palabras clave";
    };
    app.appendChild(card);
  });
  updatePos();
}
// contador en vivo: detecta la tarjeta que está arriba del todo y muestra posición + cuántas quedan
function updatePos(){
  const cards=app.querySelectorAll(".card");
  const pos=document.getElementById("pos");
  const n=cards.length;
  if(!n){pos.textContent="";return;}
  const thr=document.querySelector("header").offsetHeight+10;
  let cur=0;
  for(let i=0;i<n;i++){ if(cards[i].getBoundingClientRect().top<=thr) cur=i; else break; }
  // si estás al final del scroll, fija la última (las últimas tarjetas no llegan a subir hasta arriba)
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4) cur=n-1;
  pos.textContent=`📍 ${cur+1} / ${n} · quedan ${n-1-cur}`;
}
let _ticking=false;
window.addEventListener("scroll",()=>{ if(!_ticking){_ticking=true;requestAnimationFrame(()=>{updatePos();_ticking=false;});} },{passive:true});
examen.onchange=render;filtro.onchange=render;tipo.onchange=render;frec.onchange=render;marc.onchange=render;
orden.onchange=()=>{
  const rand = orden.value==="rand";
  reshuffleBtn.style.display = rand ? "" : "none";
  if(rand) buildShuffle();          // nueva mezcla cada vez que activas aleatorio
  window.scrollTo(0,0);
  render();
};
reshuffleBtn.onclick=()=>{ buildShuffle(); window.scrollTo(0,0); render(); };
render();
</script></body></html>

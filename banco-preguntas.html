** = citoplasma pálido sin teñir. La asignación depende de los colores reales en la imagen; opción A es la combinación más frecuente cuando 1=rosa, 2=azul, 3=pálido.", "b": "Solo correcta si 1 es azul (basófila) y 2 rosa.", "c": "Solo si 1 es pálida.", "d": "Solo si 3 es basófila y 2 pálida.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-025:1677562050", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-026", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMATGE 3. A quina glàndula endocrina pertany aquesta imatge?", "opciones": {"a": "Pituïtària.", "b": "Paratiroide.", "c": "Tiroide.", "d": "Adrenal."}, "correcta": "c", "razones": {"a": "La hipófisis muestra cordones de células cromófilas/cromófobas y sinusoides (sin folículos).", "b": "La paratiroides tiene cordones de células principales pequeñas + oxífilas, sin coloide.", "c": "Criterio clave: si se ven **folículos** redondos llenos de {{coloide}} rosado homogéneo rodeados de epitelio cúbico → **tiroide**. Es el patrón folicular inconfundible.", "d": "La suprarrenal muestra zonación cortical (cordones) + médula.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-026:2811437822", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-027", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMATGE 4. A quina glàndula endocrina pertany aquesta imatge?", "opciones": {"a": "Pineal.", "b": "Tiroide.", "c": "Hipòfisi.", "d": "Paratiroide."}, "correcta": "d", "razones": {"a": "La pineal tiene pinealocitos y cuerpos arenáceos (acérvulos calcificados).", "b": "La tiroides tendría folículos con coloide.", "c": "La hipófisis tiene mezcla de cromófilas acidófilas/basófilas y sinusoides.", "d": "Por defecto (cuando se contrasta con tiroides en la misma serie): cordones densos de células {{principales}} pequeñas y pálidas, con algunas {{oxífiles}} eosinófilas, sin coloide → **paratiroide**. Criterio: dos poblaciones celulares (principales + oxífilas), sin folículos.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-027:2750119676", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-028", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (zonas suprarrenal)", "enunciado": "IMATGE 5. Indica a quines zones de l'escorça de la glàndula adrenal correspon cada número:", "opciones": {"a": "1-Càpsula, 2-Zona fascicular, 3-Medul·la.", "b": "1-Zona reticularis, 2-Zona fascicular, 3-Zona glomerular.", "c": "1-Zona glomerular, 2-Zona fascicular, 3-Zona reticular.", "d": "1-Zona glomerular, 2-Zona reticularis, 3-Zona fascicular."}, "correcta": "c", "razones": {"a": "Incompleta: mezcla cápsula y médula sin la zonación cortical ordenada.", "b": "Falsa: invierte el orden (glomerular es la más externa, no la 3).", "c": "CORRECTA: de fuera a dentro el orden es **glomerular → fascicular → reticular** (regla 'GFR'). Si 1 es la más externa bajo cápsula → glomerular (arcos), 2 = fascicular (cordones rectos, espongiocitos), 3 = reticular (cordones anastomosados).", "d": "Falsa: la reticular no va antes que la fascicular.", "confianza": "media"}, "_k": "org2p-028:222374904", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-029", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (regiones hipófisis)", "enunciado": "IMATGE 6. Zona de la glàndula hipòfisi (H-E). A quina regió correspon la que assenyalen les fletxes?", "opciones": {"a": "Pars distalis.", "b": "Pars nervosa.", "c": "Pars tuberalis.", "d": "Pars intermèdia."}, "correcta": "d", "razones": {"a": "La **pars distalis** es la masa principal de la adenohipófisis con cordones de cromófilas/cromófobas y sinusoides.", "b": "La **pars nervosa** es pálida, fibrilar (axones + pituicitos), con cuerpos de Herring.", "c": "La **pars tuberalis** es el manguito que rodea el tallo, con cromófobas y gonadotropas.", "d": "Por defecto (lo más preguntado con flechas): banda entre adeno y neurohipófisis con {{quistes de Rathke}} (folículos con coloide) y células basófilas → **pars intermèdia**. Criterio: vesículas/quistes coloideos en la zona limítrofe.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-029:311719213", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-030", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25", "enunciado": "D'entre les cèl·lules que constitueixen el parènquima de l'adenohipòfisi, quines presenten els grànuls de secreció més grans?", "opciones": {"a": "Cèl·lules somatotropes.", "b": "Cèl·lules mamotropes.", "c": "Cèl·lules tirotropes.", "d": "Cèl·lules gonadotropes."}, "correcta": "c", "razones": {"a": "Las somatotropas (GH) tienen gránulos densos pero no los mayores.", "b": "Las mamotropas (prolactina) tienen gránulos grandes (~600 nm) pero la clave oficial marca tirotropas.", "c": "CORRECTA (clave oficial 2024-25 = C): las **cèl·lules tirotropes** presentan los gránulos de secreción de mayor tamaño según el criterio del profesor (gránulos pequeños y periféricos en otras versiones — atender a la clave). Memorizar tal cual cae.", "d": "Las gonadotropas tienen gránulos de tamaño intermedio.", "confianza": "media"}, "_k": "org2p-030:1020345631", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-031", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25", "enunciado": "De les característiques mencionades a continuació, quina és pròpia de les cèl·lules de la capa fasciculada de l'escorça suprarenal?", "opciones": {"a": "Són les més abundants i grans en l'escorça.", "b": "Freqüentment són binucleades.", "c": "Són les que presenten més gotes de lípids.", "d": "Totes les anteriors."}, "correcta": "d", "razones": {"a": "Cierta: las células de la **fascicular** son las más abundantes y grandes (espongiocitos).", "b": "Cierta: con frecuencia son {{binucleades}}.", "c": "Cierta: son las que tienen más {{gotes de lípids}} (aspecto espongioso/vacuolado).", "d": "CORRECTA (clave oficial 2024-25 = D): {{todas}} las características son propias de la zona fascicular."}, "_k": "org2p-031:2755075368", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-032", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; concepto mesangiales fagocíticas", "enunciado": "Un dels tipus cel·lulars que es citen a continuació i que formen part del ronyó presenta una important capacitat fagocítica, quin?", "opciones": {"a": "Podòcits.", "b": "Cèl·lules juxtaglomerulars.", "c": "Cèl·lules mesangials extraglomerulars.", "d": "Cèl·lules mesangials intraglomerulars."}, "correcta": "d", "razones": {"a": "Los **podòcits** forman la capa visceral de Bowman (barrera de filtración); no son fagocíticos.", "b": "Las **juxtaglomerulars** secretan renina (músculo liso modificado).", "c": "Las mesangiales extraglomerulares (células de Lacis) forman parte del aparato yuxtaglomerular, función de soporte/señal.", "d": "CORRECTA (clave oficial 2024-25 = D): las **cèl·lules mesangials intraglomerulars** tienen importante capacidad {{fagocítica}} (limpian la barrera de filtración) además de contráctil y de soporte."}, "_k": "org2p-032:3695461526", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-033", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; espermatogénesis", "enunciado": "De les cèl·lules germinals del testicle que es citen a continuació, quina experimenta la primera divisió meiòtica?", "opciones": {"a": "Espermatogoni tipus A.", "b": "Espermatòcit secundari.", "c": "Espermàtida.", "d": "Cap de les anteriors."}, "correcta": "d", "razones": {"a": "El espermatogonio tipo A se divide por {{mitosi}} (mantiene la población madre).", "b": "El **espermatòcit secundari** ya completó la 1ª meiosis; realiza la {{2ª división meiótica}}.", "c": "La espermátida es haploide, ya no se divide (entra en espermiogénesis).", "d": "CORRECTA (clave oficial 2024-25 = D): la 1ª división meiótica la realiza el **espermatòcit PRIMARI**, que no figura entre las opciones → 'cap de les anteriors'."}, "_k": "org2p-033:2571902369", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-034", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; foliculogénesis", "enunciado": "Quina de les següents afirmacions sobre el desenvolupament dels fol·licles ovàrics NO és correcta?", "opciones": {"a": "Els fol·licles primordials estan formats per un oòcit rodejat només per una capa de cèl·lules aplanades.", "b": "La teca externa dels fol·licles secundaris està formada per cèl·lules de tipus fibrós que presenten receptors per l'FSH.", "c": "Els cossos de Call-Exner són propis dels fol·licles secundaris.", "d": "Els fol·licles de Graaf estan formats per múltiples capes de cèl·lules de la granulosa i una gran cavitat antral."}, "correcta": "b", "razones": {"a": "Cierta: el folículo primordial = oocito + una capa de células {{planas}} (foliculares).", "b": "FALSA (clave oficial 2024-25 = B): la **teca externa** es fibrosa/conjuntiva y NO tiene receptores hormonales relevantes; los receptores para {{FSH}} están en las células de la {{granulosa}}, y los de LH en la teca interna. Confunde teca externa con la función hormonal.", "c": "Cierta: los **cuerpos de Call-Exner** (acúmulos de material entre células de granulosa) son propios de los folículos secundarios.", "d": "Cierta: el folículo de **Graaf** (maduro) tiene gran cavidad {{antral}} y múltiples capas de granulosa."}, "_k": "org2p-034:4180501367", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-035", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; epitelio corneal", "enunciado": "Respecte a l'epiteli còrnia, és cert que:", "opciones": {"a": "Està molt vascularitzat.", "b": "Es localitza en la superfície posterior de la còrnia.", "c": "Conté terminacions nervioses.", "d": "Conté melanòcits."}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (su transparencia depende de ello).", "b": "Falsa: el epitelio corneal está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA (clave oficial 2024-25 = C): el epitelio corneal anterior está muy {{inervado}} (terminaciones nerviosas libres → gran sensibilidad).", "d": "Falsa: no contiene melanocitos."}, "_k": "org2p-035:1016765299", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-036", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; órgano de Corti", "enunciado": "L'òrgan de Corti de l'oïda interna:", "opciones": {"a": "No presenta otòlits.", "b": "Les cèl·lules ciliades presenten estereocilis i cinocili.", "c": "La cúpula cobreix les seves ciliades.", "d": "Es localitza a la membrana vestibular."}, "correcta": "a", "razones": {"a": "CORRECTA (clave oficial 2024-25 = A): el **òrgan de Corti** {{NO tiene otolitos}} (los otolitos están en las máculas del utrículo/sáculo). Está cubierto por la membrana tectoria.", "b": "Falsa: las células ciliadas cocleares maduras tienen estereocilios pero {{pierden el cinocilio}}.", "c": "Falsa: la **cúpula** cubre las crestas ampollares (canales semicirculares), no el Corti (lo cubre la {{membrana tectòria}}).", "d": "Falsa: el Corti se asienta sobre la **membrana basilar**, no la vestibular (de Reissner)."}, "_k": "org2p-036:1173687538", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-043", "tema": "Digestivo", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; concepto estómago repetido", "enunciado": "De les següents afirmacions que fan referència a l'estómac una NO és certa:", "opciones": {"a": "Les cèl·lules mucoses superficials sintetitzen mucina que s'emmagatzema en grànuls de secreció ovals a la base de les glàndules gàstriques.", "b": "Les cèl·lules principals o pèptiques es localitzen majoritàriament en la base de les glàndules gàstriques.", "c": "Les cèl·lules oxíntiques o parietals es distingeixen per ser cèl·lules grans i tenir un citoplasma molt acidòfil.", "d": "Les cèl·lules G productores de gastrina es troben principalment en glàndules de la regió fúndica."}, "correcta": "d", "razones": {"a": "Cierta: las mucosas superficiales acumulan mucinógeno apical.", "b": "Cierta: las **principals/pèptiques** predominan en la {{base}} de las glándulas.", "c": "Cierta: las **oxíntiques/parietals** son grandes y muy {{acidòfiles/eosinòfiles}}.", "d": "FALSA (clave oficial 2022-23 = D): las **cèl·lules G** (gastrina) están principalmente en la región {{pilòrica/antral}}, NO en el fundus."}, "_k": "org1p-043:478643080", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-044", "tema": "Digestivo", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; células M", "enunciado": "Les cèl·lules M es troben majoritàriament en una de les regions del tub digestiu que es citen a continuació, quina?", "opciones": {"a": "Duodè.", "b": "Jejú.", "c": "Ili.", "d": "Còlon."}, "correcta": "c", "razones": {"a": "Pocas células M en duodeno.", "b": "Pocas en yeyuno.", "c": "CORRECTA (clave oficial 2022-23 = C): las **cèl·lules M** (microfold) están sobre las {{placas de Peyer}}, máximas en el {{ili}} (donde el tejido linfoide es más abundante).", "d": "No predominan en colon."}, "_k": "org1p-044:3852311501", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-037", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; antro folicular", "enunciado": "En quin dels següents tipus de fol·licles es comença a desenvolupar el que anomenem antre fol·licular?", "opciones": {"a": "Fol·licles primordials.", "b": "Fol·licles primaris.", "c": "Fol·licles secundaris.", "d": "Fol·licles de De Graaf."}, "correcta": "c", "razones": {"a": "El primordial es oocito + 1 capa plana, sin antro.", "b": "El primario tiene zona pelúcida y granulosa, aún sin cavidad.", "c": "CORRECTA (clave oficial 2022-23 = C): el **antre fol·licular** (cavidad con líquido) aparece por primera vez en el folículo {{secundari}} (antral).", "d": "El de Graaf ya tiene un gran antro consolidado (no es donde 'empieza')."}, "_k": "org2p-037:658667307", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-038", "tema": "Oído", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; cresta ampollar vs otolitos", "enunciado": "Quins dels següents components NO estan presents a la cresta ampul·lar?", "opciones": {"a": "Otòlits.", "b": "Cúpula.", "c": "Cèl·lules ciliades amb cinocili.", "d": "Cèl·lules de suport."}, "correcta": "a", "razones": {"a": "CORRECTA (clave oficial 2022-23 = A): los **otòlits** NO están en la cresta ampollar; son propios de las {{màcules}} (utrículo/sáculo). La cresta usa la cúpula gelatinosa sin otolitos.", "b": "La cresta SÍ tiene **cúpula** (cubierta gelatinosa).", "c": "Las células ciliadas vestibulares SÍ conservan {{cinocili}}.", "d": "Hay células de soporte."}, "_k": "org2p-038:3143488685", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-039", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; poliespermia/gránulos corticales", "enunciado": "Durant la fecundació, quin dels següents processos contribueix a evitar la poliespèrmia de forma primària?", "opciones": {"a": "L'activació de la reacció acrosòmica de l'oòcit.", "b": "Un canvi en el potencial de membrana de l'oòcit.", "c": "La unió de ZP3 als receptors de la membrana de l'espermatozoide.", "d": "A) i B) són certes."}, "correcta": "b", "razones": {"a": "Falsa: la reacción acrosómica la realiza el {{espermatozoide}}, no el oocito, y facilita la entrada (no la bloquea).", "b": "CORRECTA (clave oficial 2022-23 = B): el bloqueo {{primario/rápido}} de la poliespermia es la {{despolarización}} (cambio del potencial de membrana del oocito). El bloqueo lento/secundario es la reacción cortical (exocitosis de gránulos corticales → endurecimiento de la zona pelúcida).", "c": "Falsa: ZP3 media el reconocimiento espermatozoide-zona, no el bloqueo de poliespermia.", "d": "Falsa: solo B es el mecanismo primario."}, "_k": "org2p-039:1128606028", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-040", "tema": "Embriología", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; notocordio", "enunciado": "Respecte a la formació del notocordi, senyala la resposta correcta:", "opciones": {"a": "La placa notocordal es tanca simultàniament en tot l'embrió.", "b": "La prolongació notocordal s'origina per la proliferació i migració de cèl·lules del mesoderma des del nòdul primitiu.", "c": "Senyals procedents del tub neural indueixen la formació del notocordi.", "d": "La placa neural està constituïda per la regió ventral del conducte notocordal."}, "correcta": "b", "razones": {"a": "Falsa: el proceso es {{progresivo (craneocaudal)}}, no simultáneo.", "b": "CORRECTA (clave oficial 2022-23 = B): la **prolongación notocordal** se origina por proliferación y migración de células desde el {{nòdul primitiu}} (nódulo de Hensen), hacia craneal.", "c": "Falsa: es justo al revés — el {{notocordi}} INDUCE al ectodermo a formar la placa neural, no al revés.", "d": "Falsa: la placa neural deriva del {{ectoderma}} dorsal por inducción notocordal, no del conducto notocordal ventral."}, "_k": "org2p-040:3336875001", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-041", "tema": "Embriología", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; capas germinales", "enunciado": "Senyala l'afirmació que és certa:", "opciones": {"a": "A partir de l'hipoblast es forma mesoderma i ectoderma.", "b": "La formació de l'esbós primitiu (línia primitiva) succeeix durant la segona setmana embrionària.", "c": "La formació de l'esbós primitiu succeeix durant la quarta setmana embrionària.", "d": "Cap de les anteriors és certa."}, "correcta": "d", "razones": {"a": "Falsa: del **epiblast** (no hipoblast) derivan las tres capas (ecto, meso y endodermo).", "b": "Falsa: la **línea primitiva** aparece en la {{3ª}} semana (gastrulación), no en la 2ª.", "c": "Falsa: tampoco es la 4ª semana.", "d": "CORRECTA (clave oficial 2022-23 = D): ninguna afirmación es correcta (la línea primitiva surge en la 3ª semana, a partir del epiblasto)."}, "_k": "org2p-041:512524902", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-045", "tema": "Digestivo", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; fibras de Sharpey", "enunciado": "Les anomenades fibres de Sharpey de la dent corresponen a:", "opciones": {"a": "Part de l'estructura dels ameloblasts.", "b": "Prolongacions dels odontoblasts.", "c": "La unitat estructural del ciment de l'arrel dentària.", "d": "Fibres de col·lagen de la membrana periodontal."}, "correcta": "d", "razones": {"a": "Falsa: los ameloblastos forman esmalte (sus prolongaciones son las fibras de Tomes del esmalte).", "b": "Falsa: las prolongaciones de los odontoblastos son las **fibras de Tomes de la dentina**.", "c": "Falsa: no son la unidad del cemento.", "d": "CORRECTA (clave oficial 2021-22 = D): las **fibras de Sharpey** son las fibras de {{col·lagen}} del ligamento/membrana periodontal que se insertan en el cemento y el hueso alveolar (anclan el diente)."}, "_k": "org1p-045:2576044011", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-046", "tema": "Digestivo", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; glándulas de Von Ebner serosas", "enunciado": "En l'ésser humà, de les glàndules salivals menors que es citen a continuació, quines són de naturalesa exclusivament serosa?", "opciones": {"a": "Glàndules labials.", "b": "Glàndules de les galtes.", "c": "Glàndules de Von Ebner.", "d": "Glàndules palatines."}, "correcta": "c", "razones": {"a": "Las glándulas labiales son {{mixtas/mucosas}}.", "b": "Las geniales (mejillas) son mixtas.", "c": "CORRECTA (clave oficial 2021-22 = C): las **glàndules de Von Ebner** (asociadas a las papilas caliciformes/circunvaladas) son las únicas glándulas salivales menores {{exclusivamente seroses}}; limpian el surco para la gustación.", "d": "Las palatinas son {{mucoses}}."}, "_k": "org1p-046:2299895235", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-047", "tema": "Digestivo", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; predominio celular gástrico", "enunciado": "En la regió del cos de l'estómac, quin és el lloc de predomini de les cèl·lules principals (zimògenes)?", "opciones": {"a": "Cristes gàstriques.", "b": "Istme de les glàndules.", "c": "Coll de les glàndules.", "d": "Base de les glàndules."}, "correcta": "d", "razones": {"a": "Las foveolas/criptas son la desembocadura (células mucosas superficiales).", "b": "El istmo aloja células madre y parietales.", "c": "El cuello tiene células mucosas del cuello y parietales.", "d": "CORRECTA (clave oficial 2021-22 = D): las **cèl·lules principals/zimògenes** (pepsinógeno) predominan en la {{base}} de las glándulas gástricas."}, "_k": "org1p-047:14061415", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-048", "tema": "Digestivo", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; células de Ito", "enunciado": "De les cèl·lules dels sinusoides hepàtics, quina emmagatzema lípids en notable quantitat en condicions normals?", "opciones": {"a": "Cèl·lules de Kupffer.", "b": "Cèl·lules endotelials.", "c": "Cèl·lules d'Ito o estrellades.", "d": "Hepatòcits."}, "correcta": "c", "razones": {"a": "Las **cèl·lules de Kupffer** son macrófagos del sinusoide (fagocitosis), no almacén de lípidos.", "b": "Las endoteliales tapizan el sinusoide.", "c": "CORRECTA (clave oficial 2021-22 = C): las **cèl·lules d'Ito (estrelladas/lipocitos)**, en el espacio de Disse, almacenan {{lípidos y vitamina A}}. En fibrosis se transforman en miofibroblastos.", "d": "Los hepatocitos almacenan glucógeno y algo de lípido, pero el almacén característico de vitamina A/lípidos es la célula de Ito."}, "_k": "org1p-048:1342018383", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-042", "tema": "Endocrino", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; gránulo célula beta", "enunciado": "Quina cèl·lula dels illots de Langerhans presenta grànuls de secreció amb una estructura poligonal electrodensa (cristal·loide) que destaca sobre el fons clar del grànul?", "opciones": {"a": "Cèl·lules A o alfa.", "b": "Cèl·lules B o beta.", "c": "Cèl·lules D o delta.", "d": "Cèl·lules PP."}, "correcta": "b", "razones": {"a": "El gránulo alfa (glucagón) es denso y homogéneo con halo estrecho.", "b": "CORRECTA (clave oficial 2021-22 = B): la **cèl·lula beta** (insulina) tiene gránulos con un núcleo {{cristal·loide poligonal electrodens}} (cristales de insulina-Zn) rodeado de halo claro. Rasgo ultraestructural típico.", "c": "La célula D (somatostatina) tiene gránulo grande pálido homogéneo.", "d": "La PP tiene gránulos pequeños."}, "_k": "org2p-042:2606232002", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-043", "tema": "Reproductor", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; próstata", "enunciado": "En relació amb la pròstata, una de les següents afirmacions NO és correcta:", "opciones": {"a": "El parènquima glandular és un epiteli prismàtic simple o pseudoestratificat.", "b": "Les cèl·lules de l'epiteli prostàtic presenten un RER escàs i un Golgi poc desenvolupat.", "c": "Les secrecions prostàtiques són riques en fosfatasa àcida.", "d": "És freqüent trobar glicoproteïnes calcificades (cossos amilacis) en la llum de les glàndules."}, "correcta": "b", "razones": {"a": "Cierta: el epitelio prostático es {{cilíndric simple o pseudoestratificat}}.", "b": "FALSA (clave oficial 2021-22 = B): siendo una glándula secretora activa, las células prostáticas tienen RER y **Golgi** {{bien desarrollados}}, no escasos.", "c": "Cierta: la secreción es rica en {{fosfatasa àcida}} (y PSA).", "d": "Cierta: los **cossos amilacis** (concreciones calcificadas) son frecuentes en la luz glandular, sobre todo con la edad."}, "_k": "org2p-043:3503479966", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-044", "tema": "Urinario", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; podocitos", "enunciado": "Una de les següents afirmacions referents a la nefrona és certa:", "opciones": {"a": "La capa parietal de la càpsula de Bowman és un epiteli pla estratificat.", "b": "Els podòcits formen la capa visceral de la càpsula de Bowman.", "c": "Els podòcits i les cèl·lules endotelials glomerulars tenen làmines basals independents.", "d": "Les ranures de filtració queden entre les prolongacions primàries dels podòcits."}, "correcta": "b", "razones": {"a": "Falsa: la capa parietal de Bowman es epitelio {{pla SIMPLE}} (no estratificado).", "b": "CORRECTA (clave oficial 2021-22 = B): los **podòcits** constituyen la capa {{visceral}} de la cápsula de Bowman, abrazando los capilares glomerulares con sus pedicelos.", "c": "Falsa: podocitos y endotelio {{comparten}} una misma lámina basal (la membrana basal glomerular).", "d": "Falsa: las ranuras de filtración quedan entre los {{pedicelos (procesos secundarios)}}, no entre las prolongaciones primarias."}, "_k": "org2p-044:4272220541", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-045", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; laberinto membranoso", "enunciado": "És cert que el laberint membranós:", "opciones": {"a": "Està localitzat a l'oïda mitjana.", "b": "És més gran que el laberint ossi.", "c": "Conté l'òrgan de Corti, però no conté les màcules de l'utricle i el sàcul.", "d": "Cap de les anteriors és certa."}, "correcta": "d", "razones": {"a": "Falsa: el laberinto membranoso está en el {{oído interno}}, dentro del laberinto óseo.", "b": "Falsa: es {{más pequeño}} que el óseo (va suspendido en la perilinfa dentro de él).", "c": "Falsa: el laberinto membranoso contiene el órgano de Corti {{Y TAMBIÉN}} las máculas del utrículo y el sáculo (y las crestas ampollares).", "d": "CORRECTA (clave oficial 2021-22 = D): ninguna es correcta (todas tienen un error)."}, "_k": "org2p-045:3101092891", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-049", "tema": "Digestivo", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Marcada 2020-21; fibras de Tomes", "enunciado": "Les fibres de Tomes o de la dentina es troben constituïdes per les prolongacions de quins tipus cel·lulars?", "opciones": {"a": "Odontoblasts.", "b": "Ameloblasts.", "c": "Cimentòcits.", "d": "Cap dels anteriors."}, "correcta": "a", "razones": {"a": "CORRECTA (marcada 2020-21 = A): las **fibras de Tomes de la dentina** son las prolongaciones citoplasmáticas de los {{odontoblasts}}, alojadas en los túbulos dentinarios.", "b": "Los ameloblastos tienen su 'proceso de Tomes' pero referido al esmalte, no a la dentina.", "c": "Los cementocitos forman cemento.", "d": "Incorrecta: sí hay respuesta (odontoblastos)."}, "_k": "org1p-049:2939384516", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-046", "tema": "Reproductor", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; cristales de Reinke", "enunciado": "Els anomenats cristalls de Reinke són propis d'un dels següents tipus cel·lulars:", "opciones": {"a": "Espermatogonis de tipus A foscos.", "b": "Cèl·lules glandulars de la pròstata.", "c": "Cèl·lules de Sertoli.", "d": "Cèl·lules de Leydig."}, "correcta": "d", "razones": {"a": "Falsa: los espermatogonios no tienen cristales de Reinke.", "b": "Falsa: no son prostáticos.", "c": "Falsa: las **Sertoli** tienen los cristaloides de Charcot-Böttcher, no los de Reinke.", "d": "CORRECTA (marcada 2020-21 = D): los **cristalls de Reinke** son inclusiones citoplasmáticas propias de las **cèl·lules de Leydig** {{(intersticiales, productoras de testosterona)}}."}, "_k": "org2p-046:1479888528", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-047", "tema": "Urinario", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; glándulas de Littré", "enunciado": "Les anomenades glàndules de Littré són pròpies de:", "opciones": {"a": "La uretra peniana (esponjosa).", "b": "La uretra membranosa.", "c": "La uretra prostàtica.", "d": "La uretra femenina."}, "correcta": "a", "razones": {"a": "CORRECTA (marcada 2020-21 = A): las **glàndules de Littré** son glándulas mucosas de la **uretra peniana/esponjosa** {{(uretra masculina)}}; lubrican el epitelio uretral.", "b": "No son de la uretra membranosa.", "c": "No son prostáticas.", "d": "No son de la uretra femenina."}, "_k": "org2p-047:2347081555", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-048", "tema": "Embriología", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; bloqueo poliespermia permanente", "enunciado": "Durant la fecundació, quin dels següents processos contribueix a evitar la polispèrmia de forma permanent?", "opciones": {"a": "L'exocitosi dels grànuls corticals de l'oòcit.", "b": "Un canvi en el potencial de membrana de l'oòcit.", "c": "La unió de ZP3 als receptors de la membrana de l'espermatozoide.", "d": "A) i B) són certes."}, "correcta": "a", "razones": {"a": "CORRECTA (marcada 2020-21 = A): el bloqueo {{permanente/lento}} es la **reacción cortical**: la exocitosis de los {{grànuls corticals}} modifica la zona pelúcida (reacción de zona) e impide la entrada de más espermatozoides.", "b": "El cambio de potencial de membrana es el bloqueo {{rápido/primario}}, NO el permanente.", "c": "ZP3 media el reconocimiento inicial, no el bloqueo.", "d": "Falsa: solo A es el mecanismo permanente."}, "_k": "org2p-048:2457259720", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-049", "tema": "Embriología", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; somitas", "enunciado": "En relació amb la formació dels somites, senyala la resposta correcta:", "opciones": {"a": "Es formen a partir de la segmentació del mesoderma intermedi.", "b": "Es formen tots els somites simultàniament.", "c": "La formació dels somites s'inicia en la regió caudal de l'embrió.", "d": "Cap de les anteriors és certa."}, "correcta": "d", "razones": {"a": "Falsa: los **somites** derivan del mesodermo {{paraxial}}, no del intermedio (el intermedio forma el aparato urogenital).", "b": "Falsa: se forman {{secuencialmente}} (uno a uno), no a la vez.", "c": "Falsa: la somitogénesis empieza en la región {{cranial}} y progresa hacia caudal.", "d": "CORRECTA (marcada 2020-21 = D): ninguna es correcta (los somitas vienen del mesodermo paraxial, se forman secuencial y cranio-caudalmente)."}, "_k": "org2p-049:2679114474", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-050", "tema": "Reproductor", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; cuerpo lúteo/células del hilio", "enunciado": "Una de les següents afirmacions en relació amb l'ovari NO és certa:", "opciones": {"a": "Les cèl·lules luteíniques de la granulosa del cos lutí produeixen principalment progesterona.", "b": "Les cèl·lules luteíniques de la teca del cos lutí produeixen principalment estrògens.", "c": "Les cèl·lules epitelials de l'hili produeixen majoritàriament estrògens.", "d": "El fol·licle dominant produeix inhibina."}, "correcta": "c", "razones": {"a": "Cierta: las luteínicas de la granulosa producen sobre todo {{progesterona}}.", "b": "Cierta: las luteínicas de la teca producen {{estrògens}} (y andrógenos precursores).", "c": "FALSA (marcada 2020-21 = C): las **cèl·lules del hili ovàric** (células de Berger/hiliares) producen principalmente {{andrógenos}} (testosterona), no estrógenos; son análogas a las de Leydig.", "d": "Cierta: el folículo dominante produce {{inhibina}}."}, "_k": "org2p-050:852941083", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-050", "tema": "Cor", "examen": "2019 + 2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23, 2025-26", "enunciado": "En relación con el **corazón**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Las válvulas auriculoventriculares son más finas que las arteriales.", "b": "Las válvulas cardíacas están revestidas por endocardio.", "c": "Las fibras elásticas del miocardio de las aurículas son poco abundantes en comparación con las de los ventrículos.", "d": "El miocardio es más grueso en los ventrículos que en las aurículas."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Las válvulas {{auriculoventriculares}} son las más {{gruesas}}; las arteriales (semilunares) son las más finas. Distractor clásico que invierte el grosor.", "b": "Cierta: las válvulas son repliegues del {{endocardio}} con un eje central de tejido conjuntivo denso.", "c": "Cierta: las fibras {{elásticas}} son más abundantes en aurículas... cuidado, en realidad son MÁS abundantes en aurículas; el enunciado oficial la da como verdadera porque compara correctamente la riqueza relativa.", "d": "Cierta: el {{miocardio ventricular}} es mucho más grueso (sobre todo el izquierdo) que el auricular por la mayor carga de presión."}, "_k": "org1p-050:2502450822", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-051", "tema": "Cor", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "En relación con el **sistema de conducción cardíaco**, una afirmación **NO** es cierta:", "opciones": {"a": "Las fibras de Purkinje se distribuyen en la capa subendocárdica de los ventrículos.", "b": "Las fibras nodales presentan escasas miofibrillas.", "c": "Las fibras de Purkinje son ricas en mitocondrias.", "d": "Las fibras de Purkinje están unidas entre sí por numerosos discos intercalares completos como el miocardio común."}, "correcta": "d", "razones": {"a": "Cierta: las fibras de {{Purkinje}} ocupan la capa {{subendocárdica}} ventricular.", "b": "Cierta: las fibras {{nodales}} (nodo SA y AV) tienen pocas {{miofibrillas}} y son de pequeño tamaño.", "c": "Cierta: las Purkinje son grandes, pálidas, ricas en {{glucógeno}} y {{mitocondrias}}, con pocas miofibrillas periféricas.", "d": "CORRECTA (es la FALSA). Las Purkinje se unan por {{uniones gap}} y desmosomas, pero sus discos intercalares son {{escasos e incompletos}}, no numerosos como en el miocardio contráctil."}, "_k": "org1p-051:471551570", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-052", "tema": "Vasos", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "", "enunciado": "En relación con los **nervios vasomotores simpáticos** que inervan los vasos sanguíneos, **NO** es cierto que:", "opciones": {"a": "Son postganglionares.", "b": "Generalmente provocan vasodilatación.", "c": "Son más abundantes en las arterias que en las venas.", "d": "Su neurotransmisor es la noradrenalina."}, "correcta": "b", "razones": {"a": "Cierta: son fibras simpáticas {{postganglionares}} amielínicas que llegan a la adventicia.", "b": "CORRECTA (es la FALSA). El tono simpático sobre el músculo liso vascular produce {{vasoconstricción}}, no vasodilatación.", "c": "Cierta: la inervación vasomotora es más densa en {{arterias}} (control de resistencia) que en venas.", "d": "Cierta: el neurotransmisor es la {{noradrenalina}} sobre receptores alfa-adrenérgicos."}, "_k": "org1p-052:2870361707", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-053", "tema": "Vasos", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "De los siguientes tipos arteriales, ¿en cuál **NO** se encuentra **lámina elástica interna**?", "opciones": {"a": "Arterias elásticas.", "b": "Arterias musculares.", "c": "Arteriolas.", "d": "Metarteriolas."}, "correcta": "d", "razones": {"a": "Tienen lámina elástica interna, aunque queda enmascarada entre las numerosas {{láminas elásticas}} fenestradas de la media.", "b": "La arteria {{muscular}} presenta una lámina elástica interna muy marcada y bien definida.", "c": "Las {{arteriolas}} aún conservan una lámina elástica interna fina o discontinua.", "d": "CORRECTA. Las {{metarteriolas}} carecen de lámina elástica interna (la media es ya muy reducida, con células musculares aisladas)."}, "_k": "org1p-053:3296545405", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-054", "tema": "Vasos", "examen": "2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**NO** es una característica propia de los **capilares fenestrados**:", "opciones": {"a": "Presentar fenestraciones cerradas por diafragmas de grosor similar al de la membrana plasmática.", "b": "Presentar una lámina basal continua.", "c": "Presentar pericitos formando parte de su pared.", "d": "Tener células endoteliales unidas entre sí mediante uniones oclusivas (zonula occludens) que impiden el paso."}, "correcta": "d", "razones": {"a": "Cierta: las fenestraciones de la mayoría de capilares fenestrados están cerradas por un {{diafragma}} fino (excepto en el glomérulo renal).", "b": "Cierta: a diferencia de los sinusoides, los fenestrados conservan una lámina basal {{continua}}.", "c": "Cierta: los {{pericitos}} envuelven el endotelio y comparten su lámina basal.", "d": "CORRECTA (es la FALSA). Las {{uniones oclusivas}} herméticas son típicas de los capilares {{continuos}} (barrera hematoencefálica), no del rasgo definitorio del fenestrado, cuya función es el intercambio rápido."}, "_k": "org1p-054:2137398582", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-055", "tema": "Vasos", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept", "enunciado": "En las **arterias elásticas**, ¿cuál es la capa de mayor grosor?", "opciones": {"a": "Túnica media.", "b": "Túnica íntima.", "c": "Túnica adventicia.", "d": "Las tres tienen igual grosor."}, "correcta": "a", "razones": {"a": "CORRECTA. La capa más gruesa es la túnica {{media}}, formada por numerosas {{láminas elásticas}} fenestradas concéntricas (40-70) que amortiguan la onda de pulso.", "b": "La {{íntima}} es relativamente gruesa para una arteria pero menor que la media.", "c": "La {{adventicia}} es comparativamente delgada en las elásticas.", "d": "Falso: predomina claramente la {{media}}."}, "_k": "org1p-055:66905895", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-056", "tema": "Vasos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Respecto a la **arteria muscular**, señala la afirmación que **NO** es propia de ella:", "opciones": {"a": "La túnica adventicia es muy gruesa, mayor que la media.", "b": "Presenta lámina elástica interna bien definida.", "c": "La túnica media está dominada por músculo liso dispuesto circularmente.", "d": "Puede presentar lámina elástica externa entre media y adventicia."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). En la arteria muscular domina la túnica {{media}} (músculo liso); la {{adventicia}} es de grosor similar o menor a la media, no la mayor.", "b": "Cierta: la {{lámina elástica interna}} es prominente y ondulada en H-E.", "c": "Cierta: la media tiene muchas capas de {{músculo liso}} circular, que controla el calibre.", "d": "Cierta: las musculares grandes tienen {{lámina elástica externa}} separando media y adventicia."}, "_k": "org1p-056:3368235452", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-057", "tema": "Respiratorio", "examen": "2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "En relación con las **células olfatorias**, una afirmación **NO** es cierta:", "opciones": {"a": "Son neuronas bipolares.", "b": "Sus prolongaciones apicales constituyen los filamentos olfatorios.", "c": "Tienen cilios inmóviles inmersos en una película líquida.", "d": "Sus cuerpos celulares se disponen en el pericondrio subyacente."}, "correcta": "d", "razones": {"a": "Cierta: la célula olfatoria es una {{neurona bipolar}}, único caso de neurona en contacto con el medio externo.", "b": "Cierta: sus prolongaciones apicales (vesícula + cilios) constituyen los {{filamentos olfatorios}}.", "c": "Cierta: presentan cilios {{inmóviles}} (no móviles) bañados por la secreción de las glándulas de Bowman, donde se disuelven los odorantes.", "d": "CORRECTA (es la FALSA). Los somas (cuerpos celulares) se sitúan en posición {{central}} dentro del {{epitelio}} olfatorio, no en el pericondrio."}, "_k": "org1p-057:1351789484", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-058", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "¿Qué región(es) de la **faringe** está(n) revestida(s) por **epitelio respiratorio** (pseudoestratificado ciliado)?", "opciones": {"a": "Pared posterior y paredes laterales de la nasofaringe.", "b": "Orofaringe.", "c": "Laringofaringe.", "d": "Toda la faringe por igual."}, "correcta": "a", "razones": {"a": "CORRECTA. Solo la {{nasofaringe}} (vía aérea) tiene epitelio {{respiratorio}} pseudoestratificado ciliado.", "b": "La {{orofaringe}} (paso de aire y alimento) tiene epitelio plano estratificado no queratinizado.", "c": "La {{laringofaringe}} también es plano estratificado no queratinizado por el roce del bolo.", "d": "Falso: el epitelio cambia según la función mecánica de cada región."}, "_k": "org1p-058:1186018919", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-059", "tema": "Respiratorio", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "¿En qué región(es) de la **laringe** encontramos **epitelio plano estratificado no queratinizado**?", "opciones": {"a": "Cuerdas vocales.", "b": "Solo en una porción de la cara dorsal de la epiglotis.", "c": "Cara anterior (lingual) de la epiglotis.", "d": "En las cuerdas vocales y en una porción de la cara dorsal de la epiglotis."}, "correcta": "d", "razones": {"a": "Las {{cuerdas vocales}} verdaderas están cubiertas por plano estratificado no queratinizado por el roce, pero no es la única región.", "b": "Una porción de la cara {{dorsal}} (laríngea) de la epiglotis también lo presenta, no es la única.", "c": "La cara {{anterior/lingual}} de la epiglotis es plano estratificado, sí, pero la respuesta agrupa cuerdas vocales + dorsal de epiglotis.", "d": "CORRECTA. Coinciden el epitelio de las {{cuerdas vocales}} y de parte de la cara {{dorsal}} de la epiglotis (zonas de roce)."}, "_k": "org1p-059:218090441", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-060", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "De las siguientes afirmaciones sobre **bronquios y bronquiolos**, una **NO** es correcta:", "opciones": {"a": "La submucosa de los bronquios intrapulmonares contiene glándulas mucosas y mucoserosas.", "b": "Las células Club/clara contienen abundantes cuerpos multilaminares de aspecto electrodenso.", "c": "En los bronquios de pequeño calibre el epitelio es simple cúbico bajo con células ciliadas.", "d": "En el epitelio de los bronquiolos terminales encontramos numerosas células caliciformes."}, "correcta": "d", "razones": {"a": "Cierta: los {{bronquios}} aún tienen glándulas seromucosas en la submucosa.", "b": "Cierta: las células {{Club}} secretan surfactante/proteínas protectoras y tienen cuerpos multilaminares electrodensos.", "c": "Cierta: al disminuir el calibre el epitelio pasa a {{cúbico simple}} ciliado.", "d": "CORRECTA (es la FALSA). Los {{bronquiolos}} NO tienen células {{caliciformes}} ni glándulas ni cartílago; ese es su rasgo distintivo frente al bronquio."}, "_k": "org1p-060:2667121233", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-061", "tema": "Respiratorio", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "En relación con los **neumocitos tipo II**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Presentan cuerpos multilaminares con surfactante.", "b": "Tienen el aparato de Golgi poco desarrollado.", "c": "Pueden regenerar/restaurar a los neumocitos tipo I.", "d": "Son más numerosos pero cubren menos superficie alveolar que los tipo I."}, "correcta": "b", "razones": {"a": "Cierta: los {{cuerpos multilaminares}} (lamelares) almacenan el {{surfactante}} que reduce la tensión superficial.", "b": "CORRECTA (es la FALSA). El Golgi está {{bien desarrollado}} porque son células muy secretoras del surfactante.", "c": "Cierta: son las células {{progenitoras}} del epitelio alveolar y regeneran los tipo I dañados.", "d": "Cierta: son más {{numerosos}} pero redondeados, por lo que recubren menos superficie que los planos tipo I."}, "_k": "org1p-061:929419668", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-062", "tema": "Digestivo", "examen": "2021-junio + 2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23, 2025-26", "enunciado": "En relación con los **botones gustativos**, una afirmación es **cierta**:", "opciones": {"a": "Se localizan exclusivamente en la mucosa de la lengua.", "b": "Son estructuralmente distintos según la región de la lengua y el sabor que perciben.", "c": "Su tipo celular más abundante es la célula de sostén.", "d": "Cada célula neuroepitelial de una región solo presenta un único tipo de receptor para un sabor específico."}, "correcta": "c", "razones": {"a": "Falsa: también hay botones en {{paladar blando}}, epiglotis y faringe, no solo en la lengua.", "b": "Falsa: son {{estructuralmente idénticos}} en toda la lengua; la distribución de sabores no implica diferencias morfológicas.", "c": "CORRECTA. La célula más abundante es la {{célula de sostén}} (sustentacular); las glándulas de Von Ebren de las papilas caliciformes lavan los botones.", "d": "Falsa: una misma célula puede responder a {{varios estímulos}}; no hay correspondencia uno-a-uno célula-sabor."}, "_k": "org1p-062:2168090432", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-063", "tema": "Digestivo", "examen": "2021-junio + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2025-26", "enunciado": "Respecto a la **glándula sublingual**, un enunciado **NO** es correcto:", "opciones": {"a": "Es una glándula de secreción principalmente serosa en el ser humano.", "b": "Sus secreciones se vierten al suelo de la boca o a los conductos de la glándula submaxilar.", "c": "No presenta conductos intercalares.", "d": "No tiene una cápsula de tejido conjuntivo bien definida."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). La sublingual es mixta pero predominantemente {{mucosa}} en el humano, no serosa.", "b": "Cierta: drena por múltiples conductos pequeños al {{suelo de la boca}} o a los conductos de la {{submaxilar}}.", "c": "Cierta: prácticamente carece de conductos {{intercalares}} y estriados.", "d": "Cierta: no tiene una {{cápsula}} conjuntiva neta, a diferencia de la parótida."}, "_k": "org1p-063:1781599777", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-064", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2025-26", "enunciado": "De las partes del **diente**, ¿cuál tiene un origen **ectodérmico**?", "opciones": {"a": "Esmalte.", "b": "Dentina.", "c": "Cemento.", "d": "Membrana periodontal."}, "correcta": "a", "razones": {"a": "CORRECTA. El {{esmalte}} deriva del {{ectodermo}} (ameloblastos del órgano del esmalte).", "b": "La {{dentina}} es de origen mesenquimal/ectomesénquima (odontoblastos), no ectodérmica.", "c": "El {{cemento}} deriva del mesénquima del saco dentario (ectomesénquima).", "d": "La membrana {{periodontal}} es de origen mesodérmico/conjuntivo (fibras de Sharpey)."}, "_k": "org1p-064:1848778077", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-065", "tema": "Digestivo", "examen": "2021-junio", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, Unybook", "enunciado": "Las **fibras de Tomes** del diente corresponden a:", "opciones": {"a": "Prolongaciones citoplasmáticas de los odontoblastos.", "b": "Fibras de colágeno de la membrana periodontal.", "c": "Prolongaciones de los ameloblastos.", "d": "Cristales de hidroxiapatita del esmalte."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras de {{Tomes}} son las prolongaciones de los {{odontoblastos}} alojadas en los túbulos dentinarios.", "b": "Las fibras de colágeno de la membrana periodontal ancladas al cemento son las de {{Sharpey}}, no las de Tomes.", "c": "Los {{ameloblastos}} forman el esmalte mediante el proceso de Tomes, pero las fibras de Tomes son del odontoblasto.", "d": "Los cristales son producto del esmalte, no una fibra celular."}, "_k": "org1p-065:2995962908", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-066", "tema": "Digestivo", "examen": "2021-junio + 2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23, 2025-26", "enunciado": "En relación con el **esófago humano**, **NO** es cierto que:", "opciones": {"a": "La capa muscular del tercio medio está constituida exclusivamente por fibras musculares lisas.", "b": "El esfínter esofágico superior está constituido por el músculo cricofaríngeo.", "c": "Las glándulas esofágicas propias están formadas por células mucosas y serosas.", "d": "El epitelio de revestimiento es plano estratificado no queratinizado."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). El tercio medio es {{mixto}} (estriado + liso); el tercio superior es {{estriado esquelético}} y solo el inferior es exclusivamente liso.", "b": "Cierta: el esfínter superior corresponde al músculo {{cricofaríngeo}} (estriado).", "c": "Cierta: las glándulas esofágicas propias (en submucosa) son {{mucoserosas}}.", "d": "Cierta: el epitelio esofágico es plano estratificado {{no queratinizado}}."}, "_k": "org1p-066:3812092759", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-067", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "De las siguientes células, ¿cuál es la **menos abundante** en las **glándulas pilóricas** del estómago?", "opciones": {"a": "Células mucosas.", "b": "Células endocrinas.", "c": "Células oxínticas o parietales.", "d": "Células madre."}, "correcta": "c", "razones": {"a": "Las células {{mucosas}} son las predominantes en las glándulas pilóricas.", "b": "Las {{endocrinas}} (sobre todo células G de gastrina) son frecuentes en el píloro/antro.", "c": "CORRECTA. Las células {{oxínticas/parietales}} son escasísimas o ausentes en el píloro (abundan en fundus y cuerpo).", "d": "Las células {{madre}} están siempre presentes en el istmo/cuello para renovación."}, "_k": "org1p-067:3783228085", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-068", "tema": "Digestivo", "examen": "2021-junio + 2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2025-26", "enunciado": "En relación con las **células oxínticas (parietales) en actividad**, **NO** es cierto que:", "opciones": {"a": "Tienen invaginaciones profundas de la membrana que forman canalículos intracelulares muy desarrollados.", "b": "Su sistema tubulovesicular está poco desarrollado durante la fase de secreción activa.", "c": "Tienen abundantes mitocondrias.", "d": "Tienen numerosas microvellosidades proyectadas a la luz de los canalículos."}, "correcta": "b", "razones": {"a": "Cierta: en actividad desarrollan profundos {{canalículos intracelulares}} tapizados de microvellosidades.", "b": "CORRECTA (es la FALSA). En reposo predomina el {{sistema tubulovesicular}}; al activarse, ese sistema se {{fusiona}} con la membrana del canalículo (no está poco desarrollado, sino que se transforma en microvellosidades).", "c": "Cierta: son muy {{eosinófilas}} por su gran cantidad de {{mitocondrias}} (producen H+ por la bomba H+/K+ ATPasa).", "d": "Cierta: la luz del canalículo está cubierta por numerosas {{microvellosidades}}."}, "_k": "org1p-068:1623514422", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-069", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**NO** es una característica propia de las **células mucosas de superficie** del estómago:", "opciones": {"a": "Presentar microvellosidades cortas.", "b": "Tener un aparato de Golgi poco desarrollado.", "c": "Presentar complejos de unión en las caras laterales.", "d": "Tener abundantes gránulos esféricos electrodensos en la porción apical del citoplasma."}, "correcta": "b", "razones": {"a": "Cierta: tienen {{microvellosidades}} cortas en el polo apical.", "b": "CORRECTA (es la FALSA). El Golgi está {{bien desarrollado}}, ya que son células muy activas en la producción de moco neutro protector.", "c": "Cierta: presentan {{complejos de unión}} laterales que sellan el epitelio frente al ácido.", "d": "Cierta: acumulan {{gránulos de mucinógeno}} electrodensos en el ápice."}, "_k": "org1p-069:2899896461", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-070", "tema": "Digestivo", "examen": "2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2025-26", "enunciado": "En la región del cuello del estómago, ¿cuál es el lugar de **predominio de las células madre**?", "opciones": {"a": "Criptas gástricas.", "b": "Istmo de las glándulas.", "c": "Cuello de las glándulas.", "d": "Base de las glándulas."}, "correcta": "b", "razones": {"a": "Las {{criptas/fovéolas}} alojan células ya diferenciadas mucosas de superficie.", "b": "CORRECTA. Las células {{madre}} se concentran en el {{istmo}} de la glándula, desde donde migran arriba y abajo.", "c": "El {{cuello}} aloja sobre todo células mucosas del cuello.", "d": "La {{base}} aloja las células principales/zimógenas y algunas parietales."}, "_k": "org1p-070:2451693135", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-071", "tema": "Digestivo", "examen": "2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2025-26", "enunciado": "**NO** es una característica de las **células de Paneth**:", "opciones": {"a": "Tener forma piramidal.", "b": "Teñirse intensamente con colorantes ácidos/eosina en su zona apical, no con básicos en el núcleo.", "c": "Presentar un complejo de Golgi bien desarrollado.", "d": "Ser una población muy estable con escasa renovación."}, "correcta": "b", "razones": {"a": "Cierta: tienen forma {{piramidal}} con base ancha apoyada en la lámina basal.", "b": "CORRECTA (es la FALSA). El polo basal es muy {{basófilo}} (RER, núcleo) y se tiñe bien con colorantes {{básicos}}; los gránulos apicales (defensinas, lisozima) son eosinófilos. La afirmación está formulada al revés.", "c": "Cierta: tienen Golgi {{bien desarrollado}} por su secreción de péptidos antimicrobianos.", "d": "Cierta: a diferencia del resto del epitelio intestinal, son una población muy {{estable}} (poca renovación)."}, "_k": "org1p-071:808843392", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-072", "tema": "Digestivo", "examen": "2014-15 + 2021-junio + 2021-22 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2021-junio, 2021-22, 2025-26", "enunciado": "Sobre el **intestino delgado**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las vellosidades intestinales muestran su máximo desarrollo en la porción final del íleon.", "b": "Los pliegues de Kerckring (válvulas conniventes) son máximos en el yeyuno.", "c": "Las células de Paneth son una población muy estable con escasa renovación.", "d": "Los nódulos linfoides de la lámina propia son más numerosos y grandes a nivel del íleon."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Las {{vellosidades}} son máximas en {{duodeno y yeyuno}} y van disminuyendo hacia el íleon, no aumentando.", "b": "Cierta: los pliegues de {{Kerckring}} alcanzan su máximo en el {{yeyuno}}.", "c": "Cierta: las {{Paneth}} son población estable de escasa renovación.", "d": "Cierta: los {{nódulos linfoides}} (placas de Peyer) son máximos en el {{íleon}}."}, "_k": "org1p-072:362405850", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-073", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "¿Qué porción del **intestino delgado** está envuelta **completamente por peritoneo** (intraperitoneal)?", "opciones": {"a": "1ª porción del duodeno.", "b": "4ª porción del duodeno.", "c": "Yeyuno.", "d": "La 1ª porción del duodeno y el yeyuno."}, "correcta": "d", "razones": {"a": "La {{1ª porción}} del duodeno (bulbo) sí es intraperitoneal, pero no es la única.", "b": "La {{4ª porción}} del duodeno es retroperitoneal (fija a la pared posterior).", "c": "El {{yeyuno}} es intraperitoneal, suspendido por mesenterio, pero la respuesta agrupa ambas.", "d": "CORRECTA. Son intraperitoneales la {{1ª porción}} del duodeno y todo el {{yeyuno}} (e íleon); el resto del duodeno es retroperitoneal."}, "_k": "org1p-073:302066994", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-074", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "¿Qué tipos de **células endocrinas** se encuentran presentes en el **intestino delgado**?", "opciones": {"a": "Células secretoras de secretina.", "b": "Células secretoras de motilina.", "c": "Células secretoras de colecistocinina (CCK).", "d": "Todas las anteriores."}, "correcta": "d", "razones": {"a": "Cierta: las células {{S}} secretan {{secretina}} (estimula bicarbonato pancreático).", "b": "Cierta: las células {{M}} secretan {{motilina}} (regula la motilidad).", "c": "Cierta: las células {{I}} secretan {{CCK}} (contracción vesicular y enzimas pancreáticas).", "d": "CORRECTA. El intestino delgado posee un amplio sistema {{enteroendocrino}} difuso con todas estas células."}, "_k": "org1p-074:1755833785", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-075", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**NO** es una característica propia del **apéndice** vermiforme:", "opciones": {"a": "Glándulas escasas e irregulares.", "b": "Células caliciformes poco numerosas.", "c": "Ausencia total de células de Paneth.", "d": "Gran cantidad de nódulos linfoides en la lámina propia."}, "correcta": "c", "razones": {"a": "Cierta: las criptas son {{escasas e irregulares}}, poco profundas.", "b": "Cierta: hay {{pocas caliciformes}} respecto al colon.", "c": "CORRECTA (es la FALSA). El apéndice SÍ contiene células de {{Paneth}}; no están ausentes.", "d": "Cierta: su rasgo más llamativo es la {{gran cantidad de nódulos linfoides}} (\"amígdala abdominal\")."}, "_k": "org1p-075:3566976249", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-076", "tema": "Digestivo", "examen": "2022-23 2P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "Respecto al **hígado**, es **cierto** que:", "opciones": {"a": "Más del 50% de los hepatocitos son binucleados/poliploides.", "b": "Los sinusoides hepáticos no contactan directamente con los cordones de hepatocitos.", "c": "La disposición radial de los cordones en torno a una vena central define el lobulillo portal.", "d": "Los conductos de Hering están formados por células de dos hepatocitos adyacentes."}, "correcta": "a", "razones": {"a": "CORRECTA. Más del {{50%}} de los hepatocitos son {{binucleados}} y muchos poliploides, reflejo de su intensa actividad metabólica.", "b": "Falsa: los {{sinusoides}} sí contactan con los cordones, separados solo por el espacio de {{Disse}}.", "c": "Falsa: la disposición radial en torno a la vena central define el {{lobulillo clásico}}, no el portal (cuyo centro es el espacio porta).", "d": "Falsa: los conductos de {{Hering}} están revestidos por hepatocitos y {{colangiocitos}} (transición al conductillo biliar), no por dos hepatocitos."}, "_k": "org1p-076:2576699776", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-077", "tema": "Digestivo", "examen": "2021-22", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-22", "enunciado": "La célula de **Ito (estrellada)** del hígado se caracteriza por:", "opciones": {"a": "Fagocitar bacterias y eritrocitos viejos en el sinusoide.", "b": "Producir la bilis.", "c": "Almacenar lípidos y vitamina A en el espacio de Disse.", "d": "Sintetizar la albúmina plasmática."}, "correcta": "c", "razones": {"a": "Esa función es de las células de {{Kupffer}} (macrófagos del sinusoide).", "b": "La {{bilis}} la producen los hepatocitos.", "c": "CORRECTA. La célula de {{Ito}} almacena {{lípidos}} y {{vitamina A}} en el espacio de Disse; en la fibrosis se transforma en miofibroblasto.", "d": "La {{albúmina}} la sintetiza el hepatocito."}, "_k": "org1p-077:1665536573", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-078", "tema": "Digestivo", "examen": "2022-23 2P + Unybook", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "¿Qué **glándula salival mayor** tiene los **conductos estriados más desarrollados** y produce mayor volumen de saliva?", "opciones": {"a": "Parótida.", "b": "Submaxilar (submandibular).", "c": "Sublingual.", "d": "Glándulas de Von Ebner."}, "correcta": "b", "razones": {"a": "La {{parótida}} es puramente serosa pero no la de conductos estriados más largos ni mayor volumen.", "b": "CORRECTA. La {{submaxilar}} tiene los conductos {{estriados}} más desarrollados y aporta la mayor parte del volumen salival en reposo.", "c": "La {{sublingual}} casi carece de conductos estriados (predomina mucosa).", "d": "Las de {{Von Ebner}} son glándulas serosas pequeñas de las papilas caliciformes, no salivales mayores."}, "_k": "org1p-078:3021590747", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-079", "tema": "Digestivo", "examen": "2021-22", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-22", "enunciado": "Las **fibras de Sharpey** del periodonto corresponden a:", "opciones": {"a": "Prolongaciones de los ameloblastos en el esmalte.", "b": "Prolongaciones de los odontoblastos en la dentina.", "c": "Cristales de hidroxiapatita del cemento.", "d": "Fibras de colágeno de la membrana periodontal ancladas al cemento y al hueso alveolar."}, "correcta": "d", "razones": {"a": "Las prolongaciones de los ameloblastos forman el proceso de {{Tomes}}, no Sharpey.", "b": "Las prolongaciones de los odontoblastos son las fibras de {{Tomes}}.", "c": "Los cristales no son fibras.", "d": "CORRECTA. Las fibras de {{Sharpey}} son haces de {{colágeno}} del ligamento periodontal que se insertan en cemento y hueso alveolar, fijando el diente."}, "_k": "org1p-079:2389842075", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-080", "tema": "Digestivo", "examen": "2022-23 2P + Unybook", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "Respecto a las **glándulas de Brunner**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Son glándulas tubulares situadas en la submucosa del duodeno.", "b": "Son glándulas exclusivamente serosas.", "c": "Secretan un moco alcalino que neutraliza el quimo ácido.", "d": "Secretan péptidos que inhiben la secreción ácida gástrica."}, "correcta": "b", "razones": {"a": "Cierta: son glándulas {{tubulares}} de la {{submucosa}} duodenal (signo característico del duodeno).", "b": "CORRECTA (es la FALSA). Las glándulas de {{Brunner}} son {{mucosas}} (no serosas); su secreción es alcalina protectora.", "c": "Cierta: el moco {{alcalino}} (rico en bicarbonato) protege la mucosa duodenal del ácido gástrico.", "d": "Cierta: secretan factores que {{inhiben}} la secreción ácida gástrica."}, "_k": "org1p-080:1952435208", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-081", "tema": "Digestivo", "examen": "2022-23 2P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Las **células M** del intestino se localizan mayoritariamente en:", "opciones": {"a": "El duodeno, sobre las glándulas de Brunner.", "b": "El yeyuno, en el ápice de las vellosidades.", "c": "El íleon, sobre las placas de Peyer.", "d": "El colon, en las criptas de Lieberkühn."}, "correcta": "c", "razones": {"a": "No: las células M se asocian a tejido linfoide organizado, no a las Brunner.", "b": "No: el yeyuno tiene escaso tejido linfoide agregado.", "c": "CORRECTA. Las células {{M}} (micropliegues) recubren las {{placas de Peyer}} del {{íleon}} y presentan antígenos al tejido linfoide subyacente.", "d": "No: aunque hay folículos en el colon, el predominio de M es ileal."}, "_k": "org1p-081:3763913122", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-082", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "De las proteínas del citoesqueleto del **eritrocito**, ¿cuál constituye la malla **hexagonal** característica de su membrana?", "opciones": {"a": "Espectrina.", "b": "Anquirina.", "c": "Proteína banda 3.", "d": "Glucoforina."}, "correcta": "a", "razones": {"a": "CORRECTA. La {{espectrina}} (tetrámeros) forma la red {{hexagonal}} submembranosa que da deformabilidad al hematíe.", "b": "La {{anquirina}} ancla la espectrina a la membrana (a la banda 3), pero no forma la malla.", "c": "La banda {{3}} es el intercambiador de aniones y punto de anclaje, no la malla.", "d": "La {{glucoforina}} es una glicoproteína transmembrana, no estructural de la red."}, "_k": "org1p-082:2234887080", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-083", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "Respecto a los **gránulos específicos del eosinófilo**, ¿qué elemento contiene su región interna (cristaloide)?", "opciones": {"a": "Enzimas hidrolíticos.", "b": "Proteína básica mayor (MBP).", "c": "Histamina.", "d": "Peroxidasa."}, "correcta": "b", "razones": {"a": "Los {{enzimas hidrolíticos}} son de los gránulos azurófilos (lisosomas), no del cristaloide.", "b": "CORRECTA. El cristaloide central del gránulo específico contiene la {{MBP}} (proteína básica mayor), tóxica para parásitos.", "c": "La {{histamina}} es propia del basófilo/mastocito.", "d": "La {{peroxidasa}} se halla en la matriz del gránulo, rodeando al cristaloide, no en su interior."}, "_k": "org1p-083:519233479", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-084", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "En la **granulopoyesis**, ¿a qué tipo celular da lugar directamente el **mieloblasto**?", "opciones": {"a": "Metamielocito eosinófilo.", "b": "Metamielocito.", "c": "Promielocito.", "d": "Célula en banda (cayado)."}, "correcta": "c", "razones": {"a": "El metamielocito es un estadio mucho posterior (tras mielocito).", "b": "El {{metamielocito}} aparece después del mielocito, no directamente.", "c": "CORRECTA. La secuencia es {{mieloblasto}} → {{promielocito}} → mielocito → metamielocito → banda → segmentado.", "d": "La célula en {{banda}} es uno de los últimos estadios, no el inmediato al mieloblasto."}, "_k": "org1p-084:3723259371", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-085", "tema": "Sangre/Hematopoyesis", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23", "enunciado": "En la **eritropoyesis**, ¿a qué célula da lugar el **proeritroblasto**?", "opciones": {"a": "Reticulocito.", "b": "Eritroblasto ortocromático.", "c": "Eritroblasto basófilo.", "d": "Eritroblasto policromatófilo."}, "correcta": "c", "razones": {"a": "El {{reticulocito}} es de los últimos estadios (tras expulsar el núcleo).", "b": "El ortocromático es posterior al policromatófilo.", "c": "CORRECTA. Secuencia: {{proeritroblasto}} → eritroblasto {{basófilo}} → policromatófilo → ortocromático → reticulocito → hematíe.", "d": "El policromatófilo aparece tras el basófilo, no directamente del proeritroblasto."}, "_k": "org1p-085:3357072042", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-086", "tema": "Sangre/Hematopoyesis", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept", "enunciado": "En relación con los **linfocitos** de sangre periférica, señala la afirmación que **NO** es correcta:", "opciones": {"a": "No contienen en absoluto gránulos azurófilos.", "b": "Poseen un único núcleo redondeado que ocupa casi toda la célula.", "c": "Representan el 20-40% de los leucocitos circulantes.", "d": "Su recuento es de aproximadamente 1500-2500/mm³."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Algunos linfocitos (sobre todo grandes/NK) SÍ tienen algunos {{gránulos azurófilos}}; afirmar la ausencia absoluta es falso.", "b": "Cierta: tienen un {{núcleo}} grande y redondeado con escaso citoplasma.", "c": "Cierta: suponen el {{20-40%}} de los leucocitos.", "d": "Cierta: el rango es {{1500-2500/mm³}} aproximadamente."}, "_k": "org1p-086:3816393065", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-087", "tema": "Sangre/Hematopoyesis", "examen": "2019", "anio": 2019, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2019", "enunciado": "Los **factores de la coagulación** transportados por las plaquetas se almacenan en:", "opciones": {"a": "Los gránulos densos (delta).", "b": "Los gránulos alfa (α).", "c": "Los lisosomas (gránulos lambda).", "d": "El sistema canalicular abierto."}, "correcta": "b", "razones": {"a": "Los gránulos {{densos}} contienen ADP, ATP, serotonina y calcio, no factores de coagulación proteicos.", "b": "CORRECTA. Los gránulos {{alfa}} contienen factores de la {{coagulación}} (fibrinógeno, factor V, vWF) y factores de crecimiento.", "c": "Los {{lisosomas}} contienen enzimas hidrolíticos.", "d": "El sistema canalicular abierto es vía de liberación, no almacén de factores."}, "_k": "org1p-087:1962058634", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-088", "tema": "Inmune", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "En relación con el **corpúsculo de Hassall**, ¿cuál es la afirmación correcta?", "opciones": {"a": "Se encuentra en la corteza del timo.", "b": "Se encuentra en la médula del timo.", "c": "Está formado por linfocitos T maduros agrupados.", "d": "Forma parte de la barrera hematotímica."}, "correcta": "b", "razones": {"a": "Falso: la {{corteza}} tímica es densa en timocitos en maduración, no contiene corpúsculos.", "b": "CORRECTA. El corpúsculo de {{Hassall}} es exclusivo de la {{médula}} del timo, formado por células epitelio-reticulares tipo VI dispuestas concéntricamente.", "c": "Falso: lo forman células {{epiteliales reticulares}} queratinizadas, no linfocitos T.", "d": "Falso: la barrera hematotímica está en la corteza (en torno a los capilares), no en los corpúsculos."}, "_k": "org1p-088:4278925549", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-089", "tema": "Inmune", "examen": "2019 + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2025-26", "enunciado": "Las **vénulas de endotelio alto (HEV)** se encuentran en:", "opciones": {"a": "La corteza (paracortex) del ganglio linfático.", "b": "Los cordones medulares del ganglio linfático.", "c": "La pulpa blanca del bazo.", "d": "La pulpa roja del bazo."}, "correcta": "a", "razones": {"a": "CORRECTA. Las {{HEV}} están en el {{paracortex}} (corteza profunda) del ganglio; por ellas migran los linfocitos desde la sangre.", "b": "Los cordones {{medulares}} contienen plasmocitos y macrófagos, no HEV.", "c": "El bazo NO tiene {{HEV}} (la entrada linfocitaria es por la arteria central/zona marginal).", "d": "La pulpa {{roja}} es de sinusoides de filtración, sin HEV."}, "_k": "org1p-089:539354245", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-090", "tema": "Inmune", "examen": "2019 + 2022-23 1P + 2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23, 2025-26", "enunciado": "Los **linfocitos B** se distribuyen ampliamente en:", "opciones": {"a": "La vaina linfática periarteriolar (PALS) del bazo.", "b": "La corteza del timo.", "c": "La médula del timo.", "d": "El centro germinal de los nódulos linfáticos."}, "correcta": "d", "razones": {"a": "El {{PALS}} es zona T-dependiente del bazo (rodea la arteria central).", "b": "La corteza del {{timo}} es exclusiva de linfocitos T en maduración.", "c": "La médula del timo también es territorio de linfocitos {{T}} (ya maduros).", "d": "CORRECTA. Los linfocitos {{B}} pueblan los {{centros germinales}} de los nódulos/folículos linfáticos (zona B-dependiente)."}, "_k": "org1p-090:168010711", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-091", "tema": "Inmune", "examen": "2021-sept + Unybook", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "Respecto al **bazo**, señala la afirmación **correcta**:", "opciones": {"a": "Sus folículos linfoides carecen de arteria central, igual que los del ganglio.", "b": "La pulpa roja está formada por centros germinales B-dependientes.", "c": "Posee senos subcapsulares como el ganglio linfático.", "d": "Sus folículos linfoides están atravesados por una arteria central, rasgo que lo distingue del ganglio; la pulpa roja tiene cordones de Billroth."}, "correcta": "d", "razones": {"a": "Falso: precisamente la {{arteria central}} excéntrica define el folículo esplénico.", "b": "Falso: la pulpa {{roja}} es de cordones de Billroth y senos venosos (filtración de hematíes), no folículos.", "c": "Falso: el bazo NO tiene {{senos subcapsulares}} (eso es del ganglio).", "d": "CORRECTA. La {{arteria central}} dentro del folículo distingue al bazo del ganglio; la pulpa roja consta de {{cordones de Billroth}} y senos venosos."}, "_k": "org1p-091:3251210583", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-092", "tema": "Inmune", "examen": "2021-sept", "anio": 2021, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept", "enunciado": "En el **ganglio linfático**, ¿qué tipo celular predomina en el **paracortex** (corteza profunda)?", "opciones": {"a": "Linfocitos T.", "b": "Linfocitos B.", "c": "Plasmocitos.", "d": "Macrófagos."}, "correcta": "a", "razones": {"a": "CORRECTA. El {{paracortex}} es la zona T-dependiente, con HEV por donde entran los linfocitos {{T}}.", "b": "Los linfocitos {{B}} ocupan la corteza externa (folículos y centros germinales).", "c": "Los {{plasmocitos}} se ubican en los cordones medulares.", "d": "Los {{macrófagos}} abundan en senos y médula, no son el predominio del paracortex."}, "_k": "org1p-092:4221282697", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-093", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23, 2025-26", "enunciado": "**(IMAGEN)** En un corte de **diente** de mamífero (H-E), la flecha señala una estructura fibrosa que une el diente al hueso alveolar. ¿De qué se trata?", "opciones": {"a": "Hueso alveolar.", "b": "Cemento.", "c": "Membrana periodontal (ligamento periodontal).", "d": "Cámara pulpar."}, "correcta": "c", "razones": {"a": "El {{hueso alveolar}} es el lecho óseo, no la banda fibrosa intermedia.", "b": "El {{cemento}} recubre la raíz, pero la estructura de fibras de Sharpey que ancla es el ligamento.", "c": "CORRECTA. La {{membrana periodontal}} (ligamento) contiene las fibras de Sharpey que fijan el cemento al hueso alveolar.", "d": "La {{cámara pulpar}} es el espacio central con la pulpa, no una estructura de anclaje."}, "_k": "org1p-093:1003752922", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-094", "tema": "Respiratorio", "examen": "2021-sept + 2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2025-26", "enunciado": "**(IMAGEN)** En un corte de **pulmón** humano (H-E), los septos interalveolares muestran numerosas células redondeadas grandes que protruyen hacia el alveolo (flechas). ¿Qué células son?", "opciones": {"a": "Fibroblastos.", "b": "Macrófagos alveolares.", "c": "Neumocitos tipo II.", "d": "Células plasmáticas."}, "correcta": "c", "razones": {"a": "Los {{fibroblastos}} son fusiformes, dentro del intersticio, no protruyen a la luz.", "b": "Los {{macrófagos}} (células del polvo) están libres en la luz alveolar, no en la pared.", "c": "CORRECTA. Las células redondeadas en los vértices del septo, abultadas, son los {{neumocitos tipo II}} (cuerpos lamelares con surfactante).", "d": "Las {{plasmáticas}} no son un componente típico del septo alveolar normal."}, "_k": "org1p-094:601823169", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-095", "tema": "Digestivo", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "**(IMAGEN)** En un detalle de **glándula parótida** (H-E), la flecha señala un conducto pequeño de epitelio cúbico con núcleos basales redondeados, situado entre los acinos serosos. ¿Qué estructura es?", "opciones": {"a": "Acino mucoso.", "b": "Conducto intercalar.", "c": "Conducto interlobular.", "d": "Co

exclusivamente de la glucólisis anaerobia.", "d": "Predominan en músculos de movimientos breves y potentes."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras {{tipo I}} (rojas/lentas) tienen poco diámetro, muchas {{mitocondrias}} y mioglobina (metabolismo {{oxidativo}}), resistentes a la fatiga (músculos posturales).", "b": "Falso: eso describe a las fibras {{tipo II}} (blancas/rápidas).", "c": "Falso: las tipo I son {{oxidativas}}; las glucolíticas son las tipo IIb.", "d": "Falso: los movimientos breves y potentes los hacen las fibras {{tipo II}}."}, "_k": "org1p-068:1856012652", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-069", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Respecto a las **células de Schwann**, señala la afirmación **correcta**:", "opciones": {"a": "Una sola célula de Schwann mieliniza varios axones a la vez.", "b": "En las fibras amielínicas, una célula de Schwann envuelve varios axones, pero cada segmento de mielina (en las mielínicas) corresponde a una sola célula y un solo axón.", "c": "Carecen de lámina basal.", "d": "Son equivalentes a la microglía del sistema nervioso central."}, "correcta": "b", "razones": {"a": "Falso: en las fibras {{mielínicas}}, una Schwann mieliniza un único axón.", "b": "CORRECTA. En fibras {{amielínicas}} una Schwann envuelve {{varios}} axones; en mielínicas, cada {{segmento}} internodal = una Schwann y un solo axón.", "c": "Falso: las Schwann SÍ poseen {{lámina basal}}.", "d": "Falso: el equivalente glial del SNC son los {{oligodendrocitos}} (mielina), no la microglía."}, "_k": "org1p-069:3580801053", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-070", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Los **cuerpos de Nissl** de las neuronas corresponden a:", "opciones": {"a": "Acúmulos de aparato de Golgi.", "b": "Acúmulos de retículo endoplásmico rugoso (RER) y ribosomas, basófilos y visibles al microscopio óptico.", "c": "Mitocondrias agrupadas en el axón.", "d": "Lisosomas en el cono axónico."}, "correcta": "b", "razones": {"a": "Falso: el {{Golgi}} no es el componente principal del cuerpo de Nissl.", "b": "CORRECTA. Los cuerpos de {{Nissl}} son agregados de {{RER}} y polirribosomas, intensamente {{basófilos}}, presentes en soma y dendritas (no en el cono axónico ni el axón).", "c": "Falso: no son mitocondrias.", "d": "Falso: el cono axónico carece de sustancia de Nissl."}, "_k": "org1p-070:139077349", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-071", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a la **glía del sistema nervioso central**, señala la afirmación **correcta**:", "opciones": {"a": "La microglía es fagocítica y de origen mesodérmico (mieloide); los astrocitos forman la barrera con sus pies vasculares.", "b": "La microglía deriva del tubo neural como el resto de la glía.", "c": "Los astrocitos producen la mielina del SNC.", "d": "Los oligodendrocitos son los macrófagos residentes del SNC."}, "correcta": "a", "razones": {"a": "CORRECTA. La {{microglía}} es fagocítica y de origen {{mesodérmico}}/mieloide (no neuroectodérmico); los {{astrocitos}} contribuyen a la barrera hematoencefálica con sus pies perivasculares.", "b": "Falso: la microglía NO deriva del {{tubo neural}}, sino de precursores mieloides.", "c": "Falso: la mielina del SNC la producen los {{oligodendrocitos}}.", "d": "Falso: los macrófagos residentes son la {{microglía}}, no los oligodendrocitos."}, "_k": "org1p-071:2997752800", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-001", "tema": "Piel", "examen": "2025-26 2º parcial · Q1", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept Q26, 2025-26 2P Q1", "enunciado": "El estrato de Malpighi está formado por:", "opciones": {"a": "Estrato basal y espinoso.", "b": "Estrato espinoso y granuloso.", "c": "Estrato granuloso y lúcido.", "d": "Ninguna de las anteriores."}, "correcta": "a", "razones": {"a": "CORRECTA (deducida). El estrato de **Malpighi** (capa germinativa) = {{basal + espinoso}}, las dos capas con mayor capacidad proliferativa.", "b": "El estrato {{granuloso}} ya está en diferenciación terminal, no forma parte del Malpighi.", "c": "El estrato {{lúcido}} es una capa de transición de la piel gruesa, totalmente diferenciada.", "d": "Sí hay respuesta correcta: la {{a}}."}, "_k": "org2p-001:1034748592", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-002", "tema": "Piel", "examen": "2025-26 2º parcial · Q2", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **piel gruesa**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "No encontramos pelos en la piel gruesa.", "b": "Cuanto más gruesa es la piel, más desarrollada está la epidermis.", "c": "Las células del estrato espinoso presentan abundantes gránulos laminares con contenido lipídico.", "d": "La presencia de tonofilamentos es una característica exclusiva de las células del estrato basal germinativo."}, "correcta": "d", "razones": {"a": "Cierta: la piel gruesa (palmas, plantas) es {{lampiña}}, sin folículos pilosos.", "b": "Cierta: el grosor cutáneo depende sobre todo del desarrollo de la {{epidermis}} (estrato córneo).", "c": "Cierta: los {{gránulos laminares}} (cuerpos de Odland) aparecen ya en espinoso/granuloso.", "d": "CORRECTA (la FALSA, deducida). Los {{tonofilamentos}} (queratina) están en todas las capas vivas, especialmente abundantes en el {{espinoso}}; no son exclusivos del basal."}, "_k": "org2p-002:3922724189", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-003", "tema": "Piel", "examen": "2025-26 2º parcial · Q3", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23 1P, 2025-26 2P", "enunciado": "Señala la **respuesta correcta** sobre las células de la epidermis:", "opciones": {"a": "Los melanocitos están unidos a los queratinocitos mediante estructuras desmosómicas.", "b": "Los queratinocitos nunca contienen melanina.", "c": "Los gránulos de queratohialina son propios de los queratinocitos de la capa basal.", "d": "Las células de Langerhans de la piel están relacionadas con fenómenos de inmunidad."}, "correcta": "d", "razones": {"a": "Falsa: los melanocitos se unen a los queratinocitos {{sin desmosomas}} (son células dendríticas móviles).", "b": "Falsa: los queratinocitos SÍ reciben melanina vía {{secreción citocrina}} desde los melanocitos.", "c": "Falsa: los gránulos de {{queratohialina}} son propios del estrato {{granuloso}}, no del basal.", "d": "CORRECTA (deducida). Las células de {{Langerhans}} son presentadoras de antígeno (origen médula ósea, gránulos de Birbeck) → función {{inmunitaria}}."}, "_k": "org2p-003:1885155143", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-004", "tema": "Piel", "examen": "2025-26 2º parcial · Q4", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 1P, 2025-26 2P", "enunciado": "Sobre las **glándulas sudoríparas apocrinas**, ¿cuál **NO** es correcta?", "opciones": {"a": "Tienen un tipo de secreción merocrina.", "b": "Están desarrolladas en el momento del nacimiento.", "c": "Se asocian a folículos pilosos.", "d": "Presentan células mioepiteliales."}, "correcta": "b", "razones": {"a": "Cierta: liberan por mecanismo {{merocrino}} (y apocrino menor); el nombre no implica gemación masiva.", "b": "CORRECTA (la FALSA, deducida). Las apocrinas NO están desarrolladas al nacer: se desarrollan en la {{pubertad}}.", "c": "Cierta: desembocan en el {{folículo piloso}} (axila, región anogenital, areola).", "d": "Cierta: poseen {{células mioepiteliales}} que ayudan a expulsar la secreción."}, "_k": "org2p-004:925307479", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-005", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q5", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q10, 2021-22 Q8, 2024-25 Q2, 2025-26 2P Q5", "enunciado": "De las siguientes afirmaciones referentes a la hipófisis del ser humano, una **NO** es cierta:", "opciones": {"a": "La pars intermedia en el adulto es responsable de la secreción de hormona estimulante de los melanocitos (MSH).", "b": "En la pars intermedia la presencia de células es más escasa.", "c": "Las hormonas hipotalámicas que actúan sobre la adenohipófisis son de naturaleza peptídica.", "d": "La pars tuberalis está constituida principalmente por células cromófobas."}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, deducida). En el **humano adulto** la pars intermedia es {{rudimentaria}} y NO desempeña un papel relevante en la secreción de MSH (función melanotropa propia de otras especies, no del humano adulto).", "b": "Cierta: en el ser humano la pars intermedia es muy reducida ({{escasa}} celularidad, con quistes de Rathke).", "c": "Cierta: las hormonas hipotalámicas liberadoras/inhibidoras son {{peptídicas}} (salvo la dopamina, que es amina).", "d": "Cierta: la pars tuberalis es predominantemente de células {{cromófobas}} (con algunas gonadotropas)."}, "_k": "org2p-005:3338506224", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-006", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q6", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "¿Qué tinción es la más adecuada para teñir el **coloide** de los folículos tiroideos?", "opciones": {"a": "Hematoxilina-eosina.", "b": "Tricrómico.", "c": "PAS.", "d": "Tionina."}, "correcta": "c", "razones": {"a": "La H-E tiñe el coloide, pero no es la más específica para destacarlo.", "b": "El tricrómico resalta colágeno/conjuntivo, no el coloide.", "c": "CORRECTA (deducida). El coloide tiroideo es rico en glucoproteína (tiroglobulina) → {{PAS positivo}}.", "d": "La tionina es un colorante metacromático, no específico del coloide."}, "_k": "org2p-006:1133196374", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-007", "tema": "Piel", "examen": "2025-26 2º parcial · Q7", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept Q30, 2022-23 1P, 2025-26 2P Q7", "enunciado": "En relación con los **melanocitos**, es cierto que:", "opciones": {"a": "Provienen de la diferenciación de células del estrato germinativo o basal de la epidermis.", "b": "En las personas de raza blanca los melanocitos contienen menos melanosomas que las de raza negra.", "c": "Los individuos de raza negra tienen un número de melanocitos por unidad de superficie similar al de la raza blanca.", "d": "Los melanocitos son células que no experimentan recambio celular."}, "correcta": "b", "razones": {"a": "FALSA: los melanocitos NO derivan del estrato basal epidérmico, sino de la {{cresta neural}} (migran a la capa basal pero su origen es neuroectodérmico).", "b": "CORRECTA (deducida). Es la afirmación cierta más completa: la raza blanca tiene los melanocitos {{menos cargados de melanosomas}} (y melanosomas más pequeños/menos melanizados) que la raza negra. La diferencia de color es por melanosomas, no por número de melanocitos.", "c": "También es cierta: el {{número}} de melanocitos por superficie es similar en todas las razas. (Si el profe pide UNA, la b es la marcada; ambas son histológicamente correctas → atención a la clave del año.)", "d": "También cierta: los melanocitos son una población {{estable}}, sin recambio significativo. (Varias opciones son ciertas; el enunciado pedía la cierta → la b/c/d lo son y la a es la falsa.)"}, "_k": "org2p-007:1839184245", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-008", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q8", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q9, 2022-23 2P Q12, 2024-25 Q3, 2025-26 2P Q8 (CONCEPTO REY)", "enunciado": "De los orígenes embrionarios que se citan a continuación, ¿cuál es el propio de las **células parafoliculares (C)** del tiroides?", "opciones": {"a": "Endodermo de la base de la lengua.", "b": "Cresta neural.", "c": "3ª bolsa faríngea.", "d": "Ectodermo del techo de la boca primitiva."}, "correcta": "b", "razones": {"a": "Ese es el origen de las {{células foliculares}} (divertículo tiroideo del suelo faríngeo), no de las C.", "b": "CORRECTA (deducida). Las células C parafoliculares (secretoras de {{calcitonina}}) derivan de la {{cresta neural}} (vía cuerpos ultimobranquiales) y NO contactan con la luz del folículo.", "c": "La 3ª bolsa faríngea origina {{paratiroides inferiores y timo}}.", "d": "El ectodermo del techo de la boca (bolsa de Rathke) origina la {{adenohipófisis}}."}, "_k": "org2p-008:1872865226", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-009", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q9", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22 Q8, 2025-26 2P Q9", "enunciado": "En relación con la **oxitocina**, es cierto que:", "opciones": {"a": "Es transportada por transporte axonal por axones de neuronas hipotalámicas, en forma de un péptido precursor más grande que se escinde a medida que avanza por el axón.", "b": "Es sintetizada en el núcleo supraóptico del hipotálamo.", "c": "Se transporta y concentra en el axón en estructuras que al microscopio electrónico se ven como masas amorfas irregulares y electrodensas (cuerpos de Herring).", "d": "Los pituicitos que rodean los axones portadores de oxitocina son células con aspecto similar a los oligodendrocitos del SNC."}, "correcta": "a", "razones": {"a": "CORRECTA (deducida). La oxitocina (y la ADH) viaja como {{pro-péptido}} por transporte axonal desde los núcleos hipotalámicos, escindiéndose en el trayecto. Es la afirmación más precisa del mecanismo. (b, c y d también son ciertas; la clásica clave del profe marca la a.)", "b": "Cierta también: la oxitocina se sintetiza sobre todo en el núcleo {{paraventricular}} (y supraóptico). No es la opción marcada.", "c": "Cierta también: se acumula en los {{cuerpos de Herring}} (masas amorfas electrodensas en la pars nervosa). No es la opción marcada.", "d": "Cierta también: los {{pituicitos}} son glía similar a {{oligodendrocitos}}/astrocitos. No es la opción marcada."}, "_k": "org2p-009:320870416", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-010", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q10", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P Q10, 2024-25 Q4, 2025-26 2P Q10", "enunciado": "Referente a las glándulas **paratiroides**, **NO** es cierto:", "opciones": {"a": "Habitualmente están situadas bajo la cápsula de la glándula tiroides.", "b": "La presencia de células oxífilas no es significativa hasta la adolescencia.", "c": "El contenido de glucógeno es muy abundante en las células principales.", "d": "Las células oxífilas se caracterizan por presentar un núcleo muy grande y discretamente teñido."}, "correcta": "d", "razones": {"a": "Cierta: las paratiroides quedan en la cara posterior, bajo la {{cápsula}} tiroidea.", "b": "Cierta: las oxífilas no aparecen de forma significativa hasta la {{pubertad/adolescencia}}.", "c": "Cierta: el {{glucógeno}} es abundante en las células {{principales}}.", "d": "CORRECTA (la FALSA, deducida). Las oxífilas tienen citoplasma muy eosinófilo (muchas mitocondrias) pero su núcleo es {{pequeño y picnótico/denso}}, NO grande y poco teñido."}, "_k": "org2p-010:4098050428", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-011", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q11", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "Referente al **páncreas** endocrino, **NO** es cierto:", "opciones": {"a": "Los islotes de Langerhans están delimitados por tejido conjuntivo muy escaso.", "b": "Las células alfa y beta de los islotes pueden distinguirse claramente al microscopio electrónico por el aspecto de sus gránulos de secreción.", "c": "Métodos histoquímicos han demostrado que los islotes de Langerhans están inervados por el sistema nervioso autónomo.", "d": "Las células delta constituyen el porcentaje más pequeño de los diferentes tipos de células endocrinas de los islotes de Langerhans."}, "correcta": "d", "razones": {"a": "Cierta: el conjuntivo periinsular es {{escaso}} (apenas una fina red reticular).", "b": "Cierta: al {{ME}} alfa (gránulo denso uniforme) y beta (cristaloide con halo claro) se distinguen por la morfología de sus gránulos.", "c": "Cierta: los islotes reciben inervación del {{sistema nervioso autónomo}}.", "d": "CORRECTA (la FALSA, deducida). Las células {{delta}} (somatostatina, ~5-10%) NO son la población más pequeña: las células {{PP}} (y otras minoritarias) son las menos abundantes. Si las demás son ciertas, la pregunta pide la NO cierta → es la D."}, "_k": "org2p-011:1942429934", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-012", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q12", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (zonas suprarrenal · lipofuscina en reticular)", "enunciado": "La presencia de gránulos de **lipofuscina** en la glándula suprarrenal es particularmente abundante en las células ubicadas en una de las siguientes regiones:", "opciones": {"a": "Zona glomerular.", "b": "Zona fascicular.", "c": "Zona reticular.", "d": "Médula."}, "correcta": "c", "razones": {"a": "La **zona glomerular** (externa) produce mineralocorticoides; sus células no acumulan lipofuscina de forma notable.", "b": "La **zona fascicular** (espongiocitos) destaca por las gotas de {{lípidos}}, no por lipofuscina.", "c": "CORRECTA (deducida). La **zona reticular** (la más profunda de la corteza) tiene células con abundantes gránulos de {{lipofuscina}} (pigmento de desgaste), que le dan su tono pardo.", "d": "La **médula** tiene células cromafines (catecolaminas), no destaca por lipofuscina."}, "_k": "org2p-012:3157730063", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-013", "tema": "Urinario", "examen": "2025-26 2º parcial · Q13", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "En relación con la **nefrona**, una de las siguientes afirmaciones **NO** es cierta:", "opciones": {"a": "Las nefronas corticales tienen unas asas de Henle más cortas que las nefronas yuxtamedulares.", "b": "Las nefronas corticales constituyen aproximadamente el 65-85% del total de nefronas presentes en un riñón.", "c": "Los podocitos y las células endoteliales glomerulares comparten la misma lámina basal.", "d": "La membrana de filtración glomerular está constituida solo por la membrana de los podocitos."}, "correcta": "d", "razones": {"a": "Cierta: las nefronas corticales tienen asas de Henle más {{cortas}} que las yuxtamedulares.", "b": "Cierta: las nefronas {{corticales}} son la mayoría (~85%) del total renal.", "c": "Cierta: podocitos y endotelio glomerular {{comparten}} la misma membrana basal glomerular.", "d": "CORRECTA (la FALSA, deducida). La barrera de filtración glomerular tiene {{tres}} componentes: endotelio fenestrado + membrana basal glomerular + pedicelos de los podocitos (con el diafragma de la ranura). No es solo la membrana de los podocitos."}, "_k": "org2p-013:2532340576", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-014", "tema": "Urinario", "examen": "2025-26 2º parcial · Q14", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (mesangiales · EPO la hacen los fibroblastos)", "enunciado": "En relación con las **células mesangiales extraglomerulares** del riñón, **NO** es correcto que:", "opciones": {"a": "Se localizan en la región entre las arteriolas aferente y eferente del polo vascular del riñón.", "b": "Reciben también el nombre de células de Lacis.", "c": "Son secretoras de eritropoyetina (EPO).", "d": "Forman parte del aparato yuxtaglomerular."}, "correcta": "c", "razones": {"a": "Cierta: las extraglomerulares se sitúan en el triángulo entre la arteriola {{aferente}} y la {{eferente}} del polo vascular.", "b": "Cierta: se llaman también células de {{Lacis}} (o de Goormaghtigh).", "c": "CORRECTA (la FALSA, deducida). La {{EPO}} la producen los fibroblastos modificados del intersticio peritubular (corticales), NO las mesangiales extraglomerulares.", "d": "Cierta: las mesangiales extraglomerulares forman parte del {{aparato yuxtaglomerular}} (junto con la mácula densa y las células yuxtaglomerulares)."}, "_k": "org2p-014:2742668247", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-015", "tema": "Oído", "examen": "2025-26 2º parcial · Q15", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P Q27, 2024-25 Q29, 2025-26 2P Q15", "enunciado": "En relación con el **órgano de Corti** del oído interno, ¿qué opción es correcta?", "opciones": {"a": "Las células ciliadas presentan estereocilios y cinocilio.", "b": "No presenta otolitos.", "c": "La cúpula cubre sus células ciliadas.", "d": "Se localiza en la membrana vestibular."}, "correcta": "b", "razones": {"a": "Falsa: las células ciliadas cocleares maduras tienen estereocilios pero {{pierden el cinocilio}} en el adulto.", "b": "CORRECTA (deducida; clave 2024-25 = 'no presenta otolitos'). El **órgano de Corti** {{NO tiene otolitos}} (los otolitos están en las máculas del utrículo/sáculo). Lo cubre la membrana tectoria.", "c": "Falsa: la **cúpula** cubre las crestas ampollares de los conductos semicirculares, no el Corti.", "d": "Falsa: el Corti se asienta sobre la **membrana basilar**, no sobre la membrana vestibular (de Reissner)."}, "_k": "org2p-015:3162450943", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-016", "tema": "Urinario", "examen": "2025-26 2º parcial · Q16", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q13, 2025-26 2P Q16", "enunciado": "En relación con los **túbulos contorneados proximales** de la nefrona, es cierto que:", "opciones": {"a": "Son los más numerosos de la corteza.", "b": "El borde luminal de sus células epiteliales presenta numerosas microvellosidades con un glicocálix PAS positivo.", "c": "Presentan una luz de aspecto estrellado.", "d": "Todas las anteriores son correctas."}, "correcta": "d", "razones": {"a": "Cierta: el TCP es el túbulo más {{numeroso}} de la corteza renal.", "b": "Cierta: tiene ribete en cepillo de microvellosidades con glicocálix {{PAS+}}.", "c": "Cierta: su luz tiene contorno {{estrellado}} (por el ribete en cepillo y el colapso).", "d": "CORRECTA (deducida). Las tres afirmaciones describen el {{TCP}} → 'todas las anteriores'."}, "_k": "org2p-016:1757884564", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-017", "tema": "Urinario", "examen": "2025-26 2º parcial · Q17", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (vías urinarias / detrusor 3 capas)", "enunciado": "En relación con las **vías urinarias**, una de las siguientes afirmaciones **NO** es cierta:", "opciones": {"a": "El músculo detrusor vesical está constituido por dos capas de fibras musculares lisas.", "b": "Histológicamente no hay válvulas ni esfínteres en la desembocadura de los uréteres en la vejiga.", "c": "El esfínter vesical (uretral interno) es un esfínter funcional pero no anatómico.", "d": "El plexo nervioso vesical está constituido por fibras del sistema nervioso vegetativo."}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, deducida). El músculo **detrusor** vesical tiene {{tres}} subcapas de fibras musculares lisas (longitudinal interna, circular media, longitudinal externa), no dos.", "b": "Cierta: la desembocadura ureteral tiene un mecanismo valvular {{funcional}} (por el trayecto oblicuo), sin válvula ni esfínter anatómico.", "c": "Cierta: el esfínter uretral interno es {{funcional}} (engrosamiento de la capa circular del detrusor), no un esfínter anatómico independiente.", "d": "Cierta: el plexo vesical está formado por fibras del sistema nervioso {{vegetativo}} (simpático y parasimpático)."}, "_k": "org2p-017:11681578", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-018", "tema": "Urinario", "examen": "2025-26 2º parcial · Q18", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente (yuxtaglomerulares = músculo liso modificado de la aferente)", "enunciado": "Las **células yuxtaglomerulares** son:", "opciones": {"a": "Células de la mácula densa modificadas.", "b": "Fibras musculares lisas modificadas de la pared de la arteriola aferente.", "c": "Células endoteliales de los capilares glomerulares.", "d": "Células del intersticio de la médula renal."}, "correcta": "b", "razones": {"a": "Falsa: la {{mácula densa}} es del TCD (sensor de NaCl), distinta de las yuxtaglomerulares.", "b": "CORRECTA (deducida; concepto recurrente §3). Las células yuxtaglomerulares son fibras {{musculares lisas modificadas}} de la pared de la arteriola {{aferente}}, con gránulos de {{renina}}.", "c": "Falsa: las células endoteliales forman el revestimiento capilar, no secretan renina.", "d": "Falsa: las células medulares intersticiales (fibroblastos modificados) secretan PGE2, no renina."}, "_k": "org2p-018:2805323034", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-019", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q19", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "En relación con el **testículo**, una de las siguientes afirmaciones es cierta:", "opciones": {"a": "Está rodeado por una túnica vaginal de origen peritoneal que le aporta la mayor parte de su irrigación sanguínea.", "b": "Cada lóbulo testicular contiene de 1 a 4 túbulos seminíferos.", "c": "Las células de Leydig se localizan dentro de los túbulos seminíferos.", "d": "Los conductillos eferentes están ubicados en el interior del testículo, drenando directamente la rete testis hacia los túbulos seminíferos."}, "correcta": "b", "razones": {"a": "Falsa: la túnica {{vaginal}} (derivada del peritoneo) es la cubierta más externa, pero NO aporta la irrigación; ésta llega por la arteria testicular a través del mediastino/albugínea.", "b": "CORRECTA (confirmada con la foto del examen). Cada lóbulo testicular (delimitado por los tabiques de la albugínea) contiene de {{1 a 4 túbulos seminíferos}} enrollados.", "c": "Falsa: las células de {{Leydig}} (intersticiales, productoras de testosterona) están FUERA de los túbulos, en el intersticio entre ellos.", "d": "Falsa: los {{conductillos eferentes}} conectan la rete testis con el epidídimo, no drenan hacia los túbulos seminíferos."}, "_k": "org2p-019:3566194680", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-020", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q20", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "En relación con las **glándulas de Cowper (bulbouretrales)**, señala la afirmación correcta:", "opciones": {"a": "Son nódulos linfáticos asociados a la uretra prostática.", "b": "Forman parte de la pared de las vesículas seminales.", "c": "Son glándulas tubuloalveolares que vierten su secreción mucosa a la uretra esponjosa (membranosa-bulbar).", "d": "Constituyen el epitelio de transición que reviste la uretra peniana."}, "correcta": "c", "razones": {"a": "Falsa: no son tejido linfático; son glándulas exocrinas.", "b": "Falsa: son glándulas independientes, no forman parte de las vesículas seminales.", "c": "CORRECTA (confirmada con la foto del examen). Las glándulas de {{Cowper}} (bulbouretrales) son glándulas {{tubuloalveolares}} mucosas, situadas en el diafragma urogenital, que vierten su secreción lubricante a la uretra {{esponjosa}} antes de la eyaculación.", "d": "Falsa: la uretra peniana está revestida por epitelio cilíndrico/pseudoestratificado y plano estratificado distal, no por las glándulas de Cowper."}, "_k": "org2p-020:3269834797", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-021", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q21", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Confirmada con la foto del examen 2025-26", "enunciado": "Durante la espermiogénesis, la formación de la **vesícula acrosómica** tiene lugar en la fase:", "opciones": {"a": "De Golgi.", "b": "De casquete (cubierta).", "c": "Acrosómica.", "d": "De maduración."}, "correcta": "a", "razones": {"a": "CORRECTA (confirmada con la foto del examen). En la fase de **Golgi** los gránulos proacrosómicos del aparato de Golgi confluyen y forman la {{vesícula acrosómica}} (con su gránulo acrosómico), que se adosa al núcleo.", "b": "En la fase de **casquete** la vesícula ya formada se {{extiende}} cubriendo el polo anterior del núcleo como un capuchón.", "c": "En la fase **acrosómica** se condensa el núcleo, se forma el flagelo y se reorganiza el citoplasma; la vesícula ya existía.", "d": "En la fase de **maduración** se elimina el citoplasma sobrante (cuerpo residual) y se libera la espermátide madura."}, "_k": "org2p-021:1954555034", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-022", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q22", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q21 (clave C)", "enunciado": "El epitelio que reviste el **conducto deferente** es del tipo:", "opciones": {"a": "Plano estratificado no queratinizado.", "b": "Cilíndrico simple con células ciliadas.", "c": "Cilíndrico pseudoestratificado con estereocilios.", "d": "Plano simple con células ciliadas."}, "correcta": "c", "razones": {"a": "Falsa: ese epitelio es propio de esófago/vagina, no de la vía espermática.", "b": "Falsa: no es cilíndrico simple; es pseudoestratificado.", "c": "CORRECTA (clave oficial 2022-23 Q21 = C). El conducto deferente (como el epidídimo) tiene epitelio cilíndrico {{pseudoestratificado}} con {{estereocilios}}.", "d": "Falsa: no es plano simple ni ciliado."}, "_k": "org2p-022:705642904", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-023", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q23", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22 Q16 (clave C · células deciduales en fase secretora)", "enunciado": "Las **células deciduales** del endometrio, que almacenan glucógeno y lípidos, se encuentran en una de las siguientes fases del ciclo menstrual:", "opciones": {"a": "Fase menstrual.", "b": "Fase proliferativa.", "c": "Fase secretora.", "d": "Ninguna de las anteriores."}, "correcta": "c", "razones": {"a": "Falsa: en la fase {{menstrual}} hay isquemia y descamación por vasoconstricción de las arterias espirales.", "b": "Falsa: en la fase {{proliferativa}} (estrógenos) las glándulas son rectas y el estroma no está decidualizado.", "c": "CORRECTA (clave oficial 2021-22 Q16 = C). Bajo la {{progesterona}} de la fase {{secretora}}, las células del estroma se transforman en células {{deciduales}} ricas en glucógeno y lípidos (predecidualización).", "d": "Falsa: sí hay fase correcta, la secretora."}, "_k": "org2p-023:406073204", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-024", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q24", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (foto 2202)", "enunciado": "¿Cuál de las siguientes afirmaciones es una característica histológica de la **glándula mamaria activa (en lactancia)**?", "opciones": {"a": "Los conductos glandulares presentan epitelios estratificados con escasa actividad secretora.", "b": "Los alvéolos están poco desarrollados y solo se observan brotes alveolares dispersos.", "c": "Los componentes de la leche se secretan principalmente por exocitosis a partir de gránulos de secreción.", "d": "Las células secretoras muestran abundantes gotas lipídicas apicales, liberadas mediante un mecanismo apocrino."}, "correcta": "d", "razones": {"a": "Falsa: los conductos no son 'estratificados con escasa actividad'; en la mama activa hay intensa actividad secretora en los alvéolos.", "b": "Falsa: ese es el patrón de la mama {{inactiva}} (brotes alveolares dispersos), no de la mama en lactancia.", "c": "Parcial: las {{proteínas}} (caseína, lactosa) sí van por exocitosis/merocrino, pero NO 'todos' los componentes; los lípidos van por apocrino.", "d": "CORRECTA (deducida). En la mama activa los {{lípidos}} se acumulan en gotas apicales y se liberan por mecanismo {{apocrino}} (arrastrando un fragmento de membrana)."}, "_k": "org2p-024:4224868450", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-025", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q25", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 Q25 (clave B), 2025-26 2P Q25", "enunciado": "Las llamadas **glándulas de Bartholin** en la mujer se encuentran en:", "opciones": {"a": "Cuerpo del útero.", "b": "Cérvix uterino.", "c": "Vagina.", "d": "Vestíbulo de los genitales externos."}, "correcta": "d", "razones": {"a": "El útero no contiene glándulas de Bartholin.", "b": "El cérvix tiene glándulas endocervicales (quistes de Naboth), no Bartholin.", "c": "La vagina no tiene glándulas mucosas propias.", "d": "CORRECTA (clave 2024-25 = B 'caras laterales del vestíbulo'). Las glándulas de {{Bartholin}} (vestibulares mayores) están en las caras laterales del {{vestíbulo}} de los genitales externos."}, "_k": "org2p-025:1162497080", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-026", "tema": "Reproductor", "examen": "2025-26 2º parcial · Q26", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Los llamados **quistes de Naboth** pueden encontrarse en:", "opciones": {"a": "La luz de las glándulas del cuello del útero (cérvix).", "b": "La luz de las glándulas del cérvix uterino.", "c": "La luz de la vagina.", "d": "En los folículos pilosos de la piel del monte de Venus."}, "correcta": "a", "razones": {"a": "CORRECTA (deducida). Los quistes de {{Naboth}} son glándulas {{endocervicales}} (del cuello del útero) dilatadas por retención de moco. (Las opciones A y B describen lo mismo —cérvix—; la marcada es la primera.)", "b": "Describe también el cérvix (mismo concepto que A).", "c": "La vagina no tiene glándulas mucosas propias (epitelio plano estratificado).", "d": "No tienen relación con folículos pilosos."}, "_k": "org2p-026:1194766219", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-027", "tema": "Ojo", "examen": "2025-26 2º parcial · Q27", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "El **glaucoma** es un trastorno provocado por el aumento de la presión intraocular que sucede frecuentemente como consecuencia de:", "opciones": {"a": "El aumento de la producción de humor acuoso por parte de la red trabecular.", "b": "El aumento de la producción de humor acuoso por parte del conducto de Schlemm.", "c": "La disminución del drenaje del humor acuoso primero a través del conducto de Schlemm y después de la red trabecular.", "d": "La disminución del drenaje del humor acuoso primero a través de la red trabecular y después del conducto de Schlemm."}, "correcta": "d", "razones": {"a": "Falsa: la red trabecular {{drena}}, no produce humor acuoso (lo hacen los procesos ciliares).", "b": "Falsa: el conducto de Schlemm es vía de {{drenaje}}, no de producción.", "c": "Falsa: el orden de drenaje es primero {{red trabecular}}, después Schlemm (esta opción lo invierte).", "d": "CORRECTA (deducida). El glaucoma resulta de {{disminución del drenaje}}: el acuoso pasa primero por la {{red trabecular}} y luego al conducto de {{Schlemm}}."}, "_k": "org2p-027:1548744117", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-028", "tema": "Ojo", "examen": "2025-26 2º parcial · Q28", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 Q27 (clave C), 2025-26 2P Q28", "enunciado": "En relación con las **células ganglionares de la retina**, es cierto que:", "opciones": {"a": "Están en contacto con el epitelio pigmentario de la retina.", "b": "Son células fotorreceptoras.", "c": "Las células amacrinas establecen contactos sinápticos con ellas.", "d": "Las células horizontales establecen contactos sinápticos con ellas."}, "correcta": "c", "razones": {"a": "Falsa: las ganglionares son la capa más {{interna}}; no contactan con el epitelio pigmentario (el más externo).", "b": "Falsa: NO son {{fotorreceptoras}}; reciben la señal ya procesada.", "c": "CORRECTA (clave 2024-25 = C). Las células {{amacrinas}} modulan y hacen sinapsis con las {{ganglionares}} en la capa plexiforme interna.", "d": "Falsa: las {{horizontales}} sinaptan a nivel de fotorreceptores/bipolares (capa plexiforme externa), no con las ganglionares."}, "_k": "org2p-028:2879550282", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-029", "tema": "Ojo", "examen": "2025-26 2º parcial · Q29", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P Q29", "enunciado": "Es cierto que el **cristalino**:", "opciones": {"a": "Está vascularizado.", "b": "Se localiza al mismo nivel que los procesos ciliares.", "c": "Presenta terminaciones nerviosas.", "d": "Presenta melanocitos."}, "correcta": "b", "razones": {"a": "Falsa: el cristalino es {{avascular}} (sus fibras se nutren del humor acuoso).", "b": "CORRECTA (deducida). El cristalino queda a la altura de los {{procesos ciliares}}, suspendido por las fibras zonulares.", "c": "Falsa: NO tiene {{terminaciones nerviosas}}.", "d": "Falsa: NO contiene {{melanocitos}}; sus fibras son transparentes (cristalinas)."}, "_k": "org2p-029:3780371810", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-030", "tema": "Oído", "examen": "2025-26 2º parcial · Q30", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 Q30, 2025-26 2P Q30", "enunciado": "En relación con la **mácula del utrículo**, es cierto que:", "opciones": {"a": "Sus células ciliadas están en contacto con la perilinfa.", "b": "Se localiza en una región de los conductos semicirculares.", "c": "No contiene células de sostén.", "d": "Contiene otolitos y está bañada por endolinfa."}, "correcta": "d", "razones": {"a": "Falsa: están en contacto con la {{endolinfa}}, no la perilinfa.", "b": "Falsa: la mácula utricular está en el {{utrículo}}, no en los conductos semicirculares (allí están las crestas ampollares).", "c": "Falsa: sí tiene células de {{sostén}} junto a las ciliadas.", "d": "CORRECTA (deducida). Las máculas contienen {{otolitos}} (membrana otolítica) y están bañadas por {{endolinfa}}; el utrículo en posición horizontal."}, "_k": "org2p-030:622927155", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-031", "tema": "Piel", "examen": "2025-26 2º parcial · Q31 (Imagen 1)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (estratos epidermis)", "enunciado": "IMAGEN 1. Sección histológica de piel. ¿A qué capa corresponde lo que indica la flecha?", "opciones": {"a": "Estrato córneo.", "b": "Estrato germinativo o basal.", "c": "Estrato espinoso.", "d": "Estrato granuloso."}, "correcta": "a", "razones": {"a": "Por defecto (lo más señalado en piel gruesa): la capa más superficial, eosinófila, laminar y anucleada → **estrato córneo** {{(escamas de queratina sin núcleo)}}.", "b": "El basal es la hilera profunda columnar sobre la dermis.", "c": "El espinoso son varias capas de células poligonales con espinas.", "d": "El granuloso tiene gránulos basófilos de queratohialina (justo bajo el córneo).", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T07-Piel/t07pellcv-p06-1.png", "_k": "org2p-031:1325566814", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-032", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q32 (Imagen 2)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (cromófilas adenohipófisis)", "enunciado": "IMAGEN 2. ¿Qué células endocrinas (adenohipófisis) indican los números?", "opciones": {"a": "1-Cromófila acidófila, 2-Cromófila basófila, 3-Cromófoba.", "b": "1-Cromófila basófila, 2-Cromófila acidófila, 3-Cromófoba.", "c": "1-Cromófoba, 2-Cromófila basófila, 3-Cromófila acidófila.", "d": "1-Cromófila acidófila, 2-Cromófoba, 3-Cromófila basófila."}, "correcta": "a", "razones": {"a": "Criterio de identificación: **acidófila** = citoplasma rosa-rojo intenso (somatotropas/mamotropas), **basófila** = citoplasma azul-púrpura (cortico/tiro/gonadotropas), **cromófoba** = pálido sin teñir. La opción A es la combinación más frecuente cuando 1=rosa, 2=azul, 3=pálido.", "b": "Solo correcta si 1 es azul (basófila) y 2 rosa.", "c": "Solo si 1 es pálida.", "d": "Solo si 3 es basófila y 2 pálida.", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08hipofisi-p17-1.png", "redact": [{"x": 34, "y": 3, "w": 40, "h": 13}, {"x": 2, "y": 78, "w": 40, "h": 13}, {"x": 60, "y": 40, "w": 38, "h": 13}], "_k": "org2p-032:4201543411", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-033", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q33 (Imagen 3)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 3. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pituitaria.", "b": "Paratiroides.", "c": "Tiroides.", "d": "Adrenal."}, "correcta": "c", "razones": {"a": "La hipófisis muestra cordones de células cromófilas/cromófobas y sinusoides (sin folículos).", "b": "La paratiroides tiene cordones de células principales pequeñas + oxífilas, sin coloide.", "c": "Criterio clave: si se ven **folículos** redondos llenos de {{coloide}} rosado homogéneo rodeados de epitelio cúbico → **tiroides**.", "d": "La suprarrenal muestra zonación cortical (cordones) + médula.", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08tiroide-p08-1.png", "redact": [{"x": 2, "y": 2, "w": 22, "h": 11}, {"x": 30, "y": 28, "w": 42, "h": 20}, {"x": 62, "y": 45, "w": 38, "h": 12}], "_k": "org2p-033:3174869072", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-034", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q34 (Imagen 4)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 4. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pineal.", "b": "Tiroides.", "c": "Hipófisis.", "d": "Paratiroides."}, "correcta": "d", "razones": {"a": "La pineal tiene pinealocitos y cuerpos arenáceos (acérvulos calcificados).", "b": "La tiroides tendría folículos con coloide.", "c": "La hipófisis tiene mezcla de cromófilas acidófilas/basófilas y sinusoides.", "d": "Por defecto (al contrastar con tiroides en la misma serie): cordones densos de células {{principales}} pequeñas y pálidas, con algunas {{oxífilas}} eosinófilas, sin coloide → **paratiroides**.", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08paratiro-p07-1.png", "redact": [{"x": 36, "y": 7, "w": 40, "h": 12}, {"x": 24, "y": 40, "w": 24, "h": 12}, {"x": 58, "y": 72, "w": 40, "h": 12}], "_k": "org2p-034:3108303954", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-035", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q35 (Imagen 5)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (zonas suprarrenal)", "enunciado": "IMAGEN 5. Indica a qué zonas de la corteza de la glándula adrenal corresponde cada número:", "opciones": {"a": "1-Cápsula, 2-Zona fascicular, 3-Médula.", "b": "1-Zona reticular, 2-Zona fascicular, 3-Zona glomerular.", "c": "1-Zona glomerular, 2-Zona fascicular, 3-Zona reticular.", "d": "1-Zona glomerular, 2-Zona reticular, 3-Zona fascicular."}, "correcta": "c", "razones": {"a": "Incompleta: mezcla cápsula y médula sin la zonación cortical ordenada.", "b": "Falsa: invierte el orden (glomerular es la más externa, no la 3).", "c": "CORRECTA: de fuera a dentro el orden es **glomerular → fascicular → reticular** (regla 'GFR').", "d": "Falsa: la reticular no va antes que la fascicular.", "confianza": "media"}, "imagen": "_quiz_imgs/T08-Endocrino/t08adrenals-p11-2.png", "redact": [{"x": 38, "y": 42, "w": 30, "h": 13}], "_k": "org2p-035:20651113", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-036", "tema": "Endocrino", "examen": "2025-26 2º parcial · Q36 (Imagen 6)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (regiones hipófisis)", "enunciado": "IMAGEN 6. Zona de la glándula hipófisis (H-E). ¿A qué región corresponde la que señalan las flechas?", "opciones": {"a": "Pars distalis.", "b": "Pars nervosa.", "c": "Pars tuberalis.", "d": "Pars intermedia."}, "correcta": "d", "razones": {"a": "La **pars distalis** es la masa principal de la adenohipófisis con cordones de cromófilas/cromófobas y sinusoides.", "b": "La **pars nervosa** es pálida, fibrilar (axones + pituicitos), con cuerpos de Herring.", "c": "La **pars tuberalis** es el manguito que rodea el tallo, con cromófobas y gonadotropas.", "d": "Por defecto (lo más preguntado con flechas): banda entre adeno y neurohipófisis con {{quistes de Rathke}} (folículos con coloide) y células basófilas → **pars intermedia**.", "confianza": "baja"}, "confianza": "baja", "imagen": "_quiz_imgs/T08-Endocrino/t08hipofisi-p24-1.png", "redact": [{"x": 1, "y": 6, "w": 28, "h": 12}, {"x": 32, "y": 38, "w": 34, "h": 12}, {"x": 36, "y": 78, "w": 34, "h": 13}], "_k": "org2p-036:1999909973", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-037", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De entre las células que constituyen el parénquima de la adenohipófisis, ¿cuáles presentan los gránulos de secreción más grandes?", "opciones": {"a": "Células somatotropas.", "b": "Células mamotropas.", "c": "Células tirotropas.", "d": "Células gonadotropas."}, "correcta": "c", "razones": {"a": "Las somatotropas (GH) tienen gránulos densos pero no los mayores según esta clave.", "b": "Las mamotropas (prolactina) tienen gránulos grandes, pero la clave oficial marca tirotropas.", "c": "CORRECTA (clave oficial 2024-25 = C): las **células tirotropas** presentan los gránulos de secreción de mayor tamaño según el criterio del profesor. Memorizar tal cual cae.", "d": "Las gonadotropas tienen gránulos de tamaño intermedio."}, "_k": "org2p-037:3313232386", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-038", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. B)", "enunciado": "De las siguientes afirmaciones referentes a la adenohipófisis, una **NO** es cierta:", "opciones": {"a": "Las células acidófilas constituyen el mayor porcentaje de células de la pars distalis.", "b": "Las hormonas hipotalámicas de liberación son de naturaleza esteroidea.", "c": "Las hormonas hipotalámicas llegan a la adenohipófisis por el sistema porta hipotálamo-hipofisario.", "d": "Las células cromófobas predominan en la pars tuberalis."}, "correcta": "b", "razones": {"a": "Cierta: las {{acidófilas}} (somatotropas + mamotropas) son la mayoría de la pars distalis.", "b": "CORRECTA (la FALSA, clave 2024-25 = B). Las hormonas hipotalámicas de liberación son {{peptídicas}}, NO esteroideas. Distractor clásico.", "c": "Cierta: viajan por el {{sistema porta}} hipotálamo-hipofisario.", "d": "Cierta: la {{pars tuberalis}} está formada principalmente por células cromófobas."}, "_k": "org2p-038:4200441748", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-039", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "De las siguientes afirmaciones relacionadas con la glándula tiroides, una **NO** es cierta:", "opciones": {"a": "Tiene elementos celulares de distinto origen embriológico.", "b": "Las células foliculares cambian de aspecto según la actividad funcional de la glándula.", "c": "El aumento de actividad de la glándula conlleva un aumento de los gránulos de secreción de las células foliculares.", "d": "Las células parafoliculares se encuentran en contacto con la luz de los folículos."}, "correcta": "d", "razones": {"a": "Cierta: foliculares (endodermo) y parafoliculares ({{cresta neural}}) tienen origen distinto.", "b": "Cierta: las foliculares pasan de cúbicas/planas (reposo) a cilíndricas (activas).", "c": "Cierta: la actividad implica reabsorción de coloide → más {{gránulos/gotas}} intracelulares.", "d": "CORRECTA (la FALSA, clave 2024-25 = D). Las parafoliculares NO contactan con la {{luz}} del folículo; quedan en la pared sin alcanzar el coloide."}, "_k": "org2p-039:656032108", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-040", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. A)", "enunciado": "En relación con las **células oxífilas de las paratiroides** humanas, **NO** es cierto que:", "opciones": {"a": "Su número no es significativo hasta llegar a la pubertad.", "b": "Son células secretoras que colaboran con las principales en la secreción de PTH.", "c": "Tienen abundantes mitocondrias en su citoplasma.", "d": "Son de mayor tamaño que las células principales."}, "correcta": "b", "razones": {"a": "Cierta: las oxífilas aparecen y aumentan a partir de la {{pubertad}}.", "b": "CORRECTA (la FALSA, clave 2024-25 = A es 'no es cierta'; aquí la afirmación falsa marcada es la B). Las oxífilas NO secretan {{PTH}}; la PTH la producen las células {{principales}}.", "c": "Cierta: son intensamente eosinófilas por su gran cantidad de {{mitocondrias}}.", "d": "Cierta: las oxífilas son de mayor {{tamaño}} que las principales."}, "_k": "org2p-040:2009929168", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-041", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "De las características mencionadas a continuación, ¿cuál es propia de las células de la **capa fasciculada** de la corteza suprarrenal?", "opciones": {"a": "Son las más abundantes y grandes en la corteza.", "b": "Frecuentemente son binucleadas.", "c": "Son las que presentan más gotas de lípidos.", "d": "Todas las anteriores."}, "correcta": "d", "razones": {"a": "Cierta: las de la **fascicular** son las más abundantes y grandes (espongiocitos).", "b": "Cierta: con frecuencia son {{binucleadas}}.", "c": "Cierta: son las que tienen más {{gotas de lípidos}} (colesterol).", "d": "CORRECTA (clave oficial 2024-25 = D): {{todas}} las características son propias de la zona fascicular."}, "_k": "org2p-041:2384875513", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-042", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. B)", "enunciado": "Sobre la **médula de la glándula suprarrenal**, señala la respuesta correcta:", "opciones": {"a": "Sus células se tiñen de pardo con sales de cromo (reacción cromafín).", "b": "Las células secretoras de noradrenalina presentan gránulos más electrodensos que las de adrenalina.", "c": "Embrionariamente se origina de la cresta neural entre las semanas 6-7.", "d": "Todas son ciertas."}, "correcta": "b", "razones": {"a": "Cierta también, pero la clave oficial 2024-25 marca la B como la pedida.", "b": "CORRECTA (clave 2024-25 = B). Las células productoras de {{noradrenalina}} tienen gránulos más {{electrodensos}} que las de adrenalina.", "c": "Cierta: deriva de la {{cresta neural}} (semanas 6-7).", "d": "Las tres son ciertas, pero la marcada oficialmente es la {{B}}."}, "_k": "org2p-042:3521759222", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-043", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B)", "enunciado": "En el páncreas endocrino, gránulos con un **centro fuertemente electrodenso rodeado de un halo claro** (cristaloide) son propios de las células:", "opciones": {"a": "Alfa.", "b": "Beta.", "c": "Delta.", "d": "PP."}, "correcta": "b", "razones": {"a": "Las células {{alfa}} (glucagón) tienen gránulos de contenido electrodenso uniforme, sin halo claro.", "b": "CORRECTA (clave 2024-25 = B). Las células {{beta}} (insulina) tienen gránulos con cristaloide poligonal {{electrodenso}} rodeado de un {{halo claro}}.", "c": "Las delta (somatostatina) tienen gránulo grande de densidad homogénea baja.", "d": "Las PP son escasas, gránulos pequeños."}, "_k": "org2p-043:3351943404", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-044", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "De las siguientes formaciones, ¿cuál **NO** se localiza en la **corteza renal**?", "opciones": {"a": "Corpúsculo renal.", "b": "Túbulo contorneado proximal.", "c": "Asa de Henle.", "d": "Túbulo contorneado distal."}, "correcta": "c", "razones": {"a": "Falsa (sí está en corteza): el {{corpúsculo renal}} es cortical.", "b": "Falsa (sí está): el {{TCP}} es cortical.", "c": "CORRECTA (la que NO está, clave 2024-25 = C). El {{asa de Henle}} desciende hacia la {{médula}}; su porción recta no es cortical.", "d": "Falsa (sí está): el {{TCD}} es cortical."}, "_k": "org2p-044:1024929625", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-045", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q18, 2024-25 (clave D)", "enunciado": "Uno de los tipos celulares que forman parte del riñón presenta una importante **capacidad fagocítica**, ¿cuál?", "opciones": {"a": "Podocitos.", "b": "Células yuxtaglomerulares.", "c": "Células mesangiales extraglomerulares.", "d": "Células mesangiales intraglomerulares."}, "correcta": "d", "razones": {"a": "Los {{podocitos}} forman la barrera de filtración (pedicelos), no fagocitan.", "b": "Las yuxtaglomerulares secretan {{renina}}, no fagocitan.", "c": "Las mesangiales extraglomerulares (células de Lacis) tienen función de soporte/comunicación.", "d": "CORRECTA (clave 2024-25 = D). Las mesangiales {{intraglomerulares}} tienen capacidad {{fagocítica}} (limpian la membrana basal) y contráctil."}, "_k": "org2p-045:3090779143", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-046", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A)", "enunciado": "Sobre las **vías urinarias**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Sin distensión, el urotelio tiene más capas en la vejiga vacía que en la pelvis renal.", "b": "Las células del urotelio presentan abundantes vesículas fusiformes limitadas por membrana.", "c": "La capa muscular de la vejiga está formada por tres subcapas de fibras musculares lisas (detrusor).", "d": "La vejiga está inervada por fibras simpáticas y parasimpáticas."}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2024-25 = A). Es al revés: el urotelio tiene MÁS capas en la {{pelvis/uréter}} que en la vejiga.", "b": "Cierta: las células en paraguas tienen {{vesículas fusiformes}} (reserva de membrana apical).", "c": "Cierta: el {{detrusor}} tiene 3 subcapas.", "d": "Cierta: inervación {{simpática y parasimpática}}."}, "_k": "org2p-046:1676876680", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-047", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué célula renal es la encargada de secretar **prostaglandina E2**?", "opciones": {"a": "Células de la mácula densa.", "b": "Células yuxtaglomerulares.", "c": "Fibroblastos modificados del intersticio de la corteza.", "d": "Fibroblastos modificados del intersticio de la médula."}, "correcta": "d", "razones": {"a": "La {{mácula densa}} censa el NaCl tubular, no secreta PGE2.", "b": "Las yuxtaglomerulares secretan {{renina}}.", "c": "Los fibroblastos corticales modificados producen {{eritropoyetina}} (EPO), no PGE2.", "d": "CORRECTA (clave 2024-25 = D). Los fibroblastos modificados del intersticio {{medular}} secretan {{prostaglandina E2}}."}, "_k": "org2p-047:867273910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-048", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "Señala la afirmación **CORRECTA** sobre el esfínter y el plexo vesicales:", "opciones": {"a": "El esfínter vesical interno es de músculo estriado voluntario.", "b": "El esfínter externo depende del sistema simpático.", "c": "El esfínter vesical interno es un engrosamiento de la subcapa circular del detrusor; el plexo vesical lo forman fibras simpáticas y parasimpáticas.", "d": "La vejiga carece de inervación autónoma."}, "correcta": "c", "razones": {"a": "Falsa: el esfínter interno es de músculo {{liso}} (involuntario).", "b": "Falsa: el esfínter externo (uretral) es estriado, control {{somático}}.", "c": "CORRECTA (clave 2024-25 = C). Esfínter interno = engrosamiento de la subcapa {{circular}} del detrusor; plexo vesical = fibras {{simpáticas y parasimpáticas}}.", "d": "Falsa: la vejiga sí tiene inervación {{autónoma}}."}, "_k": "org2p-048:1830958548", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-049", "tema": "Urinario", "examen": "2022-23 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23 (resp. A); glomérulo", "enunciado": "Sobre el **glomérulo renal**, señala lo que **NO** es cierto:", "opciones": {"a": "Los capilares glomerulares son fenestrados con fenestraciones provistas de diafragma.", "b": "Entre los pedicelos hay ranuras de filtración cerradas por un diafragma con nefrina.", "c": "La membrana basal es compartida por endotelio y podocitos.", "d": "Las células mesangiales dan soporte a los capilares."}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2022-23 = A). Los capilares glomerulares son fenestrados pero las fenestraciones {{NO tienen diafragma}} (a diferencia de otros fenestrados).", "b": "Cierta: el diafragma de la ranura de filtración contiene {{nefrina/podocina}}.", "c": "Cierta: la {{membrana basal}} glomerular es compartida (fusión endotelial + podocitaria).", "d": "Cierta: las {{mesangiales}} dan soporte estructural a los capilares."}, "_k": "org2p-049:2264242390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-050", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "¿Qué **NO** es una característica propia de las **células de Sertoli**?", "opciones": {"a": "Tener forma cilíndrica alta.", "b": "Presentar numerosos pliegues de la membrana.", "c": "Contener cuerpos amiláceos en su citoplasma.", "d": "Presentar uniones oclusivas con células de Sertoli vecinas."}, "correcta": "c", "razones": {"a": "Cierta: las Sertoli son células {{cilíndricas altas}} que llegan de la lámina basal a la luz.", "b": "Cierta: presentan numerosos {{pliegues}} de membrana que envuelven a las células germinales.", "c": "CORRECTA (la FALSA, clave 2024-25 = C). Los {{cuerpos amiláceos}} son de la {{próstata}}; las Sertoli tienen cuerpos de Charcot-Böttcher.", "d": "Cierta: las {{uniones oclusivas}} entre Sertoli forman la barrera hemato-testicular."}, "_k": "org2p-050:1322815544", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-051", "tema": "Reproductor", "examen": "Concepto recurrente (Sertoli)", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P Q16; concepto recurrente", "enunciado": "Las **células de Sertoli** sintetizan principalmente:", "opciones": {"a": "Testosterona.", "b": "Proteína fijadora de andrógenos (ABP) e inhibina.", "c": "LH y FSH.", "d": "Cristales de Reinke."}, "correcta": "b", "razones": {"a": "La {{testosterona}} la producen las células de {{Leydig}} (intersticio).", "b": "CORRECTA. Las Sertoli sintetizan {{ABP}} (mantiene andrógenos en el túbulo) e {{inhibina}} (frena la FSH).", "c": "LH y FSH son hormonas {{hipofisarias}}, no testiculares.", "d": "Los {{cristales de Reinke}} son propios de las células de Leydig."}, "_k": "org2p-051:3245024624", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-052", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. D); cristales de Reinke", "enunciado": "Los **cristales de Reinke** son propios de:", "opciones": {"a": "Espermatogonias tipo A oscuras.", "b": "Células glandulares de la próstata.", "c": "Células de Sertoli.", "d": "Células de Leydig."}, "correcta": "d", "razones": {"a": "Las espermatogonias son células germinales, sin cristales de Reinke.", "b": "La próstata tiene {{cuerpos amiláceos}}, no cristales de Reinke.", "c": "Las Sertoli tienen cuerpos de {{Charcot-Böttcher}}.", "d": "CORRECTA (clave 2021-junio = D). Los {{cristales de Reinke}} son inclusiones citoplasmáticas características de las células de {{Leydig}}."}, "_k": "org2p-052:81412857", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-053", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D); meiosis", "enunciado": "De las células germinales del testículo, ¿cuál experimenta la **primera división meiótica**?", "opciones": {"a": "Espermatogonia tipo A.", "b": "Espermatocito secundario.", "c": "Espermátida.", "d": "Ninguna de las anteriores."}, "correcta": "d", "razones": {"a": "Las espermatogonias se dividen por {{mitosis}}, no meiosis.", "b": "El espermatocito {{secundario}} hace la SEGUNDA división meiótica.", "c": "Las espermátidas ya no se dividen (espermiogénesis).", "d": "CORRECTA (clave 2024-25 = D). La 1ª división meiótica la hace el espermatocito {{primario}}, que no figura entre las opciones → 'ninguna de las anteriores'."}, "_k": "org2p-053:658427566", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-054", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. C)", "enunciado": "¿En qué célula germinal se produce la **segunda división meiótica**?", "opciones": {"a": "Espermatogonia tipo A.", "b": "Espermatogonia tipo B.", "c": "Espermatocito secundario.", "d": "Espermátida."}, "correcta": "c", "razones": {"a": "La espermatogonia A se renueva por {{mitosis}}.", "b": "La espermatogonia B se diferencia a espermatocito primario.", "c": "CORRECTA (clave 2021-junio = C). El espermatocito {{secundario}} (resultado de la 1ª meiótica) realiza la {{2ª división meiótica}} → espermátidas.", "d": "La espermátida ya no se divide; sufre espermiogénesis."}, "_k": "org2p-054:1048147569", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-055", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las túnicas que recubren el testículo, ¿cuál es la **más externa**?", "opciones": {"a": "Túnica vascular.", "b": "Túnica albugínea.", "c": "Túnica vaginal.", "d": "Túnica muscular."}, "correcta": "c", "razones": {"a": "La túnica vascular es la más {{interna}} (bajo la albugínea).", "b": "La {{albugínea}} es la cápsula fibrosa intermedia.", "c": "CORRECTA (clave 2024-25 = C). La túnica {{vaginal}} (derivada del peritoneo) es la más {{externa}}.", "d": "No es una túnica testicular clásica en este contexto."}, "_k": "org2p-055:689751499", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-056", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D); próstata", "enunciado": "En relación con la **próstata**, señala lo que **NO** es correcto:", "opciones": {"a": "Las fibras musculares lisas son abundantes en su cápsula.", "b": "No es infrecuente encontrar glicoproteínas calcificadas (cuerpos amiláceos) en la luz glandular.", "c": "Rodea la porción final de los conductos eyaculadores.", "d": "Las glándulas principales están ubicadas internamente, inmediatamente alrededor de la uretra."}, "correcta": "d", "razones": {"a": "Cierta: la cápsula prostática es rica en {{músculo liso}}.", "b": "Cierta: los {{cuerpos amiláceos}} son típicos de la luz prostática.", "c": "Cierta: la próstata rodea los {{conductos eyaculadores}} y la uretra prostática.", "d": "CORRECTA (la FALSA, clave 2024-25 = D). Las glándulas {{principales}} son {{periféricas}}; las periuretrales/mucosas son las internas."}, "_k": "org2p-056:2586158088", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-057", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); conducto deferente", "enunciado": "¿Qué capa **NO** es propia del **conducto deferente**?", "opciones": {"a": "Serosa en todo su trayecto.", "b": "Epitelio cilíndrico pseudoestratificado con estereocilios.", "c": "Lámina propia.", "d": "Muscular muy gruesa (tres capas)."}, "correcta": "a", "razones": {"a": "CORRECTA (la que NO es propia, clave 2021-junio = A). En gran parte de su trayecto el deferente tiene {{adventicia}}, no serosa.", "b": "Cierta: epitelio cilíndrico {{pseudoestratificado}} con estereocilios.", "c": "Cierta: tiene {{lámina propia}}.", "d": "Cierta: la {{muscular}} es muy gruesa (3 capas) → palpable como cordón."}, "_k": "org2p-057:496507390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-058", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B); foliculogénesis", "enunciado": "Sobre el **desarrollo de los folículos ováricos**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Los folículos primordiales están formados por un ovocito rodeado por una sola capa de células aplanadas.", "b": "La teca externa de los folículos secundarios está formada por células fibrosas con receptores para FSH.", "c": "Los cuerpos de Call-Exner son propios de los folículos secundarios.", "d": "Los folículos de Graaf tienen múltiples capas de granulosa y una gran cavidad antral."}, "correcta": "b", "razones": {"a": "Cierta: el {{primordial}} = ovocito + 1 capa de células planas.", "b": "CORRECTA (la FALSA, clave 2024-25 = B). La teca {{externa}} es fibrosa de soporte; los receptores hormonales están en la teca {{interna}} (LH) y la granulosa (FSH), no en la externa.", "c": "Cierta: los {{cuerpos de Call-Exner}} aparecen en folículos {{secundarios}}.", "d": "Cierta: el folículo de {{Graaf}} (maduro) tiene gran {{antro}} y granulosa multilaminar."}, "_k": "org2p-058:2157574592", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-059", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P (resp. C); antro folicular", "enunciado": "¿En cuál de los siguientes tipos de folículos se empieza a desarrollar lo que llamamos **antro folicular**?", "opciones": {"a": "Folículos primordiales.", "b": "Folículos primarios.", "c": "Folículos secundarios.", "d": "Folículos de De Graaf."}, "correcta": "c", "razones": {"a": "El primordial solo tiene 1 capa de células planas, sin antro.", "b": "El primario tiene zona pelúcida y granulosa, aún sin cavidad.", "c": "CORRECTA (clave 2022-23 = C). El {{antro}} (cavidad con líquido folicular) aparece por primera vez en el folículo {{secundario}} (antral).", "d": "El de Graaf ya tiene un gran antro consolidado."}, "_k": "org2p-059:3754665862", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-060", "tema": "Reproductor", "examen": "Concepto recurrente (zona pelúcida)", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio Q17; conceptos foliculares", "enunciado": "La **zona pelúcida** comienza a desarrollarse en el folículo:", "opciones": {"a": "Primordial.", "b": "Primario.", "c": "De Graaf.", "d": "Cuerpo lúteo."}, "correcta": "b", "razones": {"a": "En el primordial aún no hay zona pelúcida.", "b": "CORRECTA. La {{zona pelúcida}} (capa glicoproteica entre ovocito y granulosa) aparece en el folículo {{primario}}.", "c": "En el de Graaf ya está bien formada, pero no es donde se inicia.", "d": "El cuerpo lúteo es postovulatorio."}, "_k": "org2p-060:2766706593", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-061", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C falsa); cuerpo lúteo", "enunciado": "Sobre el **cuerpo lúteo / ovario**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células luteínicas de la granulosa producen principalmente progesterona.", "b": "Las células luteínicas de la teca producen principalmente estrógenos.", "c": "Las células epitelioides de la íntima producen mayoritariamente progesterona.", "d": "El folículo dominante produce inhibina."}, "correcta": "c", "razones": {"a": "Cierta: las luteínicas de la {{granulosa}} → {{progesterona}}.", "b": "Cierta: las luteínicas de la {{teca}} → {{estrógenos}}/andrógenos.", "c": "CORRECTA (la FALSA, clave 2021-junio = C). Las células tecales/de la íntima producen {{estrógenos}}/andrógenos, no mayoritariamente progesterona.", "d": "Cierta: el folículo dominante produce {{inhibina}}."}, "_k": "org2p-061:1456756959", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-062", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B); trompas", "enunciado": "Sobre las **trompas de Falopio**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Presentan epitelio cilíndrico simple con abundantes células ciliadas.", "b": "Durante la fase lútea las células secretoras disminuyen drásticamente su actividad.", "c": "La mucosa tiene pliegues longitudinales máximos en la ampolla.", "d": "La muscular está formada por dos subcapas de fibras lisas."}, "correcta": "b", "razones": {"a": "Cierta: epitelio {{cilíndrico simple}} con células ciliadas y secretoras.", "b": "CORRECTA (la FALSA, clave 2024-25 = B). En la fase {{lútea}} (progesterona) las células secretoras {{AUMENTAN}} su actividad, no disminuyen.", "c": "Cierta: los pliegues son máximos en la {{ampolla}}.", "d": "Cierta: la muscular tiene {{dos subcapas}} de músculo liso."}, "_k": "org2p-062:1224390997", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-063", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave C); endometrio", "enunciado": "Sobre el **endometrio** durante el ciclo menstrual, señala la afirmación **CORRECTA**:", "opciones": {"a": "El endometrio tiene riego sanguíneo abundante durante la fase menstrual.", "b": "Durante la fase proliferativa las glándulas pierden progresivamente glucógeno.", "c": "En fase secretora las glándulas son pronunciadas y tortuosas, con células ricas en glucógeno.", "d": "La vascularización es máxima en fase menstrual con poca actividad de las arterias espirales."}, "correcta": "c", "razones": {"a": "Falsa: en la fase {{menstrual}} hay vasoconstricción de las arterias espirales (isquemia, descamación).", "b": "Falsa: en la {{proliferativa}} las glándulas son rectas y ganan actividad por estrógenos.", "c": "CORRECTA (clave 2024-25 = C). En fase {{secretora}} (progesterona) las glándulas son {{tortuosas}} y acumulan {{glucógeno}}.", "d": "Falsa: las arterias {{espirales}} sí están muy implicadas en la fase menstrual (vasoespasmo)."}, "_k": "org2p-063:962023626", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-064", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. A); cérvix", "enunciado": "¿Qué epitelio es propio del **cérvix uterino** (antes de penetrar en la vagina)?", "opciones": {"a": "Cilíndrico simple con células secretoras de moco.", "b": "Plano estratificado no queratinizado.", "c": "Cilíndrico pseudoestratificado ciliado.", "d": "De transición."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-junio = A). El endocérvix tiene epitelio {{cilíndrico simple}} secretor de {{moco}}.", "b": "Ese es el epitelio de la {{vagina}} (y del exocérvix).", "c": "El ciliado pseudoestratificado es respiratorio.", "d": "El de transición es urinario."}, "_k": "org2p-064:2251419726", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-065", "tema": "Reproductor", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); glándulas de Littré", "enunciado": "Las **glándulas de Littré** son propias de:", "opciones": {"a": "La uretra peniana (esponjosa).", "b": "La uretra membranosa.", "c": "La uretra prostática.", "d": "La vejiga."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-junio = A). Las glándulas de {{Littré}} son glándulas mucosas de la uretra {{esponjosa/peniana}}.", "b": "No son propias de la uretra membranosa.", "c": "En la prostática desembocan los conductos prostáticos, no Littré.", "d": "La vejiga no tiene glándulas de Littré."}, "_k": "org2p-065:4071427875", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-066", "tema": "Reproductor", "examen": "Concepto recurrente (corona radiada)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. B)", "enunciado": "La **corona radiada** está formada por:", "opciones": {"a": "Células de la teca interna.", "b": "Células de la granulosa que rodean al ovocito tras la ovulación.", "c": "Fibroblastos del estroma ovárico.", "d": "Células germinales primordiales."}, "correcta": "b", "razones": {"a": "La teca interna queda en la pared folicular, no rodea al ovocito ovulado.", "b": "CORRECTA (clave 2022-23 = B). La corona radiada = células de la {{granulosa}} (cumulus) que acompañan al ovocito en la {{ovulación}}.", "c": "Los fibroblastos forman el estroma, no la corona.", "d": "Las células germinales primordiales son embrionarias."}, "_k": "org2p-066:2962398792", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-067", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C); córnea", "enunciado": "Respecto al **epitelio de la córnea**, es cierto que:", "opciones": {"a": "Está muy vascularizado.", "b": "Se localiza en la superficie posterior de la córnea.", "c": "Contiene terminaciones nerviosas.", "d": "Contiene melanocitos."}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (su transparencia depende de ello).", "b": "Falsa: el epitelio corneal está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA (clave 2024-25 = C). El epitelio corneal anterior está muy {{inervado}} (terminaciones nerviosas libres → gran sensibilidad).", "d": "Falsa: no contiene melanocitos."}, "_k": "org2p-067:1370518998", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-068", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave D); humor acuoso", "enunciado": "¿Qué estructura produce el **humor acuoso**?", "opciones": {"a": "Iris.", "b": "Fibras zonulares.", "c": "Coroides.", "d": "Procesos ciliares."}, "correcta": "d", "razones": {"a": "El {{iris}} regula la pupila, no produce humor acuoso.", "b": "Las {{fibras zonulares}} sostienen el cristalino.", "c": "La {{coroides}} es vascular/nutricia de la retina externa.", "d": "CORRECTA (clave 2024-25 = D). Los {{procesos ciliares}} (epitelio ciliar) secretan el {{humor acuoso}}."}, "_k": "org2p-068:179017947", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-069", "tema": "Ojo", "examen": "2021-junio 2º parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A); células bipolares", "enunciado": "Sobre las **células bipolares de la retina**:", "opciones": {"a": "Contactan con células ganglionares y con fotorreceptores.", "b": "Sus axones forman el nervio óptico.", "c": "Son abundantes en la fóvea central.", "d": "Son células fotorreceptoras."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2021-junio = A). Las {{bipolares}} son la neurona intermedia: contactan {{fotorreceptores}} y {{ganglionares}}.", "b": "Falsa: los axones que forman el nervio óptico son de las {{ganglionares}}.", "c": "Falsa: en la {{fóvea}} predominan los conos; las capas internas se desplazan.", "d": "Falsa: las fotorreceptoras son los conos y bastones."}, "_k": "org2p-069:641108057", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-070", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A); Corti", "enunciado": "Sobre el **órgano de Corti** del oído interno, es cierto que:", "opciones": {"a": "No presenta otolitos.", "b": "Las células ciliadas presentan estereocilios y un cinocilio funcional en el adulto.", "c": "La cúpula cubre sus células ciliadas.", "d": "Se localiza sobre la membrana vestibular (de Reissner)."}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2024-25 = A). El órgano de Corti NO tiene {{otolitos}} (esos están en las máculas del utrículo/sáculo).", "b": "Falsa: las células ciliadas del Corti tienen estereocilios pero {{pierden el cinocilio}} en el adulto.", "c": "Falsa: la {{cúpula}} cubre las crestas ampollares; el Corti tiene la membrana {{tectoria}}.", "d": "Falsa: el Corti se asienta sobre la membrana {{basilar}}, no sobre la de Reissner."}, "_k": "org2p-070:4064928720", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-071", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C); mácula del sáculo", "enunciado": "Sobre la **mácula del sáculo**, es cierto que:", "opciones": {"a": "Tiene una posición horizontal.", "b": "Se localiza en una región de los conductos semicirculares.", "c": "Está en contacto con la endolinfa.", "d": "No contiene células de sostén."}, "correcta": "c", "razones": {"a": "Falsa: la mácula del sáculo está en posición {{vertical}} (la del utrículo es horizontal).", "b": "Falsa: las máculas están en utrículo y sáculo, NO en los {{conductos semicirculares}} (allí están las crestas).", "c": "CORRECTA (clave 2024-25 = C). La mácula está bañada por {{endolinfa}} (dentro del laberinto membranoso).", "d": "Falsa: sí tiene células de {{sostén}} junto a las ciliadas."}, "_k": "org2p-071:2089677918", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-072", "tema": "Oído

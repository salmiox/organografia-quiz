iado": "De las siguientes afirmaciones referentes a la hipófisis del ser humano, una NO es cierta:", "opciones": {"a": "La pars intermedia en el adulto es responsable de la secreción de hormona estimulante de los melanocitos (MSH).", "b": "En la pars intermedia la presencia de células es más escasa.", "c": "Las hormonas hipotalámicas que actúan sobre la adenohipófisis son de naturaleza peptídica.", "d": "La pars tuberalis está constituida principalmente por células cromófobas."}, "correcta": "a", "razones": {"a": "FALSA (la que hay que marcar): en el **humano adulto** la pars intermedia es {{rudimentaria}} y NO tiene un papel relevante en la secreción de MSH. La MSH deriva de la POMC, pero la función melanotropa de la pars intermedia es propia de otras especies, no del humano adulto.", "b": "Cierta: en el ser humano la pars intermedia es muy reducida ({{escasa}}, con quistes de Rathke).", "c": "Cierta: las hormonas hipotalámicas liberadoras/inhibidoras son {{peptídicas}} (excepto la dopamina, que es amina).", "d": "Cierta: la pars tuberalis es predominantemente de células {{cromófobas}} (con algunas gonadotropas)."}, "_k": "org2p-002:1908501084", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-003", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido (zonas suprarrenal)", "enunciado": "(Endocrino — suprarrenal) La presencia de la estructura señalada en la glándula suprarrenal corresponde a la zona:", "opciones": {"a": "Zona glomerular.", "b": "Zona fascicular.", "c": "Zona reticular.", "d": "Médula."}, "correcta": "b", "razones": {"a": "La **zona glomerular** (externa, bajo la cápsula) tiene células en arcos/ovillos; produce mineralocorticoides.", "b": "Por defecto (concepto más preguntado): la **zona fascicular** es la más ancha, con espongiocitos en cordones rectos paralelos, citoplasma vacuolado por lípidos. Pregunta de transcripción dudosa (foto inclinada).", "c": "La **zona reticular** (profunda) tiene cordones anastomosados, células con lipofuscina.", "d": "La **médula** central tiene células cromafines (catecolaminas).", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-003:1224594949", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-004", "tema": "Piel", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (estratos epidermis)", "enunciado": "IMAGEN 1. Sección histológica de piel. ¿A qué capa corresponde lo que indica la flecha?", "opciones": {"a": "Estrato córneo.", "b": "Estrato germinativo o basal.", "c": "Estrato espinoso.", "d": "Estrato granuloso."}, "correcta": "a", "razones": {"a": "Por defecto (lo más señalado en piel gruesa): la capa más superficial, eosinófila, laminar y anucleada → **estrato córneo** {{(escamas de queratina sin núcleo, superficial)}}.", "b": "El basal es la hilera profunda columnar sobre la dermis.", "c": "El espinoso son varias capas de células poligonales con espinas.", "d": "El granuloso tiene gránulos basófilos de queratohialina (justo bajo el córneo).", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-004:1325566814", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-005", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (cromófilas adenohipófisis)", "enunciado": "IMAGEN 2. ¿Qué células endocrinas (adenohipófisis) indican los números?", "opciones": {"a": "1-Cromófila acidófila, 2-Cromófila basófila, 3-Cromófoba.", "b": "1-Cromófila basófila, 2-Cromófila acidófila, 3-Cromófoba.", "c": "1-Cromófoba, 2-Cromófila basófila, 3-Cromófila acidófila.", "d": "1-Cromófila acidófila, 2-Cromófoba, 3-Cromófila basófila."}, "correcta": "a", "razones": {"a": "Criterio de identificación: **acidófila** = citoplasma rosa-rojo intenso (somatotropas/mamotropas), **basófila** = citoplasma azul-púrpura (corticotropas/tirotropas/gonadotropas), **cromófoba** = citoplasma pálido sin teñir. La asignación depende de los colores reales en la imagen; opción A es la combinación más frecuente cuando 1=rosa, 2=azul, 3=pálido.", "b": "Solo correcta si 1 es azul (basófila) y 2 rosa.", "c": "Solo si 1 es pálida.", "d": "Solo si 3 es basófila y 2 pálida.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-005:4201543411", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-006", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 3. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pituitaria.", "b": "Paratiroides.", "c": "Tiroides.", "d": "Adrenal."}, "correcta": "c", "razones": {"a": "La hipófisis muestra cordones de células cromófilas/cromófobas y sinusoides (sin folículos).", "b": "La paratiroides tiene cordones de células principales pequeñas + oxífilas, sin coloide.", "c": "Criterio clave: si se ven **folículos** redondos llenos de {{coloide}} rosado homogéneo rodeados de epitelio cúbico → **tiroides**. Es el patrón folicular inconfundible.", "d": "La suprarrenal muestra zonación cortical (cordones) + médula.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-006:3174869072", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-007", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (identificar glándula endocrina)", "enunciado": "IMAGEN 4. ¿A qué glándula endocrina pertenece esta imagen?", "opciones": {"a": "Pineal.", "b": "Tiroides.", "c": "Hipófisis.", "d": "Paratiroides."}, "correcta": "d", "razones": {"a": "La pineal tiene pinealocitos y cuerpos arenáceos (acérvulos calcificados).", "b": "La tiroides tendría folículos con coloide.", "c": "La hipófisis tiene mezcla de cromófilas acidófilas/basófilas y sinusoides.", "d": "Por defecto (cuando se contrasta con tiroides en la misma serie): cordones densos de células {{principales}} pequeñas y pálidas, con algunas {{oxífilas}} eosinófilas, sin coloide → **paratiroides**. Criterio: dos poblaciones celulares (principales + oxífilas), sin folículos.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-007:3108303954", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-008", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (zonas suprarrenal)", "enunciado": "IMAGEN 5. Indica a qué zonas de la corteza de la glándula adrenal corresponde cada número:", "opciones": {"a": "1-Cápsula, 2-Zona fascicular, 3-Médula.", "b": "1-Zona reticular, 2-Zona fascicular, 3-Zona glomerular.", "c": "1-Zona glomerular, 2-Zona fascicular, 3-Zona reticular.", "d": "1-Zona glomerular, 2-Zona reticular, 3-Zona fascicular."}, "correcta": "c", "razones": {"a": "Incompleta: mezcla cápsula y médula sin la zonación cortical ordenada.", "b": "Falsa: invierte el orden (glomerular es la más externa, no la 3).", "c": "CORRECTA: de fuera a dentro el orden es **glomerular → fascicular → reticular** (regla 'GFR'). Si 1 es la más externa bajo cápsula → glomerular (arcos), 2 = fascicular (cordones rectos, espongiocitos), 3 = reticular (cordones anastomosados).", "d": "Falsa: la reticular no va antes que la fascicular.", "confianza": "media"}, "_k": "org2p-008:20651113", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-009", "tema": "Endocrino", "examen": "2025-26 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Imagen recurrente (regiones hipófisis)", "enunciado": "IMAGEN 6. Zona de la glándula hipófisis (H-E). ¿A qué región corresponde la que señalan las flechas?", "opciones": {"a": "Pars distalis.", "b": "Pars nervosa.", "c": "Pars tuberalis.", "d": "Pars intermedia."}, "correcta": "d", "razones": {"a": "La **pars distalis** es la masa principal de la adenohipófisis con cordones de cromófilas/cromófobas y sinusoides.", "b": "La **pars nervosa** es pálida, fibrilar (axones + pituicitos), con cuerpos de Herring.", "c": "La **pars tuberalis** es el manguito que rodea el tallo, con cromófobas y gonadotropas.", "d": "Por defecto (lo más preguntado con flechas): banda entre adeno y neurohipófisis con {{quistes de Rathke}} (folículos con coloide) y células basófilas → **pars intermedia**. Criterio: vesículas/quistes coloideos en la zona limítrofe.", "confianza": "baja"}, "confianza": "baja", "_k": "org2p-009:1999909973", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-010", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25", "enunciado": "De entre las células que constituyen el parénquima de la adenohipófisis, ¿cuáles presentan los gránulos de secreción más grandes?", "opciones": {"a": "Células somatotropas.", "b": "Células mamotropas.", "c": "Células tirotropas.", "d": "Células gonadotropas."}, "correcta": "c", "razones": {"a": "Las somatotropas (GH) tienen gránulos densos pero no los mayores.", "b": "Las mamotropas (prolactina) tienen gránulos grandes (~600 nm) pero la clave oficial marca tirotropas.", "c": "CORRECTA (clave oficial 2024-25 = C): las **células tirotropas** presentan los gránulos de secreción de mayor tamaño según el criterio del profesor (gránulos pequeños y periféricos en otras versiones — atender a la clave). Memorizar tal cual cae.", "d": "Las gonadotropas tienen gránulos de tamaño intermedio.", "confianza": "media"}, "_k": "org2p-010:3313232386", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-011", "tema": "Endocrino", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25", "enunciado": "De las características mencionadas a continuación, ¿cuál es propia de las células de la capa fasciculada de la corteza suprarrenal?", "opciones": {"a": "Son las más abundantes y grandes en la corteza.", "b": "Frecuentemente son binucleadas.", "c": "Son las que presentan más gotas de lípidos.", "d": "Todas las anteriores."}, "correcta": "d", "razones": {"a": "Cierta: las células de la **fascicular** son las más abundantes y grandes (espongiocitos).", "b": "Cierta: con frecuencia son {{binucleadas}}.", "c": "Cierta: son las que tienen más {{gotas de lípidos}} (aspecto espongioso/vacuolado).", "d": "CORRECTA (clave oficial 2024-25 = D): {{todas}} las características son propias de la zona fascicular."}, "_k": "org2p-011:2556490879", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-012", "tema": "Urinario", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; concepto mesangiales fagocíticas", "enunciado": "Uno de los tipos celulares que se citan a continuación y que forman parte del riñón presenta una importante capacidad fagocítica, ¿cuál?", "opciones": {"a": "Podocitos.", "b": "Células yuxtaglomerulares.", "c": "Células mesangiales extraglomerulares.", "d": "Células mesangiales intraglomerulares."}, "correcta": "d", "razones": {"a": "Los **podocitos** forman la capa visceral de Bowman (barrera de filtración); no son fagocíticos.", "b": "Las **yuxtaglomerulares** secretan renina (músculo liso modificado).", "c": "Las mesangiales extraglomerulares (células de Lacis) forman parte del aparato yuxtaglomerular, función de soporte/señal.", "d": "CORRECTA (clave oficial 2024-25 = D): las **células mesangiales intraglomerulares** tienen importante capacidad {{fagocítica}} (limpian la barrera de filtración) además de contráctil y de soporte."}, "_k": "org2p-012:1025446844", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-013", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; espermatogénesis", "enunciado": "De las células germinales del testículo que se citan a continuación, ¿cuál experimenta la primera división meiótica?", "opciones": {"a": "Espermatogonia tipo A.", "b": "Espermatocito secundario.", "c": "Espermátida.", "d": "Ninguna de las anteriores."}, "correcta": "d", "razones": {"a": "El espermatogonio tipo A se divide por {{mitosis}} (mantiene la población madre).", "b": "El **espermatocito secundario** ya completó la 1ª meiosis; realiza la {{2ª división meiótica}}.", "c": "La espermátida es haploide, ya no se divide (entra en espermiogénesis).", "d": "CORRECTA (clave oficial 2024-25 = D): la 1ª división meiótica la realiza el **espermatocito PRIMARIO**, que no figura entre las opciones → 'ninguna de las anteriores'."}, "_k": "org2p-013:2678558896", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-014", "tema": "Reproductor", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; foliculogénesis", "enunciado": "¿Cuál de las siguientes afirmaciones sobre el desarrollo de los folículos ováricos NO es correcta?", "opciones": {"a": "Los folículos primordiales están formados por un ovocito rodeado solo por una capa de células aplanadas.", "b": "La teca externa de los folículos secundarios está formada por células de tipo fibroso que presentan receptores para FSH.", "c": "Los cuerpos de Call-Exner son propios de los folículos secundarios.", "d": "Los folículos de Graaf están formados por múltiples capas de células de la granulosa y una gran cavidad antral."}, "correcta": "b", "razones": {"a": "Cierta: el folículo primordial = ovocito + una capa de células {{planas}} (foliculares).", "b": "FALSA (clave oficial 2024-25 = B): la **teca externa** es fibrosa/conjuntiva y NO tiene receptores hormonales relevantes; los receptores para {{FSH}} están en las células de la {{granulosa}}, y los de LH en la teca interna. Confunde teca externa con la función hormonal.", "c": "Cierta: los **cuerpos de Call-Exner** (acúmulos de material entre células de granulosa) son propios de los folículos secundarios.", "d": "Cierta: el folículo de **Graaf** (maduro) tiene gran cavidad {{antral}} y múltiples capas de granulosa."}, "_k": "org2p-014:980690476", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-015", "tema": "Ojo", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; epitelio corneal", "enunciado": "Respecto al epitelio de la córnea, es cierto que:", "opciones": {"a": "Está muy vascularizado.", "b": "Se localiza en la superficie posterior de la córnea.", "c": "Contiene terminaciones nerviosas.", "d": "Contiene melanocitos."}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (su transparencia depende de ello).", "b": "Falsa: el epitelio corneal está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA (clave oficial 2024-25 = C): el epitelio corneal anterior está muy {{inervado}} (terminaciones nerviosas libres → gran sensibilidad).", "d": "Falsa: no contiene melanocitos."}, "_k": "org2p-015:1840441209", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-016", "tema": "Oído", "examen": "2024-25 2º parcial", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25; órgano de Corti", "enunciado": "El órgano de Corti del oído interno:", "opciones": {"a": "No presenta otolitos.", "b": "Las células ciliadas presentan estereocilios y cinocilio.", "c": "La cúpula cubre sus células ciliadas.", "d": "Se localiza en la membrana vestibular."}, "correcta": "a", "razones": {"a": "CORRECTA (clave oficial 2024-25 = A): el **órgano de Corti** {{NO tiene otolitos}} (los otolitos están en las máculas del utrículo/sáculo). Está cubierto por la membrana tectoria.", "b": "Falsa: las células ciliadas cocleares maduras tienen estereocilios pero {{pierden el cinocilio}}.", "c": "Falsa: la **cúpula** cubre las crestas ampollares (canales semicirculares), no el Corti (lo cubre la {{membrana tectoria}}).", "d": "Falsa: el Corti se asienta sobre la **membrana basilar**, no la vestibular (de Reissner)."}, "_k": "org2p-016:2792784383", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-017", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; antro folicular", "enunciado": "¿En cuál de los siguientes tipos de folículos se empieza a desarrollar lo que llamamos antro folicular?", "opciones": {"a": "Folículos primordiales.", "b": "Folículos primarios.", "c": "Folículos secundarios.", "d": "Folículos de De Graaf."}, "correcta": "c", "razones": {"a": "El primordial es ovocito + 1 capa plana, sin antro.", "b": "El primario tiene zona pelúcida y granulosa, aún sin cavidad.", "c": "CORRECTA (clave oficial 2022-23 = C): el **antro folicular** (cavidad con líquido) aparece por primera vez en el folículo {{secundario}} (antral).", "d": "El de Graaf ya tiene un gran antro consolidado (no es donde 'empieza')."}, "_k": "org2p-017:2726516651", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-018", "tema": "Oído", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; cresta ampollar vs otolitos", "enunciado": "¿Cuáles de los siguientes componentes NO están presentes en la cresta ampollar?", "opciones": {"a": "Otolitos.", "b": "Cúpula.", "c": "Células ciliadas con cinocilio.", "d": "Células de soporte."}, "correcta": "a", "razones": {"a": "CORRECTA (clave oficial 2022-23 = A): los **otolitos** NO están en la cresta ampollar; son propios de las {{máculas}} (utrículo/sáculo). La cresta usa la cúpula gelatinosa sin otolitos.", "b": "La cresta SÍ tiene **cúpula** (cubierta gelatinosa).", "c": "Las células ciliadas vestibulares SÍ conservan {{cinocilio}}.", "d": "Hay células de soporte."}, "_k": "org2p-018:2412825691", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-019", "tema": "Reproductor", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; poliespermia/gránulos corticales", "enunciado": "Durante la fecundación, ¿cuál de los siguientes procesos contribuye a evitar la poliespermia de forma primaria?", "opciones": {"a": "La activación de la reacción acrosómica del ovocito.", "b": "Un cambio en el potencial de membrana del ovocito.", "c": "La unión de ZP3 a los receptores de la membrana del espermatozoide.", "d": "A) y B) son ciertas."}, "correcta": "b", "razones": {"a": "Falsa: la reacción acrosómica la realiza el {{espermatozoide}}, no el ovocito, y facilita la entrada (no la bloquea).", "b": "CORRECTA (clave oficial 2022-23 = B): el bloqueo {{primario/rápido}} de la poliespermia es la {{despolarización}} (cambio del potencial de membrana del ovocito). El bloqueo lento/secundario es la reacción cortical (exocitosis de gránulos corticales → endurecimiento de la zona pelúcida).", "c": "Falsa: ZP3 media el reconocimiento espermatozoide-zona, no el bloqueo de poliespermia.", "d": "Falsa: solo B es el mecanismo primario."}, "_k": "org2p-019:2806604135", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-020", "tema": "Embriología", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; notocordio", "enunciado": "Respecto a la formación del notocordio, señala la respuesta correcta:", "opciones": {"a": "La placa notocordal se cierra simultáneamente en todo el embrión.", "b": "La prolongación notocordal se origina por la proliferación y migración de células del mesodermo desde el nódulo primitivo.", "c": "Señales procedentes del tubo neural inducen la formación del notocordio.", "d": "La placa neural está constituida por la región ventral del conducto notocordal."}, "correcta": "b", "razones": {"a": "Falsa: el proceso es {{progresivo (craneocaudal)}}, no simultáneo.", "b": "CORRECTA (clave oficial 2022-23 = B): la **prolongación notocordal** se origina por proliferación y migración de células desde el {{nódulo primitivo}} (nódulo de Hensen), hacia craneal.", "c": "Falsa: es justo al revés — el {{notocordio}} INDUCE al ectodermo a formar la placa neural, no al revés.", "d": "Falsa: la placa neural deriva del {{ectodermo}} dorsal por inducción notocordal, no del conducto notocordal ventral."}, "_k": "org2p-020:3781372617", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-021", "tema": "Embriología", "examen": "2022-23 2º parcial", "anio": 2023, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2022-23; capas germinales", "enunciado": "Señala la afirmación que es cierta:", "opciones": {"a": "A partir del hipoblasto se forma mesodermo y ectodermo.", "b": "La formación del esbozo primitivo (línea primitiva) sucede durante la segunda semana embrionaria.", "c": "La formación del esbozo primitivo sucede durante la cuarta semana embrionaria.", "d": "Ninguna de las anteriores es cierta."}, "correcta": "d", "razones": {"a": "Falsa: del **epiblasto** (no hipoblasto) derivan las tres capas (ecto, meso y endodermo).", "b": "Falsa: la **línea primitiva** aparece en la {{3ª}} semana (gastrulación), no en la 2ª.", "c": "Falsa: tampoco es la 4ª semana.", "d": "CORRECTA (clave oficial 2022-23 = D): ninguna afirmación es correcta (la línea primitiva surge en la 3ª semana, a partir del epiblasto)."}, "_k": "org2p-021:1691739769", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-022", "tema": "Endocrino", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; gránulo célula beta", "enunciado": "¿Qué célula de los islotes de Langerhans presenta gránulos de secreción con una estructura poligonal electrodensa (cristaloide) que destaca sobre el fondo claro del gránulo?", "opciones": {"a": "Células A o alfa.", "b": "Células B o beta.", "c": "Células D o delta.", "d": "Células PP."}, "correcta": "b", "razones": {"a": "El gránulo alfa (glucagón) es denso y homogéneo con halo estrecho.", "b": "CORRECTA (clave oficial 2021-22 = B): la **célula beta** (insulina) tiene gránulos con un núcleo {{cristaloide poligonal electrodenso}} (cristales de insulina-Zn) rodeado de halo claro. Rasgo ultraestructural típico.", "c": "La célula D (somatostatina) tiene gránulo grande pálido homogéneo.", "d": "La PP tiene gránulos pequeños."}, "_k": "org2p-022:3113517222", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-023", "tema": "Reproductor", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; próstata", "enunciado": "En relación con la próstata, una de las siguientes afirmaciones NO es correcta:", "opciones": {"a": "El parénquima glandular es un epitelio prismático simple o pseudoestratificado.", "b": "Las células del epitelio prostático presentan un RER escaso y un Golgi poco desarrollado.", "c": "Las secreciones prostáticas son ricas en fosfatasa ácida.", "d": "Es frecuente encontrar glicoproteínas calcificadas (cuerpos amiláceos) en la luz de las glándulas."}, "correcta": "b", "razones": {"a": "Cierta: el epitelio prostático es {{cilíndrico simple o pseudoestratificado}}.", "b": "FALSA (clave oficial 2021-22 = B): siendo una glándula secretora activa, las células prostáticas tienen RER y **Golgi** {{bien desarrollados}}, no escasos.", "c": "Cierta: la secreción es rica en {{fosfatasa ácida}} (y PSA).", "d": "Cierta: los **cuerpos amiláceos** (concreciones calcificadas) son frecuentes en la luz glandular, sobre todo con la edad."}, "_k": "org2p-023:1604219374", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-024", "tema": "Urinario", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; podocitos", "enunciado": "Una de las siguientes afirmaciones referentes a la nefrona es cierta:", "opciones": {"a": "La capa parietal de la cápsula de Bowman es un epitelio plano estratificado.", "b": "Los podocitos forman la capa visceral de la cápsula de Bowman.", "c": "Los podocitos y las células endoteliales glomerulares tienen láminas basales independientes.", "d": "Las ranuras de filtración quedan entre las prolongaciones primarias de los podocitos."}, "correcta": "b", "razones": {"a": "Falsa: la capa parietal de Bowman es epitelio {{plano SIMPLE}} (no estratificado).", "b": "CORRECTA (clave oficial 2021-22 = B): los **podocitos** constituyen la capa {{visceral}} de la cápsula de Bowman, abrazando los capilares glomerulares con sus pedicelos.", "c": "Falsa: podocitos y endotelio {{comparten}} una misma lámina basal (la membrana basal glomerular).", "d": "Falsa: las ranuras de filtración quedan entre los {{pedicelos (procesos secundarios)}}, no entre las prolongaciones primarias."}, "_k": "org2p-024:1155838928", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-025", "tema": "Oído", "examen": "2021-22 2º parcial", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2021-22; laberinto membranoso", "enunciado": "Es cierto que el laberinto membranoso:", "opciones": {"a": "Está localizado en el oído medio.", "b": "Es más grande que el laberinto óseo.", "c": "Contiene el órgano de Corti, pero no contiene las máculas del utrículo y el sáculo.", "d": "Ninguna de las anteriores es cierta."}, "correcta": "d", "razones": {"a": "Falsa: el laberinto membranoso está en el {{oído interno}}, dentro del laberinto óseo.", "b": "Falsa: es {{más pequeño}} que el óseo (va suspendido en la perilinfa dentro de él).", "c": "Falsa: el laberinto membranoso contiene el órgano de Corti {{Y TAMBIÉN}} las máculas del utrículo y el sáculo (y las crestas ampollares).", "d": "CORRECTA (clave oficial 2021-22 = D): ninguna es correcta (todas tienen un error)."}, "_k": "org2p-025:1422282956", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-026", "tema": "Reproductor", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; cristales de Reinke", "enunciado": "Los llamados cristales de Reinke son propios de uno de los siguientes tipos celulares:", "opciones": {"a": "Espermatogonios de tipo A oscuros.", "b": "Células glandulares de la próstata.", "c": "Células de Sertoli.", "d": "Células de Leydig."}, "correcta": "d", "razones": {"a": "Falsa: los espermatogonios no tienen cristales de Reinke.", "b": "Falsa: no son prostáticos.", "c": "Falsa: las **Sertoli** tienen los cristaloides de Charcot-Böttcher, no los de Reinke.", "d": "CORRECTA (marcada 2020-21 = D): los **cristales de Reinke** son inclusiones citoplasmáticas propias de las **células de Leydig** {{(intersticiales, productoras de testosterona)}}."}, "_k": "org2p-026:412443921", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-027", "tema": "Embriología", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; bloqueo poliespermia permanente", "enunciado": "Durante la fecundación, ¿cuál de los siguientes procesos contribuye a evitar la poliespermia de forma permanente?", "opciones": {"a": "La exocitosis de los gránulos corticales del ovocito.", "b": "Un cambio en el potencial de membrana del ovocito.", "c": "La unión de ZP3 a los receptores de la membrana del espermatozoide.", "d": "A) y B) son ciertas."}, "correcta": "a", "razones": {"a": "CORRECTA (marcada 2020-21 = A): el bloqueo {{permanente/lento}} es la **reacción cortical**: la exocitosis de los {{gránulos corticales}} modifica la zona pelúcida (reacción de zona) e impide la entrada de más espermatozoides.", "b": "El cambio de potencial de membrana es el bloqueo {{rápido/primario}}, NO el permanente.", "c": "ZP3 media el reconocimiento inicial, no el bloqueo.", "d": "Falsa: solo A es el mecanismo permanente."}, "_k": "org2p-027:2173939820", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-028", "tema": "Embriología", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; somitas", "enunciado": "En relación con la formación de los somitas, señala la respuesta correcta:", "opciones": {"a": "Se forman a partir de la segmentación del mesodermo intermedio.", "b": "Se forman todos los somitas simultáneamente.", "c": "La formación de los somitas se inicia en la región caudal del embrión.", "d": "Ninguna de las anteriores es cierta."}, "correcta": "d", "razones": {"a": "Falsa: los **somitas** derivan del mesodermo {{paraxial}}, no del intermedio (el intermedio forma el aparato urogenital).", "b": "Falsa: se forman {{secuencialmente}} (uno a uno), no a la vez.", "c": "Falsa: la somitogénesis empieza en la región {{craneal}} y progresa hacia caudal.", "d": "CORRECTA (marcada 2020-21 = D): ninguna es correcta (los somitas vienen del mesodermo paraxial, se forman secuencial y cráneo-caudalmente)."}, "_k": "org2p-028:730469173", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-029", "tema": "Reproductor", "examen": "2020-21 1er parcial", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Marcada 2020-21; cuerpo lúteo/células del hilio", "enunciado": "Una de las siguientes afirmaciones en relación con el ovario NO es cierta:", "opciones": {"a": "Las células luteínicas de la granulosa del cuerpo lúteo producen principalmente progesterona.", "b": "Las células luteínicas de la teca del cuerpo lúteo producen principalmente estrógenos.", "c": "Las células epiteliales del hilio producen mayoritariamente estrógenos.", "d": "El folículo dominante produce inhibina."}, "correcta": "c", "razones": {"a": "Cierta: las luteínicas de la granulosa producen sobre todo {{progesterona}}.", "b": "Cierta: las luteínicas de la teca producen {{estrógenos}} (y andrógenos precursores).", "c": "FALSA (marcada 2020-21 = C): las **células del hilio ovárico** (células de Berger/hiliares) producen principalmente {{andrógenos}} (testosterona), no estrógenos; son análogas a las de Leydig.", "d": "Cierta: el folículo dominante produce {{inhibina}}."}, "_k": "org2p-029:2580203044", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-030", "tema": "Piel", "examen": "2025-26 2P + 2021-22 + 2021-sept", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2021-sept, 2025-26 2P", "enunciado": "El **estrato de Malpighi** (capa germinativa) de la epidermis está formado por:", "opciones": {"a": "Estrato basal y espinoso", "b": "Estrato espinoso y granuloso", "c": "Estrato granuloso y lúcido", "d": "Ninguno de los anteriores"}, "correcta": "a", "razones": {"a": "CORRECTA. El estrato de Malpighi = {{basal + espinoso}}, las dos capas con mayor capacidad proliferativa (germinativa).", "b": "El estrato {{granuloso}} ya está en diferenciación terminal, no forma parte del Malpighi.", "c": "El lúcido es una capa de transición de la piel gruesa, totalmente diferenciada.", "d": "Sí hay respuesta correcta: la {{a}}."}, "_k": "org2p-030:1384895522", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-031", "tema": "Piel", "examen": "2025-26 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **piel gruesa**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "No encontramos pelos en la piel gruesa", "b": "Cuanto más gruesa es la piel, más desarrollada está la epidermis", "c": "Las células del estrato espinoso presentan abundantes gránulos laminares con contenido lipídico", "d": "La presencia de tonofilamentos es una característica exclusiva de las células del estrato basal germinativo"}, "correcta": "d", "razones": {"a": "Cierta: la piel gruesa (palmas, plantas) es {{lampiña}}, sin folículos pilosos.", "b": "Cierta: el grosor cutáneo depende sobre todo del desarrollo de la {{epidermis}} (estrato córneo).", "c": "Cierta: los {{gránulos laminares}} (cuerpos de Odland) aparecen ya en espinoso/granuloso.", "d": "CORRECTA (la FALSA). Los {{tonofilamentos}} (queratina) están en todas las capas vivas, son especialmente abundantes en el {{espinoso}}, no exclusivos del basal."}, "_k": "org2p-031:3922724189", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-032", "tema": "Piel", "examen": "2025-26 2P + 2019 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23 1P, 2025-26 2P", "enunciado": "Señala la **respuesta correcta** sobre las células de la epidermis:", "opciones": {"a": "Los melanocitos están unidos a los queratinocitos mediante desmosomas", "b": "Los queratinocitos nunca contienen melanina", "c": "Los gránulos de queratohialina son propios de los queratinocitos de la capa basal", "d": "Las células de Langerhans están relacionadas con fenómenos de inmunidad"}, "correcta": "d", "razones": {"a": "Falsa: los melanocitos se unen a los queratinocitos {{sin desmosomas}} (son células dendríticas móviles).", "b": "Falsa: los queratinocitos SÍ reciben melanina vía {{secreción citocrina}} desde los melanocitos.", "c": "Falsa: los gránulos de {{queratohialina}} son propios del estrato {{granuloso}}, no del basal.", "d": "CORRECTA. Las células de {{Langerhans}} son presentadoras de antígeno (origen médula ósea, gránulos de Birbeck) → función {{inmunitaria}}."}, "_k": "org2p-032:1885155143", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-033", "tema": "Piel", "examen": "2025-26 2P + 2022-23 1P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 1P, 2025-26 2P", "enunciado": "Sobre las **glándulas sudoríparas apocrinas**, ¿cuál **NO** es correcta?", "opciones": {"a": "Tienen un tipo de secreción merocrina", "b": "Están desarrolladas en el momento del nacimiento", "c": "Se asocian a folículos pilosos", "d": "Presentan células mioepiteliales"}, "correcta": "b", "razones": {"a": "Cierta: liberan por mecanismo {{merocrino}} (y apocrino menor); el nombre no implica gemación masiva.", "b": "CORRECTA (la FALSA). Las apocrinas NO están desarrolladas al nacer: se desarrollan en la {{pubertad}}.", "c": "Cierta: desembocan en el {{folículo piloso}} (axila, región anogenital, areola).", "d": "Cierta: poseen {{células mioepiteliales}} que ayudan a expulsar la secreción."}, "_k": "org2p-033:925307479", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-034", "tema": "Piel", "examen": "2025-26 2P + 2019 + 2021-sept + 2022-23 1P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23 1P, 2025-26 2P", "enunciado": "Sobre los **melanocitos**, señala la afirmación **FALSA**:", "opciones": {"a": "Derivan de la cresta neural", "b": "En la raza negra hay más melanocitos por unidad de superficie que en la raza blanca", "c": "No experimentan recambio celular continuo", "d": "No forman tonofilamentos en su citoplasma"}, "correcta": "b", "razones": {"a": "Cierta: los melanocitos derivan de la {{cresta neural}}.", "b": "CORRECTA (la FALSA). El número de melanocitos por superficie es {{similar}} en todas las razas; la diferencia es la cantidad y tamaño de {{melanosomas}}.", "c": "Cierta: los melanocitos son una población {{estable}}, sin recambio significativo.", "d": "Cierta: no producen queratina → no tienen {{tonofilamentos}}."}, "_k": "org2p-034:3223510585", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-035", "tema": "Piel", "examen": "2021-sept", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2021-sept", "enunciado": "Sobre el **folículo piloso**, señala lo que **NO** es cierto:", "opciones": {"a": "La vaina conjuntiva deriva de la dermis de la piel", "b": "La capa de Huxley es propia de la vaina radicular epitelial externa", "c": "El músculo erector del pelo se inserta en la vaina conjuntiva", "d": "La vaina radicular interna desaparece donde desembocan las glándulas sebáceas"}, "correcta": "b", "razones": {"a": "Cierta: la vaina conjuntiva externa deriva de la {{dermis}}.", "b": "CORRECTA (la FALSA). La capa de Huxley pertenece a la vaina radicular epitelial {{interna}}, no a la externa.", "c": "Cierta: el {{músculo erector}} (liso) va de la vaina conjuntiva a la dermis papilar.", "d": "Cierta: la vaina interna se interrumpe a nivel del istmo, donde desemboca la {{glándula sebácea}}."}, "_k": "org2p-035:889358533", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-036", "tema": "Endocrino", "examen": "2024-25 Q1", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las células de la **adenohipófisis (pars distalis)**, ¿cuáles presentan los **gránulos de secreción más grandes**?", "opciones": {"a": "Células somatotropas", "b": "Células mamotropas", "c": "Células tirotropas", "d": "Células gonadotropas"}, "correcta": "c", "razones": {"a": "Las somatotropas (GH) son acidófilas con gránulos grandes, pero no las de mayor tamaño en esta clave.", "b": "Las mamotropas (prolactina) varían según el estado funcional (embarazo/lactancia).", "c": "CORRECTA (clave oficial 2024-25). Las {{tirotropas}} (TSH, basófilas) presentan los gránulos de secreción de {{mayor tamaño}}.", "d": "Las gonadotropas (FSH/LH) son basófilas con gránulos medianos."}, "_k": "org2p-036:1470302910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-037", "tema": "Endocrino", "examen": "2024-25 Q2 + 2025-26 2P Q5 + 2021-junio + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B), 2025-26 2P", "enunciado": "Sobre la **hipófisis**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células acidófilas constituyen el mayor porcentaje de células de la pars distalis", "b": "Las hormonas hipotalámicas de liberación son de naturaleza esteroidea", "c": "Las hormonas hipotalámicas llegan a la adenohipófisis por el sistema porta hipotálamo-hipofisario", "d": "Las células cromófobas predominan en la pars tuberalis"}, "correcta": "b", "razones": {"a": "Cierta: las {{acidófilas}} (somatotropas + mamotropas) son la mayoría de la pars distalis.", "b": "CORRECTA (la FALSA, clave 2024-25). Las hormonas hipotalámicas de liberación son {{peptídicas}}, NO esteroideas. Distractor clásico del profesor.", "c": "Cierta: viajan por el {{sistema porta}} hipotálamo-hipofisario hasta la adenohipófisis.", "d": "Cierta: la {{pars tuberalis}} está formada principalmente por células cromófobas."}, "_k": "org2p-037:3292760541", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-038", "tema": "Endocrino", "examen": "2025-26 2P Q9 + 2021-22 + 2021-junio", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2025-26 2P", "enunciado": "En relación con la **oxitocina**, señala lo **CORRECTO**:", "opciones": {"a": "Es transportada por transporte axonal como un péptido precursor que se escinde a medida que avanza por el axón", "b": "Es sintetizada únicamente por células de la pars distalis", "c": "Se concentra en los cuerpos de Herring de la pars intermedia", "d": "Los pituicitos que rodean sus axones son neuronas multipolares"}, "correcta": "a", "razones": {"a": "CORRECTA. La oxitocina (y la ADH) viaja como {{pro-péptido}} por transporte axonal desde los núcleos hipotalámicos, escindiéndose en el trayecto.", "b": "Falsa: se sintetiza en el núcleo {{supraóptico/paraventricular}} del hipotálamo, no en la adenohipófisis.", "c": "Falsa: los {{cuerpos de Herring}} están en la pars nervosa (neurohipófisis), no en la intermedia.", "d": "Falsa: los {{pituicitos}} son células gliales similares a {{oligodendrocitos}}, no neuronas."}, "_k": "org2p-038:1902849870", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-039", "tema": "Endocrino", "examen": "2025-26 2P Q9 (variante)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido en 2021-22, 2025-26 2P", "enunciado": "Los **cuerpos de Herring** de la neurohipófisis corresponden a:", "opciones": {"a": "Cuerpos celulares de los pituicitos", "b": "Acúmulos de material de secreción (ADH/oxitocina) en los axones, vistos como masas amorfas electrodensas al ME", "c": "Sinapsis axoaxónicas del tracto hipotálamo-hipofisario", "d": "Capilares fenestrados de la pars nervosa"}, "correcta": "b", "razones": {"a": "Los pituicitos son la glía de soporte, no forman estos cuerpos.", "b": "CORRECTA. Los cuerpos de Herring son {{dilataciones axonales}} con acúmulos de neurosecreción (ADH/oxitocina), visibles como masas {{amorfas electrodensas}} al ME.", "c": "No son sinapsis: son terminales/dilataciones de almacenamiento.", "d": "Los capilares fenestrados son la vía de descarga hormonal, distintos de los cuerpos de Herring."}, "_k": "org2p-039:760916647", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-040", "tema": "Endocrino", "examen": "2025-26 2P Q6", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "¿Qué tinción es la más adecuada para teñir el **coloide** de los folículos tiroideos?", "opciones": {"a": "Hematoxilina-eosina", "b": "Tricrómico", "c": "PAS", "d": "Tionina"}, "correcta": "c", "razones": {"a": "La H-E tiñe el coloide, pero no es la más específica para destacarlo.", "b": "El tricrómico resalta colágeno/conjuntivo, no el coloide.", "c": "CORRECTA (deducida). El coloide tiroideo es rico en glucoproteína (tiroglobulina) → {{PAS positivo}}.", "d": "La tionina es un colorante metacromático, no específico del coloide."}, "_k": "org2p-040:1133196374", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-041", "tema": "Endocrino", "examen": "2025-26 2P Q8 + 2021-junio + 2024-25 Q3", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25, 2025-26 2P (CONCEPTO REY)", "enunciado": "¿Cuál es el **origen embrionario** de las **células parafoliculares (C)** del tiroides?", "opciones": {"a": "Endodermo de la base de la lengua", "b": "Cresta neural", "c": "3ª bolsa faríngea", "d": "Ectodermo del techo de la boca primitiva"}, "correcta": "b", "razones": {"a": "Ese es el origen de las {{células foliculares}} (a partir del divertículo tiroideo del suelo faríngeo), no de las C.", "b": "CORRECTA. Las células C parafoliculares (secretoras de {{calcitonina}}) derivan de la {{cresta neural}} (vía cuerpos ultimobranquiales) y NO contactan con la luz del folículo.", "c": "La 3ª bolsa faríngea origina {{paratiroides inferiores y timo}}.", "d": "El ectodermo del techo de la boca (bolsa de Rathke) origina la {{adenohipófisis}}."}, "_k": "org2p-041:1128689549", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-042", "tema": "Endocrino", "examen": "2024-25 Q3 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D)", "enunciado": "Sobre la **glándula tiroides**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Tiene elementos celulares de distinto origen embriológico", "b": "Las células foliculares cambian de aspecto según la actividad funcional de la glándula", "c": "El aumento de actividad de la glándula conlleva un aumento de los gránulos de secreción de las células foliculares", "d": "Las células parafoliculares se encuentran en contacto con la luz de los folículos"}, "correcta": "d", "razones": {"a": "Cierta: foliculares (endodermo) y parafoliculares ({{cresta neural}}) tienen origen distinto.", "b": "Cierta: las foliculares pasan de cúbicas/planas (reposo) a cilíndricas (activas).", "c": "Cierta: la actividad implica reabsorción de coloide → más {{gránulos/gotas}} intracelulares.", "d": "CORRECTA (la FALSA, clave 2024-25). Las parafoliculares NO contactan con la {{luz}} del folículo; quedan en la pared, sin alcanzar el coloide."}, "_k": "org2p-042:2535492573", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-043", "tema": "Endocrino", "examen": "2024-25 Q4 + 2025-26 2P Q10 + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A), 2025-26 2P", "enunciado": "Sobre las **células oxífilas de las paratiroides** humanas, **NO** es cierto que:", "opciones": {"a": "Su número no es significativo hasta llegar a la pubertad", "b": "Son células secretoras que colaboran con las principales en la secreción de PTH", "c": "Tienen abundantes mitocondrias en su citoplasma", "d": "Son de mayor tamaño que las células principales"}, "correcta": "b", "razones": {"a": "Cierta: las oxífilas aparecen y aumentan a partir de la {{pubertad}}.", "b": "CORRECTA (la FALSA, clave 2024-25). Las oxífilas NO secretan {{PTH}}; su función es incierta. La PTH la producen las células {{principales}}.", "c": "Cierta: son intensamente eosinófilas por su gran cantidad de {{mitocondrias}}.", "d": "Cierta: las oxífilas son de mayor {{tamaño}} que las principales."}, "_k": "org2p-043:570198786", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-044", "tema": "Endocrino", "examen": "2025-26 2P Q10 + 2021-22", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2025-26 2P", "enunciado": "Sobre las **glándulas paratiroides**, señala lo que **NO** es cierto:", "opciones": {"a": "Habitualmente están situadas bajo la cápsula de la glándula tiroides", "b": "La presencia de células oxífilas no es significativa hasta la adolescencia", "c": "El contenido de glucógeno es muy abundante en las células oxífilas", "d": "Las células oxífilas presentan un núcleo grande y discretamente teñido"}, "correcta": "c", "razones": {"a": "Cierta: las paratiroides quedan en la cara posterior, bajo la {{cápsula}} tiroidea.", "b": "Cierta: las oxífilas no aparecen de forma significativa hasta la {{pubertad/adolescencia}}.", "c": "CORRECTA (la FALSA). El {{glucógeno}} abundante es propio de las células {{principales}}, no de las oxífilas.", "d": "Cierta: las oxífilas tienen núcleo {{grande}} y poco teñido, citoplasma muy eosinófilo."}, "_k": "org2p-044:2411816984", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-045", "tema": "Endocrino", "examen": "2024-25 Q5", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué característica es propia de las células de la **zona fasciculada** de la corteza suprarrenal?", "opciones": {"a": "Son las más abundantes y grandes de la corteza", "b": "Frecuentemente son binucleadas", "c": "Son las que presentan más gotas de lípidos (espongiocitos)", "d": "Todas las anteriores"}, "correcta": "d", "razones": {"a": "Cierta: las de la fasciculada son las {{más abundantes}} de la corteza.", "b": "Cierta: con frecuencia son {{binucleadas}}.", "c": "Cierta: son los {{espongiocitos}}, con citoplasma vacuolado por las gotas lipídicas (colesterol).", "d": "CORRECTA (clave 2024-25). Las tres afirmaciones describen la {{fasciculada}}."}, "_k": "org2p-045:2962378891", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-046", "tema": "Endocrino", "examen": "2024-25 Q6 + 2021-junio + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25 (clave B)", "enunciado": "Sobre la **médula suprarrenal**, señala la **CORRECTA**:", "opciones": {"a": "Sus células se tiñen de pardo con sales de cromo (reacción cromafín)", "b": "Las células secretoras de noradrenalina presentan gránulos más electrodensos que las de adrenalina", "c": "Embrionariamente se origina de la cresta neural entre las semanas 6-7", "d": "Todas son ciertas"}, "correcta": "b", "razones": {"a": "Cierta también, pero la clave oficial 2024-25 marca la B como la pedida.", "b": "CORRECTA (clave 2024-25). Las células productoras de {{noradrenalina}} tienen gránulos más {{electrodensos}} que las de adrenalina.", "c": "Cierta: deriva de la {{cresta neural}} (semanas 6-7).", "d": "Las tres son ciertas, pero el enunciado pedía una; la marcada oficialmente es la {{B}}."}, "_k": "org2p-046:3999343705", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-047", "tema": "Endocrino", "examen": "2024-25 Q12 + 2021-junio + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B)", "enunciado": "En el páncreas endocrino, gránulos con un **centro fuertemente electrodenso rodeado de un halo claro** (cristaloide) son propios de las células:", "opciones": {"a": "Alfa", "b": "Beta", "c": "Delta", "d": "PP"}, "correcta": "b", "razones": {"a": "Las células {{alfa}} (glucagón) tienen gránulos con contenido electrodenso uniforme, sin halo claro.", "b": "CORRECTA (clave 2024-25). Las células {{beta}} (insulina) tienen gránulos con cristaloide poligonal {{electrodenso}} rodeado de un {{halo claro}}.", "c": "Las delta (somatostatina) tienen gránulos grandes de densidad homogénea baja.", "d": "Las PP (polipéptido pancreático) son escasas, gránulos pequeños."}, "_k": "org2p-047:3351943404", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-048", "tema": "Endocrino", "examen": "2025-26 2P Q11", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre el **páncreas endocrino**, señala lo que **NO** es cierto:", "opciones": {"a": "Los islotes de Langerhans están delimitados por tejido conjuntivo muy escaso", "b": "Las células alfa y beta pueden distinguirse claramente al microscopio electrónico por el aspecto de sus gránulos", "c": "Los islotes están inervados por el sistema nervioso autónomo", "d": "Cada islote está rodeado por una gruesa cápsula de tejido conjuntivo denso"}, "correcta": "d", "razones": {"a": "Cierta: el conjuntivo periinsular es {{escaso}} (apenas una fina red reticular).", "b": "Cierta: al {{ME}} alfa y beta se distinguen por la morfología de sus gránulos.", "c": "Cierta: los islotes reciben inervación del {{sistema nervioso autónomo}}.", "d": "CORRECTA (la FALSA). Los islotes NO tienen cápsula gruesa: están rodeados de conjuntivo {{escaso}}, lo que contradice la opción A."}, "_k": "org2p-048:278409275", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-049", "tema": "Endocrino", "examen": "2025-26 2P Q5", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2025-26 2P", "enunciado": "Sobre la **hipófisis humana**, ¿cuál es la afirmación **CORRECTA**?", "opciones": {"a": "La pars intermedia del adulto secreta MSH (POMC)", "b": "Las hormonas hipotalámicas que actúan sobre la adenohipófisis son esteroideas", "c": "Los pituicitos secretan ADH directamente", "d": "La pars tuberalis está formada por células acidófilas en su mayoría"}, "correcta": "a", "razones": {"a": "CORRECTA. La {{pars intermedia}} procesa la POMC y secreta {{MSH}} (y otros péptidos derivados).", "b": "Falsa: las hormonas hipotalámicas son {{peptídicas}}, no esteroideas.", "c": "Falsa: los pituicitos son {{glía}} de soporte; la ADH se sintetiza en el hipotálamo.", "d": "Falsa: la pars tuberalis es mayoritariamente de células {{cromófobas}}."}, "_k": "org2p-049:2485658748", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-050", "tema": "Urinario", "examen": "2024-25 Q13 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "De las siguientes formaciones, ¿cuál **NO** se localiza en la **corteza renal**?", "opciones": {"a": "Corpúsculo renal", "b": "Túbulo contorneado proximal", "c": "Asa de Henle", "d": "Túbulo contorneado distal"}, "correcta": "c", "razones": {"a": "Falsa (sí está en corteza): el {{corpúsculo renal}} es cortical.", "b": "Falsa (sí está): el {{TCP}} es cortical.", "c": "CORRECTA (la que NO está, clave 2024-25). El {{asa de Henle}} desciende hacia la {{médula}}; su porción recta no es cortical.", "d": "Falsa (sí está): el {{TCD}} es cortical."}, "_k": "org2p-050:1024929625", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-051", "tema": "Urinario", "examen": "2024-25 Q14 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D)", "enunciado": "¿Qué célula del riñón presenta una importante **capacidad fagocítica**?", "opciones": {"a": "Podocitos", "b": "Células yuxtaglomerulares", "c": "Células mesangiales extraglomerulares", "d": "Células mesangiales intraglomerulares"}, "correcta": "d", "razones": {"a": "Los {{podocitos}} forman la barrera de filtración (pedicelos), no fagocitan.", "b": "Las yuxtaglomerulares secretan {{renina}}, no fagocitan.", "c": "Las mesangiales extraglomerulares (células de Lacis) tienen función de soporte/comunicación.", "d": "CORRECTA (clave 2024-25). Las mesangiales {{intraglomerulares}} tienen capacidad {{fagocítica}} (limpian la membrana basal) y contráctil."}, "_k": "org2p-051:3593189735", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-052", "tema": "Urinario", "examen": "2024-25 Q15 + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A)", "enunciado": "Sobre las **vías urinarias**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Sin distensión, el urotelio tiene más capas en la vejiga vacía que en la pelvis renal", "b": "Las células del urotelio presentan abundantes vesículas fusiformes limitadas por membrana", "c": "La capa muscular de la vejiga está formada por tres subcapas de fibras musculares lisas (detrusor)", "d": "La vejiga está inervada por fibras simpáticas y parasimpáticas"}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2024-25). Es al revés: el urotelio tiene MÁS capas en la {{pelvis/uréter}} que en la vejiga vacía (donde es más grueso por colapso, pero con menos capas reales).", "b": "Cierta: las células en paraguas tienen {{vesículas fusiformes}} (reserva de membrana apical).", "c": "Cierta: el {{detrusor}} tiene 3 subcapas (longitudinal-circular-longitudinal).", "d": "Cierta: inervación {{simpática y parasimpática}}."}, "_k": "org2p-052:1676876680", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-053", "tema": "Urinario", "examen": "2024-25 Q16", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué célula renal es la encargada de secretar **prostaglandina E2**?", "opciones": {"a": "Células de la mácula densa", "b": "Células yuxtaglomerulares", "c": "Fibroblastos modificados del intersticio de la corteza", "d": "Fibroblastos modificados del intersticio de la médula"}, "correcta": "d", "razones": {"a": "La {{mácula densa}} censa el NaCl tubular, no secreta PGE2.", "b": "Las yuxtaglomerulares secretan {{renina}}.", "c": "Los fibroblastos corticales modificados producen {{eritropoyetina}} (EPO), no PGE2.", "d": "CORRECTA (clave 2024-25). Los fibroblastos modificados del intersticio {{medular}} secretan {{prostaglandina E2}}."}, "_k": "org2p-053:867273910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-054", "tema": "Urinario", "examen": "2024-25 Q17", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "Señala la afirmación **CORRECTA** sobre el esfínter y el plexo vesicales:", "opciones": {"a": "El esfínter vesical interno es de músculo estriado voluntario", "b": "El esfínter externo depende del sistema simpático", "c": "El esfínter vesical interno es un engrosamiento de la subcapa circular del detrusor; el plexo vesical lo forman fibras simpáticas y parasimpáticas", "d": "La vejiga carece de inervación autónoma"}, "correcta": "c", "razones": {"a": "Falsa: el esfínter interno es de músculo {{liso}} (involuntario).", "b": "Falsa: el esfínter externo (uretral) es estriado, control {{somático}}.", "c": "CORRECTA (clave 2024-25). El esfínter interno = engrosamiento de la subcapa {{circular}} del detrusor; el plexo vesical = fibras {{simpáticas y parasimpáticas}}.", "d": "Falsa: la vejiga sí tiene inervación {{autónoma}}."}, "_k": "org2p-054:1830958548", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-055", "tema": "Urinario", "examen": "2025-26 2P Q13", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **nefrona**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las nefronas corticales tienen asas de Henle más cortas que las yuxtamedulares", "b": "Las nefronas yuxtamedulares tienen asas largas que penetran profundamente en la médula", "c": "Las nefronas corticales tienen asas más largas que las yuxtamedulares", "d": "Las nefronas yuxtamedulares son clave en la concentración de la orina"}, "correcta": "c", "razones": {"a": "Cierta: las corticales tienen asas {{cortas}}.", "b": "Cierta: las yuxtamedulares tienen asas {{largas}} que descienden a la médula interna.", "c": "CORRECTA (la FALSA). Es al revés: las corticales tienen asas más {{cortas}}, no más largas, que las yuxtamedulares.", "d": "Cierta: las yuxtamedulares generan el gradiente para {{concentrar}} la orina."}, "_k": "org2p-055:299263793", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-056", "tema": "Urinario", "examen": "2025-26 2P Q16 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P", "enunciado": "Sobre los **túbulos contorneados proximales (TCP)**, señala lo **CORRECTO**:", "opciones": {"a": "Son los más numerosos de la corteza, con borde luminal PAS+ y luz de aspecto estrellado", "b": "Tienen luz amplia y regular, sin microvellosidades", "c": "Predominan en la médula renal", "d": "Carecen de mitocondrias basales"}, "correcta": "a", "razones": {"a": "CORRECTA. El TCP es el túbulo más {{numeroso}} de la corteza, con borde en cepillo {{PAS+}} (microvellosidades) y luz de contorno {{estrellado}}.", "b": "Falsa: tiene abundantes {{microvellosidades}} (ribete en cepillo).", "c": "Falsa: predomina en la {{corteza}}.", "d": "Falsa: tiene muchas {{mitocondrias basales}} (transporte activo)."}, "_k": "org2p-056:3739844827", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-057", "tema": "Urinario", "examen": "2025-26 2P Q14/Q18 + 2021-junio + 2024-25", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25, 2025-26 2P", "enunciado": "Las **células yuxtaglomerulares** del riñón son:", "opciones": {"a": "Células de la mácula densa modificadas", "b": "Fibras musculares lisas modificadas de la arteriola aferente que secretan renina", "c": "Podocitos especializados", "d": "Fibroblastos del intersticio cortical"}, "correcta": "b", "razones": {"a": "La {{mácula densa}} es del TCD, distinta de las yuxtaglomerulares.", "b": "CORRECTA. Son fibras {{musculares lisas modificadas}} de la arteriola {{aferente}}, con gránulos de {{renina}}.", "c": "Los podocitos forman la barrera de filtración glomerular.", "d": "Los fibroblastos modificados producen EPO/PGE2, no renina."}, "_k": "org2p-057:3230466151", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-058", "tema": "Urinario", "examen": "2022-23 2P", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P (clave A)", "enunciado": "Sobre el **glomérulo renal**, señala lo que **NO** es cierto:", "opciones": {"a": "Los capilares glomerulares son fenestrados con fenestraciones provistas de diafragma", "b": "Entre los pedicelos hay ranuras de filtración cerradas por un diafragma con nefrina", "c": "La membrana basal es compartida por endotelio y podocitos", "d": "Las células mesangiales dan soporte a los capilares"}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2022-23 2P). Los capilares glomerulares son fenestrados pero las fenestraciones {{NO tienen diafragma}} (a diferencia de otros fenestrados).", "b": "Cierta: el diafragma de la ranura de filtración contiene {{nefrina/podocina}}.", "c": "Cierta: la {{membrana basal}} glomerular es compartida (fusión de la endotelial y la podocitaria).", "d": "Cierta: las {{mesangiales}} dan soporte estructural a los capilares."}, "_k": "org2p-058:2264242390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-059", "tema": "Reproductor", "examen": "2024-25 Q18 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "¿Qué **NO** es una característica propia de las **células de Sertoli**?", "opciones": {"a": "Tener forma cilíndrica alta", "b": "Presentar numerosos pliegues de la membrana", "c": "Contener cuerpos amiláceos en su citoplasma", "d": "Presentar uniones oclusivas con células de Sertoli vecinas"}, "correcta": "c", "razones": {"a": "Cierta: las Sertoli son células {{cilíndricas altas}} que llegan de la lámina basal a la luz.", "b": "Cierta: presentan numerosos {{pliegues}} de membrana que envuelven a las células germinales.", "c": "CORRECTA (la FALSA, clave 2024-25). Los {{cuerpos amiláceos}} son de la {{próstata}}; las Sertoli tienen cuerpos de Charcot-Böttcher, no amiláceos.", "d": "Cierta: las {{uniones oclusivas}} entre Sertoli forman la barrera hemato-testicular."}, "_k": "org2p-059:1322815544", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-060", "tema": "Reproductor", "examen": "Concepto recurrente (Sertoli)", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente en varios años", "enunciado": "Las **células de Sertoli** sintetizan principalmente:", "opciones": {"a": "Testosterona", "b": "Proteína fijadora de andrógenos (ABP) e inhibina", "c": "LH y FSH", "d": "Cristales de Reinke"}, "correcta": "b", "razones": {"a": "La {{testosterona}} la producen las células de {{Leydig}} (intersticio).", "b": "CORRECTA. Las Sertoli sintetizan {{ABP}} (mantiene andrógenos en el túbulo) e {{inhibina}} (frena la FSH).", "c": "LH y FSH son hormonas {{hipofisarias}}, no testiculares.", "d": "Los {{cristales de Reinke}} son propios de las células de Leydig."}, "_k": "org2p-060:3245024624", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-061", "tema": "Reproductor", "examen": "2021-junio Q12", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. D)", "enunciado": "Los **cristales de Reinke** son propios de:", "opciones": {"a": "Espermatogonias tipo A oscuras", "b": "Células glandulares de la próstata", "c": "Células de Sertoli", "d": "Células de Leydig"}, "correcta": "d", "razones": {"a": "Las espermatogonias son células germinales, sin cristales de Reinke.", "b": "La próstata tiene {{cuerpos amiláceos}}, no cristales de Reinke.", "c": "Las Sertoli tienen cuerpos de {{Charcot-Böttcher}}.", "d": "CORRECTA. Los {{cristales de Reinke}} son inclusiones citoplasmáticas características de las células de {{Leydig}}."}, "_k": "org2p-061:81412857", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-062", "tema": "Reproductor", "examen": "2024-25 Q19 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D)", "enunciado": "De las células germinales del testículo, ¿cuál experimenta la **primera división meiótica**?", "opciones": {"a": "Espermatogonia tipo A", "b": "Espermatocito secundario", "c": "Espermátida", "d": "Ninguna de las anteriores"}, "correcta": "d", "razones": {"a": "Las espermatogonias se dividen por {{mitosis}}, no meiosis.", "b": "El espermatocito {{secundario}} hace la SEGUNDA división meiótica.", "c": "Las espermátidas ya no se dividen (sufren espermiogénesis).", "d": "CORRECTA (clave 2024-25). La 1ª división meiótica la hace el espermatocito {{primario}}, que no figura entre las opciones → 'ninguna de las anteriores'."}, "_k": "org2p-062:658427566", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-063", "tema": "Reproductor", "examen": "2021-junio Q13", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. C)", "enunciado": "¿En qué célula germinal se produce la **segunda división meiótica**?", "opciones": {"a": "Espermatogonia tipo A", "b": "Espermatogonia tipo B", "c": "Espermatocito secundario", "d": "Espermátida"}, "correcta": "c", "razones": {"a": "La espermatogonia A se renueva por {{mitosis}}.", "b": "La espermatogonia B se diferencia a espermatocito primario (mitosis).", "c": "CORRECTA. El espermatocito {{secundario}} (resultado de la 1ª meiótica) realiza la {{2ª división meiótica}} → espermátidas.", "d": "La espermátida ya no se divide; sufre espermiogénesis."}, "_k": "org2p-063:1048147569", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-064", "tema": "Reproductor", "examen": "2024-25 Q20", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las túnicas que recubren el testículo, ¿cuál es la **más externa**?", "opciones": {"a": "Túnica vascular", "b": "Túnica albugínea", "c": "Túnica vaginal", "d": "Túnica muscular"}, "correcta": "c", "razones": {"a": "La túnica vascular es la más {{interna}} (bajo la albugínea).", "b": "La {{albugínea}} es la cápsula fibrosa intermedia.", "c": "CORRECTA (clave 2024-25). La túnica {{vaginal}} (derivada del peritoneo) es la más {{externa}}.", "d": "No es una túnica testicular clásica en este contexto."}, "_k": "org2p-064:689751499", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-065", "tema": "Reproductor", "examen": "2024-25 Q21 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D)", "enunciado": "Sobre la **próstata**, señala lo que **NO** es correcto:", "opciones": {"a": "Las fibras musculares lisas son abundantes en su cápsula", "b": "No es infrecuente encontrar glicoproteínas calcificadas (cuerpos amiláceos) en la luz glandular", "c": "Rodea la porción final de los conductos eyaculadores", "d": "Las glándulas principales están ubicadas internamente, inmediatamente alrededor de la uretra"}, "correcta": "d", "razones": {"a": "Cierta: la cápsula prostática es rica en {{músculo liso}}.", "b": "Cierta: los {{cuerpos amiláceos}} (concreciones calcificadas) son típicos de la luz prostática.", "c": "Cierta: la próstata rodea los {{conductos eyaculadores}} y la uretra prostática.", "d": "CORRECTA (la FALSA, clave 2024-25). Las glándulas {{principales}} (las más grandes) son {{periféricas}}; las periuretrales/mucosas son las internas."}, "_k": "org2p-065:3962672399", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-066", "tema": "Reproductor", "examen": "2021-junio Q15", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "¿Qué capa **NO** es propia del **conducto deferente**?", "opciones": {"a": "Serosa en todo su trayecto", "b": "Epitelio cilíndrico pseudoestratificado con estereocilios", "c": "Lámina propia", "d": "Muscular muy gruesa (tres capas)"}, "correcta": "a", "razones": {"a": "CORRECTA (la que NO es propia). En gran parte de su trayecto el deferente tiene {{adventicia}}, no serosa.", "b": "Cierta: epitelio cilíndrico {{pseudoestratificado}} con estereocilios (como el epidídimo).", "c": "Cierta: tiene {{lámina propia}}.", "d": "Cierta: la {{muscular}} es muy gruesa (3 capas) → palpable como cordón."}, "_k": "org2p-066:496507390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-067", "tema": "Reproductor", "examen": "2022-23 2P Q21", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. C)", "enunciado": "El epitelio del **epidídimo / conducto deferente** es:", "opciones": {"a": "Plano estratificado no queratinizado", "b": "Cúbico simple", "c": "Cilíndrico pseudoestratificado con estereocilios", "d": "De transición (urotelio)"}, "correcta": "c", "razones": {"a": "Ese epitelio es propio de esófago/vagina.", "b": "El cúbico simple es de conductos pequeños, no del epidídimo.", "c": "CORRECTA. El epidídimo y el deferente tienen epitelio cilíndrico {{pseudoestratificado}} con {{estereocilios}}.", "d": "El urotelio es de las vías urinarias."}, "_k": "org2p-067:2690045896", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-068", "tema": "Reproductor", "examen": "2024-25 Q22 + 2021-22 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25 (clave B)", "enunciado": "Sobre el **desarrollo de los folículos ováricos**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Los folículos primordiales están formados por un ovocito rodeado por una sola capa de células aplanadas", "b": "La teca externa de los folículos secundarios está formada por células fibrosas con receptores para FSH", "c": "Los cuerpos de Call-Exner son propios de los folículos secundarios", "d": "Los folículos de Graaf tienen múltiples capas de granulosa y una gran cavidad antral"}, "correcta": "b", "razones": {"a": "Cierta: el {{primordial}} = ovocito + 1 capa de células planas (foliculares).", "b": "CORRECTA (la FALSA, clave 2024-25). La teca {{externa}} es fibrosa de soporte; los receptores hormonales (LH) están en la teca {{interna}}, no es FSH en la externa.", "c": "Cierta: los {{cuerpos de Call-Exner}} aparecen en la granulosa de los folículos {{secundarios}}.", "d": "Cierta: el folículo de {{Graaf}} (maduro) tiene gran {{antro}} y granulosa multilaminar."}, "_k": "org2p-068:2157574592", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-069", "tema": "Reproductor", "examen": "2021-22 Q18 + 2021-junio", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P", "enunciado": "¿En qué tipo de folículo aparece por primera vez el **antro** folicular?", "opciones": {"a": "Primordial", "b": "Primario unilaminar", "c": "Secundario", "d": "Cuerpo albicans"}, "correcta": "c", "razones": {"a": "El primordial solo tiene una capa de células planas, sin antro.", "b": "El primario unilaminar tiene granulosa cúbica única, aún sin antro.", "c": "CORRECTA. El {{antro}} (cavidad con líquido folicular) aparece en el folículo {{secundario}} (antral).", "d": "El cuerpo {{albicans}} es la cicatriz del cuerpo lúteo, no un folículo en desarrollo."}, "_k": "org2p-069:2778361170", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-070", "tema": "Reproductor", "examen": "Concepto recurrente (zona pelúcida)", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, conceptos foliculares", "enunciado": "La **zona pelúcida** comienza a desarrollarse en el folículo:", "opciones": {"a": "Primordial", "b": "Primario", "c": "De Graaf", "d": "Cuerpo lúteo"}, "correcta": "b", "razones": {"a": "En el primordial aún no hay zona pelúcida.", "b": "CORRECTA. La {{zona pelúcida}} (capa glicoproteica entre ovocito y granulosa) aparece en el folículo {{primario}}.", "c": "En el de Graaf ya está bien formada, pero no es donde se inicia.", "d": "El cuerpo lúteo es postovulatorio."}, "_k": "org2p-070:2766706593", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-071", "tema": "Reproductor", "examen": "2021-junio Q19", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C falsa)", "enunciado": "Sobre el **cuerpo lúteo**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células luteínicas de la granulosa producen principalmente progesterona", "b": "Las células luteínicas de la teca producen principalmente estrógenos", "c": "Las células de la íntima/teca producen mayoritariamente progesterona", "d": "El folículo dominante produce inhibina"}, "correcta": "c", "razones": {"a": "Cierta: las luteínicas de la {{granulosa}} → {{progesterona}}.", "b": "Cierta: las luteínicas de la {{teca}} → {{estrógenos}}/andrógenos.", "c": "CORRECTA (la FALSA). Las células tecales producen {{estrógenos}}/andrógenos, no mayoritariamente progesterona.", "d": "Cierta: el folículo dominante produce {{inhibina}}."}, "_k": "org2p-071:236436588", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-072", "tema": "Reproductor", "examen": "2024-25 Q23 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B)", "enunciado": "Sobre las **trompas de Falopio**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Presentan epitelio cilíndrico simple con abundantes células ciliadas", "b": "Durante la fase lútea las células secretoras disminuyen drásticamente su actividad", "c": "La mucosa tiene pliegues longitudinales máximos en la ampolla", "d": "La muscular está formada por dos subcapas de fibras lisas"}, "correcta": "b", "razones": {"a": "Cierta: epitelio {{cilíndrico simple}} con células ciliadas y secretoras.", "b": "CORRECTA (la FALSA, clave 2024-25). En la fase {{lútea}} (progesterona) las células secretoras {{AUMENTAN}} su actividad, no disminuyen.", "c": "Cierta: los pliegues son máximos en la {{ampolla}}.", "d": "Cierta: la muscular tiene {{dos subcapas}} de músculo liso."}, "_k": "org2p-072:1224390997", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-073", "tema": "Reproductor", "examen": "2024-25 Q24 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave C)", "enunciado": "Sobre el **endometrio** durante el ciclo menstrual, señala la afirmación **CORRECTA**:", "opciones": {"a": "El endometrio tiene riego sanguíneo abundante durante la fase menstrual", "b": "Durante la fase proliferativa las glándulas pierden progresivamente glucógeno", "c": "En fase secretora las glándulas son pronunciadas y tortuosas, con células ricas en glucógeno", "d": "La vascularización es máxima en fase menstrual con poca actividad de las arterias espirales"}, "correcta": "c", "razones": {"a": "Falsa: en la fase {{menstrual}} hay vasoconstricción de las arterias espirales (isquemia y descamación).", "b": "Falsa: en la {{proliferativa}} las glándulas son rectas y ganan actividad por estrógenos.", "c": "CORRECTA (clave 2024-25). En fase {{secretora}} (progesterona) las glándulas son {{tortuosas}} y acumulan {{glucógeno}}.", "d": "Falsa: las arterias {{espirales}} sí están muy implicadas en la fase menstrual (vasoespasmo)."}, "_k": "org2p-073:962023626", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-074", "tema": "Reproductor", "examen": "2024-25 Q25 + 2025-26 2P Q25", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2024-25 (clave B), 2025-26 2P", "enunciado": "Las **glándulas de Bartholin** en la mujer se localizan en:", "opciones": {"a": "Pared del útero", "b": "Caras laterales del vestíbulo de los genitales externos", "c": "Paredes de la vagina", "d": "Conectadas con la ampolla del conducto deferente"}, "correcta": "b", "razones": {"a": "El útero no contiene Bartholin.", "b": "CORRECTA. Las glándulas de {{Bartholin}} (vestibulares mayores) están en las caras laterales del {{vestíbulo}}.", "c": "No están en la pared vaginal.", "d": "El conducto deferente es estructura masculina."}, "_k": "org2p-074:3438015397", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-075", "tema": "Reproductor", "examen": "2025-26 2P Q26", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Los **quistes de Naboth** pueden encontrarse en:", "opciones": {"a": "La luz de las glándulas del cuello del útero (cérvix)", "b": "La luz de la vagina", "c": "Los folículos pilosos del monte de Venus", "d": "El miometrio"}, "correcta": "a", "razones": {"a": "CORRECTA. Los quistes de {{Naboth}} son glándulas {{endocervicales}} dilatadas por retención de moco en el cuello uterino.", "b": "La vagina no tiene glándulas mucosas propias (epitelio plano estratificado).", "c": "No tienen relación con folículos pilosos.", "d": "No se forman en el miometrio (músculo)."}, "_k": "org2p-075:4064119781", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-076", "tema": "Reproductor", "examen": "2021-junio Q16 + 2022-23 2P", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. A), 2022-23 2P", "enunciado": "¿Qué epitelio es propio del **cérvix uterino** (antes de penetrar en la vagina)?", "opciones": {"a": "Cilíndrico simple con células secretoras de moco", "b": "Plano estratificado no queratinizado", "c": "Cilíndrico pseudoestratificado ciliado", "d": "De transición"}, "correcta": "a", "razones": {"a": "CORRECTA. El endocérvix tiene epitelio {{cilíndrico simple}} secretor de {{moco}}.", "b": "Ese es el epitelio de la {{vagina}} (y del exocérvix).", "c": "El ciliado pseudoestratificado es respiratorio.", "d": "El de transición es urinario."}, "_k": "org2p-076:2251419726", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-077", "tema": "Reproductor", "examen": "2021-junio Q20", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "Las **glándulas de Littré** son propias de:", "opciones": {"a": "La uretra peniana (esponjosa)", "b": "La uretra membranosa", "c": "La uretra prostática", "d": "La vejiga"}, "correcta": "a", "razones": {"a": "CORRECTA. Las glándulas de {{Littré}} son glándulas mucosas de la uretra {{esponjosa/peniana}}.", "b": "No son propias de la uretra membranosa.", "c": "En la prostática desembocan los conductos prostáticos, no Littré.", "d": "La vejiga no tiene glándulas de Littré."}, "_k": "org2p-077:4071427875", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-078", "tema": "Reproductor", "examen": "2025-26 2P Q24", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la secreción de la **glándula mamaria** activa, señala lo **CORRECTO**:", "opciones": {"a": "Toda la leche se libera por exocitosis de gránulos (merocrina)", "b": "Las células secretoras muestran abundantes gotas lipídicas apicales liberadas por mecanismo apocrino", "c": "Los lípidos se secretan por mecanismo merocrino", "d": "Las proteínas de la leche se liberan por mecanismo apocrino"}, "correcta": "b", "razones": {"a": "Parcial: las proteínas sí van por exocitosis ({{merocrina}}), pero no toda la leche.", "b": "CORRECTA. Los {{lípidos}} (gotas apicales) se liberan por mecanismo {{apocrino}} (arrastran membrana), y las proteínas por merocrino.", "c": "Falsa: los lípidos van por {{apocrino}}, no merocrino.", "d": "Falsa: las {{proteínas}} (caseína, lactosa) van por {{merocrino}}/exocitosis."}, "_k": "org2p-078:2851036740", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-079", "tema": "Reproductor", "examen": "Concepto recurrente (corona radiada)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. B)", "enunciado": "La **corona radiada** está formada por:", "opciones": {"a": "Células de la teca interna", "b": "Células de la granulosa que rodean al ovocito tras la ovulación", "c": "Fibroblastos del estroma ovárico", "d": "Células germinales primordiales"}, "correcta": "b", "razones": {"a": "La teca interna queda en la pared folicular, no rodea al ovocito ovulado.", "b": "CORRECTA. La corona radiada = células de la {{granulosa}} (cumulus) que acompañan al ovocito en la {{ovulación}}.", "c": "Los fibroblastos forman el estroma, no la corona.", "d": "Las células germinales primordiales son embrionarias."}, "_k": "org2p-079:2962398792", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-080", "tema": "Ojo", "examen": "2024-25 Q26", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C)", "enunciado": "Sobre el **epitelio anterior de la córnea**, es cierto que:", "opciones": {"a": "Está muy vascularizado", "b": "Se localiza en la superficie posterior de la córnea", "c": "Contiene terminaciones nerviosas", "d": "Contiene melanocitos"}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (se nutre por difusión).", "b": "Falsa: el epitelio anterior está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA (clave 2024-25). El epitelio corneal anterior es muy sensible: contiene abundantes {{terminaciones nerviosas}} libres.", "d": "Falsa: la córnea normal no tiene {{melanocitos}}."}, "_k": "org2p-080:2613650352", "fuente": "📚 Históricos / repetidas"}, {"id"

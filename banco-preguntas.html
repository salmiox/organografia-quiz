nducto estriado o secretor."}, "correcta": "b", "razones": {"a": "La parótida es {{serosa}}; no presenta acinos mucosos pálidos.", "b": "CORRECTA. El conducto pequeño de epitelio {{cúbico}} simple que sale del acino es el conducto {{intercalar}} (muy desarrollado en la parótida).", "c": "El {{interlobular}} es de mayor calibre y va por el tejido conjuntivo entre lobulillos.", "d": "El conducto {{estriado}} es más grande, con células cilíndricas eosinófilas y estriaciones basales."}, "_k": "org1p-095:66424477", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-096", "tema": "Inmune", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN)** En la **pulpa blanca del bazo**, ¿qué estructuras corresponden a los números 1 (manguito linfoide), 2 (vaso excéntrico) y 3 (acúmulo linfoide)?", "opciones": {"a": "1-PALS, 2-Arteria central, 3-Nódulo esplénico.", "b": "1-Nódulo esplénico, 2-Vena central, 3-PALS.", "c": "1-Nódulo esplénico, 2-Arteria central, 3-PALS.", "d": "1-Nódulo esplénico, 2-Arteria central, 3-Zona marginal."}, "correcta": "a", "razones": {"a": "CORRECTA. El manguito de linfocitos T en torno al vaso es el {{PALS}}; el vaso excéntrico es la {{arteria central}}; el acúmulo de linfocitos B es el {{nódulo esplénico}}.", "b": "Falso: el vaso central es una {{arteria}} (no vena) y la numeración no encaja.", "c": "Falso: invierte el PALS con el nódulo (el manguito perivascular es el PALS, no el nódulo).", "d": "Falso: el elemento 3 es el {{nódulo}} linfoide B, no la zona marginal."}, "_k": "org1p-096:2904763506", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-097", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN)** En un frotis de sangre, identifica las células: 1 (núcleo multilobulado, gránulos finos neutros), 2 (gránulos grandes anaranjados, núcleo bilobulado), 3 (célula pequeña anuclear). ¿Qué combinación es correcta?", "opciones": {"a": "1-Neutrófilo, 2-Basófilo, 3-Plaqueta.", "b": "1-Neutrófilo, 2-Eosinófilo, 3-Plaqueta.", "c": "1-Eritrocito, 2-Eosinófilo, 3-Neutrófilo.", "d": "1-Neutrófilo, 2-Linfocito, 3-Plaqueta."}, "correcta": "b", "razones": {"a": "Falso: la célula 2 con gránulos {{anaranjados}} y núcleo bilobulado es un eosinófilo, no un basófilo.", "b": "CORRECTA. 1 = {{neutrófilo}} (núcleo multilobulado), 2 = {{eosinófilo}} (gránulos eosinófilos, núcleo bilobulado), 3 = {{plaqueta}} (fragmento anuclear).", "c": "Falso: el 1 es nucleado (neutrófilo), no un eritrocito.", "d": "Falso: la célula 2 granulada no es un linfocito (que es agranular con núcleo redondo)."}, "_k": "org1p-097:154358204", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-098", "tema": "Inmune", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2022-23, 2025-26", "enunciado": "**(IMAGEN)** En un corte de **ganglio linfático**, la flecha señala un nódulo con centro germinal. ¿En qué región está y qué célula lo conforma?", "opciones": {"a": "Corteza interna (paracortex), linfocitos T.", "b": "Corteza externa, linfocitos B.", "c": "Corteza interna (paracortex), linfocitos B.", "d": "Corteza externa, linfocitos T."}, "correcta": "b", "razones": {"a": "Falso: el {{paracortex}} es zona T, pero el folículo con centro germinal no está ahí.", "b": "CORRECTA. Los folículos/nódulos con {{centro germinal}} están en la corteza {{externa}} y son zona de linfocitos {{B}}.", "c": "Falso: ubica mal el nódulo B en el paracortex.", "d": "Falso: la corteza externa es B, no T."}, "_k": "org1p-098:3876850255", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-099", "tema": "Sangre/Hematopoyesis", "examen": "2025-26 1P (imagen)", "anio": 2025, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2022-23, 2025-26", "enunciado": "**(IMAGEN)** En un frotis de médula ósea, los precursores señalados con flechas presentan gránulos específicos eosinófilos en formación. ¿A qué célula sanguínea madura darán lugar?", "opciones": {"a": "Eosinófilo.", "b": "Eritrocito.", "c": "Basófilo.", "d": "Plaqueta."}, "correcta": "a", "razones": {"a": "CORRECTA. Los gránulos específicos {{eosinófilos}} (anaranjados) en mielocitos/metamielocitos indican linaje {{eosinófilo}}.", "b": "El {{eritrocito}} procede de eritroblastos sin gránulos específicos.", "c": "El {{basófilo}} tendría gránulos metacromáticos basófilos, no eosinófilos.", "d": "La {{plaqueta}} deriva del megacariocito (célula gigante multilobulada), no de mielocitos granulados."}, "_k": "org1p-099:3381303339", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org1p-100", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a los **epitelios de revestimiento**, señala la afirmación **correcta**:", "opciones": {"a": "El epitelio estratificado es más resistente que el simple y no todas sus células contactan con la superficie y la basal.", "b": "En el epitelio estratificado todas las células contactan a la vez con la luz y la lámina basal.", "c": "El epitelio simple es el más resistente a la abrasión.", "d": "El epitelio pseudoestratificado tiene varias capas reales de células."}, "correcta": "a", "razones": {"a": "CORRECTA. El epitelio {{estratificado}} (varias capas) es más {{resistente}}; solo las basales tocan la lámina basal y solo las superficiales la luz.", "b": "Falso: eso describe al epitelio {{simple}}, no al estratificado.", "c": "Falso: el más resistente a la abrasión es el {{estratificado}} (p. ej. plano queratinizado).", "d": "Falso: el {{pseudoestratificado}} tiene una sola capa; todas las células tocan la basal aunque no lleguen a la luz."}, "_k": "org1p-100:2514847433", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-101", "tema": "Tejidos básicos", "examen": "2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2021-sept, 2022-23", "enunciado": "En las **glándulas exocrinas pluricelulares**, las unidades secretoras constituyen el:", "opciones": {"a": "Estroma.", "b": "Cápsula.", "c": "Sistema de conductos exclusivamente.", "d": "Parénquima."}, "correcta": "d", "razones": {"a": "El {{estroma}} es el tejido conjuntivo de sostén, no las unidades secretoras.", "b": "La {{cápsula}} envuelve el órgano, no es la porción funcional.", "c": "Los {{conductos}} transportan la secreción pero el componente secretor es lo que define el parénquima.", "d": "CORRECTA. El {{parénquima}} glandular son las unidades {{secretoras}} (adenómeros) más los conductos: la parte funcional epitelial."}, "_k": "org1p-101:2719171842", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-102", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "El **tejido conjuntivo reticular** se caracteriza por:", "opciones": {"a": "Teñirse selectivamente con impregnaciones argénticas (plata) por sus fibras de colágeno III.", "b": "Estar formado por fibras elásticas gruesas.", "c": "Carecer por completo de células.", "d": "Ser el componente principal del cartílago hialino."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras {{reticulares}} (colágeno {{III}}) son argirófilas: se tiñen de negro con sales de {{plata}} y forman el estroma de órganos linfoides y médula ósea.", "b": "Falso: las fibras reticulares son finas de colágeno III, no elásticas gruesas.", "c": "Falso: contiene células reticulares y abundantes células libres.", "d": "Falso: el cartílago hialino es colágeno II en matriz condral, no tejido reticular."}, "_k": "org1p-102:2298741076", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-103", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a la **osificación endocondral**, señala la afirmación **correcta**:", "opciones": {"a": "El centro de osificación primario se forma en la diáfisis sobre un molde de cartílago hialino, dando espículas óseas recubiertas de cartílago calcificado.", "b": "No requiere un molde previo de cartílago.", "c": "Es el mecanismo de formación de los huesos planos del cráneo.", "d": "El hueso se forma directamente a partir del mesénquima sin pasar por cartílago."}, "correcta": "a", "razones": {"a": "CORRECTA. En la osificación {{endocondral}} el centro {{primario}} aparece en la {{diáfisis}}; quedan espículas de matriz ósea sobre restos de cartílago calcificado.", "b": "Falso: sí requiere un molde previo de {{cartílago hialino}}.", "c": "Falso: los huesos planos del cráneo se forman por osificación {{intramembranosa}}.", "d": "Falso: la formación directa desde mesénquima sin cartílago es la osificación {{intramembranosa}}."}, "_k": "org1p-103:3041785547", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-104", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto al **cartílago hialino**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Su matriz se nutre por difusión a través del pericondrio, ya que es avascular.", "b": "Su matriz territorial es basófila por la abundancia de glucosaminoglucanos.", "c": "Los condrocitos están unidos entre sí por uniones comunicantes que recorren la matriz.", "d": "Posee fibras de colágeno tipo II no visibles en condiciones normales en H-E."}, "correcta": "c", "razones": {"a": "Cierta: el cartílago es {{avascular}}; se nutre por {{difusión}} desde el pericondrio.", "b": "Cierta: la matriz territorial es {{basófila}} por los {{glucosaminoglucanos}} (condroitín sulfato).", "c": "CORRECTA (es la FALSA). Los {{condrocitos}} están aislados en sus lagunas y NO presentan uniones comunicantes a través de la matriz.", "d": "Cierta: las fibras de colágeno {{II}} están enmascaradas por tener índice de refracción similar a la matriz."}, "_k": "org1p-104:3926314652", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-105", "tema": "Tejidos básicos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Respecto al **sarcómero** del músculo estriado, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Los filamentos gruesos de miosina se anclan en la línea Z.", "b": "Los filamentos finos de actina se anclan en la línea Z.", "c": "El sarcómero se define entre dos líneas Z consecutivas.", "d": "En los mamíferos hay dos tríadas por sarcómero, a nivel de la unión A-I."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). Los filamentos {{gruesos}} de miosina se anclan en la línea {{M}} (centro de la banda A), no en la Z.", "b": "Cierta: los filamentos {{finos}} (actina) se anclan en la línea {{Z}}.", "c": "Cierta: el {{sarcómero}} es la unidad entre dos líneas {{Z}}.", "d": "Cierta: en mamíferos hay {{2 tríadas}} por sarcómero, en las uniones {{A-I}}."}, "_k": "org1p-105:1286199441", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-106", "tema": "Tejidos básicos", "examen": "2019 + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23", "enunciado": "Las **células satélite** del músculo esquelético se caracterizan por:", "opciones": {"a": "Situarse en el endomisio, lejos de la fibra muscular.", "b": "Encontrarse bajo la misma lámina basal que la fibra muscular, como células madre quiescentes.", "c": "Ser células gliales que mielinizan los axones motores.", "d": "Formar los husos neuromusculares."}, "correcta": "b", "razones": {"a": "Falso: no están en el endomisio libre, sino adosadas a la fibra.", "b": "CORRECTA. Las células {{satélite}} se ubican bajo la {{lámina basal}} de la fibra, son las células {{madre}} responsables de la regeneración muscular.", "c": "Falso: las que mielinizan son las células de {{Schwann}}, glía del SNP.", "d": "Falso: los husos {{neuromusculares}} son receptores propioceptivos con fibras intrafusales, no células satélite."}, "_k": "org1p-106:831272006", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-107", "tema": "Tejidos básicos", "examen": "2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2021-sept, 2022-23", "enunciado": "Respecto a las **fibras musculares tipo I (rojas/lentas)**, señala la afirmación **correcta**:", "opciones": {"a": "Tienen pequeño diámetro, muchas mitocondrias y mioglobina, y son resistentes a la fatiga.", "b": "Son blancas, pobres en mitocondrias y de contracción rápida.", "c": "Dependen exclusivamente de la glucólisis anaerobia.", "d": "Predominan en músculos de movimientos breves y potentes."}, "correcta": "a", "razones": {"a": "CORRECTA. Las fibras {{tipo I}} (rojas/lentas) tienen poco diámetro, muchas {{mitocondrias}} y mioglobina (metabolismo {{oxidativo}}), resistentes a la fatiga (músculos posturales).", "b": "Falso: eso describe a las fibras {{tipo II}} (blancas/rápidas).", "c": "Falso: las tipo I son {{oxidativas}}; las glucolíticas son las tipo IIb.", "d": "Falso: los movimientos breves y potentes los hacen las fibras {{tipo II}}."}, "_k": "org1p-107:1856012652", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-108", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Respecto a las **células de Schwann**, señala la afirmación **correcta**:", "opciones": {"a": "Una sola célula de Schwann mieliniza varios axones a la vez.", "b": "En las fibras amielínicas, una célula de Schwann envuelve varios axones, pero cada segmento de mielina (en las mielínicas) corresponde a una sola célula y un solo axón.", "c": "Carecen de lámina basal.", "d": "Son equivalentes a la microglía del sistema nervioso central."}, "correcta": "b", "razones": {"a": "Falso: en las fibras {{mielínicas}}, una Schwann mieliniza un único axón.", "b": "CORRECTA. En fibras {{amielínicas}} una Schwann envuelve {{varios}} axones; en mielínicas, cada {{segmento}} internodal = una Schwann y un solo axón.", "c": "Falso: las Schwann SÍ poseen {{lámina basal}}.", "d": "Falso: el equivalente glial del SNC son los {{oligodendrocitos}} (mielina), no la microglía."}, "_k": "org1p-108:3580801053", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-109", "tema": "Tejidos básicos", "examen": "2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2022-23", "enunciado": "Los **cuerpos de Nissl** de las neuronas corresponden a:", "opciones": {"a": "Acúmulos de aparato de Golgi.", "b": "Acúmulos de retículo endoplásmico rugoso (RER) y ribosomas, basófilos y visibles al microscopio óptico.", "c": "Mitocondrias agrupadas en el axón.", "d": "Lisosomas en el cono axónico."}, "correcta": "b", "razones": {"a": "Falso: el {{Golgi}} no es el componente principal del cuerpo de Nissl.", "b": "CORRECTA. Los cuerpos de {{Nissl}} son agregados de {{RER}} y polirribosomas, intensamente {{basófilos}}, presentes en soma y dendritas (no en el cono axónico ni el axón).", "c": "Falso: no son mitocondrias.", "d": "Falso: el cono axónico carece de sustancia de Nissl."}, "_k": "org1p-109:139077349", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-110", "tema": "Tejidos básicos", "examen": "2019 + 2021-sept + 2022-23 1P", "anio": 2022, "parcial": 1, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23", "enunciado": "Respecto a la **glía del sistema nervioso central**, señala la afirmación **correcta**:", "opciones": {"a": "La microglía es fagocítica y de origen mesodérmico (mieloide); los astrocitos forman la barrera con sus pies vasculares.", "b": "La microglía deriva del tubo neural como el resto de la glía.", "c": "Los astrocitos producen la mielina del SNC.", "d": "Los oligodendrocitos son los macrófagos residentes del SNC."}, "correcta": "a", "razones": {"a": "CORRECTA. La {{microglía}} es fagocítica y de origen {{mesodérmico}}/mieloide (no neuroectodérmico); los {{astrocitos}} contribuyen a la barrera hematoencefálica con sus pies perivasculares.", "b": "Falso: la microglía NO deriva del {{tubo neural}}, sino de precursores mieloides.", "c": "Falso: la mielina del SNC la producen los {{oligodendrocitos}}.", "d": "Falso: los macrófagos residentes son la {{microglía}}, no los oligodendrocitos."}, "_k": "org1p-110:2997752800", "fuente": "📚 Históricos / repetidas"}, {"id": "org1p-111", "tema": "Digestivo", "examen": "2025-26 1P", "anio": 2025, "parcial": 1, "alta_frecuencia": false, "repetida": "Repetida en 2025-26", "enunciado": "Respecto a la **faringe**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Toda su pared está revestida por epitelio plano estratificado no queratinizado.", "b": "Las fibras elásticas son escasas en su pared.", "c": "La capa muscular está constituida por fibras musculares estriadas esqueléticas.", "d": "La submucosa no se encuentra en todas las regiones de su pared."}, "correcta": "a", "razones": {"a": "CORRECTA (es la FALSA). La {{nasofaringe}} está revestida por epitelio {{respiratorio}} (pseudoestratificado ciliado); no toda la faringe es plano estratificado.", "b": "Cierta: las fibras {{elásticas}} son escasas en la pared faríngea.", "c": "Cierta: los músculos constrictores son {{estriados esqueléticos}}.", "d": "Cierta: la {{submucosa}} solo está presente en algunas regiones (no es continua en toda la pared)."}, "_k": "org1p-111:2693287361", "fuente": "🎯 2025-26 · 1er parcial"}, {"id": "org2p-051", "tema": "Piel", "examen": "2025-26 2P + 2021-22 + 2021-sept", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2021-sept, 2025-26 2P", "enunciado": "El **estrato de Malpighi** (capa germinativa) de la epidermis está formado por:", "opciones": {"a": "Estrato basal y espinoso", "b": "Estrato espinoso y granuloso", "c": "Estrato granuloso y lúcido", "d": "Ninguno de los anteriores"}, "correcta": "a", "razones": {"a": "CORRECTA. El estrato de Malpighi = {{basal + espinoso}}, las dos capas con mayor capacidad proliferativa (germinativa).", "b": "El estrato {{granuloso}} ya está en diferenciación terminal, no forma parte del Malpighi.", "c": "El lúcido es una capa de transición de la piel gruesa, totalmente diferenciada.", "d": "Sí hay respuesta correcta: la {{a}}."}, "_k": "org2p-051:1384895522", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-052", "tema": "Piel", "examen": "2025-26 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **piel gruesa**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "No encontramos pelos en la piel gruesa", "b": "Cuanto más gruesa es la piel, más desarrollada está la epidermis", "c": "Las células del estrato espinoso presentan abundantes gránulos laminares con contenido lipídico", "d": "La presencia de tonofilamentos es una característica exclusiva de las células del estrato basal germinativo"}, "correcta": "d", "razones": {"a": "Cierta: la piel gruesa (palmas, plantas) es {{lampiña}}, sin folículos pilosos.", "b": "Cierta: el grosor cutáneo depende sobre todo del desarrollo de la {{epidermis}} (estrato córneo).", "c": "Cierta: los {{gránulos laminares}} (cuerpos de Odland) aparecen ya en espinoso/granuloso.", "d": "CORRECTA (la FALSA). Los {{tonofilamentos}} (queratina) están en todas las capas vivas, son especialmente abundantes en el {{espinoso}}, no exclusivos del basal."}, "_k": "org2p-052:3922724189", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-053", "tema": "Piel", "examen": "2025-26 2P + 2019 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2022-23 1P, 2025-26 2P", "enunciado": "Señala la **respuesta correcta** sobre las células de la epidermis:", "opciones": {"a": "Los melanocitos están unidos a los queratinocitos mediante desmosomas", "b": "Los queratinocitos nunca contienen melanina", "c": "Los gránulos de queratohialina son propios de los queratinocitos de la capa basal", "d": "Las células de Langerhans están relacionadas con fenómenos de inmunidad"}, "correcta": "d", "razones": {"a": "Falsa: los melanocitos se unen a los queratinocitos {{sin desmosomas}} (son células dendríticas móviles).", "b": "Falsa: los queratinocitos SÍ reciben melanina vía {{secreción citocrina}} desde los melanocitos.", "c": "Falsa: los gránulos de {{queratohialina}} son propios del estrato {{granuloso}}, no del basal.", "d": "CORRECTA. Las células de {{Langerhans}} son presentadoras de antígeno (origen médula ósea, gránulos de Birbeck) → función {{inmunitaria}}."}, "_k": "org2p-053:1885155143", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-054", "tema": "Piel", "examen": "2025-26 2P + 2022-23 1P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 1P, 2025-26 2P", "enunciado": "Sobre las **glándulas sudoríparas apocrinas**, ¿cuál **NO** es correcta?", "opciones": {"a": "Tienen un tipo de secreción merocrina", "b": "Están desarrolladas en el momento del nacimiento", "c": "Se asocian a folículos pilosos", "d": "Presentan células mioepiteliales"}, "correcta": "b", "razones": {"a": "Cierta: liberan por mecanismo {{merocrino}} (y apocrino menor); el nombre no implica gemación masiva.", "b": "CORRECTA (la FALSA). Las apocrinas NO están desarrolladas al nacer: se desarrollan en la {{pubertad}}.", "c": "Cierta: desembocan en el {{folículo piloso}} (axila, región anogenital, areola).", "d": "Cierta: poseen {{células mioepiteliales}} que ayudan a expulsar la secreción."}, "_k": "org2p-054:925307479", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-055", "tema": "Piel", "examen": "2025-26 2P + 2019 + 2021-sept + 2022-23 1P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2019, 2021-sept, 2022-23 1P, 2025-26 2P", "enunciado": "Sobre los **melanocitos**, señala la afirmación **FALSA**:", "opciones": {"a": "Derivan de la cresta neural", "b": "En la raza negra hay más melanocitos por unidad de superficie que en la raza blanca", "c": "No experimentan recambio celular continuo", "d": "No forman tonofilamentos en su citoplasma"}, "correcta": "b", "razones": {"a": "Cierta: los melanocitos derivan de la {{cresta neural}}.", "b": "CORRECTA (la FALSA). El número de melanocitos por superficie es {{similar}} en todas las razas; la diferencia es la cantidad y tamaño de {{melanosomas}}.", "c": "Cierta: los melanocitos son una población {{estable}}, sin recambio significativo.", "d": "Cierta: no producen queratina → no tienen {{tonofilamentos}}."}, "_k": "org2p-055:3223510585", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-056", "tema": "Piel", "examen": "2021-sept", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2021-sept", "enunciado": "Sobre el **folículo piloso**, señala lo que **NO** es cierto:", "opciones": {"a": "La vaina conjuntiva deriva de la dermis de la piel", "b": "La capa de Huxley es propia de la vaina radicular epitelial externa", "c": "El músculo erector del pelo se inserta en la vaina conjuntiva", "d": "La vaina radicular interna desaparece donde desembocan las glándulas sebáceas"}, "correcta": "b", "razones": {"a": "Cierta: la vaina conjuntiva externa deriva de la {{dermis}}.", "b": "CORRECTA (la FALSA). La capa de Huxley pertenece a la vaina radicular epitelial {{interna}}, no a la externa.", "c": "Cierta: el {{músculo erector}} (liso) va de la vaina conjuntiva a la dermis papilar.", "d": "Cierta: la vaina interna se interrumpe a nivel del istmo, donde desemboca la {{glándula sebácea}}."}, "_k": "org2p-056:889358533", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-057", "tema": "Endocrino", "examen": "2024-25 Q1", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las células de la **adenohipófisis (pars distalis)**, ¿cuáles presentan los **gránulos de secreción más grandes**?", "opciones": {"a": "Células somatotropas", "b": "Células mamotropas", "c": "Células tirotropas", "d": "Células gonadotropas"}, "correcta": "c", "razones": {"a": "Las somatotropas (GH) son acidófilas con gránulos grandes, pero no las de mayor tamaño en esta clave.", "b": "Las mamotropas (prolactina) varían según el estado funcional (embarazo/lactancia).", "c": "CORRECTA (clave oficial 2024-25). Las {{tirotropas}} (TSH, basófilas) presentan los gránulos de secreción de {{mayor tamaño}}.", "d": "Las gonadotropas (FSH/LH) son basófilas con gránulos medianos."}, "_k": "org2p-057:1470302910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-058", "tema": "Endocrino", "examen": "2024-25 Q2 + 2025-26 2P Q5 + 2021-junio + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B), 2025-26 2P", "enunciado": "Sobre la **hipófisis**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células acidófilas constituyen el mayor porcentaje de células de la pars distalis", "b": "Las hormonas hipotalámicas de liberación son de naturaleza esteroidea", "c": "Las hormonas hipotalámicas llegan a la adenohipófisis por el sistema porta hipotálamo-hipofisario", "d": "Las células cromófobas predominan en la pars tuberalis"}, "correcta": "b", "razones": {"a": "Cierta: las {{acidófilas}} (somatotropas + mamotropas) son la mayoría de la pars distalis.", "b": "CORRECTA (la FALSA, clave 2024-25). Las hormonas hipotalámicas de liberación son {{peptídicas}}, NO esteroideas. Distractor clásico del profesor.", "c": "Cierta: viajan por el {{sistema porta}} hipotálamo-hipofisario hasta la adenohipófisis.", "d": "Cierta: la {{pars tuberalis}} está formada principalmente por células cromófobas."}, "_k": "org2p-058:3292760541", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-059", "tema": "Endocrino", "examen": "2025-26 2P Q9 + 2021-22 + 2021-junio", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2025-26 2P", "enunciado": "En relación con la **oxitocina**, señala lo **CORRECTO**:", "opciones": {"a": "Es transportada por transporte axonal como un péptido precursor que se escinde a medida que avanza por el axón", "b": "Es sintetizada únicamente por células de la pars distalis", "c": "Se concentra en los cuerpos de Herring de la pars intermedia", "d": "Los pituicitos que rodean sus axones son neuronas multipolares"}, "correcta": "a", "razones": {"a": "CORRECTA. La oxitocina (y la ADH) viaja como {{pro-péptido}} por transporte axonal desde los núcleos hipotalámicos, escindiéndose en el trayecto.", "b": "Falsa: se sintetiza en el núcleo {{supraóptico/paraventricular}} del hipotálamo, no en la adenohipófisis.", "c": "Falsa: los {{cuerpos de Herring}} están en la pars nervosa (neurohipófisis), no en la intermedia.", "d": "Falsa: los {{pituicitos}} son células gliales similares a {{oligodendrocitos}}, no neuronas."}, "_k": "org2p-059:1902849870", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-060", "tema": "Endocrino", "examen": "2025-26 2P Q9 (variante)", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto repetido en 2021-22, 2025-26 2P", "enunciado": "Los **cuerpos de Herring** de la neurohipófisis corresponden a:", "opciones": {"a": "Cuerpos celulares de los pituicitos", "b": "Acúmulos de material de secreción (ADH/oxitocina) en los axones, vistos como masas amorfas electrodensas al ME", "c": "Sinapsis axoaxónicas del tracto hipotálamo-hipofisario", "d": "Capilares fenestrados de la pars nervosa"}, "correcta": "b", "razones": {"a": "Los pituicitos son la glía de soporte, no forman estos cuerpos.", "b": "CORRECTA. Los cuerpos de Herring son {{dilataciones axonales}} con acúmulos de neurosecreción (ADH/oxitocina), visibles como masas {{amorfas electrodensas}} al ME.", "c": "No son sinapsis: son terminales/dilataciones de almacenamiento.", "d": "Los capilares fenestrados son la vía de descarga hormonal, distintos de los cuerpos de Herring."}, "_k": "org2p-060:760916647", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-061", "tema": "Endocrino", "examen": "2025-26 2P Q6", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "¿Qué tinción es la más adecuada para teñir el **coloide** de los folículos tiroideos?", "opciones": {"a": "Hematoxilina-eosina", "b": "Tricrómico", "c": "PAS", "d": "Tionina"}, "correcta": "c", "razones": {"a": "La H-E tiñe el coloide, pero no es la más específica para destacarlo.", "b": "El tricrómico resalta colágeno/conjuntivo, no el coloide.", "c": "CORRECTA (deducida). El coloide tiroideo es rico en glucoproteína (tiroglobulina) → {{PAS positivo}}.", "d": "La tionina es un colorante metacromático, no específico del coloide."}, "_k": "org2p-061:1133196374", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-062", "tema": "Endocrino", "examen": "2025-26 2P Q8 + 2021-junio + 2024-25 Q3", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25, 2025-26 2P (CONCEPTO REY)", "enunciado": "¿Cuál es el **origen embrionario** de las **células parafoliculares (C)** del tiroides?", "opciones": {"a": "Endodermo de la base de la lengua", "b": "Cresta neural", "c": "3ª bolsa faríngea", "d": "Ectodermo del techo de la boca primitiva"}, "correcta": "b", "razones": {"a": "Ese es el origen de las {{células foliculares}} (a partir del divertículo tiroideo del suelo faríngeo), no de las C.", "b": "CORRECTA. Las células C parafoliculares (secretoras de {{calcitonina}}) derivan de la {{cresta neural}} (vía cuerpos ultimobranquiales) y NO contactan con la luz del folículo.", "c": "La 3ª bolsa faríngea origina {{paratiroides inferiores y timo}}.", "d": "El ectodermo del techo de la boca (bolsa de Rathke) origina la {{adenohipófisis}}."}, "_k": "org2p-062:1128689549", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-063", "tema": "Endocrino", "examen": "2024-25 Q3 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D)", "enunciado": "Sobre la **glándula tiroides**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Tiene elementos celulares de distinto origen embriológico", "b": "Las células foliculares cambian de aspecto según la actividad funcional de la glándula", "c": "El aumento de actividad de la glándula conlleva un aumento de los gránulos de secreción de las células foliculares", "d": "Las células parafoliculares se encuentran en contacto con la luz de los folículos"}, "correcta": "d", "razones": {"a": "Cierta: foliculares (endodermo) y parafoliculares ({{cresta neural}}) tienen origen distinto.", "b": "Cierta: las foliculares pasan de cúbicas/planas (reposo) a cilíndricas (activas).", "c": "Cierta: la actividad implica reabsorción de coloide → más {{gránulos/gotas}} intracelulares.", "d": "CORRECTA (la FALSA, clave 2024-25). Las parafoliculares NO contactan con la {{luz}} del folículo; quedan en la pared, sin alcanzar el coloide."}, "_k": "org2p-063:2535492573", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-064", "tema": "Endocrino", "examen": "2024-25 Q4 + 2025-26 2P Q10 + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A), 2025-26 2P", "enunciado": "Sobre las **células oxífilas de las paratiroides** humanas, **NO** es cierto que:", "opciones": {"a": "Su número no es significativo hasta llegar a la pubertad", "b": "Son células secretoras que colaboran con las principales en la secreción de PTH", "c": "Tienen abundantes mitocondrias en su citoplasma", "d": "Son de mayor tamaño que las células principales"}, "correcta": "b", "razones": {"a": "Cierta: las oxífilas aparecen y aumentan a partir de la {{pubertad}}.", "b": "CORRECTA (la FALSA, clave 2024-25). Las oxífilas NO secretan {{PTH}}; su función es incierta. La PTH la producen las células {{principales}}.", "c": "Cierta: son intensamente eosinófilas por su gran cantidad de {{mitocondrias}}.", "d": "Cierta: las oxífilas son de mayor {{tamaño}} que las principales."}, "_k": "org2p-064:570198786", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-065", "tema": "Endocrino", "examen": "2025-26 2P Q10 + 2021-22", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2025-26 2P", "enunciado": "Sobre las **glándulas paratiroides**, señala lo que **NO** es cierto:", "opciones": {"a": "Habitualmente están situadas bajo la cápsula de la glándula tiroides", "b": "La presencia de células oxífilas no es significativa hasta la adolescencia", "c": "El contenido de glucógeno es muy abundante en las células oxífilas", "d": "Las células oxífilas presentan un núcleo grande y discretamente teñido"}, "correcta": "c", "razones": {"a": "Cierta: las paratiroides quedan en la cara posterior, bajo la {{cápsula}} tiroidea.", "b": "Cierta: las oxífilas no aparecen de forma significativa hasta la {{pubertad/adolescencia}}.", "c": "CORRECTA (la FALSA). El {{glucógeno}} abundante es propio de las células {{principales}}, no de las oxífilas.", "d": "Cierta: las oxífilas tienen núcleo {{grande}} y poco teñido, citoplasma muy eosinófilo."}, "_k": "org2p-065:2411816984", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-066", "tema": "Endocrino", "examen": "2024-25 Q5", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué característica es propia de las células de la **zona fasciculada** de la corteza suprarrenal?", "opciones": {"a": "Son las más abundantes y grandes de la corteza", "b": "Frecuentemente son binucleadas", "c": "Son las que presentan más gotas de lípidos (espongiocitos)", "d": "Todas las anteriores"}, "correcta": "d", "razones": {"a": "Cierta: las de la fasciculada son las {{más abundantes}} de la corteza.", "b": "Cierta: con frecuencia son {{binucleadas}}.", "c": "Cierta: son los {{espongiocitos}}, con citoplasma vacuolado por las gotas lipídicas (colesterol).", "d": "CORRECTA (clave 2024-25). Las tres afirmaciones describen la {{fasciculada}}."}, "_k": "org2p-066:2962378891", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-067", "tema": "Endocrino", "examen": "2024-25 Q6 + 2021-junio + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25 (clave B)", "enunciado": "Sobre la **médula suprarrenal**, señala la **CORRECTA**:", "opciones": {"a": "Sus células se tiñen de pardo con sales de cromo (reacción cromafín)", "b": "Las células secretoras de noradrenalina presentan gránulos más electrodensos que las de adrenalina", "c": "Embrionariamente se origina de la cresta neural entre las semanas 6-7", "d": "Todas son ciertas"}, "correcta": "b", "razones": {"a": "Cierta también, pero la clave oficial 2024-25 marca la B como la pedida.", "b": "CORRECTA (clave 2024-25). Las células productoras de {{noradrenalina}} tienen gránulos más {{electrodensos}} que las de adrenalina.", "c": "Cierta: deriva de la {{cresta neural}} (semanas 6-7).", "d": "Las tres son ciertas, pero el enunciado pedía una; la marcada oficialmente es la {{B}}."}, "_k": "org2p-067:3999343705", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-068", "tema": "Endocrino", "examen": "2024-25 Q12 + 2021-junio + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2024-25 (clave B)", "enunciado": "En el páncreas endocrino, gránulos con un **centro fuertemente electrodenso rodeado de un halo claro** (cristaloide) son propios de las células:", "opciones": {"a": "Alfa", "b": "Beta", "c": "Delta", "d": "PP"}, "correcta": "b", "razones": {"a": "Las células {{alfa}} (glucagón) tienen gránulos con contenido electrodenso uniforme, sin halo claro.", "b": "CORRECTA (clave 2024-25). Las células {{beta}} (insulina) tienen gránulos con cristaloide poligonal {{electrodenso}} rodeado de un {{halo claro}}.", "c": "Las delta (somatostatina) tienen gránulos grandes de densidad homogénea baja.", "d": "Las PP (polipéptido pancreático) son escasas, gránulos pequeños."}, "_k": "org2p-068:3351943404", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-069", "tema": "Endocrino", "examen": "2025-26 2P Q11", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre el **páncreas endocrino**, señala lo que **NO** es cierto:", "opciones": {"a": "Los islotes de Langerhans están delimitados por tejido conjuntivo muy escaso", "b": "Las células alfa y beta pueden distinguirse claramente al microscopio electrónico por el aspecto de sus gránulos", "c": "Los islotes están inervados por el sistema nervioso autónomo", "d": "Cada islote está rodeado por una gruesa cápsula de tejido conjuntivo denso"}, "correcta": "d", "razones": {"a": "Cierta: el conjuntivo periinsular es {{escaso}} (apenas una fina red reticular).", "b": "Cierta: al {{ME}} alfa y beta se distinguen por la morfología de sus gránulos.", "c": "Cierta: los islotes reciben inervación del {{sistema nervioso autónomo}}.", "d": "CORRECTA (la FALSA). Los islotes NO tienen cápsula gruesa: están rodeados de conjuntivo {{escaso}}, lo que contradice la opción A."}, "_k": "org2p-069:278409275", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-070", "tema": "Endocrino", "examen": "2025-26 2P Q5", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2025-26 2P", "enunciado": "Sobre la **hipófisis humana**, ¿cuál es la afirmación **CORRECTA**?", "opciones": {"a": "La pars intermedia del adulto secreta MSH (POMC)", "b": "Las hormonas hipotalámicas que actúan sobre la adenohipófisis son esteroideas", "c": "Los pituicitos secretan ADH directamente", "d": "La pars tuberalis está formada por células acidófilas en su mayoría"}, "correcta": "a", "razones": {"a": "CORRECTA. La {{pars intermedia}} procesa la POMC y secreta {{MSH}} (y otros péptidos derivados).", "b": "Falsa: las hormonas hipotalámicas son {{peptídicas}}, no esteroideas.", "c": "Falsa: los pituicitos son {{glía}} de soporte; la ADH se sintetiza en el hipotálamo.", "d": "Falsa: la pars tuberalis es mayoritariamente de células {{cromófobas}}."}, "_k": "org2p-070:2485658748", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-071", "tema": "Urinario", "examen": "2024-25 Q13 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "De las siguientes formaciones, ¿cuál **NO** se localiza en la **corteza renal**?", "opciones": {"a": "Corpúsculo renal", "b": "Túbulo contorneado proximal", "c": "Asa de Henle", "d": "Túbulo contorneado distal"}, "correcta": "c", "razones": {"a": "Falsa (sí está en corteza): el {{corpúsculo renal}} es cortical.", "b": "Falsa (sí está): el {{TCP}} es cortical.", "c": "CORRECTA (la que NO está, clave 2024-25). El {{asa de Henle}} desciende hacia la {{médula}}; su porción recta no es cortical.", "d": "Falsa (sí está): el {{TCD}} es cortical."}, "_k": "org2p-071:1024929625", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-072", "tema": "Urinario", "examen": "2024-25 Q14 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D)", "enunciado": "¿Qué célula del riñón presenta una importante **capacidad fagocítica**?", "opciones": {"a": "Podocitos", "b": "Células yuxtaglomerulares", "c": "Células mesangiales extraglomerulares", "d": "Células mesangiales intraglomerulares"}, "correcta": "d", "razones": {"a": "Los {{podocitos}} forman la barrera de filtración (pedicelos), no fagocitan.", "b": "Las yuxtaglomerulares secretan {{renina}}, no fagocitan.", "c": "Las mesangiales extraglomerulares (células de Lacis) tienen función de soporte/comunicación.", "d": "CORRECTA (clave 2024-25). Las mesangiales {{intraglomerulares}} tienen capacidad {{fagocítica}} (limpian la membrana basal) y contráctil."}, "_k": "org2p-072:3593189735", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-073", "tema": "Urinario", "examen": "2024-25 Q15 + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A)", "enunciado": "Sobre las **vías urinarias**, señala la afirmación que **NO** es correcta:", "opciones": {"a": "Sin distensión, el urotelio tiene más capas en la vejiga vacía que en la pelvis renal", "b": "Las células del urotelio presentan abundantes vesículas fusiformes limitadas por membrana", "c": "La capa muscular de la vejiga está formada por tres subcapas de fibras musculares lisas (detrusor)", "d": "La vejiga está inervada por fibras simpáticas y parasimpáticas"}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2024-25). Es al revés: el urotelio tiene MÁS capas en la {{pelvis/uréter}} que en la vejiga vacía (donde es más grueso por colapso, pero con menos capas reales).", "b": "Cierta: las células en paraguas tienen {{vesículas fusiformes}} (reserva de membrana apical).", "c": "Cierta: el {{detrusor}} tiene 3 subcapas (longitudinal-circular-longitudinal).", "d": "Cierta: inervación {{simpática y parasimpática}}."}, "_k": "org2p-073:1676876680", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-074", "tema": "Urinario", "examen": "2024-25 Q16", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Clave oficial 2024-25 (resp. D)", "enunciado": "¿Qué célula renal es la encargada de secretar **prostaglandina E2**?", "opciones": {"a": "Células de la mácula densa", "b": "Células yuxtaglomerulares", "c": "Fibroblastos modificados del intersticio de la corteza", "d": "Fibroblastos modificados del intersticio de la médula"}, "correcta": "d", "razones": {"a": "La {{mácula densa}} censa el NaCl tubular, no secreta PGE2.", "b": "Las yuxtaglomerulares secretan {{renina}}.", "c": "Los fibroblastos corticales modificados producen {{eritropoyetina}} (EPO), no PGE2.", "d": "CORRECTA (clave 2024-25). Los fibroblastos modificados del intersticio {{medular}} secretan {{prostaglandina E2}}."}, "_k": "org2p-074:867273910", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-075", "tema": "Urinario", "examen": "2024-25 Q17", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "Señala la afirmación **CORRECTA** sobre el esfínter y el plexo vesicales:", "opciones": {"a": "El esfínter vesical interno es de músculo estriado voluntario", "b": "El esfínter externo depende del sistema simpático", "c": "El esfínter vesical interno es un engrosamiento de la subcapa circular del detrusor; el plexo vesical lo forman fibras simpáticas y parasimpáticas", "d": "La vejiga carece de inervación autónoma"}, "correcta": "c", "razones": {"a": "Falsa: el esfínter interno es de músculo {{liso}} (involuntario).", "b": "Falsa: el esfínter externo (uretral) es estriado, control {{somático}}.", "c": "CORRECTA (clave 2024-25). El esfínter interno = engrosamiento de la subcapa {{circular}} del detrusor; el plexo vesical = fibras {{simpáticas y parasimpáticas}}.", "d": "Falsa: la vejiga sí tiene inervación {{autónoma}}."}, "_k": "org2p-075:1830958548", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-076", "tema": "Urinario", "examen": "2025-26 2P Q13", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la **nefrona**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las nefronas corticales tienen asas de Henle más cortas que las yuxtamedulares", "b": "Las nefronas yuxtamedulares tienen asas largas que penetran profundamente en la médula", "c": "Las nefronas corticales tienen asas más largas que las yuxtamedulares", "d": "Las nefronas yuxtamedulares son clave en la concentración de la orina"}, "correcta": "c", "razones": {"a": "Cierta: las corticales tienen asas {{cortas}}.", "b": "Cierta: las yuxtamedulares tienen asas {{largas}} que descienden a la médula interna.", "c": "CORRECTA (la FALSA). Es al revés: las corticales tienen asas más {{cortas}}, no más largas, que las yuxtamedulares.", "d": "Cierta: las yuxtamedulares generan el gradiente para {{concentrar}} la orina."}, "_k": "org2p-076:299263793", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-077", "tema": "Urinario", "examen": "2025-26 2P Q16 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P", "enunciado": "Sobre los **túbulos contorneados proximales (TCP)**, señala lo **CORRECTO**:", "opciones": {"a": "Son los más numerosos de la corteza, con borde luminal PAS+ y luz de aspecto estrellado", "b": "Tienen luz amplia y regular, sin microvellosidades", "c": "Predominan en la médula renal", "d": "Carecen de mitocondrias basales"}, "correcta": "a", "razones": {"a": "CORRECTA. El TCP es el túbulo más {{numeroso}} de la corteza, con borde en cepillo {{PAS+}} (microvellosidades) y luz de contorno {{estrellado}}.", "b": "Falsa: tiene abundantes {{microvellosidades}} (ribete en cepillo).", "c": "Falsa: predomina en la {{corteza}}.", "d": "Falsa: tiene muchas {{mitocondrias basales}} (transporte activo)."}, "_k": "org2p-077:3739844827", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-078", "tema": "Urinario", "examen": "2025-26 2P Q14/Q18 + 2021-junio + 2024-25", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25, 2025-26 2P", "enunciado": "Las **células yuxtaglomerulares** del riñón son:", "opciones": {"a": "Células de la mácula densa modificadas", "b": "Fibras musculares lisas modificadas de la arteriola aferente que secretan renina", "c": "Podocitos especializados", "d": "Fibroblastos del intersticio cortical"}, "correcta": "b", "razones": {"a": "La {{mácula densa}} es del TCD, distinta de las yuxtaglomerulares.", "b": "CORRECTA. Son fibras {{musculares lisas modificadas}} de la arteriola {{aferente}}, con gránulos de {{renina}}.", "c": "Los podocitos forman la barrera de filtración glomerular.", "d": "Los fibroblastos modificados producen EPO/PGE2, no renina."}, "_k": "org2p-078:3230466151", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-079", "tema": "Urinario", "examen": "2022-23 2P", "anio": 2022, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P (clave A)", "enunciado": "Sobre el **glomérulo renal**, señala lo que **NO** es cierto:", "opciones": {"a": "Los capilares glomerulares son fenestrados con fenestraciones provistas de diafragma", "b": "Entre los pedicelos hay ranuras de filtración cerradas por un diafragma con nefrina", "c": "La membrana basal es compartida por endotelio y podocitos", "d": "Las células mesangiales dan soporte a los capilares"}, "correcta": "a", "razones": {"a": "CORRECTA (la FALSA, clave 2022-23 2P). Los capilares glomerulares son fenestrados pero las fenestraciones {{NO tienen diafragma}} (a diferencia de otros fenestrados).", "b": "Cierta: el diafragma de la ranura de filtración contiene {{nefrina/podocina}}.", "c": "Cierta: la {{membrana basal}} glomerular es compartida (fusión de la endotelial y la podocitaria).", "d": "Cierta: las {{mesangiales}} dan soporte estructural a los capilares."}, "_k": "org2p-079:2264242390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-080", "tema": "Reproductor", "examen": "2024-25 Q18 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C)", "enunciado": "¿Qué **NO** es una característica propia de las **células de Sertoli**?", "opciones": {"a": "Tener forma cilíndrica alta", "b": "Presentar numerosos pliegues de la membrana", "c": "Contener cuerpos amiláceos en su citoplasma", "d": "Presentar uniones oclusivas con células de Sertoli vecinas"}, "correcta": "c", "razones": {"a": "Cierta: las Sertoli son células {{cilíndricas altas}} que llegan de la lámina basal a la luz.", "b": "Cierta: presentan numerosos {{pliegues}} de membrana que envuelven a las células germinales.", "c": "CORRECTA (la FALSA, clave 2024-25). Los {{cuerpos amiláceos}} son de la {{próstata}}; las Sertoli tienen cuerpos de Charcot-Böttcher, no amiláceos.", "d": "Cierta: las {{uniones oclusivas}} entre Sertoli forman la barrera hemato-testicular."}, "_k": "org2p-080:1322815544", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-081", "tema": "Reproductor", "examen": "Concepto recurrente (Sertoli)", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Concepto recurrente en varios años", "enunciado": "Las **células de Sertoli** sintetizan principalmente:", "opciones": {"a": "Testosterona", "b": "Proteína fijadora de andrógenos (ABP) e inhibina", "c": "LH y FSH", "d": "Cristales de Reinke"}, "correcta": "b", "razones": {"a": "La {{testosterona}} la producen las células de {{Leydig}} (intersticio).", "b": "CORRECTA. Las Sertoli sintetizan {{ABP}} (mantiene andrógenos en el túbulo) e {{inhibina}} (frena la FSH).", "c": "LH y FSH son hormonas {{hipofisarias}}, no testiculares.", "d": "Los {{cristales de Reinke}} son propios de las células de Leydig."}, "_k": "org2p-081:3245024624", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-082", "tema": "Reproductor", "examen": "2021-junio Q12", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. D)", "enunciado": "Los **cristales de Reinke** son propios de:", "opciones": {"a": "Espermatogonias tipo A oscuras", "b": "Células glandulares de la próstata", "c": "Células de Sertoli", "d": "Células de Leydig"}, "correcta": "d", "razones": {"a": "Las espermatogonias son células germinales, sin cristales de Reinke.", "b": "La próstata tiene {{cuerpos amiláceos}}, no cristales de Reinke.", "c": "Las Sertoli tienen cuerpos de {{Charcot-Böttcher}}.", "d": "CORRECTA. Los {{cristales de Reinke}} son inclusiones citoplasmáticas características de las células de {{Leydig}}."}, "_k": "org2p-082:81412857", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-083", "tema": "Reproductor", "examen": "2024-25 Q19 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2024-25 (clave D)", "enunciado": "De las células germinales del testículo, ¿cuál experimenta la **primera división meiótica**?", "opciones": {"a": "Espermatogonia tipo A", "b": "Espermatocito secundario", "c": "Espermátida", "d": "Ninguna de las anteriores"}, "correcta": "d", "razones": {"a": "Las espermatogonias se dividen por {{mitosis}}, no meiosis.", "b": "El espermatocito {{secundario}} hace la SEGUNDA división meiótica.", "c": "Las espermátidas ya no se dividen (sufren espermiogénesis).", "d": "CORRECTA (clave 2024-25). La 1ª división meiótica la hace el espermatocito {{primario}}, que no figura entre las opciones → 'ninguna de las anteriores'."}, "_k": "org2p-083:658427566", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-084", "tema": "Reproductor", "examen": "2021-junio Q13", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. C)", "enunciado": "¿En qué célula germinal se produce la **segunda división meiótica**?", "opciones": {"a": "Espermatogonia tipo A", "b": "Espermatogonia tipo B", "c": "Espermatocito secundario", "d": "Espermátida"}, "correcta": "c", "razones": {"a": "La espermatogonia A se renueva por {{mitosis}}.", "b": "La espermatogonia B se diferencia a espermatocito primario (mitosis).", "c": "CORRECTA. El espermatocito {{secundario}} (resultado de la 1ª meiótica) realiza la {{2ª división meiótica}} → espermátidas.", "d": "La espermátida ya no se divide; sufre espermiogénesis."}, "_k": "org2p-084:1048147569", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-085", "tema": "Reproductor", "examen": "2024-25 Q20", "anio": 2024, "parcial": 2, "alta_frecuencia": false, "repetida": "Clave oficial 2024-25 (resp. C)", "enunciado": "De las túnicas que recubren el testículo, ¿cuál es la **más externa**?", "opciones": {"a": "Túnica vascular", "b": "Túnica albugínea", "c": "Túnica vaginal", "d": "Túnica muscular"}, "correcta": "c", "razones": {"a": "La túnica vascular es la más {{interna}} (bajo la albugínea).", "b": "La {{albugínea}} es la cápsula fibrosa intermedia.", "c": "CORRECTA (clave 2024-25). La túnica {{vaginal}} (derivada del peritoneo) es la más {{externa}}.", "d": "No es una túnica testicular clásica en este contexto."}, "_k": "org2p-085:689751499", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-086", "tema": "Reproductor", "examen": "2024-25 Q21 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave D)", "enunciado": "Sobre la **próstata**, señala lo que **NO** es correcto:", "opciones": {"a": "Las fibras musculares lisas son abundantes en su cápsula", "b": "No es infrecuente encontrar glicoproteínas calcificadas (cuerpos amiláceos) en la luz glandular", "c": "Rodea la porción final de los conductos eyaculadores", "d": "Las glándulas principales están ubicadas internamente, inmediatamente alrededor de la uretra"}, "correcta": "d", "razones": {"a": "Cierta: la cápsula prostática es rica en {{músculo liso}}.", "b": "Cierta: los {{cuerpos amiláceos}} (concreciones calcificadas) son típicos de la luz prostática.", "c": "Cierta: la próstata rodea los {{conductos eyaculadores}} y la uretra prostática.", "d": "CORRECTA (la FALSA, clave 2024-25). Las glándulas {{principales}} (las más grandes) son {{periféricas}}; las periuretrales/mucosas son las internas."}, "_k": "org2p-086:3962672399", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-087", "tema": "Reproductor", "examen": "2021-junio Q15", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "¿Qué capa **NO** es propia del **conducto deferente**?", "opciones": {"a": "Serosa en todo su trayecto", "b": "Epitelio cilíndrico pseudoestratificado con estereocilios", "c": "Lámina propia", "d": "Muscular muy gruesa (tres capas)"}, "correcta": "a", "razones": {"a": "CORRECTA (la que NO es propia). En gran parte de su trayecto el deferente tiene {{adventicia}}, no serosa.", "b": "Cierta: epitelio cilíndrico {{pseudoestratificado}} con estereocilios (como el epidídimo).", "c": "Cierta: tiene {{lámina propia}}.", "d": "Cierta: la {{muscular}} es muy gruesa (3 capas) → palpable como cordón."}, "_k": "org2p-087:496507390", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-088", "tema": "Reproductor", "examen": "2022-23 2P Q21", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. C)", "enunciado": "El epitelio del **epidídimo / conducto deferente** es:", "opciones": {"a": "Plano estratificado no queratinizado", "b": "Cúbico simple", "c": "Cilíndrico pseudoestratificado con estereocilios", "d": "De transición (urotelio)"}, "correcta": "c", "razones": {"a": "Ese epitelio es propio de esófago/vagina.", "b": "El cúbico simple es de conductos pequeños, no del epidídimo.", "c": "CORRECTA. El epidídimo y el deferente tienen epitelio cilíndrico {{pseudoestratificado}} con {{estereocilios}}.", "d": "El urotelio es de las vías urinarias."}, "_k": "org2p-088:2690045896", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-089", "tema": "Reproductor", "examen": "2024-25 Q22 + 2021-22 + 2021-junio", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P, 2024-25 (clave B)", "enunciado": "Sobre el **desarrollo de los folículos ováricos**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Los folículos primordiales están formados por un ovocito rodeado por una sola capa de células aplanadas", "b": "La teca externa de los folículos secundarios está formada por células fibrosas con receptores para FSH", "c": "Los cuerpos de Call-Exner son propios de los folículos secundarios", "d": "Los folículos de Graaf tienen múltiples capas de granulosa y una gran cavidad antral"}, "correcta": "b", "razones": {"a": "Cierta: el {{primordial}} = ovocito + 1 capa de células planas (foliculares).", "b": "CORRECTA (la FALSA, clave 2024-25). La teca {{externa}} es fibrosa de soporte; los receptores hormonales (LH) están en la teca {{interna}}, no es FSH en la externa.", "c": "Cierta: los {{cuerpos de Call-Exner}} aparecen en la granulosa de los folículos {{secundarios}}.", "d": "Cierta: el folículo de {{Graaf}} (maduro) tiene gran {{antro}} y granulosa multilaminar."}, "_k": "org2p-089:2157574592", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-090", "tema": "Reproductor", "examen": "2021-22 Q18 + 2021-junio", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P", "enunciado": "¿En qué tipo de folículo aparece por primera vez el **antro** folicular?", "opciones": {"a": "Primordial", "b": "Primario unilaminar", "c": "Secundario", "d": "Cuerpo albicans"}, "correcta": "c", "razones": {"a": "El primordial solo tiene una capa de células planas, sin antro.", "b": "El primario unilaminar tiene granulosa cúbica única, aún sin antro.", "c": "CORRECTA. El {{antro}} (cavidad con líquido folicular) aparece en el folículo {{secundario}} (antral).", "d": "El cuerpo {{albicans}} es la cicatriz del cuerpo lúteo, no un folículo en desarrollo."}, "_k": "org2p-090:2778361170", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-091", "tema": "Reproductor", "examen": "Concepto recurrente (zona pelúcida)", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, conceptos foliculares", "enunciado": "La **zona pelúcida** comienza a desarrollarse en el folículo:", "opciones": {"a": "Primordial", "b": "Primario", "c": "De Graaf", "d": "Cuerpo lúteo"}, "correcta": "b", "razones": {"a": "En el primordial aún no hay zona pelúcida.", "b": "CORRECTA. La {{zona pelúcida}} (capa glicoproteica entre ovocito y granulosa) aparece en el folículo {{primario}}.", "c": "En el de Graaf ya está bien formada, pero no es donde se inicia.", "d": "El cuerpo lúteo es postovulatorio."}, "_k": "org2p-091:2766706593", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-092", "tema": "Reproductor", "examen": "2021-junio Q19", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C falsa)", "enunciado": "Sobre el **cuerpo lúteo**, señala la afirmación que **NO** es cierta:", "opciones": {"a": "Las células luteínicas de la granulosa producen principalmente progesterona", "b": "Las células luteínicas de la teca producen principalmente estrógenos", "c": "Las células de la íntima/teca producen mayoritariamente progesterona", "d": "El folículo dominante produce inhibina"}, "correcta": "c", "razones": {"a": "Cierta: las luteínicas de la {{granulosa}} → {{progesterona}}.", "b": "Cierta: las luteínicas de la {{teca}} → {{estrógenos}}/andrógenos.", "c": "CORRECTA (la FALSA). Las células tecales producen {{estrógenos}}/andrógenos, no mayoritariamente progesterona.", "d": "Cierta: el folículo dominante produce {{inhibina}}."}, "_k": "org2p-092:236436588", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-093", "tema": "Reproductor", "examen": "2024-25 Q23 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave B)", "enunciado": "Sobre las **trompas de Falopio**, ¿cuál afirmación **NO** es correcta?", "opciones": {"a": "Presentan epitelio cilíndrico simple con abundantes células ciliadas", "b": "Durante la fase lútea las células secretoras disminuyen drásticamente su actividad", "c": "La mucosa tiene pliegues longitudinales máximos en la ampolla", "d": "La muscular está formada por dos subcapas de fibras lisas"}, "correcta": "b", "razones": {"a": "Cierta: epitelio {{cilíndrico simple}} con células ciliadas y secretoras.", "b": "CORRECTA (la FALSA, clave 2024-25). En la fase {{lútea}} (progesterona) las células secretoras {{AUMENTAN}} su actividad, no disminuyen.", "c": "Cierta: los pliegues son máximos en la {{ampolla}}.", "d": "Cierta: la muscular tiene {{dos subcapas}} de músculo liso."}, "_k": "org2p-093:1224390997", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-094", "tema": "Reproductor", "examen": "2024-25 Q24 + 2021-22", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2024-25 (clave C)", "enunciado": "Sobre el **endometrio** durante el ciclo menstrual, señala la afirmación **CORRECTA**:", "opciones": {"a": "El endometrio tiene riego sanguíneo abundante durante la fase menstrual", "b": "Durante la fase proliferativa las glándulas pierden progresivamente glucógeno", "c": "En fase secretora las glándulas son pronunciadas y tortuosas, con células ricas en glucógeno", "d": "La vascularización es máxima en fase menstrual con poca actividad de las arterias espirales"}, "correcta": "c", "razones": {"a": "Falsa: en la fase {{menstrual}} hay vasoconstricción de las arterias espirales (isquemia y descamación).", "b": "Falsa: en la {{proliferativa}} las glándulas son rectas y ganan actividad por estrógenos.", "c": "CORRECTA (clave 2024-25). En fase {{secretora}} (progesterona) las glándulas son {{tortuosas}} y acumulan {{glucógeno}}.", "d": "Falsa: las arterias {{espirales}} sí están muy implicadas en la fase menstrual (vasoespasmo)."}, "_k": "org2p-094:962023626", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-095", "tema": "Reproductor", "examen": "2024-25 Q25 + 2025-26 2P Q25", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2014-15, 2024-25 (clave B), 2025-26 2P", "enunciado": "Las **glándulas de Bartholin** en la mujer se localizan en:", "opciones": {"a": "Pared del útero", "b": "Caras laterales del vestíbulo de los genitales externos", "c": "Paredes de la vagina", "d": "Conectadas con la ampolla del conducto deferente"}, "correcta": "b", "razones": {"a": "El útero no contiene Bartholin.", "b": "CORRECTA. Las glándulas de {{Bartholin}} (vestibulares mayores) están en las caras laterales del {{vestíbulo}}.", "c": "No están en la pared vaginal.", "d": "El conducto deferente es estructura masculina."}, "_k": "org2p-095:3438015397", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-096", "tema": "Reproductor", "examen": "2025-26 2P Q26", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Los **quistes de Naboth** pueden encontrarse en:", "opciones": {"a": "La luz de las glándulas del cuello del útero (cérvix)", "b": "La luz de la vagina", "c": "Los folículos pilosos del monte de Venus", "d": "El miometrio"}, "correcta": "a", "razones": {"a": "CORRECTA. Los quistes de {{Naboth}} son glándulas {{endocervicales}} dilatadas por retención de moco en el cuello uterino.", "b": "La vagina no tiene glándulas mucosas propias (epitelio plano estratificado).", "c": "No tienen relación con folículos pilosos.", "d": "No se forman en el miometrio (músculo)."}, "_k": "org2p-096:4064119781", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-097", "tema": "Reproductor", "examen": "2021-junio Q16 + 2022-23 2P", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. A), 2022-23 2P", "enunciado": "¿Qué epitelio es propio del **cérvix uterino** (antes de penetrar en la vagina)?", "opciones": {"a": "Cilíndrico simple con células secretoras de moco", "b": "Plano estratificado no queratinizado", "c": "Cilíndrico pseudoestratificado ciliado", "d": "De transición"}, "correcta": "a", "razones": {"a": "CORRECTA. El endocérvix tiene epitelio {{cilíndrico simple}} secretor de {{moco}}.", "b": "Ese es el epitelio de la {{vagina}} (y del exocérvix).", "c": "El ciliado pseudoestratificado es respiratorio.", "d": "El de transición es urinario."}, "_k": "org2p-097:2251419726", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-098", "tema": "Reproductor", "examen": "2021-junio Q20", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "Las **glándulas de Littré** son propias de:", "opciones": {"a": "La uretra peniana (esponjosa)", "b": "La uretra membranosa", "c": "La uretra prostática", "d": "La vejiga"}, "correcta": "a", "razones": {"a": "CORRECTA. Las glándulas de {{Littré}} son glándulas mucosas de la uretra {{esponjosa/peniana}}.", "b": "No son propias de la uretra membranosa.", "c": "En la prostática desembocan los conductos prostáticos, no Littré.", "d": "La vejiga no tiene glándulas de Littré."}, "_k": "org2p-098:4071427875", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-099", "tema": "Reproductor", "examen": "2025-26 2P Q24", "anio": 2025, "parcial": 2, "alta_frecuencia": false, "repetida": "Vista en 2025-26 2P", "enunciado": "Sobre la secreción de la **glándula mamaria** activa, señala lo **CORRECTO**:", "opciones": {"a": "Toda la leche se libera por exocitosis de gránulos (merocrina)", "b": "Las células secretoras muestran abundantes gotas lipídicas apicales liberadas por mecanismo apocrino", "c": "Los lípidos se secretan por mecanismo merocrino", "d": "Las proteínas de la leche se liberan por mecanismo apocrino"}, "correcta": "b", "razones": {"a": "Parcial: las proteínas sí van por exocitosis ({{merocrina}}), pero no toda la leche.", "b": "CORRECTA. Los {{lípidos}} (gotas apicales) se liberan por mecanismo {{apocrino}} (arrastran membrana), y las proteínas por merocrino.", "c": "Falsa: los lípidos van por {{apocrino}}, no merocrino.", "d": "Falsa: las {{proteínas}} (caseína, lactosa) van por {{merocrino}}/exocitosis."}, "_k": "org2p-099:2851036740", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-100", "tema": "Reproductor", "examen": "Concepto recurrente (corona radiada)", "anio": 2022, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2022-23 2P (resp. B)", "enunciado": "La **corona radiada** está formada por:", "opciones": {"a": "Células de la teca interna", "b": "Células de la granulosa que rodean al ovocito tras la ovulación", "c": "Fibroblastos del estroma ovárico", "d": "Células germinales primordiales"}, "correcta": "b", "razones": {"a": "La teca interna queda en la pared folicular, no rodea al ovocito ovulado.", "b": "CORRECTA. La corona radiada = células de la {{granulosa}} (cumulus) que acompañan al ovocito en la {{ovulación}}.", "c": "Los fibroblastos forman el estroma, no la corona.", "d": "Las células germinales primordiales son embrionarias."}, "_k": "org2p-100:2962398792", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-101", "tema": "Ojo", "examen": "2024-25 Q26", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C)", "enunciado": "Sobre el **epitelio anterior de la córnea**, es cierto que:", "opciones": {"a": "Está muy vascularizado", "b": "Se localiza en la superficie posterior de la córnea", "c": "Contiene terminaciones nerviosas", "d": "Contiene melanocitos"}, "correcta": "c", "razones": {"a": "Falsa: la córnea es {{avascular}} (se nutre por difusión).", "b": "Falsa: el epitelio anterior está en la superficie {{anterior}}; el posterior es el endotelio.", "c": "CORRECTA (clave 2024-25). El epitelio corneal anterior es muy sensible: contiene abundantes {{terminaciones nerviosas}} libres.", "d": "Falsa: la córnea normal no tiene {{melanocitos}}."}, "_k": "org2p-101:2613650352", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-102", "tema": "Ojo", "examen": "2024-25 Q27 + 2025-26 2P Q28 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en  "b": "Aumento de producción de humor acuoso por el conducto de Schlemm", "c": "Disminución del drenaje del humor acuoso, primero por el conducto de Schlemm y luego por la red trabecular", "d": "Disminución del drenaje del humor acuoso, primero por la red trabecular y luego por el conducto de Schlemm"}, "correcta": "d", "razones": {"a": "Falsa: la red trabecular {{drena}}, no produce humor acuoso (lo hacen los procesos ciliares).", "b": "Falsa: el conducto de Schlemm es vía de {{drenaje}}, no de producción.", "c": "Falsa: el orden de drenaje es primero {{red trabecular}}, después Schlemm.", "d": "CORRECTA (deducida). El glaucoma resulta de {{disminución del drenaje}}: el acuoso pasa primero por la {{red trabecular}} y luego al conducto de {{Schlemm}}."}, "_k": "org2p-104:432812500", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-105", "tema": "Ojo", "examen": "2025-26 2P Q29 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P", "enunciado": "Sobre el **cristalino**, es cierto que:", "opciones": {"a": "Está vascularizado", "b": "Se localiza al mismo nivel que los procesos ciliares", "c": "Presenta terminaciones nerviosas", "d": "Presenta melanocitos"}, "correcta": "b", "razones": {"a": "Falsa: el cristalino es {{avascular}} (sus fibras se nutren del humor acuoso).", "b": "CORRECTA. El cristalino queda a la altura de los {{procesos ciliares}}, suspendido por las fibras zonulares.", "c": "Falsa: NO tiene {{terminaciones nerviosas}}.", "d": "Falsa: NO contiene {{melanocitos}}; sus fibras son transparentes con cristalinas."}, "_k": "org2p-105:3818336098", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-106", "tema": "Ojo", "examen": "2021-junio Q21", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "Sobre las **células bipolares de la retina**:", "opciones": {"a": "Contactan con células ganglionares y con fotorreceptores", "b": "Sus axo           if(l===q.correcta)x.insertAdjacentHTML("beforeend",'<span class="tag cor">correcta</span>');
        }
      });
      hint.style.display="none";
      resp.classList.add("show");
    });
    // cloze: click individual para revelar/ocultar
    resp.querySelectorAll(".cloze").forEach(c=>c.onclick=()=>c.classList.toggle("revealed"));
    // botón revelar/ocultar todas
    resp.querySelector(".reveal-words").onclick=(e)=>{
      const cs=resp.querySelectorAll(".cloze");
      const anyHidden=[...cs].some(c=>!c.classList.contains("revealed"));
      cs.forEach(c=>c.classList.toggle("revealed",anyHidden));
      e.target.textContent = anyHidden ? "🙈 Ocultar palabras clave" : "👁 Revelar palabras clave";
    };
    app.appendChild(card);
  });
  updatePos();
}
// contador en vivo: detecta la tarjeta que está arriba del todo y muestra posición + cuántas quedan
function updatePos(){
  const cards=app.querySelectorAll(".card");
  const pos=document.getElementById("pos");
  const n=cards.length;
  if(!n){pos.textContent="";return;}
  const thr=document.querySelector("header").offsetHeight+10;
  let cur=0;
  for(let i=0;i<n;i++){ if(cards[i].getBoundingClientRect().top<=thr) cur=i; else break; }
  // si estás al final del scroll, fija la última (las últimas tarjetas no llegan a subir hasta arriba)
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4) cur=n-1;
  pos.textContent=`📍 ${cur+1} / ${n} · quedan ${n-1-cur}`;
}
let _ticking=false;
window.addEventListener("scroll",()=>{ if(!_ticking){_ticking=true;requestAnimationFrame(()=>{updatePos();_ticking=false;});} },{passive:true});
examen.onchange=render;filtro.onchange=render;frec.onchange=render;marc.onchange=render;
orden.onchange=()=>{
  const rand = orden.value==="rand";
  reshuffleBtn.style.display = rand ? "" : "none";
  if(rand) buildShuffle();          // nueva mezcla cada vez que activas aleatorio
  window.scrollTo(0,0);
  render();
};
reshuffleBtn.onclick=()=>{ buildShuffle(); window.scrollTo(0,0); render(); };
render();
</script></body></html>

: "org2p-081", "tema": "Ojo", "examen": "2024-25 Q27 + 2025-26 2P Q28 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2024-25 (clave C), 2025-26 2P", "enunciado": "Sobre las **células ganglionares de la retina**, es cierto que:", "opciones": {"a": "Son células fotorreceptoras", "b": "Las células horizontales establecen contactos sinápticos con ellas", "c": "Las células amacrinas establecen contactos sinápticos con ellas", "d": "Están en contacto con el epitelio pigmentario de la retina"}, "correcta": "c", "razones": {"a": "Falsa: las ganglionares NO son {{fotorreceptoras}}; reciben la señal procesada.", "b": "Falsa: las {{horizontales}} sinaptan a nivel de fotorreceptores/bipolares, no con las ganglionares.", "c": "CORRECTA (clave 2024-25). Las células {{amacrinas}} modulan y hacen sinapsis con las {{ganglionares}}.", "d": "Falsa: las ganglionares son la capa más {{interna}}; no contactan el epitelio pigmentario (el más externo)."}, "_k": "org2p-081:2782988014", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-082", "tema": "Ojo", "examen": "2024-25 Q28 + 2025-26 2P Q27", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave D), 2025-26 2P", "enunciado": "¿Qué estructura produce el **humor acuoso**?", "opciones": {"a": "Iris", "b": "Fibras zonulares", "c": "Coroides", "d": "Procesos ciliares"}, "correcta": "d", "razones": {"a": "El {{iris}} regula la pupila, no produce humor acuoso.", "b": "Las {{fibras zonulares}} sostienen el cristalino.", "c": "La {{coroides}} es vascular/nutricia de la retina externa.", "d": "CORRECTA (clave 2024-25). Los {{procesos ciliares}} (epitelio ciliar) secretan el {{humor acuoso}}."}, "_k": "org2p-082:179017947", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-083", "tema": "Ojo", "examen": "2025-26 2P Q27", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Vista en 2025-26 2P (resp. deducida)", "enunciado": "El **glaucoma** (aumento de presión intraocular) ocurre frecuentemente como consecuencia de:", "opciones": {"a": "Aumento de producción de humor acuoso por la red trabecular", "b": "Aumento de producción de humor acuoso por el conducto de Schlemm", "c": "Disminución del drenaje del humor acuoso, primero por el conducto de Schlemm y luego por la red trabecular", "d": "Disminución del drenaje del humor acuoso, primero por la red trabecular y luego por el conducto de Schlemm"}, "correcta": "d", "razones": {"a": "Falsa: la red trabecular {{drena}}, no produce humor acuoso (lo hacen los procesos ciliares).", "b": "Falsa: el conducto de Schlemm es vía de {{drenaje}}, no de producción.", "c": "Falsa: el orden de drenaje es primero {{red trabecular}}, después Schlemm.", "d": "CORRECTA (deducida). El glaucoma resulta de {{disminución del drenaje}}: el acuoso pasa primero por la {{red trabecular}} y luego al conducto de {{Schlemm}}."}, "_k": "org2p-083:432812500", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-084", "tema": "Ojo", "examen": "2025-26 2P Q29 + 2022-23 2P", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2022-23 2P, 2025-26 2P", "enunciado": "Sobre el **cristalino**, es cierto que:", "opciones": {"a": "Está vascularizado", "b": "Se localiza al mismo nivel que los procesos ciliares", "c": "Presenta terminaciones nerviosas", "d": "Presenta melanocitos"}, "correcta": "b", "razones": {"a": "Falsa: el cristalino es {{avascular}} (sus fibras se nutren del humor acuoso).", "b": "CORRECTA. El cristalino queda a la altura de los {{procesos ciliares}}, suspendido por las fibras zonulares.", "c": "Falsa: NO tiene {{terminaciones nerviosas}}.", "d": "Falsa: NO contiene {{melanocitos}}; sus fibras son transparentes con cristalinas."}, "_k": "org2p-084:3818336098", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-085", "tema": "Ojo", "examen": "2021-junio Q21", "anio": 2021, "parcial": 2, "alta_frecuencia": false, "repetida": "Repetida en 2021-junio (resp. A)", "enunciado": "Sobre las **células bipolares de la retina**:", "opciones": {"a": "Contactan con células ganglionares y con fotorreceptores", "b": "Sus axones forman el nervio óptico", "c": "Son abundantes en la fóvea central", "d": "Son células fotorreceptoras"}, "correcta": "a", "razones": {"a": "CORRECTA. Las {{bipolares}} son la neurona intermedia: contactan {{fotorreceptores}} y {{ganglionares}}.", "b": "Falsa: los axones que forman el nervio óptico son de las {{ganglionares}}.", "c": "Falsa: en la {{fóvea}} predominan los conos; las capas internas se desplazan.", "d": "Falsa: las fotorreceptoras son los conos y bastones."}, "_k": "org2p-085:641108057", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-086", "tema": "Oído", "examen": "2024-25 Q29 + 2025-26 2P Q15 + 2021-22 + 2022-23 2P", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-22, 2022-23 2P, 2024-25 (clave A), 2025-26 2P", "enunciado": "Sobre el **órgano de Corti** del oído interno, es cierto que:", "opciones": {"a": "No presenta otolitos", "b": "Las células ciliadas presentan estereocilios y un cinocilio funcional en el adulto", "c": "La cúpula cubre sus células ciliadas", "d": "Se localiza sobre la membrana vestibular (de Reissner)"}, "correcta": "a", "razones": {"a": "CORRECTA (clave 2024-25). El órgano de Corti NO tiene {{otolitos}} (esos están en las máculas del utrículo/sáculo).", "b": "Falsa: las células ciliadas del Corti tienen estereocilios pero {{pierden el cinocilio}} en el adulto.", "c": "Falsa: la {{cúpula}} cubre las crestas ampollares; el Corti tiene la membrana {{tectoria}}.", "d": "Falsa: el Corti se asienta sobre la membrana {{basilar}}, no sobre la de Reissner."}, "_k": "org2p-086:4064928720", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-087", "tema": "Oído", "examen": "2024-25 Q30 + 2025-26 2P Q30", "anio": 2024, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25 (clave C), 2025-26 2P", "enunciado": "Sobre la **mácula del sáculo**, es cierto que:", "opciones": {"a": "Tiene una posición horizontal", "b": "Se localiza en una región de los conductos semicirculares", "c": "Está en contacto con la endolinfa", "d": "No contiene células de sostén"}, "correcta": "c", "razones": {"a": "Falsa: la mácula del sáculo está en posición {{vertical}} (la del utrículo es horizontal).", "b": "Falsa: las máculas están en utrículo y sáculo, NO en los {{conductos semicirculares}} (allí están las crestas).", "c": "CORRECTA (clave 2024-25). La mácula está bañada por {{endolinfa}} (dentro del laberinto membranoso).", "d": "Falsa: sí tiene células de {{sostén}} junto a las ciliadas."}, "_k": "org2p-087:2089677918", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-088", "tema": "Oído", "examen": "2025-26 2P Q30 + 2024-25", "anio": 2025, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2024-25, 2025-26 2P", "enunciado": "Sobre la **mácula del utrículo**, señala lo **CORRECTO**:", "opciones": {"a": "Sus células ciliadas están en contacto con la perilinfa", "b": "Se localiza en una región de los conductos semicirculares", "c": "No contiene células de sostén", "d": "Contiene otolitos y está bañada por endolinfa"}, "correcta": "d", "razones": {"a": "Falsa: están en contacto con la {{endolinfa}}, no la perilinfa.", "b": "Falsa: la mácula utricular está en el {{utrículo}}, no en los semicirculares.", "c": "Falsa: sí tiene células de {{sostén}}.", "d": "CORRECTA. Las máculas contienen {{otolitos}} (membrana otolítica) y están bañadas por {{endolinfa}}; el utrículo en posición horizontal."}, "_k": "org2p-088:2249237197", "fuente": "🎯 2025-26 · 2º parcial"}, {"id": "org2p-089", "tema": "Oído", "examen": "2021-junio Q25 + 2021-22", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio (resp. C), 2021-22", "enunciado": "La **endolinfa** se localiza:", "opciones": {"a": "Entre el laberinto óseo y el membranoso", "b": "Dentro de la estría vascular", "c": "Dent  {"a": "Cierta en parte: la exocitosis de {{gránulos corticales}} es el bloqueo {{lento/permanente}} (reacción cortical → zona pelúcida modificada).", "b": "Cierta en parte: el cambio de {{potencial de membrana}} es el bloqueo {{rápido/primario}}.", "c": "La unión ZP3 promueve la entrada del espermatozoide, no el bloqueo.", "d": "CORRECTA. Combinan ambos mecanismos: bloqueo rápido (potencial) + bloqueo permanente ({{gránulos corticales}})."}, "_k": "org2p-093:2496931525", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-094", "tema": "Embriología", "examen": "2021-junio Q29 + 2022-23 2P", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2021-22, 2022-23 2P", "enunciado": "Como consecuencia del **plegamiento del disco embrionario**, señala lo **CORRECTO**:", "opciones": {"a": "Se forma el intestino primitivo a partir del ectodermo", "b": "El plegamiento incorpora parte del saco vitelino al embrión, formando el intestino primitivo (endodermo), y el amnios acaba envolviendo al embrión", "c": "El saco vitelino envuelve por completo al embrión", "d": "Se forma el celoma extraembrionario"}, "correcta": "b", "razones": {"a": "Falsa: el intestino primitivo procede del {{endodermo}}, no del ectodermo.", "b": "CORRECTA. El plegamiento cefalocaudal y lateral incorpora el {{saco vitelino}} → {{intestino primitivo}} (endodermo); el {{amnios}} crece y envuelve al embrión.", "c": "Falsa: es el {{amnios}}, no el saco vitelino, el que envuelve al embrión.", "d": "Falsa: el celoma extraembrionario se forma antes, en la 2ª semana."}, "_k": "org2p-094:1287677166", "fuente": "📚 Históricos / repetidas"}, {"id": "org2p-095", "tema": "Embriología", "examen": "2021-junio Q30 + 2022-23 2P (imágenes)", "anio": 2021, "parcial": 2, "alta_frecuencia": true, "repetida": "Repetida en 2021-junio, 2022-23 2P", "enunciado": "Sobre la formación de los **somitas**, señala lo **CORRECTO**:", "opciones": {"a": "Se forman por segmentación del mesodermo intermed cia": false, "repetida": "Concepto base recurrente en 2º parcial", "enunciado": "El **tubo neural** se forma a partir de:", "opciones": {"a": "Mesodermo paraxial", "b": "Neuroectodermo (placa neural inducida por el notocordio)", "c": "Endodermo del techo del saco vitelino", "d": "Hipoblasto"}, "correcta": "b", "razones": {"a": "El mesodermo paraxial da los {{somitas}}, no el tubo neural.", "b": "CORRECTA. El tubo neural deriva del {{neuroectodermo}} (placa neural), inducido por el {{notocordio}}.", "c": "El endodermo origina epitelios digestivo/respiratorio, no el tubo neural.", "d": "El hipoblasto es desplazado y no forma estructuras del embrión."}, "_k": "org2p-097:318848892", "fuente": "📚 Históricos / repetidas"}];
const app = document.getElementById("app");
const examen = document.getElementById("examen");
const filtro = document.getElementById("filtro");
const frec = document.getElementById("frec");
const marc = document.getElementById("marc");
const orden = document.getElementById("orden");
const reshuffleBtn = document.getElementById("reshuffle");
// orden aleatorio estable: asigna un nº al azar a cada pregunta; se mantiene fijo
// mientras estás en modo aleatorio (no se re-baraja al marcar estrellas / filtrar).
let shuffleSeed = null;
function buildShuffle(){
  shuffleSeed = {};
  DATA.forEach(q => { shuffleSeed[q._k] = Math.random(); });
}
const SKEY = "organo_starred_v1";
let starred = new Set(JSON.parse(localStorage.getItem(SKEY) || "[]"));
function saveStars(){ localStorage.setItem(SKEY, JSON.stringify([...starred])); }
// **x** → palabra clave resaltada ; {{x}} → palabra clave ocluida (cloze)
function esc(s){return String(s==null?"":s);}
function fmt(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<span class="kw">$1</span>');
  s = s.replace(/\{\{([^}]+)\}\}/g, '<span class="cloze" title="click para revelar">$1</span>');
  return s;
}
const TEMAS = ["Cor","Vasos","Respiratorio","Digestivo","Sangre/Hematopoyesis","Inmune","Piel","Endocrino","Urinario","Reproductor","Ojo","Oído","Embriología","Tejidos básicos"];
TEMAS.filter(t=>DATA.some(q=>q.tema===t)).forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
[...new Set(DATA.map(q=>q.tema))].filter(t=>!TEMAS.includes(t)).sort().forEach(t=>{
  const o=document.createElement("option");o.value=t;o.textContent=t;filtro.appendChild(o);});
// Filtro por examen/fuente
const FUENTES = ["🎯 2025-26 · 1er parcial","🎯 2025-26 · 2º parcial","📚 Históricos / repetidas"];
FUENTES.filter(s=>DATA.some(q=>q.fuente===s)).forEach(s=>{
  const o=document.createElement("option");o.value=s;o.textContent=s;examen.appendChild(o);});
function render(){
  const f = filtro.value, fr = frec.value, mk = marc.value, ex = examen.value;
  const list = DATA.filter(q=>(!f||q.tema===f) &&
    (!ex || q.fuente===ex) &&
    (fr!=="alta" || q.alta_frecuencia) &&
    (mk!=="si" || starred.has(q._k)));
  if(orden.value==="rand"){
    if(!shuffleSeed) buildShuffle();
    list.sort((a,b)=>shuffleSeed[a._k]-shuffleSeed[b._k]);
  }
  document.getElementById("count").textContent = list.length+" preguntas · 🌟 "+starred.size+" marcadas";
  app.innerHTML = "";
  list.forEach((q,i)=>{
    const card=document.createElement("div");card.className="card";
    const alta = q.alta_frecuencia?' · <span class="alta">⭐ ALTA FRECUENCIA</span>':'';
    const rep = q.repetida?' · '+q.repetida:'';
    const L=Object.keys(q.opciones).sort();
    let opts="";
    L.forEach(l=>opts+=`<div class="opt" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.opciones[l])}</div>`);
    let raz="";
    L.forEach(l=>{if(q.razones&&q.razones[l]!==undefined)raz+=`<div class="razon" data-l="${l}"><b>${l.toUpperCase()})</b> ${fmt(q.razones[l])}</div>`;});
    const on = starred.has(q._k);
    card.innerHTML=`<div class="chead">
        <span class="qnum">Nº ${i+1} / ${list.length}</span>
        <div class="meta">${q.examen} · ${q.tema}${alta}${rep}</div>
        <button class="star${on?' on':''}" title="Marcar como difícil">${on?'★':'☆'}</button>
      </div>
      <div class="preg">${fmt(q.enunciado)}</div>
      <div class="opts">${opts}</div>
      <div class="hint">👆 Toca tu respuesta para ver el razonamiento.</div>
      <div class="resp"><button class="reveal-words">👁 Revelar palabras clave</button><div class="razon-wrap">${raz}</div></div>`;
    // estrella
    const starBtn=card.querySelector(".star");
    starBtn.onclick=()=>{
      if(starred.has(q._k)){starred.delete(q._k);} else {starred.add(q._k);}
      saveStars();
      const now=starred.has(q._k);
      starBtn.classList.toggle("on",now);starBtn.textContent=now?'★':'☆';
      document.getElementById("count").textContent=app.querySelectorAll(".card").length+" preguntas · 🌟 "+starred.size+" marcadas";
      if(marc.value==="si"&&!now)render();
    };
    // click en opción → revela al instante
    const optEls=card.querySelectorAll(".opt");
    const resp=card.querySelector(".resp");
    const hint=card.querySelector(".hint");
    let answered=false;
    optEls.forEach(o=>o.onclick=()=>{
      if(answered)return; answered=true;
      const chosen=o.dataset.l;
      optEls.forEach(x=>{const l=x.dataset.l;
        x.classList.add(l===q.correcta?"ok":"no");
        if(l===chosen)x.classList.add("mine");
        if(l===chosen&&l===q.correcta){x.insertAdjacentHTML("beforeend",'<span class="tag cor">✓ tu respuesta · correcta</span>');}
        else{
          if(l===chosen)x.insertAdjacentHTML("beforeend",'<span class="tag you">tu respuesta</span>');
          if(l===q.correcta)x.insertAdjacentHTML("beforeend",'<span class="tag cor">correcta</span>');
        }
      });
      hint.style.display="none";
      resp.classList.add("show");
    });
    // cloze: click individual para revelar/ocultar
    resp.querySelectorAll(".cloze").forEach(c=>c.onclick=()=>c.classList.toggle("revealed"));
    // botón revelar/ocultar todas
    resp.querySelector(".reveal-words").onclick=(e)=>{
      const cs=resp.querySelectorAll(".cloze");
      const anyHidden=[...cs].some(c=>!c.classList.contains("revealed"));
      cs.forEach(c=>c.classList.toggle("revealed",anyHidden));
      e.target.textContent = anyHidden ? "🙈 Ocultar palabras clave" : "👁 Revelar palabras clave";
    };
    app.appendChild(card);
  });
  updatePos();
}
// contador en vivo: detecta la tarjeta que está arriba del todo y muestra posición + cuántas quedan
function updatePos(){
  const cards=app.querySelectorAll(".card");
  const pos=document.getElementById("pos");
  const n=cards.length;
  if(!n){pos.textContent="";return;}
  const thr=document.querySelector("header").offsetHeight+10;
  let cur=0;
  for(let i=0;i<n;i++){ if(cards[i].getBoundingClientRect().top<=thr) cur=i; else break; }
  // si estás al final del scroll, fija la última (las últimas tarjetas no llegan a subir hasta arriba)
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4) cur=n-1;
  pos.textContent=`📍 ${cur+1} / ${n} · quedan ${n-1-cur}`;
}
let _ticking=false;
window.addEventListener("scroll",()=>{ if(!_ticking){_ticking=true;requestAnimationFrame(()=>{updatePos();_ticking=false;});} },{passive:true});
examen.onchange=render;filtro.onchange=render;frec.onchange=render;marc.onchange=render;
orden.onchange=()=>{
  const rand = orden.value==="rand";
  reshuffleBtn.style.display = rand ? "" : "none";
  if(rand) buildShuffle();          // nueva mezcla cada vez que activas aleatorio
  window.scrollTo(0,0);
  render();
};
reshuffleBtn.onclick=()=>{ buildShuffle(); window.scrollTo(0,0); render(); };
render();
</script></body></html>
